<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4682b4">
<title>🔗 Link Launcher — Dove Blue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
--bg-primary:#eef5fb;--bg-secondary:#f7fbff;--bg-tertiary:#ffffff;--bg-card:#ffffff;--bg-hover:#e6f0f9;
--neon-cyan:#4682b4;--neon-blue:#37688f;--neon-purple:#2e5474;--neon-green:#15803d;--neon-yellow:#b45309;--neon-red:#c62828;
--text-primary:#13232f;--text-secondary:#4a5d6e;--text-tertiary:#6b7c8c;--text-muted:#93a3b1;
--border-subtle:rgba(31,58,84,.08);--border-normal:rgba(31,58,84,.16);--border-strong:rgba(31,58,84,.28);--border-glow:rgba(70,130,180,.5);
--shadow-sm:0 2px 6px rgba(31,58,84,.08);--shadow-md:0 6px 18px rgba(31,58,84,.12);--shadow-lg:0 14px 40px rgba(31,58,84,.18);--shadow-glow:0 0 18px rgba(70,130,180,.18);
--radius-sm:8px;--radius-md:11px;--radius-lg:14px;--radius-xl:18px;
--transition:all .25s cubic-bezier(.4,0,.2,1);--transition-bounce:.45s cubic-bezier(.34,1.56,.64,1);
--field-bg:rgba(31,58,84,.05);--code-bg:rgba(31,58,84,.06);--overlay-bg:rgba(15,28,42,.45);
}
html.dark{
--bg-primary:#0f1d2b;--bg-secondary:#132434;--bg-tertiary:#1a2f42;--bg-card:#1a2f42;--bg-hover:#27455f;
--neon-cyan:#6fa3cf;--neon-blue:#8fbce0;--neon-purple:#aacfeb;--neon-green:#34d399;--neon-yellow:#f0a830;--neon-red:#ef5350;
--text-primary:#e8f0f8;--text-secondary:#9fb2c4;--text-tertiary:#7f96ab;--text-muted:#5a7186;
--border-subtle:rgba(255,255,255,.06);--border-normal:rgba(255,255,255,.12);--border-strong:rgba(255,255,255,.2);--border-glow:rgba(111,163,207,.5);
--shadow-sm:0 2px 6px rgba(0,0,0,.4);--shadow-md:0 6px 18px rgba(0,0,0,.5);--shadow-lg:0 14px 40px rgba(0,0,0,.6);--shadow-glow:0 0 18px rgba(111,163,207,.25);
--field-bg:rgba(0,0,0,.35);--code-bg:rgba(0,0,0,.4);--overlay-bg:rgba(2,4,8,.88);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg-primary);color:var(--text-primary);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
body{background:radial-gradient(1100px 500px at 8% -8%,rgba(70,130,180,.14) 0%,transparent 55%),radial-gradient(900px 500px at 108% 6%,rgba(111,163,207,.12) 0%,transparent 50%),linear-gradient(180deg,var(--bg-primary),var(--bg-secondary));min-height:100vh;overflow-x:hidden}
.bg-effects{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-effects::before{content:'';position:absolute;width:700px;height:700px;background:radial-gradient(circle,rgba(70,130,180,.12) 0%,transparent 65%);top:-250px;left:-200px;animation:float1 22s ease-in-out infinite;filter:blur(20px)}
.bg-effects::after{content:'';position:absolute;width:600px;height:600px;background:radial-gradient(circle,rgba(46,84,116,.10) 0%,transparent 65%);bottom:-200px;right:-200px;animation:float2 26s ease-in-out infinite;filter:blur(20px)}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(100px,80px) scale(1.12)}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-80px,-60px) scale(1.08)}}

.container{max-width:960px;margin:0 auto;padding:26px 20px;position:relative;z-index:2}

.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px}
.logo-icon{width:46px;height:46px;border-radius:var(--radius-md);background:linear-gradient(135deg,var(--bg-tertiary),var(--bg-card));border:1px solid rgba(70,130,180,.3);display:grid;place-items:center;font-size:22px;box-shadow:var(--shadow-sm);transition:var(--transition);cursor:pointer}
.logo-icon:hover{transform:scale(1.1) rotate(5deg);box-shadow:var(--shadow-glow);border-color:var(--neon-cyan)}
.logo-text h1{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;letter-spacing:1px;background:linear-gradient(135deg,var(--neon-cyan),var(--neon-blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.2}
.logo-text small{font-size:9px;color:var(--text-muted);letter-spacing:2.5px;text-transform:uppercase;font-weight:600;margin-top:2px;display:block}

.header-actions{display:flex;gap:8px;align-items:center}
.btn-icon{width:40px;height:40px;padding:0;display:grid;place-items:center;background:var(--field-bg);border:1px solid var(--border-subtle);border-radius:var(--radius-md);color:var(--text-secondary);cursor:pointer;transition:var(--transition);font-size:15px}
.btn-icon:hover{color:var(--neon-cyan);border-color:var(--neon-cyan);background:rgba(70,130,180,.1);transform:scale(1.06);box-shadow:var(--shadow-glow)}

.page-title{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:12px;text-transform:uppercase;margin-bottom:20px}
.page-title::before{content:'';width:4px;height:22px;background:linear-gradient(180deg,var(--neon-cyan),var(--neon-blue));border-radius:3px;box-shadow:0 0 8px var(--neon-cyan)}

.bento{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.bento-stat{background:linear-gradient(135deg,var(--bg-tertiary),var(--bg-secondary));border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:16px 18px;position:relative;overflow:hidden;transition:var(--transition)}
.bento-stat::before{content:'';position:absolute;top:-40px;right:-40px;width:110px;height:110px;border-radius:50%;filter:blur(50px);opacity:.16;transition:opacity .4s}
.bento-stat:nth-child(1)::before{background:var(--neon-cyan)}
.bento-stat:nth-child(2)::before{background:var(--neon-blue)}
.bento-stat:nth-child(3)::before{background:var(--neon-purple)}
.bento-stat:nth-child(4)::before{background:var(--neon-green)}
.bento-stat:hover{border-color:rgba(70,130,180,.3);transform:translateY(-3px);box-shadow:var(--shadow-glow)}
.bento-stat:hover::before{opacity:.3}
.bento-label{font-family:'Space Grotesk',sans-serif;font-size:9px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:1.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.bento-label .icon{font-size:14px}
.bento-value{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:800;margin-top:8px;letter-spacing:-.03em;background:linear-gradient(135deg,var(--neon-cyan),var(--neon-blue),var(--text-primary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.1}
.bento-sub{font-size:10px;color:var(--text-muted);margin-top:4px;font-weight:500}

.section{background:linear-gradient(135deg,var(--bg-tertiary),var(--bg-secondary));border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:20px;margin-bottom:20px;backdrop-filter:blur(12px);position:relative;overflow:hidden}
.section::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(70,130,180,.5),transparent);opacity:.3}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--border-subtle);position:relative}
.section-header::after{content:'';position:absolute;bottom:-1px;left:0;width:60px;height:2px;background:linear-gradient(90deg,var(--neon-cyan),var(--neon-blue));box-shadow:0 0 12px var(--neon-cyan)}
.section-header h3{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;letter-spacing:1.5px;display:flex;align-items:center;gap:10px;text-transform:uppercase}
.section-header h3 .bar{width:3px;height:18px;background:linear-gradient(180deg,var(--neon-cyan),var(--neon-blue));border-radius:2px;box-shadow:0 0 8px var(--neon-cyan)}
.section-header small{font-family:'Space Grotesk',sans-serif;font-size:10px;color:var(--neon-cyan);font-weight:600;background:rgba(70,130,180,.1);padding:4px 12px;border-radius:16px;border:1px solid rgba(70,130,180,.3);letter-spacing:1px}

.form-group{margin-bottom:14px}
.form-group label{display:block;font-family:'Space Grotesk',sans-serif;font-size:9px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:2px;font-weight:700;margin-bottom:8px}
.input-field,.form-group textarea{width:100%;padding:12px 15px;background:var(--field-bg);border:1px solid var(--border-subtle);border-radius:var(--radius-md);color:var(--text-primary);font-size:13px;font-family:'Inter',sans-serif;transition:var(--transition);font-weight:500}
.form-group textarea{min-height:140px;resize:vertical;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.7;tab-size:2}
.input-field:focus,.form-group textarea:focus{outline:none;border-color:var(--neon-cyan);box-shadow:0 0 0 3px rgba(70,130,180,.1),var(--shadow-glow)}
.form-group textarea::placeholder,.input-field::placeholder{color:var(--text-muted)}

.btn{padding:9px 16px;border:none;border-radius:var(--radius-md);cursor:pointer;font-size:11.5px;font-weight:700;transition:var(--transition);display:inline-flex;align-items:center;justify-content:center;gap:7px;font-family:'Inter',sans-serif;text-transform:uppercase;letter-spacing:.8px;position:relative;overflow:hidden}
.btn-primary{background:linear-gradient(135deg,var(--neon-cyan),var(--neon-blue));color:#fff;box-shadow:var(--shadow-glow)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 0 24px rgba(70,130,180,.4)}
.btn-success{background:linear-gradient(135deg,var(--neon-green),#0e5c2f);color:#fff;box-shadow:var(--shadow-sm)}
.btn-success:hover{transform:translateY(-2px);box-shadow:0 0 20px rgba(21,128,61,.4)}
.btn-warning{background:linear-gradient(135deg,var(--neon-blue),var(--neon-purple));color:#fff;box-shadow:var(--shadow-sm)}
.btn-warning:hover{transform:translateY(-2px)}
.btn-danger{background:linear-gradient(135deg,var(--neon-red),#8f1d1d);color:#fff;box-shadow:var(--shadow-sm)}
.btn-danger:hover{transform:translateY(-2px)}
.btn-ghost{background:var(--field-bg);color:var(--text-primary);border:1px solid var(--border-normal)}
.btn-ghost:hover{background:rgba(70,130,180,.1);border-color:var(--neon-cyan);color:var(--neon-cyan);transform:translateY(-2px)}
.btn.opened{background:linear-gradient(135deg,var(--neon-green),#0e5c2f)!important;color:#fff!important}

.action-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

.search-bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;padding:10px 14px;background:var(--field-bg);border:1px solid var(--border-subtle);border-radius:var(--radius-md);transition:var(--transition)}
.search-bar:focus-within{border-color:var(--neon-cyan);box-shadow:0 0 0 3px rgba(70,130,180,.1)}
.search-bar i{color:var(--neon-cyan);font-size:14px;flex-shrink:0}
.search-bar input{flex:1;background:none;border:none;outline:none;color:var(--text-primary);font-size:12.5px;font-family:'Inter',sans-serif;font-weight:500}
.search-bar input::placeholder{color:var(--text-muted)}
.search-bar .search-info{font-size:10px;color:var(--neon-cyan);font-family:'Space Grotesk',sans-serif;font-weight:600;flex-shrink:0}
.search-bar .clear-btn{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:4px;transition:var(--transition)}
.search-bar .clear-btn:hover{color:var(--neon-red);background:rgba(198,40,40,.1)}

.link-list{display:flex;flex-direction:column;gap:10px}
.link-card{background:linear-gradient(135deg,var(--bg-tertiary),var(--bg-secondary));border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:14px 16px;transition:var(--transition);position:relative;overflow:hidden;animation:slideUp .4s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.link-card::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(120deg,transparent,rgba(70,130,180,.08),transparent);transition:left .6s ease}
.link-card:hover::before{left:100%}
.link-card:hover{border-color:rgba(70,130,180,.3);transform:translateY(-2px);box-shadow:var(--shadow-glow)}
.link-card.opened{border-color:rgba(21,128,61,.4);background:linear-gradient(135deg,rgba(21,128,61,.04),var(--bg-secondary))}
.link-card-head{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.link-icon{width:38px;height:38px;min-width:38px;border-radius:9px;background:linear-gradient(135deg,rgba(70,130,180,.18),rgba(70,130,180,.07));border:1px solid rgba(70,130,180,.25);display:grid;place-items:center;font-size:15px;flex-shrink:0;transition:var(--transition-bounce);cursor:pointer;color:var(--neon-cyan)}
.link-icon:hover{transform:scale(1.1) rotate(5deg);box-shadow:var(--shadow-glow);border-color:var(--neon-cyan)}
.link-icon.opened{background:linear-gradient(135deg,rgba(21,128,61,.18),rgba(21,128,61,.07));border-color:rgba(21,128,61,.3);color:var(--neon-green)}
.link-body{flex:1;min-width:0}
.link-url{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--neon-cyan);word-break:break-all;font-weight:500;letter-spacing:.3px}
.link-host{font-size:10px;color:var(--text-muted);margin-top:4px;font-weight:600;text-transform:uppercase;letter-spacing:1px}
.link-meta{display:flex;gap:14px;font-size:10px;color:var(--text-tertiary);padding:8px 0;border-top:1px solid var(--border-subtle);border-bottom:1px solid var(--border-subtle);margin:8px 0;font-weight:500;flex-wrap:wrap;align-items:center}
.link-meta span{display:flex;align-items:center;gap:5px}
.link-meta span .icon{font-size:11px;color:var(--neon-cyan)}
.link-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.link-actions .btn{padding:6px 11px;font-size:9.5px;letter-spacing:.5px;flex:1;min-width:90px}

.badge-new{position:absolute;top:10px;right:10px;font-size:8px;padding:3px 8px;background:rgba(198,40,40,.15);color:var(--neon-red);border:1px solid rgba(198,40,40,.4);border-radius:5px;text-transform:uppercase;font-weight:800;letter-spacing:1px;font-family:'Space Grotesk',sans-serif;animation:badgePulse 1.8s ease-in-out infinite;z-index:2}
@keyframes badgePulse{0%,100%{transform:scale(1);box-shadow:0 0 0 rgba(198,40,40,.4)}50%{transform:scale(1.08);box-shadow:0 0 12px rgba(198,40,40,.6)}}

.empty{text-align:center;padding:60px 24px;background:var(--field-bg);border:1px dashed var(--border-normal);border-radius:var(--radius-lg)}
.empty .icon{font-size:52px;margin-bottom:14px;opacity:.5;animation:float 3.5s ease-in-out infinite;filter:drop-shadow(0 0 16px rgba(70,130,180,.3))}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.empty h4{font-size:17px;margin-bottom:8px;font-weight:700;font-family:'Space Grotesk',sans-serif;letter-spacing:1px}
.empty p{color:var(--text-secondary);font-size:12.5px;margin-bottom:18px;line-height:1.6}

.toasts{position:fixed;bottom:24px;right:24px;z-index:10000;display:flex;flex-direction:column;gap:10px;max-width:340px}
.toast{background:linear-gradient(135deg,var(--bg-hover),var(--bg-tertiary));backdrop-filter:blur(24px);border:1px solid rgba(70,130,180,.3);border-radius:var(--radius-md);padding:13px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-glow);animation:toastSlideIn .45s cubic-bezier(.34,1.56,.64,1);font-size:12px;font-weight:500;position:relative;overflow:hidden}
.toast.success{border-left:3px solid var(--neon-green)}
.toast.error{border-left:3px solid var(--neon-red)}
.toast.info{border-left:3px solid var(--neon-cyan)}
.toast.warning{border-left:3px solid var(--neon-blue)}
@keyframes toastSlideIn{from{transform:translateX(150%) scale(.9);opacity:0}to{transform:translateX(0) scale(1);opacity:1}}
.toast .icon{font-size:18px}
.toast-progress{position:absolute;bottom:0;left:0;height:2px;background:linear-gradient(90deg,var(--neon-cyan),var(--neon-blue));animation:progressShrink 3.5s linear forwards;box-shadow:0 0 8px var(--neon-cyan)}
@keyframes progressShrink{from{width:100%}to{width:0}}

.footer{text-align:center;padding:20px;font-size:10px;color:var(--text-muted);letter-spacing:2px;text-transform:uppercase;font-weight:600;font-family:'Space Grotesk',sans-serif}
.footer strong{color:var(--neon-cyan);letter-spacing:2px}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg-primary)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--neon-cyan),var(--neon-blue));border-radius:6px;border:2px solid var(--bg-primary)}

@media(max-width:768px){
.container{padding:18px 14px}
.bento{grid-template-columns:repeat(2,1fr)}
.page-title{font-size:17px}
.link-actions{flex-wrap:wrap}
.link-actions .btn{min-width:calc(50% - 3px)}
}

@media(max-width:480px){
.bento{grid-template-columns:1fr 1fr;gap:8px}
.bento-value{font-size:22px}
.action-row{flex-direction:column}
.action-row .btn{width:100%}
}
</style>
</head>
<body>
<div class="bg-effects"></div>

<div class="container">
<div class="header">
  <div class="logo">
    <div class="logo-icon">🔗</div>
    <div class="logo-text">
      <h1>LINK LAUNCHER</h1>
      <small>DOVE BLUE 2026</small>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn-icon" onclick="toggleTheme()" id="themeBtn" title="Ganti Tema">🌙</button>
    <button class="btn-icon" onclick="exportLinks()" title="Ekspor Link"><i class="fas fa-download"></i></button>
    <button class="btn-icon" onclick="importLinks()" title="Impor Link"><i class="fas fa-upload"></i></button>
  </div>
</div>

<div class="page-title"><i class="fas fa-rocket" style="color:var(--neon-cyan)"></i> BUKA BANYAK LINK SEKALIGUS</div>

<div class="bento">
  <div class="bento-stat"><div class="bento-label"><span class="icon">🔗</span>Total Link</div><div class="bento-value" id="bTot">0</div><div class="bento-sub">Link tersimpan</div></div>
  <div class="bento-stat"><div class="bento-label"><span class="icon"><i class="fas fa-check-circle"></i></span>Dibuka</div><div class="bento-value" id="bOpened">0</div><div class="bento-sub">Sudah diakses</div></div>
  <div class="bento-stat"><div class="bento-label"><span class="icon"><i class="fas fa-hourglass-half"></i></span>Belum</div><div class="bento-value" id="bPending">0</div><div class="bento-sub">Masih antri</div></div>
  <div class="bento-stat"><div class="bento-label"><span class="icon"><i class="fas fa-fire"></i></span>Baru</div><div class="bento-value" id="bNew">0</div><div class="bento-sub">&lt; 2 hari</div></div>
</div>

<div class="section">
  <div class="section-header">
    <h3><span class="bar"></span><i class="fas fa-plus-circle"></i> TAMBAH LINK</h3>
    <small>TANPA BATAS</small>
  </div>
  <div class="form-group">
    <label>Paste Link (satu per baris)</label>
    <textarea id="linkInput" placeholder="google.com&#10;youtube.com&#10;https://github.com"></textarea>
  </div>
  <div class="action-row">
    <button class="btn btn-primary" onclick="addLinks()" style="flex:1"><i class="fas fa-plus"></i> TAMBAH LINK</button>
    <button class="btn btn-ghost" onclick="document.getElementById('linkInput').value='';updateInputCount()" style="flex:1"><i class="fas fa-times"></i> KOSONGKAN</button>
  </div>
  <div style="font-size:10px;color:var(--text-muted);margin-top:8px;text-align:center">
    <span id="inputCount">0 link siap ditambahkan</span> · Tanpa limit jumlah link
  </div>
</div>

<div class="section">
  <div class="section-header">
    <h3><span class="bar"></span><i class="fas fa-list"></i> DAFTAR LINK</h3>
    <small id="listCount">0 LINK</small>
  </div>
  <div class="search-bar">
    <i class="fas fa-search"></i>
    <input type="text" id="searchInput" placeholder="Cari link..." oninput="renderLinks()">
    <span class="search-info" id="searchInfo"></span>
    <button class="clear-btn" onclick="document.getElementById('searchInput').value='';renderLinks()"><i class="fas fa-times-circle"></i></button>
  </div>
  <div class="action-row" style="margin-bottom:14px">
    <button class="btn btn-success" onclick="openAllLinks()" style="flex:1"><i class="fas fa-rocket"></i> BUKA SEMUA</button>
    <button class="btn btn-warning" onclick="openPendingLinks()" style="flex:1"><i class="fas fa-play"></i> BUKA YANG BELUM</button>
    <button class="btn btn-danger" onclick="clearAllLinks()" style="flex:1"><i class="fas fa-trash"></i> HAPUS SEMUA</button>
  </div>
  <div id="linkList" class="link-list"></div>
</div>

<div class="footer">👑 Created by <strong>SCRIPTVAULT</strong> · Dove Blue Edition</div>
</div>

<div class="toasts" id="toasts"></div>
<input type="file" id="fileInput" accept=".json,.txt" style="display:none" onchange="handleFileImport(event)">

<script>
let links = [];
const NEW_THRESHOLD = 2 * 24 * 60 * 60 * 1000;

// ========== THEME ==========
function applyTheme(dark){
  document.documentElement.classList.toggle('dark', dark);
  const b = document.getElementById('themeBtn');
  if(b) b.textContent = dark ? '☀️' : '🌙';
  try{ localStorage.setItem('ll_theme', dark ? '1' : '0'); }catch(e){}
}
function toggleTheme(){ applyTheme(!document.documentElement.classList.contains('dark')); }
try{ if(localStorage.getItem('ll_theme')==='1') applyTheme(true); }catch(e){}

// ========== TOAST ==========
function toast(msg, type){
  type = type || 'info';
  const w = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const im = {
    success:'<i class="fas fa-check-circle"></i>',
    error:'<i class="fas fa-times-circle"></i>',
    info:'<i class="fas fa-info-circle"></i>',
    warning:'<i class="fas fa-exclamation-triangle"></i>'
  };
  el.innerHTML = '<span class="icon">'+(im[type]||'')+'</span><span>'+esc(msg)+'</span><div class="toast-progress"></div>';
  w.appendChild(el);
  setTimeout(()=>{ el.style.animation='toastSlideIn 0.3s reverse'; setTimeout(()=>el.remove(),300); }, 3500);
}

function esc(t){
  if(!t) return '';
  return String(t).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ========== URL ==========
function normalizeUrl(url){
  url = (url || '').trim();
  if(!url) return null;
  if(!/^https?:\/\//i.test(url)) url = 'https://' + url;
  try{ new URL(url); return url; }catch(e){ return null; }
}

function getHost(url){
  try{ return new URL(url).hostname.replace(/^www\./,''); }catch(e){ return url; }
}

// ========== INPUT COUNTER ==========
function updateInputCount(){
  const v = document.getElementById('linkInput').value;
  const lines = v.split('\n').map(l=>l.trim()).filter(Boolean);
  const valid = lines.map(normalizeUrl).filter(Boolean).length;
  document.getElementById('inputCount').textContent = valid + ' link siap ditambahkan';
}
document.addEventListener('DOMContentLoaded', ()=>{
  const ta = document.getElementById('linkInput');
  if(ta) ta.addEventListener('input', updateInputCount);
});

// ========== CRUD ==========
function addLinks(){
  const ta = document.getElementById('linkInput');
  const lines = ta.value.split('\n').map(l=>l.trim()).filter(Boolean);
  const validLinks = lines.map(normalizeUrl).filter(Boolean);
  if(!validLinks.length){ toast('⚠️ Tidak ada link valid ditemukan', 'warning'); return; }
  
  // Tanpa limit - langsung push semua
  const now = Date.now();
  validLinks.forEach(url=>{
    links.push({ url, addedAt: now, opened: false, id: 'l_' + now + '_' + Math.random().toString(36).substr(2,5) });
  });
  
  saveLinks();
  ta.value = '';
  updateInputCount();
  renderLinks();
  toast('✅ ' + validLinks.length + ' link berhasil ditambahkan!', 'success');
}

function removeLink(id){
  const idx = links.findIndex(l=>l.id===id);
  if(idx>-1){
    links.splice(idx,1);
    saveLinks();
    renderLinks();
    toast('🗑️ Link dihapus', 'success');
  }
}

function clearAllLinks(){
  if(!links.length){ toast('ℹ️ Tidak ada link', 'info'); return; }
  if(!confirm('Hapus semua ' + links.length + ' link? Aksi ini tidak dapat dibatalkan.')) return;
  links = [];
  saveLinks();
  renderLinks();
  toast('🗑️ Semua link dihapus', 'success');
}

// ========== OPEN LINKS ==========
function openSingleLink(id){
  const l = links.find(x=>x.id===id);
  if(!l) return;
  const win = window.open(l.url, '_blank', 'noopener,noreferrer');
  l.opened = true;
  saveLinks();
  renderLinks();
  if(!win || win.closed || typeof win.closed === 'undefined'){
    toast('🔒 Pop-up diblokir untuk link ini', 'warning');
  } else {
    toast('✅ Link dibuka', 'success');
  }
}

function openAllLinks(){
  if(!links.length){ toast('⚠️ Belum ada link', 'warning'); return; }
  toast('🚀 Membuka ' + links.length + ' link — izinkan pop-up', 'info');
  
  // Tandai semua dibuka
  links.forEach(l=>l.opened = true);
  saveLinks();
  renderLinks();
  
  let opened = 0, blocked = 0;
  links.forEach((l, i) => {
    setTimeout(()=>{
      const win = window.open(l.url, '_blank', 'noopener,noreferrer');
      if(win && !win.closed) opened++; else blocked++;
      if(i === links.length - 1){
        if(blocked === 0) toast('✨ ' + opened + ' link berhasil dibuka!', 'success');
        else toast('⚠️ ' + opened + ' dibuka, ' + blocked + ' diblokir (izinkan pop-up)', 'warning');
      }
    }, i * 250);
  });
}

function openPendingLinks(){
  const pending = links.filter(l=>!l.opened);
  if(!pending.length){ toast('✅ Semua link sudah dibuka', 'info'); return; }
  openAllLinks(); // Buka semua, karena pending filter otomatis by state
}

// ========== RENDER ==========
function renderLinks(){
  const container = document.getElementById('linkList');
  const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
  
  let filtered = links;
  if(q){
    filtered = links.filter(l => l.url.toLowerCase().includes(q) || getHost(l.url).includes(q));
  }
  
  // Update stats
  const total = links.length;
  const opened = links.filter(l=>l.opened).length;
  const now = Date.now();
  const newCount = links.filter(l=> (now - l.addedAt) < NEW_THRESHOLD).length;
  
  document.getElementById('bTot').textContent = total;
  document.getElementById('bOpened').textContent = opened;
  document.getElementById('bPending').textContent = total - opened;
  document.getElementById('bNew').textContent = newCount;
  document.getElementById('listCount').textContent = filtered.length + ' LINK';
  
  const info = document.getElementById('searchInfo');
  if(info) info.textContent = q ? (filtered.length + ' dari ' + links.length + ' cocok') : '';
  
  if(!filtered.length){
    container.innerHTML = '<div class="empty"><div class="icon">🔗</div><h4>' + (q?'TIDAK DITEMUKAN':'BELUM ADA LINK') + '</h4><p>' + (q?'Tidak ada link cocok dengan "'+esc(q)+'"':'Tambahkan link di form atas untuk memulai') + '</p></div>';
    return;
  }
  
  // Sort: newest first
  const sorted = [...filtered].sort((a,b)=>b.addedAt-a.addedAt);
  
  container.innerHTML = sorted.map((l, idx)=>{
    const isNew = (now - l.addedAt) < NEW_THRESHOLD;
    const host = getHost(l.url);
    const timeAgo = ago(l.addedAt);
    return `
      <div class="link-card ${l.opened?'opened':''}" style="animation-delay:${idx*0.03}s">
        ${isNew ? '<div class="badge-new">NEW</div>' : ''}
        <div class="link-card-head">
          <div class="link-icon ${l.opened?'opened':''}" onclick="openSingleLink('${l.id}')" title="Buka link">
            <i class="fas ${l.opened?'fa-check':'fa-external-link-alt'}"></i>
          </div>
          <div class="link-body">
            <div class="link-url">${esc(l.url)}</div>
            <div class="link-host"><i class="fas fa-server" style="margin-right:4px;color:var(--neon-cyan)"></i>${esc(host)}</div>
          </div>
        </div>
        <div class="link-meta">
          <span><span class="icon"><i class="fas fa-clock"></i></span>${timeAgo}</span>
          <span><span class="icon"><i class="${l.opened?'fas fa-check-circle':'fas fa-hourglass-half'}"></i></span>${l.opened?'Dibuka':'Belum dibuka'}</span>
          ${isNew ? '<span><span class="icon"><i class="fas fa-bolt"></i></span>Baru ditambahkan</span>' : ''}
        </div>
        <div class="link-actions">
          <button class="btn ${l.opened?'opened':'btn-primary'}" onclick="openSingleLink('${l.id}')">
            <i class="fas ${l.opened?'fa-check':'fa-external-link-alt'}"></i> ${l.opened?'DIBUKA':'BUKA'}
          </button>
          <button class="btn btn-ghost" onclick="copyLink('${l.id}')"><i class="fas fa-copy"></i> Copy</button>
          <button class="btn btn-danger" onclick="removeLink('${l.id}')"><i class="fas fa-trash"></i> Hapus</button>
        </div>
      </div>
    `;
  }).join('');
}

// ========== HELPERS ==========
function copyLink(id){
  const l = links.find(x=>x.id===id);
  if(!l) return;
  navigator.clipboard.writeText(l.url).then(()=>toast('✅ Link di-copy', 'success'))
    .catch(()=>{
      const t = document.createElement('textarea');
      t.value = l.url; t.style.position='fixed'; t.style.opacity='0';
      document.body.appendChild(t); t.select();
      try{ document.execCommand('copy'); }catch(e){}
      document.body.removeChild(t);
      toast('✅ Link di-copy', 'success');
    });
}

function ago(ts){
  const s = (Date.now() - ts) / 1000;
  if(s < 60) return 'baru saja';
  if(s < 3600) return Math.floor(s/60) + 'm lalu';
  if(s < 86400) return Math.floor(s/3600) + 'j lalu';
  if(s < 2592000) return Math.floor(s/86400) + 'h lalu';
  return new Date(ts).toLocaleDateString('id-ID');
}

// ========== STORAGE ==========
function saveLinks(){
  try{ localStorage.setItem('ll_links', JSON.stringify(links)); }catch(e){}
}
function loadLinks(){
  try{
    const raw = localStorage.getItem('ll_links');
    if(raw) links = JSON.parse(raw) || [];
  }catch(e){ links = []; }
}

// ========== EXPORT / IMPORT ==========
function exportLinks(){
  if(!links.length){ toast('ℹ️ Belum ada link', 'info'); return; }
  const data = { exportedAt: new Date().toISOString(), links };
  const blob = new Blob([JSON.stringify(data,null,2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const d = new Date();
  a.download = 'link-launcher-' + d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0') + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(a.href); }, 400);
  toast('✅ Link diekspor', 'success');
}

function importLinks(){ document.getElementById('fileInput').click(); }
function handleFileImport(e){
  const file = e.target.files[0];
  if(!file) return;
  const r = new FileReader();
  r.onload = ev => {
    try{
      const txt = ev.target.result;
      // Try JSON first
      let imported = [];
      try{
        const d = JSON.parse(txt);
        if(Array.isArray(d.links)) imported = d.links;
        else if(Array.isArray(d)) imported = d;
      }catch(_){
        // Fallback: plain text (one URL per line)
        imported = txt.split('\n').map(l=>l.trim()).filter(Boolean).map(url=>({
          url: normalizeUrl(url),
          addedAt: Date.now(),
          opened: false,
          id: 'l_' + Date.now() + '_' + Math.random().toString(36).substr(2,5)
        })).filter(l=>l.url);
      }
      if(!imported.length){ toast('❌ Tidak ada link valid di file', 'error'); return; }
      
      // Merge: avoid duplicates by URL
      let added = 0;
      imported.forEach(imp => {
        if(!imp.url) return;
        const url = normalizeUrl(imp.url);
        if(!url) return;
        if(!links.some(x=>x.url===url)){
          links.push({ url, addedAt: imp.addedAt || Date.now(), opened: false, id: imp.id || 'l_' + Date.now() + '_' + Math.random().toString(36).substr(2,5) });
          added++;
        }
      });
      saveLinks();
      renderLinks();
      toast('✅ ' + added + ' link baru diimpor', 'success');
    }catch(err){ toast('❌ File tidak valid', 'error'); }
  };
  r.readAsText(file);
  e.target.value = '';
}

// ========== KEYBOARD ==========
document.addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){ e.preventDefault(); addLinks(); }
  if(e.key === 'Escape'){ document.getElementById('searchInput').value = ''; renderLinks(); }
});

// ========== INIT ==========
document.addEventListener('DOMContentLoaded', ()=>{
  loadLinks();
  renderLinks();
  updateInputCount();
  toast('🔗 Link Launcher siap!', 'success');
});
</script>
</body>
</html>
