<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BUKU DOSA ALL — Dove Blue v4</title>
<style>
:root{--dv50:#f2f7fc;--dv100:#e3eef8;--dv200:#c9ddef;--dv300:#a3c4e2;--dv400:#74a3cf;
--dv500:#4682b4;--dv600:#38688f;--dv700:#2e5474;--dv800:#203a51;
--ink:#12222f;--soft:#4a5d6e;--line:#d7e4f0;--red:#c62828;--redbg:#fdecea;
--amber:#b45309;--amberbg:#fff7e0;--shadow:0 8px 24px rgba(32,58,81,.12)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);
background:linear-gradient(180deg,var(--dv50),#eaf2fa 60%,#e3edf7);min-height:100vh}
header{position:sticky;top:0;z-index:60;background:linear-gradient(90deg,var(--dv600),var(--dv500) 55%,var(--dv400));color:#fff;box-shadow:0 6px 18px rgba(32,58,81,.25)}
.hwrap{max-width:1700px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#fff,#cfe0f0);display:grid;place-items:center;font-size:22px}
h1{font-size:20px;margin:0}h1 small{display:block;font-size:11px;font-weight:400;opacity:.85}
#status{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:6px 12px;border-radius:999px}
.dot{width:8px;height:8px;border-radius:50%;background:#9be1ff;box-shadow:0 0 8px #9be1ff}
.dot.ok{background:#7ef0c0}.dot.err{background:#ff9d9d}
.tabs{max-width:1700px;margin:16px auto 0;padding:0 20px;display:flex;gap:10px;flex-wrap:wrap}
.tab{cursor:pointer;padding:11px 20px;border-radius:12px 12px 4px 4px;font-weight:700;background:#fff;color:var(--dv700);border:1px solid var(--dv200);display:flex;gap:10px;align-items:center;transition:.18s}
.tab.on{background:linear-gradient(180deg,var(--dv500),var(--dv600));color:#fff}
.pill{font-size:11px;padding:2px 9px;border-radius:999px;background:rgba(70,130,180,.12)}.tab.on .pill{background:rgba(255,255,255,.25)}
.ctrls{max-width:1700px;margin:14px auto;padding:0 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ctrl{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--dv200);border-radius:12px;padding:8px 12px}
.ctrl label{font-size:11px;font-weight:800;color:var(--dv700);white-space:nowrap}
.ctrl select,.ctrl input{border:0;outline:0;background:transparent;font-size:13px;min-width:150px}
.btn{cursor:pointer;border:1px solid var(--dv200);background:linear-gradient(180deg,#fff,#e8f1fa);color:var(--dv700);font-weight:700;padding:9px 14px;border-radius:10px;text-decoration:none;display:inline-block}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(32,58,81,.12)}
.badge{font-size:12px;font-weight:800;color:#fff;background:linear-gradient(90deg,var(--dv500),var(--dv400));padding:8px 14px;border-radius:10px;box-shadow:var(--shadow)}
.badge.src{background:linear-gradient(90deg,#5b7086,#74899f)}
.stats{max-width:1700px;margin:0 auto 12px;padding:0 20px;display:flex;gap:10px;flex-wrap:wrap}
.stat{background:#fff;border:1px solid var(--dv200);border-radius:12px;padding:10px 16px;min-width:120px}
.stat .t{font-size:10px;letter-spacing:.8px;color:var(--soft);font-weight:800}.stat .v{font-size:20px;font-weight:900;color:var(--dv600)}
.staffbox{max-width:1700px;margin:0 auto 12px;padding:0 20px}
.staffscroll{background:#fff;border:1px solid var(--dv200);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px}
.staffscroll h3{margin:2px 4px 8px;font-size:13px;color:var(--dv700)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;cursor:grab}
.chips::-webkit-scrollbar{height:8px}.chips::-webkit-scrollbar-thumb{background:var(--dv300);border-radius:8px}
.chip-s{flex:0 0 auto;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--dv800);background:linear-gradient(180deg,#f6faff,#e7f0f9);border:1px solid var(--dv200);border-radius:999px;padding:7px 12px;cursor:pointer}
.chip-s.on{background:linear-gradient(180deg,var(--dv500),var(--dv600));color:#fff}
.chip-s b{background:rgba(70,130,180,.14);border-radius:999px;padding:1px 8px;font-size:11px}.chip-s.on b{background:rgba(255,255,255,.25)}
main{max-width:1700px;margin:0 auto 46px;padding:0 20px}
.panel{display:none}.panel.on{display:block;animation:fd .25s}
@keyframes fd{from{opacity:0}to{opacity:1}}
.twrap{background:#fff;border:1px solid var(--dv200);border-radius:14px;box-shadow:var(--shadow);overflow:auto;max-height:72vh;cursor:grab}
.twrap::-webkit-scrollbar{height:10px;width:10px}.twrap::-webkit-scrollbar-thumb{background:var(--dv300);border-radius:10px}
.grid{min-width:1150px}.grid.fatal{min-width:1450px}
.hrow,.row{display:grid;grid-template-columns:46px 108px 240px minmax(340px,1.2fr) minmax(280px,1.1fr);align-items:center;border-bottom:1px solid var(--line)}
.grid.fatal .hrow,.grid.fatal .row{grid-template-columns:44px 105px 200px 80px 100px 90px minmax(250px,1.2fr) minmax(240px,1fr) minmax(240px,1fr)}
.hrow{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--dv500),var(--dv600));color:#fff;font-size:11px;font-weight:800;letter-spacing:.8px}
.hrow div{padding:11px 10px}
.row{font-size:12.5px;background:#fff}.row:nth-child(even){background:#f6fafd}.row:hover{background:var(--dv100)}
.row>div{padding:8px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .no{color:var(--soft);font-weight:700;text-align:center}
.row .tgl{font-weight:700;color:var(--dv600)}.row .nm{font-weight:700;color:var(--dv800)}
.row.fatalrow{background:var(--redbg)}.row.fatalrow .ket{color:var(--red);font-weight:800}
.ket{white-space:normal!important;line-height:1.35;max-height:44px;overflow:hidden}
.links{display:flex;gap:8px;overflow-x:auto;padding:6px 10px!important;white-space:nowrap!important}
.links::-webkit-scrollbar{height:6px}.links::-webkit-scrollbar-thumb{background:var(--dv300);border-radius:6px}
.ph{flex:0 0 auto;display:inline-flex;gap:7px;align-items:center;background:#f4f9fd;border:1px solid var(--dv200);border-radius:9px;padding:4px 8px}
.fb{cursor:pointer;border:1px solid var(--dv300);background:linear-gradient(180deg,var(--dv400),var(--dv500));color:#fff;font-weight:800;font-size:11px;border-radius:7px;padding:5px 9px;flex:0 0 auto}
.fb:hover{filter:brightness(1.1)}
.fu{font-size:11px;color:var(--dv600);font-weight:600;text-decoration:underline;white-space:nowrap}
.fu:hover{color:var(--dv800)}
.tagf{display:inline-block;font-size:10px;font-weight:900;border-radius:6px;padding:2px 8px}
.tagf.red{background:var(--red);color:#fff}.tagf.amb{background:var(--amberbg);color:var(--amber);border:1px solid #f3dda0}
.dsep{grid-column:1/-1;background:linear-gradient(90deg,var(--dv100),#fff);color:var(--dv700);font-weight:900;font-size:11px;letter-spacing:1px;padding:6px 12px;border-bottom:1px solid var(--line)}
.empty{padding:46px;text-align:center;color:var(--soft);font-weight:600}
.warnbox{grid-column:1/-1;margin:14px;padding:18px;border:1px dashed var(--dv400);border-radius:12px;background:var(--amberbg);color:var(--amber);font-size:13px;line-height:1.7}
.warnbox .btn{margin:4px 6px 0 0}
.loader{display:flex;gap:10px;align-items:center;justify-content:center;padding:26px;color:var(--dv600);font-weight:700}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--dv200);border-top-color:var(--dv500);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.mbg{position:fixed;inset:0;background:rgba(16,29,42,.75);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:100;padding:18px}
.mbg.show{display:flex}
.modal{background:#fff;border-radius:16px;border:1px solid var(--dv200);max-width:min(980px,96vw);max-height:92vh;overflow:auto;padding:16px}
.modal .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal img{display:block;margin:12px auto 0;max-width:100%;max-height:70vh;border-radius:10px;border:1px solid var(--dv200)}
.murl{display:block;margin:12px auto 0;background:var(--dv100);border:1px solid var(--dv200);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--dv800);word-break:break-all;user-select:all}
.mcap{margin-top:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
@media(max-width:640px){h1{font-size:16px}.ctrl{width:100%}.ctrl select,.ctrl input{flex:1;min-width:0}}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="logo">🕊️</div>
  <h1>BUKU DOSA ALL <small>Drag‑Free · Dove Blue · v4</small></h1>
  <div id="status"><span class="dot" id="sDot"></span><span id="sTxt">Memuat data…</span></div>
</div></header>

<div class="tabs">
  <div class="tab on" data-p="chat">🗨️ KESALAHAN CHAT ALL <span class="pill" id="cChat">0</span></div>
  <div class="tab" data-p="fatal">⚠️ FATAL ALL SITUS <span class="pill" id="cFatal">0</span></div>
</div>

<main>
<section class="panel on" id="p-chat">
  <div class="ctrls">
    <span class="badge">C2: <span id="c2val">…</span></span>
    <span class="badge src" id="srcInfo">📡 mencari sumber situs…</span>
    <div class="ctrl"><label>🌐 PILIH SITUS</label><select id="selSitus"></select></div>
    <div class="ctrl"><label>＋ TAB</label><input id="addSite" placeholder="nama tab sheet…"><button class="btn" id="btnAdd">Muat</button></div>
    <div class="ctrl"><label>🔍</label><input id="qChat" placeholder="cari nama / keterangan…"></div>
    <button class="btn" id="btnResetChat">↺</button><button class="btn" id="btnReload">⟳ Reload</button>
  </div>
  <div class="stats">
    <div class="stat"><div class="t">BARIS</div><div class="v" id="stRow">0</div></div>
    <div class="stat"><div class="t">CS</div><div class="v" id="stCs">0</div></div>
    <div class="stat"><div class="t">FATAL</div><div class="v" id="stFatal">0</div></div>
    <div class="stat"><div class="t">TAMPIL</div><div class="v" id="stShow">0</div></div>
  </div>
  <div class="staffbox"><div class="staffscroll">
    <h3>👥 STAFF & TOTAL KESALAHAN (I3:J40) — klik untuk filter</h3>
    <div class="chips" id="staffChips"></div>
  </div></div>
  <div class="twrap" id="wrapChat"><div class="grid" id="gridChat"><div class="loader"><div class="spin"></div>Memuat…</div></div></div>
</section>

<section class="panel" id="p-fatal">
  <div class="ctrls">
    <div class="ctrl"><label>🌐 SITUS</label><select id="fSitus"></select></div>
    <div class="ctrl"><label>👤 STAFF</label><select id="fStaff"></select></div>
    <div class="ctrl"><label>📅</label><input type="date" id="fDate"></div>
    <div class="ctrl"><label>🔍</label><input id="qFatal" placeholder="cari…"></div>
    <button class="btn" id="btnResetFatal">↺ Reset</button>
  </div>
  <div class="stats">
    <div class="stat"><div class="t">TOTAL</div><div class="v" id="ftRow">0</div></div>
    <div class="stat"><div class="t">STAFF</div><div class="v" id="ftStaff">0</div></div>
    <div class="stat"><div class="t">SITUS</div><div class="v" id="ftSitus">0</div></div>
    <div class="stat"><div class="t">TAMPIL</div><div class="v" id="ftShow">0</div></div>
  </div>
  <div class="twrap" id="wrapFatal"><div class="grid fatal" id="gridFatal"><div class="loader"><div class="spin"></div>Memuat…</div></div></div>
</section>
</main>

<div class="mbg" id="mbg"><div class="modal">
  <div class="top"><b id="mTitle">Preview</b><button class="btn" onclick="mClose()">✕ Tutup</button></div>
  <img id="mImg" alt="preview">
  <code class="murl" id="mUrl"></code>
  <div class="mcap"><button class="btn" id="btnCopy">📋 Salin Link</button><a class="btn" id="btnOpen" target="_blank">🔗 Buka di Tab Baru</a></div>
</div></div>

<script>
/* ================== KONFIG ================== */
const SID='1camkXfvojs-YSBBPekYHTi4cwata4YCGTtmVIeOy1yc';
const CHAT_SHEET='Situs Lain', FATAL_SHEET='Fatal All Situs';
const SHEET_EDIT='https://docs.google.com/spreadsheets/d/'+SID+'/edit?gid=1921614792';
/* Jika Anda TAHU nama tab sheet-nya, isi di sini → 100% berfungsi: */
const MASTER_TABS=['CHAT ALL','ALL CHAT','KESALAHAN CHAT ALL','KESALAHAN CHAT','DATA CHAT','MASTER CHAT','MASTER','REKAP CHAT','ALL SITUS','REKAPAN KESALAHAN CS CHAT'];
const LIST_TABS=['DATA SITUS','SITUS','LIST SITUS','NAMA SITUS'];
const EXTRA_SITES=[];
const csvURL=n=>`https://docs.google.com/spreadsheets/d/${SID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(n)}`;

/* ================== STATE ================== */
let CHAT_CACHE={},FATAL=[],C2='',curSite='',MODE='fallback',MASTER=null,SITE_LIST=[];
let KNOWN=new Set(EXTRA_SITES),DEAD=new Set();
let cQ='',cStaff='',fQ='',fSitus='',fStaff='',fDate='';

/* ================== UTIL ================== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cl=v=>(v==null||String(v).trim()==='')?'':String(v).trim();
const isDate=s=>/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(cl(s));
const linksOf=s=>cl(s)?[...new Set(String(s).match(/https?:\/\/[^\s,"'<>]+/gi)||[])]:[];
const eqSite=(a,b)=>cl(a).toUpperCase()===cl(b).toUpperCase();
const NAME_RE=/^[A-Z][A-Za-z'. ]{2,}[A-Z0-9]{6,9}$/;
function parseCSV(t){const R=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];
if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
else{if(c==='"')q=true;else if(c===','){r.push(f);f=''}else if(c==='\n'){r.push(f);R.push(r);r=[];f=''}else if(c!=='\r')f+=c}}
if(f||r.length){r.push(f);R.push(r)}return R}
async function fetchCSV(u){const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);
const t=await r.text();if(t.trim().startsWith('<'))throw new Error('tab tidak ada');return parseCSV(t)}
const setStatus=(k,t)=>{$('sDot').className='dot '+(k==='ok'?'ok':k==='err'?'err':'');$('sTxt').textContent=t};

/* ================== PARSER ================== */
function detectC2(rows){for(let i=0;i<Math.min(4,rows.length);i++){const r=rows[i]||[];
for(const ci of[2,1,3]){const v=cl(r[ci]);if(v&&!isDate(v)&&!/^https?:/i.test(v)&&!/GANTI NAMA|REKAPAN/i.test(v)&&v.length<=40)return v}}return''}

function parseChat(rows){const c2=detectC2(rows);const recs=[],staff=[];let curDate='';
for(let i=2;i<Math.min(rows.length,2547);i++){const r=rows[i]||[];const B=cl(r[1]),C=cl(r[2]),D=cl(r[3]);
if(isDate(C)){curDate=C;continue}
if(i<40){const I=cl(r[8]),J=cl(r[9]);if(I&&!/#VALUE!|TOTAL/i.test(I))staff.push({name:I,total:J||'0'})}
const L=linksOf(C);if(!B&&!L.length&&!D)continue;if(!B&&!L.length)continue;
recs.push({tgl:curDate,nama:B,links:L,ket:D,site:c2})}
return{c2,recs,staff}}

/* parser longgar: untuk tab master / tab per-situs (layout apa pun) */
function looseRow(r,siteCol){let nama='',tgl='',ket='',links=[];
const site=siteCol>=0?cl(r[siteCol]):'';
for(let c=0;c<(r||[]).length;c++){const v=cl(r[c]);if(!v||c===siteCol)continue;
const L=linksOf(v);if(L.length){links.push(...L);continue}
if(isDate(v)){if(!tgl)tgl=v;continue}
if(!nama&&NAME_RE.test(v)){nama=v;continue}
if(/GANTI NAMA|NAMA STAFF|TOTAL|NOMOR PASPOR|KETERANGAN|SITUS/i.test(v)&&v.length<28)continue;
if(v.length>(ket||'').length)ket=v}
return{nama,tgl,ket,site,links:[...new Set(links)]}}
function parseLoose(rows,siteCol){const recs=[];let curDate='';
for(let i=0;i<rows.length;i++){const o=looseRow(rows[i]||[],siteCol);
if(o.tgl&&!o.nama&&!o.links.length){curDate=o.tgl;continue}
if(!o.nama&&!o.links.length&&!o.ket)continue;
if(!o.tgl)o.tgl=curDate;recs.push(o)}return recs}
function detectSiteCol(rows){const up=new Set([...KNOWN].map(s=>s.toUpperCase()));const score={};
for(let i=0;i<Math.min(rows.length,400);i++){const r=rows[i]||[];
for(let c=0;c<Math.min(r.length,16);c++){const v=cl(r[c]);if(!v||v.length>24||/^https?:/i.test(v)||isDate(v))continue;
if(up.has(v.toUpperCase()))score[c]=(score[c]||0)+3;
else if(/^[A-Z0-9 ]{3,20}$/.test(v))score[c]=(score[c]||0)+1}}
let best=-1,bn=2;for(const c in score)if(score[c]>bn){bn=score[c];best=+c}return best}
function extractList(rows){const col={};for(let i=0;i<Math.min(rows.length,80);i++){
const v=cl((rows[i]||[])[0]);if(!v||isDate(v)||/^https?:/i.test(v)||v.length>30)continue;col[v]=1}
const l=Object.keys(col);return(l.length>=2&&l.length<=60)?l:null}

/* ================== SUMBER DATA CHAT ================== */
function getChatRecs(){
if(MODE==='master'&&MASTER){let r=MASTER.recs;if(curSite)r=r.filter(x=>eqSite(x.site,curSite));return r}
if(curSite)return(CHAT_CACHE[curSite]||{recs:[]}).recs;
let r=[];for(const k in CHAT_CACHE)r=r.concat(CHAT_CACHE[k].recs);return r}

async function loadChatSite(site){if(CHAT_CACHE[site])return CHAT_CACHE[site];
const rows=await fetchCSV(site===C2?csvURL(CHAT_SHEET):csvURL(site));
const p=parseChat(rows);p.recs=p.recs.map(r=>({...r,site:r.site||site}));
CHAT_CACHE[site]=p;DEAD.delete(site);return p}

async function discover(){
setStatus('','Mencari sumber data situs…');
for(const n of LIST_TABS){try{const l=extractList(await fetchCSV(csvURL(n)));
if(l){SITE_LIST=l;l.forEach(s=>KNOWN.add(s));setStatus('ok','Daftar situs ditemukan: '+n);break}}catch(e){}}
for(const n of MASTER_TABS){try{const rows=await fetchCSV(csvURL(n));const sc=detectSiteCol(rows);
if(sc>=0&&rows.length>10){MASTER={name:n,recs:parseLoose(rows,sc)};MODE='master';
MASTER.recs.forEach(r=>r.site&&KNOWN.add(r.site));
setStatus('ok','Master situs ditemukan: '+n);break}}catch(e){}}
if(MODE!=='master'){for(const s of[...KNOWN].slice(0,10)){if(s===C2||CHAT_CACHE[s])continue;
try{await loadChatSite(s)}catch(e){DEAD.add(s)}}
if(Object.keys(CHAT_CACHE).length>1)MODE='tabs'}
buildSitusOptions();renderStaff();renderChat();updateSrc()}
function updateSrc(){
$('srcInfo').textContent=MODE==='master'?('📡 Master: "'+MASTER.name+'" — pilih situs LANGSUNG filter ✓')
:MODE==='tabs'?'📡 Mode tab per‑situs ✓':'📡 Mode Situs Lain (mengikuti C2)'}

/* ================== RENDER CHAT ================== */
function photoCell(links,nama){
if(!links.length)return'<span style="color:#9aa7b2">—</span>';
return links.map((u,j)=>`<span class="ph"><button class="fb" data-u="${esc(u)}" data-t="${esc(nama)} — Foto ${j+1}">📷 Buka Foto</button><a class="fu" href="${esc(u)}" target="_blank">${esc(u)}</a></span>`).join('')}
function renderChat(){
let recs=getChatRecs();const all=recs;
if(cStaff)recs=recs.filter(r=>(r.nama||'').toUpperCase().includes(cStaff.toUpperCase()));
if(cQ)recs=recs.filter(r=>((r.nama||'')+' '+(r.ket||'')).toLowerCase().includes(cQ.toLowerCase()));
$('stRow').textContent=all.length;$('stCs').textContent=new Set(all.map(r=>r.nama).filter(Boolean)).size;
$('stFatal').textContent=all.filter(r=>/fatal/i.test(r.ket)).length;
$('stShow').textContent=recs.length;$('cChat').textContent=recs.length;
let last='',html='<div class="hrow"><div>NO</div><div>TANGGAL</div><div>NAMA CS</div><div>FOTO + LINK (terpisah)</div><div>KETERANGAN</div></div>';
if(curSite&&MODE!=='master'&&DEAD.has(curSite)&&!CHAT_CACHE[curSite]){
html+=`<div class="warnbox">⚠️ Tab sheet <b>"${esc(curSite)}"</b> tidak ditemukan.<br>
• Google Sheet publik hanya mengirim <b>nilai C2</b> (saat ini: <b>${esc(C2||'—')}</b>), bukan isi dropdownnya, dan data "Situs Lain" sudah ter‑filter per situs.<br>
• Agar pilih situs berfungsi pasti: isi <b>MASTER_TABS</b> / <b>EXTRA_SITES</b> di bagian CONFIG dengan nama tab sheet Anda, atau ketik nama tab di kolom <b>＋ TAB</b>.<br>
<button class="btn" onclick="window.open('${SHEET_EDIT}','_blank')">📂 Buka Google Sheet</button>
<button class="btn" onclick="boot()">⟳ Reload</button></div>`}
else if(!recs.length)html+='<div class="empty">Tidak ada data — baris kosong diabaikan.</div>';
else recs.forEach((r,i)=>{
if(r.tgl&&r.tgl!==last){last=r.tgl;html+=`<div class="dsep">📅 ${esc(r.tgl)}${r.site?' — '+esc(r.site):''}</div>`}
const fatal=/fatal/i.test(r.ket);
html+=`<div class="row${fatal?' fatalrow':''}"><div class="no">${i+1}</div>
<div class="tgl">${esc(r.tgl||'—')}</div><div class="nm" title="${esc(r.nama)}">${esc(r.nama||'—')}</div>
<div class="links">${photoCell(r.links,r.nama)}</div>
<div class="ket" title="${esc(r.ket)}">${fatal?'<span class="tagf red">FATAL</span> ':''}${esc(r.ket||'—')}</div></div>`});
$('gridChat').innerHTML=html;bindFoto($('gridChat'))}
function renderStaff(){const src=CHAT_CACHE[C2]||CHAT_CACHE[Object.keys(CHAT_CACHE)[0]]||{staff:[]};
$('staffChips').innerHTML=src.staff.length?src.staff.map(s=>`<div class="chip-s${cStaff===s.name?' on':''}" data-n="${esc(s.name)}">👤 ${esc(s.name)} <b>${esc(s.total)}</b></div>`).join(''):'<div class="empty" style="padding:10px">—</div>';
$('staffChips').querySelectorAll('.chip-s').forEach(c=>c.onclick=()=>{cStaff=(cStaff===c.dataset.n)?'':c.dataset.n;renderStaff();renderChat()})}
function buildSitusOptions(){if(C2)KNOWN.add(C2);FATAL.forEach(r=>r.situs&&KNOWN.add(r.situs));
const list=SITE_LIST.length?SITE_LIST:[...KNOWN].filter(Boolean).sort();
$('selSitus').innerHTML='<option value="">— SEMUA SITUS —</option>'+list.map(s=>`<option value="${esc(s)}"${s===curSite?' selected':''}>${esc(s)}</option>`).join('');
$('c2val').textContent=C2||'—'}

/* ================== RENDER FATAL ================== */
const normD=s=>{const m=cl(s).match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);if(!m)return cl(s);let y=m[3];if(y.length===2)y='20'+y;return`${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`};
function renderFatal(){let r=[...FATAL];
if(fSitus)r=r.filter(x=>x.situs===fSitus);if(fStaff)r=r.filter(x=>x.staf===fStaff);
if(fDate)r=r.filter(x=>normD(x.tgl)===fDate);
if(fQ)r=r.filter(x=>((x.staf||'')+' '+(x.ket||'')+' '+(x.situs||'')).toLowerCase().includes(fQ.toLowerCase()));
$('ftRow').textContent=FATAL.length;$('ftStaff').textContent=new Set(FATAL.map(x=>x.staf).filter(Boolean)).size;
$('ftSitus').textContent=new Set(FATAL.map(x=>x.situs).filter(Boolean)).size;
$('ftShow').textContent=r.length;$('cFatal').textContent=r.length;
let html='<div class="hrow"><div>NO</div><div>TANGGAL</div><div>NAMA STAF</div><div>STATUS</div><div>SITUS</div><div>POTONG</div><div>KETERANGAN FATAL</div><div>SS KESALAHAN</div><div>SS LC</div></div>';
if(!r.length)html+='<div class="empty">Tidak ada data fatal.</div>';
r.forEach((x,i)=>{html+=`<div class="row"><div class="no">${i+1}</div><div class="tgl">${esc(x.tgl||'—')}</div>
<div class="nm" title="${esc(x.staf)}">${esc(x.staf||'—')}</div>
<div>${x.stat?`<span class="tagf amb">${esc(x.stat)}</span>`:'—'}</div>
<div><b>${esc(x.situs||'—')}</b></div>
<div>${x.potong?`<span class="tagf red">−${esc(x.potong)}%</span>`:'—'}</div>
<div class="ket" title="${esc(x.ket)}">${esc(x.ket||'—')}</div>
<div class="links">${photoCell(x.ss1,x.staf)}</div>
<div class="links">${photoCell(x.ss2,x.staf)}</div></div>`});
$('gridFatal').innerHTML=html;bindFoto($('gridFatal'))}
function bindFoto(root){root.querySelectorAll('.fb').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();mOpen(b.dataset.u,b.dataset.t)}))}

/* ================== BOOT ================== */
async function boot(){setStatus('','Memuat data…');
try{const[a,b]=await Promise.allSettled([fetchCSV(csvURL(CHAT_SHEET)),fetchCSV(csvURL(FATAL_SHEET))]);
if(a.status==='fulfilled'){const p=parseChat(a.value);C2=p.c2;CHAT_CACHE[C2||CHAT_SHEET]=p}
if(b.status==='fulfilled'){FATAL=parseFatal(b.value);fillFatalFilters()}
buildSitusOptions();renderStaff();renderChat();renderFatal();setStatus('ok','Data termuat ✓');
discover()}catch(e){setStatus('err','Gagal: '+e.message)}}
function fillFatalFilters(){
const s=[...new Set(FATAL.map(x=>x.situs).filter(Boolean))].sort();
const p=[...new Set(FATAL.map(x=>x.staf).filter(Boolean))].sort();
$('fSitus').innerHTML='<option value="">— Semua —</option>'+s.map(x=>`<option>${esc(x)}</option>`).join('');
$('fStaff').innerHTML='<option value="">— Semua —</option>'+p.map(x=>`<option>${esc(x)}</option>`).join('')}

/* ================== EVENTS ================== */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));
t.classList.add('on');$('p-'+t.dataset.p).classList.add('on')});
$('selSitus').onchange=async e=>{curSite=e.target.value;
if(MODE!=='master'&&curSite&&!CHAT_CACHE[curSite]){
setStatus('','Memuat '+curSite+'…');
try{await loadChatSite(curSite);setStatus('ok','✓ '+curSite)}catch(err){DEAD.add(curSite);setStatus('err','Tab tidak ditemukan')}
if(MODE!=='master'&&Object.keys(CHAT_CACHE).length>1)MODE='tabs',updateSrc()}
renderChat()};
$('btnAdd').onclick=async()=>{const n=cl($('addSite').value);if(!n)return;
try{await loadChatSite(n);KNOWN.add(n);buildSitusOptions();curSite=n;$('selSitus').value=n;
if(MODE!=='master'&&Object.keys(CHAT_CACHE).length>1)MODE='tabs';updateSrc();renderChat();setStatus('ok','Tab "'+n+'" ✓')}
catch(e){setStatus('err','Tab "'+n+'" tidak ditemukan')}};
$('qChat').oninput=e=>{cQ=e.target.value;renderChat()};
$('btnResetChat').onclick=()=>{cQ='';cStaff='';curSite='';$('qChat').value='';buildSitusOptions();renderStaff();renderChat()};
$('btnReload').onclick=()=>{CHAT_CACHE={};FATAL=[];DEAD.clear();MASTER=null;MODE='fallback';boot()};
$('fSitus').onchange=e=>{fSitus=e.target.value;renderFatal()};
$('fStaff').onchange=e=>{fStaff=e.target.value;renderFatal()};
$('fDate').onchange=e=>{fDate=e.target.value;renderFatal()};
$('qFatal').oninput=e=>{fQ=e.target.value;renderFatal()};
$('btnResetFatal').onclick=()=>{fSitus=fStaff=fDate=fQ='';$('fSitus').value=$('fStaff').value=$('fDate').value=$('qFatal').value='';renderFatal()};

/* ================== DRAG SCROLL ================== */
function dragScroll(el){let d=false,sx=0,sl=0,mv=0;
el.addEventListener('pointerdown',e=>{if(e.target.closest('a,button,select,input'))return;d=true;mv=0;sx=e.clientX;sl=el.scrollLeft});
window.addEventListener('pointermove',e=>{if(!d)return;const dx=e.clientX-sx;mv=Math.max(mv,Math.abs(dx));if(mv>4)el.scrollLeft=sl-dx});
window.addEventListener('pointerup',()=>d=false)}
dragScroll($('wrapChat'));dragScroll($('wrapFatal'));dragScroll($('staffChips'));

/* ================== MODAL ================== */
let mCur='';
function mOpen(url,cap){mCur=url;$('mTitle').textContent=cap||'Preview';$('mUrl').textContent=url;$('btnOpen').href=url;
let img=url;const d=url.match(/\/d\/([\w-]{10,})/)||url.match(/[?&]id=([\w-]{10,})/);
if(d)img=`https://drive.google.com/thumbnail?id=${d[1]}&sz=w1600`;
const el=$('mImg');el.style.display='block';el.src=img;el.onerror=()=>el.style.display='none';
$('mbg').classList.add('show')}
function mClose(){$('mbg').classList.remove('show');$('mImg').src=''}
$('btnCopy').onclick=async()=>{try{await navigator.clipboard.writeText(mCur);$('btnCopy').textContent='✅ Tersalin!'}catch(e){}
setTimeout(()=>$('btnCopy').textContent='📋 Salin Link',1500)};
$('mbg').onclick=e=>{if(e.target.id==='mbg')mClose()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')mClose()});
boot();
</script>
</body>
