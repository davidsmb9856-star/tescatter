<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUKU DOSA ALL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            font-size: 2.5em;
            color: #ff4757;
            text-shadow: 0 0 20px rgba(255, 71, 87, 0.5);
            margin-bottom: 10px;
        }

        .header p {
            color: #a0a0a0;
            font-size: 1.1em;
        }

        .menu-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .menu-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .menu-btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .menu-btn.kesalahan {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
        }

        .menu-btn.fatal {
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            color: white;
        }

        .menu-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .menu-btn.active {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 71, 87, 0.4);
        }

        .filter-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-container label {
            font-size: 1.1em;
            color: #ffa502;
            font-weight: bold;
        }

        .filter-container select,
        .filter-container input {
            padding: 12px 20px;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1em;
            min-width: 200px;
        }

        .filter-container select option {
            background: #1a1a2e;
            color: #fff;
        }

        .filter-container button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #2ed573, #17c0eb);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-container button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(46, 213, 115, 0.4);
        }

        .content-section {
            display: none;
        }

        .content-section.active {
            display: block;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
            padding: 10px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 71, 87, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card-header h3 {
            color: #ff4757;
            font-size: 1.2em;
        }

        .card-header .badge {
            background: linear-gradient(135deg, #ff4757, #ff6b6b);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .card-body p {
            margin-bottom: 10px;
            line-height: 1.6;
        }

        .card-body .label {
            color: #ffa502;
            font-weight: bold;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-body .value {
            color: #e0e0e0;
            margin-top: 3px;
        }

        .photos-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .photo-link {
            display: inline-block;
            padding: 8px 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 8px;
            color: white;
            text-decoration: none;
            font-size: 0.85em;
            font-weight: bold;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .photo-link:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .photo-preview {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            margin-top: 10px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .staff-summary {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .staff-summary h2 {
            color: #2ed573;
            margin-bottom: 15px;
            text-align: center;
        }

        .staff-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }

        .staff-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .staff-item .name {
            color: #e0e0e0;
            font-weight: 500;
        }

        .staff-item .count {
            background: #ff4757;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.3em;
            color: #ffa502;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #ffa502;
            border-top-color: transparent;
            border-radius: 50%;
            margin-left: 10px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .no-data {
            text-align: center;
            padding: 50px;
            color: #a0a0a0;
            font-size: 1.2em;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            max-width: 90%;
            max-height: 90%;
            border-radius: 10px;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            color: white;
            cursor: pointer;
            z-index: 1001;
        }

        .total-badge {
            background: linear-gradient(135deg, #ff4757, #c0392b);
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: bold;
            display: inline-block;
            margin: 10px 0;
        }

        @media (max-width: 768px) {
            .cards-grid {
                grid-template-columns: 1fr;
            }

            .menu-buttons {
                flex-direction: column;
                align-items: center;
            }

            .header h1 {
                font-size: 1.8em;
            }
        }

        .date-badge {
            background: rgba(46, 213, 115, 0.2);
            color: #2ed573;
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 0.85em;
            font-weight: bold;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 5px;
            font-size: 0.85em;
            font-weight: bold;
        }

        .status-active {
            background: rgba(46, 213, 115, 0.2);
            color: #2ed573;
        }

        .status-inactive {
            background: rgba(255, 71, 87, 0.2);
            color: #ff4757;
        }

        .bonus-deduction {
            background: rgba(255, 165, 2, 0.2);
            color: #ffa502;
            padding: 4px 10px;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📖 BUKU DOSA ALL</h1>
        <p>Sistem Pencatatan Kesalahan & Fatal Error Staff</p>
    </div>

    <div class="menu-container">
        <div class="menu-buttons">
            <button class="menu-btn kesalahan active" onclick="showSection('kesalahan')">📋 KESALAHAN CHAT ALL</button>
            <button class="menu-btn fatal" onclick="showSection('fatal')">⚠️ FATAL ALL SITUS</button>
        </div>

        <!-- KESALAHAN CHAT ALL Section -->
        <div id="kesalahan-section" class="content-section active">
            <div class="filter-container">
                <label>🏢 Pilih Situs:</label>
                <select id="site-filter-kesalahan" onchange="filterKesalahan()">
                    <option value="">-- Semua Situs --</option>
                </select>
                <label>👤 Staff:</label>
                <select id="staff-filter-kesalahan" onchange="filterKesalahan()">
                    <option value="">-- Semua Staff --</option>
                </select>
                <button onclick="loadKesalahanData()">🔄 Refresh</button>
            </div>

            <div id="staff-summary" class="staff-summary">
                <h2>📊 Ringkasan Total Kesalahan Staff</h2>
                <div class="staff-grid" id="staff-grid"></div>
            </div>

            <div id="kesalahan-loading" class="loading">Memuat data kesalahan...</div>
            <div id="kesalahan-cards" class="cards-grid"></div>
        </div>

        <!-- FATAL ALL Section -->
        <div id="fatal-section" class="content-section">
            <div class="filter-container">
                <label>👤 Staff:</label>
                <select id="staff-filter-fatal" onchange="filterFatal()">
                    <option value="">-- Semua Staff --</option>
                </select>
                <label>🏢 Situs:</label>
                <select id="site-filter-fatal" onchange="filterFatal()">
                    <option value="">-- Semua Situs --</option>
                </select>
                <button onclick="loadFatalData()">🔄 Refresh</button>
            </div>

            <div id="fatal-loading" class="loading">Memuat data fatal...</div>
            <div id="fatal-cards" class="cards-grid"></div>
        </div>
    </div>

    <!-- Modal for photo preview -->
    <div id="photo-modal" class="modal" onclick="closeModal()">
        <span class="modal-close">&times;</span>
        <img id="modal-image" class="modal-content" src="" alt="Photo Preview">
    </div>

    <script>
        const SPREADSHEET_ID = '1camkXfvojs-YSBBPekYHTi4cwata4YCGTtmVIeOy1yc';
        const SHEET_KESALAHAN = 'Situs Lain';
        const SHEET_FATAL = 'Fatal All Situs';

        let kesalahanData = [];
        let fatalData = [];
        let staffSummary = [];
        let siteOptions = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadKesalahanData();
        });

        function showSection(section) {
            document.querySelectorAll('.content-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.menu-btn').forEach(el => el.classList.remove('active'));

            if (section === 'kesalahan') {
                document.getElementById('kesalahan-section').classList.add('active');
                document.querySelector('.menu-btn.kesalahan').classList.add('active');
                if (kesalahanData.length === 0) loadKesalahanData();
            } else {
                document.getElementById('fatal-section').classList.add('active');
                document.querySelector('.menu-btn.fatal').classList.add('active');
                if (fatalData.length === 0) loadFatalData();
            }
        }

        async function fetchSheetData(sheetName, query = '') {
            try {
                const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}${query ? '&tq=' + encodeURIComponent(query) : ''}`;
                const response = await fetch(url);
                const text = await response.text();
                
                // Parse the JSONP response
                const json = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));
                return json;
            } catch (error) {
                console.error('Error fetching data:', error);
                return null;
            }
        }

        function getCellValue(cell) {
            if (!cell) return '';
            if (cell.v !== undefined) return cell.v;
            if (cell.f !== undefined) return cell.f;
            return '';
        }

        async function loadKesalahanData() {
            document.getElementById('kesalahan-loading').style.display = 'block';
            document.getElementById('kesalahan-cards').innerHTML = '';

            try {
                // Fetch site dropdown (C2)
                const siteData = await fetchSheetData(SHEET_KESALAHAN, 'select C limit 1 offset 1');
                if (siteData && siteData.table && siteData.table.rows[0]) {
                    const siteCell = siteData.table.rows[0].c[0];
                    if (siteCell && siteCell.v) {
                        siteOptions = siteCell.v.toString().split(',').map(s => s.trim()).filter(s => s);
                        populateSiteFilter('site-filter-kesalahan', siteOptions);
                    }
                }

                // Fetch main data (B4:D2547)
                const mainData = await fetchSheetData(SHEET_KESALAHAN, 'select B, C, D offset 3');
                kesalahanData = [];

                if (mainData && mainData.table && mainData.table.rows) {
                    mainData.table.rows.forEach(row => {
                        const csName = getCellValue(row.c[0]);
                        const photoLink = getCellValue(row.c[1]);
                        const keterangan = getCellValue(row.c[2]);

                        if (csName && (photoLink || keterangan)) {
                            kesalahanData.push({
                                nama: csName,
                                linkFoto: photoLink,
                                keterangan: keterangan
                            });
                        }
                    });
                }

                // Fetch staff summary (I3:J40)
                const summaryData = await fetchSheetData(SHEET_KESALAHAN, 'select I, J offset 2 limit 38');
                staffSummary = [];

                if (summaryData && summaryData.table && summaryData.table.rows) {
                    summaryData.table.rows.forEach(row => {
                        const staffName = getCellValue(row.c[0]);
                        const totalKesalahan = getCellValue(row.c[1]);

                        if (staffName && staffName !== 'TOTAL KESALAHAN') {
                            staffSummary.push({
                                nama: staffName,
                                total: totalKesalahan
                            });
                        }
                    });
                }

                // Populate staff filter
                const staffNames = [...new Set(kesalahanData.map(d => d.nama))];
                populateStaffFilter('staff-filter-kesalahan', staffNames);

                // Render staff summary
                renderStaffSummary();

                // Render cards
                filterKesalahan();

            } catch (error) {
                console.error('Error loading kesalahan data:', error);
                document.getElementById('kesalahan-cards').innerHTML = '<div class="no-data">❌ Gagal memuat data. Pastikan sheet bersifat publik.</div>';
            }

            document.getElementById('kesalahan-loading').style.display = 'none';
        }

        async function loadFatalData() {
            document.getElementById('fatal-loading').style.display = 'block';
            document.getElementById('fatal-cards').innerHTML = '';

            try {
                // Fetch fatal data (B5:K1001)
                const fatalSheet = await fetchSheetData(SHEET_FATAL, 'select B, D, E, F, H, I, J, K offset 4');
                fatalData = [];

                if (fatalSheet && fatalSheet.table && fatalSheet.table.rows) {
                    fatalSheet.table.rows.forEach(row => {
                        const tanggal = getCellValue(row.c[0]);
                        const namaStaf = getCellValue(row.c[1]);
                        const status = getCellValue(row.c[2]);
                        const namaSitus = getCellValue(row.c[3]);
                        const potongBonus = getCellValue(row.c[4]);
                        const keterangan = getCellValue(row.c[5]);
                        const ssKesalahan = getCellValue(row.c[6]);
                        const ssKesalahanLC = getCellValue(row.c[7]);

                        if (namaStaf && (tanggal || keterangan || namaSitus)) {
                            fatalData.push({
                                tanggal: tanggal,
                                namaStaf: namaStaf,
                                status: status,
                                namaSitus: namaSitus,
                                potongBonus: potongBonus,
                                keterangan: keterangan,
                                ssKesalahan: ssKesalahan,
                                ssKesalahanLC: ssKesalahanLC
                            });
                        }
                    });
                }

                // Populate filters
                const staffNames = [...new Set(fatalData.map(d => d.namaStaf))];
                const siteNames = [...new Set(fatalData.map(d => d.namaSitus))];
                populateStaffFilter('staff-filter-fatal', staffNames);
                populateSiteFilter('site-filter-fatal', siteNames);

                // Render cards
                filterFatal();

            } catch (error) {
                console.error('Error loading fatal data:', error);
                document.getElementById('fatal-cards').innerHTML = '<div class="no-data">❌ Gagal memuat data. Pastikan sheet bersifat publik.</div>';
            }

            document.getElementById('fatal-loading').style.display = 'none';
        }

        function populateSiteFilter(elementId, sites) {
            const select = document.getElementById(elementId);
            select.innerHTML = '<option value="">-- Semua Situs --</option>';
            sites.forEach(site => {
                if (site) {
                    const option = document.createElement('option');
                    option.value = site;
                    option.textContent = site;
                    select.appendChild(option);
                }
            });
        }

        function populateStaffFilter(elementId, staffs) {
            const select = document.getElementById(elementId);
            select.innerHTML = '<option value="">-- Semua Staff --</option>';
            staffs.forEach(staff => {
                if (staff) {
                    const option = document.createElement('option');
                    option.value = staff;
                    option.textContent = staff;
                    select.appendChild(option);
                }
            });
        }

        function filterKesalahan() {
            const siteFilter = document.getElementById('site-filter-kesalahan').value;
            const staffFilter = document.getElementById('staff-filter-kesalahan').value;

            let filtered = kesalahanData;

            if (siteFilter) {
                filtered = filtered.filter(d => d.nama.includes(siteFilter) || !siteFilter);
            }

            if (staffFilter) {
                filtered = filtered.filter(d => d.nama === staffFilter);
            }

            renderKesalahanCards(filtered);
        }

        function filterFatal() {
            const staffFilter = document.getElementById('staff-filter-fatal').value;
            const siteFilter = document.getElementById('site-filter-fatal').value;

            let filtered = fatalData;

            if (staffFilter) {
                filtered = filtered.filter(d => d.namaStaf === staffFilter);
            }

            if (siteFilter) {
                filtered = filtered.filter(d => d.namaSitus === siteFilter);
            }

            renderFatalCards(filtered);
        }

        function renderKesalahanCards(data) {
            const container = document.getElementById('kesalahan-cards');
            container.innerHTML = '';

            if (data.length === 0) {
                container.innerHTML = '<div class="no-data">📭 Tidak ada data kesalahan ditemukan.</div>';
                return;
            }

            data.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';

                const photoLinks = extractLinks(item.linkFoto);
                const dateInfo = extractDate(item.linkFoto);

                card.innerHTML = `
                    <div class="card-header">
                        <h3>👤 ${item.nama || 'Unknown'}</h3>
                        <span class="badge">#${index + 1}</span>
                    </div>
                    <div class="card-body">
                        ${dateInfo ? `<p><span class="label">📅 Tanggal:</span><br><span class="date-badge">${dateInfo}</span></p>` : ''}
                        ${item.keterangan ? `<p><span class="label">📝 Keterangan:</span><br><span class="value">${item.keterangan}</span></p>` : ''}
                        ${photoLinks.length > 0 ? `
                            <p><span class="label">📷 Foto Kesalahan (${photoLinks.length}):</span></p>
                            <div class="photos-container">
                                ${photoLinks.map((link, i) => `
                                    <a href="${link}" target="_blank" class="photo-link" onclick="openPhoto('${link}', event)">📸 Foto ${i + 1}</a>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function renderFatalCards(data) {
            const container = document.getElementById('fatal-cards');
            container.innerHTML = '';

            if (data.length === 0) {
                container.innerHTML = '<div class="no-data">📭 Tidak ada data fatal ditemukan.</div>';
                return;
            }

            data.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';

                const ssLinks = extractLinks(item.ssKesalahan);
                const ssLCLinks = extractLinks(item.ssKesalahanLC);
                const statusClass = item.status && item.status.toLowerCase().includes('active') ? 'status-active' : 'status-inactive';

                card.innerHTML = `
                    <div class="card-header">
                        <h3>⚠️ ${item.namaStaf || 'Unknown'}</h3>
                        <span class="badge">${item.namaSitus || 'N/A'}</span>
                    </div>
                    <div class="card-body">
                        ${item.tanggal ? `<p><span class="label">📅 Tanggal:</span><br><span class="date-badge">${item.tanggal}</span></p>` : ''}
                        ${item.status ? `<p><span class="label">📌 Status:</span><br><span class="status-badge ${statusClass}">${item.status}</span></p>` : ''}
                        ${item.potongBonus ? `<p><span class="label">💰 Potong Bonus:</span><br><span class="bonus-deduction">${item.potongBonus}</span></p>` : ''}
                        ${item.keterangan ? `<p><span class="label">📝 Keterangan Fatal:</span><br><span class="value">${item.keterangan}</span></p>` : ''}
                        ${ssLinks.length > 0 ? `
                            <p><span class="label">📷 SS Kesalahan (${ssLinks.length}):</span></p>
                            <div class="photos-container">
                                ${ssLinks.map((link, i) => `
                                    <a href="${link}" target="_blank" class="photo-link" onclick="openPhoto('${link}', event)">📸 SS ${i + 1}</a>
                                `).join('')}
                            </div>
                        ` : ''}
                        ${ssLCLinks.length > 0 ? `
                            <p style="margin-top:10px"><span class="label">📷 SS Kesalahan LC (${ssLCLinks.length}):</span></p>
                            <div class="photos-container">
                                ${ssLCLinks.map((link, i) => `
                                    <a href="${link}" target="_blank" class="photo-link" onclick="openPhoto('${link}', event)">📸 LC ${i + 1}</a>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function renderStaffSummary() {
            const grid = document.getElementById('staff-grid');
            grid.innerHTML = '';

            if (staffSummary.length === 0) {
                grid.innerHTML = '<div class="no-data">Tidak ada data ringkasan staff.</div>';
                return;
            }

            let totalAll = 0;
            staffSummary.forEach(staff => {
                const count = parseInt(staff.total) || 0;
                totalAll += count;

                const item = document.createElement('div');
                item.className = 'staff-item';
                item.innerHTML = `
                    <span class="name">${staff.nama}</span>
                    <span class="count">${staff.total || 0}</span>
                `;
                grid.appendChild(item);
            });

            // Add total
            const totalItem = document.createElement('div');
            totalItem.className = 'staff-item';
            totalItem.style.background = 'rgba(255, 71, 87, 0.2)';
            totalItem.style.border = '2px solid #ff4757';
            totalItem.innerHTML = `
                <span class="name" style="color:#ff4757; font-weight:bold;">TOTAL</span>
                <span class="count" style="background:#fff; color:#ff4757;">${totalAll}</span>
            `;
            grid.appendChild(totalItem);
        }

        function extractLinks(text) {
            if (!text) return [];
            
            const urlRegex = /(https?:\/\/[^\s<>"']+)/gi;
            const links = text.match(urlRegex) || [];
            
            return links.filter(link => link && link.length > 10);
        }

        function extractDate(text) {
            if (!text) return '';
            
            // Try to find date patterns
            const datePatterns = [
                /(\d{1,2}[\/\-\.]\d{1,2}[\/\-\.]\d{2,4})/g,
                /(\d{1,2}\s+(Jan|Feb|Mar|Apr|Mei|Jun|Jul|Agu|Sep|Okt|Nov|Des)[a-z]*\s+\d{2,4})/gi
            ];

            for (let pattern of datePatterns) {
                const match = text.match(pattern);
                if (match && match.length > 0) {
                    return match[0];
                }
            }
            return '';
        }

        function openPhoto(url, event) {
            if (event) event.preventDefault();
            
            const modal = document.getElementById('photo-modal');
            const modalImg = document.getElementById('modal-image');
            
            // Convert Google Drive links to direct image links
            let imageUrl = url;
            if (url.includes('drive.google.com')) {
                const fileId = url.match(/\/d\/([^\/]+)/);
                if (fileId) {
                    imageUrl = `https://drive.google.com/uc?export=view&id=${fileId[1]}`;
                }
            }
            
            modalImg.src = imageUrl;
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('photo-modal').classList.remove('active');
        }

        // Close modal with Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
