<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0"/>
<title>BUKU DOSA ALL — Dove Blue v4</title>
<style>
:root{
  --dv50:#f2f7fc;--dv100:#e3eef8;--dv200:#c9ddef;--dv300:#a3c4e2;--dv400:#74a3cf;
  --dv500:#4682b4;--dv600:#38688f;--dv700:#2e5474;--dv800:#203a51;--dv900:#16293a;
  --ink:#12222f;--soft:#54657a;--line:#dbe7f2;
  --red:#c62828;--redbg:#fdecea;--amber:#b45309;--amberbg:#fff7e0;--ok:#15803d;--okbg:#dcfce7;
  --shadow:0 8px 22px rgba(32,58,81,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,var(--dv50),#eaf2fa 55%,#e3edf7);min-height:100vh;padding-bottom:30px}

/* ===== HEADER ===== */
header{position:sticky;top:0;z-index:60;background:linear-gradient(90deg,var(--dv600),var(--dv500) 55%,var(--dv400));
  color:#fff;box-shadow:0 4px 16px rgba(32,58,81,.25)}
.hwrap{max-width:1700px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#fff,#cfe0f0);
  display:grid;place-items:center;font-size:20px;flex:0 0 auto;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
h1{font-size:17px;margin:0;letter-spacing:.5px;line-height:1.15}
h1 small{display:block;font-size:10px;font-weight:400;opacity:.85;letter-spacing:.3px}
#status{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:11px;flex:0 0 auto;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:5px 10px;border-radius:999px}
.dot{width:7px;height:7px;border-radius:50%;background:#9be1ff;box-shadow:0 0 8px #9be1ff}
.dot.ok{background:#7ef0c0;box-shadow:0 0 8px #7ef0c0}.dot.err{background:#ff9d9d;box-shadow:0 0 8px #ff9d9d}

/* ===== TABS ===== */
.tabs{position:sticky;top:58px;z-index:55;background:rgba(242,247,252,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:8px 16px;display:flex;gap:8px;overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{cursor:pointer;flex:0 0 auto;padding:9px 16px;border-radius:11px;font-weight:700;font-size:13px;letter-spacing:.3px;
  background:#fff;color:var(--dv700);border:1px solid var(--dv200);box-shadow:0 2px 5px rgba(32,58,81,.07);
  display:flex;gap:8px;align-items:center;transition:.16s;white-space:nowrap}
.tab.on{background:linear-gradient(180deg,var(--dv500),var(--dv600));color:#fff;border-color:var(--dv700)}
.pill{font-size:10px;padding:1px 8px;border-radius:999px;background:rgba(70,130,180,.13)}
.tab.on .pill{background:rgba(255,255,255,.25)}

/* ===== CONTROLS ===== */
.ctrls{max-width:1700px;margin:12px auto;padding:0 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ctrl{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--dv200);
  border-radius:11px;padding:7px 11px;box-shadow:0 2px 5px rgba(32,58,81,.06);flex:1 1 180px;min-width:0}
.ctrl label{font-size:10px;font-weight:800;color:var(--dv700);letter-spacing:.5px;white-space:nowrap}
.ctrl select,.ctrl input{border:0;outline:0;background:transparent;font-size:13px;color:var(--ink);width:100%;min-width:0}
.btn{cursor:pointer;border:1px solid var(--dv200);background:linear-gradient(180deg,#fff,#e8f1fa);
  color:var(--dv700);font-weight:700;padding:8px 13px;border-radius:10px;transition:.15s;font-size:13px;white-space:nowrap}
.btn:active{transform:scale(.97)}

/* ===== STATS ===== */
.stats{max-width:1700px;margin:0 auto 10px;padding:0 16px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:#fff;border:1px solid var(--dv200);border-radius:11px;padding:8px 10px;box-shadow:0 2px 7px rgba(32,58,81,.06);text-align:center}
.stat .t{font-size:9px;letter-spacing:.6px;color:var(--soft);font-weight:800}
.stat .v{font-size:18px;font-weight:900;color:var(--dv600);line-height:1.1}

/* ===== STAFF CHIPS ===== */
.staffbox{max-width:1700px;margin:0 auto 10px;padding:0 16px}
.staffscroll{background:#fff;border:1px solid var(--dv200);border-radius:13px;box-shadow:var(--shadow);padding:9px 11px}
.staffscroll h3{margin:1px 3px 7px;font-size:12px;color:var(--dv700);letter-spacing:.3px}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:5px;cursor:grab;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{height:6px}.chips::-webkit-scrollbar-thumb{background:var(--dv300);border-radius:6px}
.chip-s{flex:0 0 auto;display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:var(--dv800);
  background:linear-gradient(180deg,#f6faff,#e7f0f9);border:1px solid var(--dv200);border-radius:999px;padding:6px 11px;cursor:pointer;transition:.15s}
.chip-s.on{background:linear-gradient(180deg,var(--dv500),var(--dv600));color:#fff;border-color:var(--dv700)}
.chip-s b{background:rgba(70,130,180,.14);border-radius:999px;padding:1px 7px;font-size:10px}
.chip-s.on b{background:rgba(255,255,255,.25)}

/* ===== PANEL ===== */
main{max-width:1700px;margin:0 auto;padding:0 16px}
.panel{display:none}.panel.on{display:block;animation:fd .22s}
@keyframes fd{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.twrap{background:#fff;border:1px solid var(--dv200);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}

/* ===== DESKTOP TABLE (1 BARIS LURUS) ===== */
.scrollx{overflow:auto;max-height:72vh;cursor:grab}
.scrollx:active{cursor:grabbing}
.scrollx::-webkit-scrollbar{height:9px;width:9px}.scrollx::-webkit-scrollbar-thumb{background:var(--dv300);border-radius:9px}
.grid{min-width:1180px}
.grid.fatal{min-width:1500px}
.hrow,.row{display:grid;grid-template-columns:46px 105px 250px minmax(380px,1.5fr) minmax(280px,1.25fr);
  align-items:stretch;gap:0;border-bottom:1px solid var(--line)}
.grid.fatal .hrow,.grid.fatal .row{grid-template-columns:44px 100px 200px 78px 105px 88px minmax(250px,1.3fr) minmax(300px,1.4fr) minmax(300px,1.4fr)}
.hrow{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--dv500),var(--dv600));
  color:#fff;font-size:11px;font-weight:800;letter-spacing:.7px}
.hrow div{padding:11px 10px;display:flex;align-items:center}
.row{font-size:12.5px;background:#fff;transition:background .12s}
.row:nth-child(even){background:#f7fafd}
.row:hover{background:var(--dv100)}
.row>div{padding:8px 10px;display:flex;align-items:center;min-width:0}
.row .no{color:var(--soft);font-weight:700;justify-content:center}
.row .tgl{font-weight:700;color:var(--dv600);white-space:nowrap}
.row .nm{font-weight:700;color:var(--dv800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.fatalrow{background:var(--redbg)}.row.fatalrow:hover{background:#fbd9d4}
.row.fatalrow .ket{color:var(--red);font-weight:800}
.ket{white-space:normal!important;line-height:1.35;max-height:46px;overflow:hidden;align-items:flex-start!important}
.links{display:flex;flex-direction:column;gap:5px;padding:6px 10px!important;max-height:130px;overflow-y:auto;align-items:flex-start!important}
.links::-webkit-scrollbar{width:5px}.links::-webkit-scrollbar-thumb{background:var(--dv300);border-radius:5px}
.lk{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;text-decoration:none;font-size:11px;font-weight:700;
  color:var(--dv700);background:linear-gradient(180deg,#eef6fd,#dfeaf6);border:1px solid var(--dv200);
  border-radius:8px;padding:5px 9px;cursor:pointer;transition:.13s;max-width:100%}
.lk:hover{background:linear-gradient(180deg,var(--dv400),var(--dv500));color:#fff}
.lk .lab{white-space:nowrap}
.lk .url{color:var(--dv600);font-family:ui-monospace,Consolas,monospace;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:230px}
.lk:hover .url{color:#eaf3fb}
.lk .copy{opacity:.55;font-size:10px;border-left:1px solid currentColor;padding-left:6px;white-space:nowrap}
.tagf{display:inline-block;font-size:10px;font-weight:900;border-radius:6px;padding:2px 8px;white-space:nowrap}
.tagf.red{background:var(--red);color:#fff}.tagf.amb{background:var(--amberbg);color:var(--amber);border:1px solid #f1dca0}
.dsep{grid-column:1/-1;background:linear-gradient(90deg,var(--dv100),#fff);color:var(--dv700);
  font-weight:900;font-size:11px;letter-spacing:1px;padding:6px 12px;border-bottom:1px solid var(--line)}
.empty{padding:40px 20px;text-align:center;color:var(--soft);font-weight:600}
.loader{display:flex;gap:10px;align-items:center;justify-content:center;padding:26px;color:var(--dv600);font-weight:700}
.spin{width:24px;height:24px;border-radius:50%;border:3px solid var(--dv200);border-top-color:var(--dv500);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ===== MOBILE CARDS (muat 1 layar) ===== */
.cards{display:none;flex-direction:column;gap:9px;max-height:74vh;overflow-y:auto;padding:10px;-webkit-overflow-scrolling:touch}
.cards::-webkit-scrollbar{width:6px}.cards::-webkit-scrollbar-thumb{background:var(--dv300);border-radius:6px}
.card{background:#fff;border:1px solid var(--dv200);border-radius:12px;padding:10px 12px;box-shadow:0 3px 9px rgba(32,58,81,.07)}
.card.fatalcard{border-left:4px solid var(--red);background:linear-gradient(90deg,var(--redbg),#fff 40%)}
.card .chead{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.card .av{width:34px;height:34px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;
  background:linear-gradient(135deg,var(--dv300),var(--dv500));box-shadow:inset 0 0 0 2px #fff}
.card.fatalcard .av{background:linear-gradient(135deg,#f3a3a3,var(--red))}
.card .who{min-width:0;flex:1}
.card .who .nm{font-weight:800;font-size:13.5px;color:var(--dv800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .who .sub{font-size:11px;color:var(--soft);display:flex;gap:8px;flex-wrap:wrap;margin-top:1px}
.card .who .sub b{color:var(--dv600)}
.card .no{font-size:11px;font-weight:800;color:var(--soft);background:var(--dv100);border-radius:8px;padding:2px 8px;flex:0 0 auto}
.card .ck{font-size:12.5px;line-height:1.4;color:var(--ink);background:var(--dv50);border-left:3px solid var(--dv400);
  border-radius:6px;padding:7px 9px;margin-bottom:7px}
.card.fatalcard .ck{border-left-color:var(--red);color:var(--red);font-weight:700}
.card .clinks{display:flex;flex-direction:column;gap:5px}
.card .clabel{font-size:10px;font-weight:800;color:var(--soft);letter-spacing:.5px;margin:2px 0 3px}
.card .lk{width:100%;justify-content:flex-start}
.card .lk .url{max-width:none;flex:1}
.dsep-m{font-weight:900;font-size:11px;letter-spacing:.8px;color:var(--dv700);background:linear-gradient(90deg,var(--dv100),#fff);
  border:1px solid var(--dv200);border-radius:9px;padding:6px 11px;text-align:center}

/* ===== MODAL ===== */
.mbg{position:fixed;inset:0;background:rgba(16,29,42,.78);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:100;padding:14px}
.mbg.show{display:flex}
.modal{background:#fff;border-radius:15px;border:1px solid var(--dv200);width:100%;max-width:960px;max-height:92vh;overflow:auto;padding:14px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.modal .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.modal .top .actions{display:flex;gap:7px;flex-wrap:wrap}
.modal img{display:block;margin:11px auto 0;max-width:100%;max-height:62vh;border-radius:10px;border:1px solid var(--dv200)}
.mcap{text-align:left;margin-top:10px;font-size:12.5px;color:var(--soft);background:var(--dv50);padding:9px 11px;border-radius:8px;border:1px solid var(--dv200);word-break:break-all}
.mcap code{background:#fff;padding:2px 6px;border-radius:4px;font-size:11px;border:1px solid var(--dv200)}
.mcap a{color:var(--dv600);font-weight:800}
.copied{background:var(--okbg)!important;color:var(--ok)!important}

/* ===== RESPONSIVE : MOBILE ===== */
@media(max-width:820px){
  .scrollx{display:none}            /* sembunyikan tabel desktop */
  .cards{display:flex}              /* tampilkan kartu mobile */
  .twrap{overflow:visible;box-shadow:none;border:0;background:transparent}
  .stats{grid-template-columns:repeat(4,1fr);gap:6px}
  .stat{padding:7px 4px}.stat .v{font-size:16px}.stat .t{font-size:8px}
  .ctrls{gap:7px}.ctrl{flex:1 1 100%;padding:8px 11px}
  h1{font-size:15px}
  .tab{padding:8px 13px;font-size:12px}
}
@media(max-width:380px){
  .stat .v{font-size:14px}
  .card .who .nm{font-size:12.5px}
}
</style>
</head>
<body>

<header><div class="hwrap">
  <div class="logo">🕊️</div>
  <h1>BUKU DOSA ALL <small>Drag‑Free · Dove Blue v4</small></h1>
  <div id="status"><span class="dot" id="sDot"></span><span id="sTxt">Memuat…</span></div>
</div></header>

<div class="tabs">
  <div class="tab on" data-p="chat">🗨️ KESALAHAN CHAT ALL <span class="pill" id="cChat">0</span></div>
  <div class="tab" data-p="fatal">⚠️ FATAL ALL SITUS <span class="pill" id="cFatal">0</span></div>
</div>

<!-- ================= PANEL CHAT ================= -->
<main>
<section class="panel on" id="p-chat">
  <div class="ctrls">
    <div class="ctrl"><label>🔍 CARI</label><input id="qChat" placeholder="nama CS / keterangan…"></div>
    <button class="btn" id="btnResetChat">↺ Reset</button>
    <button class="btn" id="btnReload">⟳ Reload</button>
  </div>
  <div class="stats">
    <div class="stat"><div class="t">BARIS</div><div class="v" id="stRow">0</div></div>
    <div class="stat"><div class="t">CS</div><div class="v" id="stCs">0</div></div>
    <div class="stat"><div class="t">FATAL</div><div class="v" id="stFatal">0</div></div>
    <div class="stat"><div class="t">TAMPIL</div><div class="v" id="stShow">0</div></div>
  </div>
  <div class="staffbox"><div class="staffscroll">
    <h3>👥 STAFF & TOTAL KESALAHAN — klik untuk filter</h3>
    <div class="chips" id="staffChips"></div>
  </div></div>
  <div class="twrap">
    <!-- DESKTOP -->
    <div class="scrollx" id="wrapChat"><div class="grid" id="gridChat">
      <div class="loader"><div class="spin"></div> Memuat KESALAHAN CHAT ALL…</div>
    </div></div>
    <!-- MOBILE -->
    <div class="cards" id="cardsChat"></div>
  </div>
</section>

<!-- ================= PANEL FATAL ================= -->
<section class="panel" id="p-fatal">
  <div class="ctrls">
    <div class="ctrl"><label>🌐 SITUS</label><select id="fSitus"></select></div>
    <div class="ctrl"><label>👤 STAFF</label><select id="fStaff"></select></div>
    <div class="ctrl"><label>📅 TGL</label><input type="date" id="fDate"></div>
    <div class="ctrl"><label>🔍 CARI</label><input id="qFatal" placeholder="keterangan / nama…"></div>
    <button class="btn" id="btnResetFatal">↺ Reset</button>
  </div>
  <div class="stats">
    <div class="stat"><div class="t">TOTAL</div><div class="v" id="ftRow">0</div></div>
    <div class="stat"><div class="t">STAFF</div><div class="v" id="ftStaff">0</div></div>
    <div class="stat"><div class="t">SITUS</div><div class="v" id="ftSitus">0</div></div>
    <div class="stat"><div class="t">TAMPIL</div><div class="v" id="ftShow">0</div></div>
  </div>
  <div class="twrap">
    <div class="scrollx" id="wrapFatal"><div class="grid fatal" id="gridFatal">
      <div class="loader"><div class="spin"></div> Memuat FATAL ALL SITUS…</div>
    </div></div>
    <div class="cards" id="cardsFatal"></div>
  </div>
</section>
</main>

<!-- MODAL -->
<div class="mbg" id="mbg"><div class="modal">
  <div class="top">
    <b id="mTitle">Preview</b>
    <div class="actions">
      <button class="btn" id="mCopy">📋 Copy</button>
      <a class="btn" id="mOpen" target="_blank" rel="noopener">🔗 Buka</a>
      <button class="btn" onclick="mClose()">✕</button>
    </div>
  </div>
  <img id="mImg" alt="preview">
  <div class="mcap" id="mCap"></div>
</div></div>

<script>
/* =============== KONFIG =============== */
const SID='1camkXfvojs-YSBBPekYHTi4cwata4YCGTtmVIeOy1yc';
const CHAT_GID='0';                 // ← sheet KESALAHAN CHAT ALL (gid=0)
const FATAL_SHEET='Fatal All Situs';
const csvByGid=g=>`https://docs.google.com/spreadsheets/d/${SID}/gviz/tq?tqx=out:csv&gid=${g}`;
const csvByName=n=>`https://docs.google.com/spreadsheets/d/${SID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(n)}`;

/* =============== STATE =============== */
let CHAT_RECS=[],CHAT_STAFF=[],FATAL=[];
let fStaff='',fSitus='',fDate='',fQ='',cQ='',cStaff='';

/* =============== UTIL =============== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cl=v=>(v==null||String(v).trim()==='')?'':String(v).trim();
const isDate=s=>/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(cl(s));
const linksOf=s=>cl(s)?[...new Set((String(s).match(/https?:\/\/[^\s,"'<>]+/gi)||[]))]:[];
function shortURL(u){try{const o=new URL(u);return o.hostname.replace(/^www\./,'')+(o.pathname.length>1?o.pathname.slice(0,18)+(o.pathname.length>18?'…':''):'')}catch(e){return u}}
function initials(n){return (n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()}
function parseCSV(t){const R=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];
 if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
 else{if(c==='"')q=true;else if(c===','){r.push(f);f=''}else if(c==='\n'){r.push(f);R.push(r);r=[];f=''}else if(c!=='\r')f+=c}}
 if(f||r.length){r.push(f);R.push(r)}return R}
async function fetchCSV(u){const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);
 const t=await r.text();if(t.trim().startsWith('<'))throw new Error('Bukan CSV (cek akses share sheet)');return parseCSV(t)}
function setStatus(k,t){$('sDot').className='dot '+(k==='ok'?'ok':k==='err'?'err':'');$('sTxt').textContent=t}
function copyText(text,el){navigator.clipboard.writeText(text).then(()=>{if(el){const o=el.textContent;el.textContent='✓';el.classList.add('copied');setTimeout(()=>{el.textContent=o;el.classList.remove('copied')},1100)}}).catch(()=>{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(ta)})}

/* =============== PARSE =============== */
function parseChat(rows){
  const recs=[],staff=[];let curDate='';
  for(let i=1;i<Math.min(rows.length,2600);i++){
    const r=rows[i]||[],B=cl(r[1]),C=cl(r[2]),D=cl(r[3]);
    if(isDate(C)){curDate=C;continue}
    if(i>=2&&i<40){const I=cl(r[8]),J=cl(r[9]);
      if(I&&!/#VALUE!/i.test(I)&&!/total/i.test(I))staff.push({name:I,total:J||'0'})}
    const L=linksOf(C);
    if(!B&&!L.length)continue;          // abaikan baris kosong
    recs.push({tgl:curDate,nama:B,links:L,ket:D});
  }
  return {recs,staff};
}
function parseFatal(rows){
  const out=[];for(let i=4;i<Math.min(rows.length,1001);i++){const r=rows[i]||[];
    const o={tgl:cl(r[1]),staf:cl(r[3]),stat:cl(r[4]),situs:cl(r[5]),potong:cl(r[7]),ket:cl(r[8]),ss1:linksOf(r[9]),ss2:linksOf(r[10])};
    if(!o.tgl&&!o.staf&&!o.ket&&!o.ss1.length&&!o.ss2.length)continue;
    out.push(o)}return out;
}

/* =============== LINK HTML (desktop + mobile pakai class sama) =============== */
function linkHTML(u,j,ctxName,lab){
  return `<a class="lk" data-u="${esc(u)}" data-t="${esc(ctxName)} — ${lab} ${j+1}" title="${esc(u)}">
    <span class="lab">📷 ${lab} ${j+1}</span>
    <span class="url">${esc(shortURL(u))}</span>
    <span class="copy">⧉</span></a>`;
}
function bindLinks(root){
  root.querySelectorAll('.lk').forEach(a=>{
    a.addEventListener('click',e=>{e.stopPropagation();
      if(e.shiftKey||e.metaKey||e.ctrlKey){window.open(a.dataset.u,'_blank');return}
      if(e.target.classList.contains('copy')){copyText(a.dataset.u,e.target);return}
      mOpen(a.dataset.u,a.dataset.t)});
    a.addEventListener('contextmenu',e=>{e.preventDefault();window.open(a.dataset.u,'_blank')});
  });
}

/* =============== RENDER CHAT =============== */
function renderChat(){
  let recs=[...CHAT_RECS];
  if(cStaff)recs=recs.filter(r=>r.nama.toUpperCase().includes(cStaff.toUpperCase()));
  if(cQ)recs=recs.filter(r=>(r.nama+' '+r.ket).toLowerCase().includes(cQ.toLowerCase()));
  $('stRow').textContent=CHAT_RECS.length;
  $('stCs').textContent=new Set(CHAT_RECS.map(r=>r.nama).filter(Boolean)).size;
  $('stFatal').textContent=CHAT_RECS.filter(r=>/fatal/i.test(r.ket)).length;
  $('stShow').textContent=recs.length;$('cChat').textContent=recs.length;

  // ---- DESKTOP TABLE ----
  let last='',dh='<div class="hrow"><div>NO</div><div>TANGGAL</div><div>NAMA CS</div><div>🔗 LINK FOTO (SS)</div><div>KETERANGAN</div></div>';
  if(!recs.length)dh+='<div class="empty">Tidak ada data yang cocok. Baris kosong diabaikan otomatis.</div>';
  recs.forEach((r,i)=>{
    if(r.tgl&&r.tgl!==last){last=r.tgl;dh+=`<div class="dsep">📅 ${esc(r.tgl)}</div>`}
    const fatal=/fatal/i.test(r.ket);
    const lks=r.links.length?r.links.map((u,j)=>linkHTML(u,j,r.nama,'Foto')).join(''):'<span style="color:#9aa7b2">— tidak ada link —</span>';
    dh+=`<div class="row${fatal?' fatalrow':''}">
      <div class="no">${i+1}</div><div class="tgl">${esc(r.tgl||'—')}</div>
      <div class="nm" title="${esc(r.nama)}">${esc(r.nama||'—')}</div>
      <div class="links">${lks}</div>
      <div class="ket" title="${esc(r.ket)}">${fatal?'<span class="tagf red">FATAL</span> ':''}${esc(r.ket||'—')}</div></div>`;
  });
  $('gridChat').innerHTML=dh;bindLinks($('gridChat'));

  // ---- MOBILE CARDS ----
  last='';let mh='';
  if(!recs.length)mh='<div class="empty">Tidak ada data yang cocok.</div>';
  recs.forEach((r,i)=>{
    if(r.tgl&&r.tgl!==last){last=r.tgl;mh+=`<div class="dsep-m">📅 ${esc(r.tgl)}</div>`}
    const fatal=/fatal/i.test(r.ket);
    const lks=r.links.length?r.links.map((u,j)=>linkHTML(u,j,r.nama,'Foto')).join(''):'<span style="color:#9aa7b2;font-size:12px">— tidak ada link —</span>';
    mh+=`<div class="card${fatal?' fatalcard':''}">
      <div class="chead">
        <div class="av">${esc(initials(r.nama))}</div>
        <div class="who"><div class="nm">${esc(r.nama||'—')}</div>
          <div class="sub"><span>📅 <b>${esc(r.tgl||'—')}</b></span><span>📷 <b>${r.links.length}</b> foto</span>${fatal?'<span class="tagf red">FATAL</span>':''}</div></div>
        <div class="no">#${i+1}</div>
      </div>
      ${r.ket?`<div class="ck">${esc(r.ket)}</div>`:''}
      <div class="clabel">🔗 LINK FOTO</div>
      <div class="clinks">${lks}</div>
    </div>`;
  });
  $('cardsChat').innerHTML=mh;bindLinks($('cardsChat'));
}
function renderStaff(){
  $('staffChips').innerHTML=CHAT_STAFF.length?CHAT_STAFF.map(s=>`<div class="chip-s${cStaff===s.name?' on':''}" data-n="${esc(s.name)}">👤 ${esc(s.name)} <b>${esc(s.total)}</b></div>`).join(''):'<div class="empty" style="padding:8px">Staff belum tersedia</div>';
  $('staffChips').querySelectorAll('.chip-s').forEach(c=>c.onclick=()=>{cStaff=(cStaff===c.dataset.n)?'':c.dataset.n;renderStaff();renderChat()});
}

/* =============== RENDER FATAL =============== */
function renderFatal(){
  let r=[...FATAL];
  if(fSitus)r=r.filter(x=>x.situs===fSitus);
  if(fStaff)r=r.filter(x=>x.staf===fStaff);
  if(fDate)r=r.filter(x=>normD(x.tgl)===fDate);
  if(fQ)r=r.filter(x=>(x.staf+' '+x.ket+' '+x.situs).toLowerCase().includes(fQ.toLowerCase()));
  $('ftRow').textContent=FATAL.length;
  $('ftStaff').textContent=new Set(FATAL.map(x=>x.staf).filter(Boolean)).size;
  $('ftSitus').textContent=new Set(FATAL.map(x=>x.situs).filter(Boolean)).size;
  $('ftShow').textContent=r.length;$('cFatal').textContent=r.length;

  let dh='<div class="hrow"><div>NO</div><div>TANGGAL</div><div>NAMA STAF</div><div>STATUS</div><div>SITUS</div><div>POTONG</div><div>KETERANGAN FATAL</div><div>🔗 SS KESALAHAN</div><div>🔗 SS LC</div></div>';
  if(!r.length)dh+='<div class="empty">Tidak ada data fatal yang cocok.</div>';
  r.forEach((x,i)=>{
    const mk=(a,l)=>a.length?a.map((u,j)=>linkHTML(u,j,x.staf,l)).join(''):'<span style="color:#9aa7b2">—</span>';
    dh+=`<div class="row">
      <div class="no">${i+1}</div><div class="tgl">${esc(x.tgl||'—')}</div>
      <div class="nm" title="${esc(x.staf)}">${esc(x.staf||'—')}</div>
      <div>${x.stat?`<span class="tagf amb">${esc(x.stat)}</span>`:'—'}</div>
      <div><b>${esc(x.situs||'—')}</b></div>
      <div>${x.potong?`<span class="tagf red">−${esc(x.potong)}%</span>`:'—'}</div>
      <div class="ket" title="${esc(x.ket)}">${esc(x.ket||'—')}</div>
      <div class="links">${mk(x.ss1,'SS')}</div>
      <div class="links">${mk(x.ss2,'LC')}</div></div>`;
  });
  $('gridFatal').innerHTML=dh;bindLinks($('gridFatal'));

  let mh='';
  if(!r.length)mh='<div class="empty">Tidak ada data fatal yang cocok.</div>';
  r.forEach((x,i)=>{
    const mk=(a,l)=>a.length?a.map((u,j)=>linkHTML(u,j,x.staf,l)).join(''):'<span style="color:#9aa7b2;font-size:12px">— tidak ada —</span>';
    mh+=`<div class="card fatalcard">
      <div class="chead">
        <div class="av">${esc(initials(x.staf))}</div>
        <div class="who"><div class="nm">${esc(x.staf||'—')}</div>
          <div class="sub"><span>📅 <b>${esc(x.tgl||'—')}</b></span><span>🌐 <b>${esc(x.situs||'—')}</b></span>${x.stat?`<span class="tagf amb">${esc(x.stat)}</span>`:''}${x.potong?`<span class="tagf red">−${esc(x.potong)}%</span>`:''}</div></div>
        <div class="no">#${i+1}</div>
      </div>
      ${x.ket?`<div class="ck">${esc(x.ket)}</div>`:''}
      <div class="clabel">🔗 SS KESALAHAN</div><div class="clinks">${mk(x.ss1,'SS')}</div>
      <div class="clabel" style="margin-top:6px">🔗 SS KESALAHAN LC</div><div class="clinks">${mk(x.ss2,'LC')}</div>
    </div>`;
  });
  $('cardsFatal').innerHTML=mh;bindLinks($('cardsFatal'));
}
const normD=s=>{const m=cl(s).match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);if(!m)return cl(s);let y=m[3];if(y.length===2)y='20'+y;return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`};

/* =============== LOAD =============== */
async function boot(){
  setStatus('','Memuat data…');
  try{
    const [a,b]=await Promise.allSettled([fetchCSV(csvByGid(CHAT_GID)),fetchCSV(csvByName(FATAL_SHEET))]);
    if(a.status==='fulfilled'){const p=parseChat(a.value);CHAT_RECS=p.recs;CHAT_STAFF=p.staff}
    else throw a.reason;
    if(b.status==='fulfilled')FATAL=parseFatal(b.value);
    renderStaff();renderChat();renderFatal();fillFatalFilters();setStatus('ok','Data termuat ✓');
  }catch(e){console.error(e);setStatus('err','Gagal: '+e.message);
    $('gridChat').innerHTML='<div class="empty">❌ Gagal memuat. Pastikan Google Sheet di-share: <b>Anyone with the link → Viewer</b>.<br><small>'+esc(e.message)+'</small></div>';
    $('cardsChat').innerHTML='';}
}
function fillFatalFilters(){
  const s=[...new Set(FATAL.map(x=>x.situs).filter(Boolean))].sort();
  const p=[...new Set(FATAL.map(x=>x.staf).filter(Boolean))].sort();
  $('fSitus').innerHTML='<option value="">— Semua Situs —</option>'+s.map(x=>`<option>${esc(x)}</option>`).join('');
  $('fStaff').innerHTML='<option value="">— Semua Staff —</option>'+p.map(x=>`<option>${esc(x)}</option>`).join('');
}

/* =============== EVENTS =============== */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));
  t.classList.add('on');$('p-'+t.dataset.p).classList.add('on')});
$('qChat').oninput=e=>{cQ=e.target.value;renderChat()};
$('btnResetChat').onclick=()=>{cQ='';cStaff='';$('qChat').value='';renderStaff();renderChat()};
$('btnReload').onclick=()=>{CHAT_RECS=[];CHAT_STAFF=[];FATAL=[];boot()};
$('fSitus').onchange=e=>{fSitus=e.target.value;renderFatal()};
$('fStaff').onchange=e=>{fStaff=e.target.value;renderFatal()};
$('fDate').onchange=e=>{fDate=e.target.value;renderFatal()};
$('qFatal').oninput=e=>{fQ=e.target.value;renderFatal()};
$('btnResetFatal').onclick=()=>{fSitus=fStaff=fDate=fQ='';$('fSitus').value=$('fStaff').value=$('fDate').value=$('qFatal').value='';renderFatal()};

/* =============== DRAG-FREE SCROLL (desktop) =============== */
function dragScroll(el){let down=false,sx=0,sl=0,moved=0;
 el.addEventListener('pointerdown',e=>{if(e.target.closest('a,button,select,input'))return;down=true;moved=0;sx=e.clientX;sl=el.scrollLeft});
 window.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-sx;moved=Math.max(moved,Math.abs(dx));if(moved>4)el.scrollLeft=sl-dx});
 window.addEventListener('pointerup',()=>down=false)}
dragScroll($('wrapChat'));dragScroll($('wrapFatal'));dragScroll($('staffChips'));

/* =============== MODAL =============== */
let mURL='';
function mOpen(url,cap){mURL=url;$('mTitle').textContent=cap||'Preview';
  let img=url;const d=url.match(/\/d\/([\w-]{10,})/)||url.match(/[?&]id=([\w-]{10,})/);
  if(d)img=`https://drive.google.com/thumbnail?id=${d[1]}&sz=w1600`;
  const el=$('mImg');el.src=img;el.style.display='block';
  el.onerror=()=>{el.style.display='none'};
  $('mOpen').href=url;
  $('mCap').innerHTML=`<b>🔗 URL:</b> <code>${esc(url)}</code><br><small>Domain: <b>${esc(shortURL(url))}</b></small>`;
  $('mbg').classList.add('show')}
function mClose(){$('mbg').classList.remove('show');$('mImg').src=''}
$('mbg').onclick=e=>{if(e.target.id==='mbg')mClose()};
$('mCopy').onclick=()=>copyText(mURL,$('mCopy'));
document.addEventListener('keydown',e=>{if(e.key==='Escape')mClose()});

boot();
</script>
