<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUKU DOSA ALL - Social Media</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .menu-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .menu-title {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 15px 30px;
            background: #f0f0f0;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: 600;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 200px;
        }

        .tab-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .filter-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .filter-section label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }

        .filter-section select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            background: white;
            cursor: pointer;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .stat-card h3 {
            font-size: 1em;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .stat-card .count {
            font-size: 2.5em;
            font-weight: bold;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            border: 1px solid #eee;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
        }

        .card-header h3 {
            font-size: 1.3em;
            margin-bottom: 5px;
        }

        .card-header .status {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .card-body {
            padding: 20px;
        }

        .card-info {
            margin-bottom: 15px;
        }

        .card-info strong {
            color: #667eea;
            display: inline-block;
            min-width: 120px;
        }

        .card-info span {
            color: #333;
        }

        .card-description {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            border-left: 4px solid #667eea;
        }

        .card-images {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .card-images img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.3s ease;
            border: 2px solid #ddd;
        }

        .card-images img:hover {
            transform: scale(1.05);
            border-color: #667eea;
        }

        .card-link {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            margin: 5px;
            transition: all 0.3s ease;
            font-size: 0.9em;
        }

        .card-link:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2em;
            color: #667eea;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            border-left: 4px solid #c33;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            max-width: 90%;
            max-height: 90%;
            position: relative;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 10px;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            cursor: pointer;
            z-index: 1001;
        }

        .badge {
            display: inline-block;
            background: #28a745;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            margin: 5px;
        }

        .badge-danger {
            background: #dc3545;
        }

        .badge-warning {
            background: #ffc107;
            color: #333;
        }

        .refresh-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .tab-btn {
                min-width: 100%;
            }

            .cards-grid {
                grid-template-columns: 1fr;
            }

            .stat-card .count {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 BUKU DOSA ALL</h1>
            <p>Sistem Pencatatan Kesalahan - Social Media</p>
        </div>

        <div class="menu-container">
            <h2 class="menu-title">Menu Utama</h2>
            
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="switchTab('kesalahan', this)">
                    💬 KESALAHAN CHAT ALL
                </button>
                <button class="tab-btn" onclick="switchTab('fatal', this)">
                    ⚠️ FATAL ALL SITUS
                </button>
            </div>

            <!-- Tab Kesalahan Chat -->
            <div id="kesalahan-tab" class="tab-content active">
                <div class="filter-section">
                    <label for="siteFilter">🌐 Pilih Situs:</label>
                    <select id="siteFilter" onchange="filterKesalahanBySite()">
                        <option value="all">Semua Situs</option>
                    </select>
                    <button class="refresh-btn" onclick="loadKesalahanData()">🔄 Refresh Data</button>
                </div>

                <h3 style="margin: 20px 0; color: #333;">📊 Statistik Kesalahan Staff</h3>
                <div id="statsGrid" class="stats-grid">
                    <div class="loading">Memuat data...</div>
                </div>

                <h3 style="margin: 30px 0 20px 0; color: #333;">📋 Daftar Kesalahan Chat</h3>
                <div id="kesalahanCards" class="cards-grid">
                    <div class="loading">Memuat data...</div>
                </div>
            </div>

            <!-- Tab Fatal -->
            <div id="fatal-tab" class="tab-content">
                <div class="filter-section">
                    <label for="fatalSiteFilter">🌐 Filter Situs:</label>
                    <select id="fatalSiteFilter" onchange="filterFatalBySite()">
                        <option value="all">Semua Situs</option>
                    </select>
                    <button class="refresh-btn" onclick="loadFatalData()">🔄 Refresh Data</button>
                </div>

                <h3 style="margin: 30px 0 20px 0; color: #333;">⚠️ Daftar Kesalahan Fatal</h3>
                <div id="fatalCards" class="cards-grid">
                    <div class="loading">Memuat data...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for image viewing -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <div class="modal-content">
            <img id="modalImage" src="" alt="Preview">
        </div>
    </div>

    <script>
        const SHEET_ID = '1camkXfvojs-YSBBPekYHTi4cwata4YCGTtmVIeOy1yc';
        const SITUS_LAIN_SHEET = 'Situs Lain';
        const FATAL_SHEET = 'Fatal All Situs';

        let kesalahanData = [];
        let fatalData = [];
        let staffStats = [];

        // Switch tabs
        function switchTab(tab, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            btn.classList.add('active');
            document.getElementById(tab + '-tab').classList.add('active');

            if (tab === 'kesalahan' && kesalahanData.length === 0) {
                loadKesalahanData();
            } else if (tab === 'fatal' && fatalData.length === 0) {
                loadFatalData();
            }
        }

        // Load Kesalahan Chat data
        async function loadKesalahanData() {
            try {
                document.getElementById('kesalahanCards').innerHTML = '<div class="loading">Memuat data...</div>';
                document.getElementById('statsGrid').innerHTML = '<div class="loading">Memuat statistik...</div>';

                const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SITUS_LAIN_SHEET)}`;
                const response = await fetch(url);
                const csv = await response.text();
                
                const rows = parseCSV(csv);
                
                // Extract staff stats (I3:I40 = index 8, J3:J40 = index 9)
                staffStats = [];
                for (let i = 2; i < Math.min(rows.length, 40); i++) {
                    const row = rows[i];
                    if (!row) continue;
                    const name = (row[8] || '').trim();
                    const count = (row[9] || '0').trim();
                    if (name && count !== '') {
                        staffStats.push({ name, count: parseInt(count) || 0 });
                    }
                }

                // Extract kesalahan data (B4:B2547=col1, C4:C2547=col2, D4:D2547=col3)
                kesalahanData = [];
                for (let i = 3; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || row.length < 4) continue;

                    const csName = (row[1] || '').trim();
                    const photoLinks = (row[2] || '').trim();
                    const description = (row[3] || '').trim();

                    // Abaikan baris kosong
                    if (!csName && !photoLinks && !description) continue;

                    kesalahanData.push({
                        site: csName,
                        photoLinks: parseMultipleLinks(photoLinks),
                        photoRaw: photoLinks,
                        description: description
                    });
                }

                // Populate site filter from C2 area and unique sites
                const siteOptions = new Set();
                // Coba ambil dari row 1 (C2 = index 2, row index 1)
                if (rows[1] && rows[1][2]) {
                    const c2val = rows[1][2].trim();
                    if (c2val) siteOptions.add(c2val);
                }
                // Tambahkan semua site dari data
                kesalahanData.forEach(item => {
                    if (item.site) siteOptions.add(item.site);
                });

                const siteFilter = document.getElementById('siteFilter');
                siteFilter.innerHTML = '<option value="all">Semua Situs</option>';
                Array.from(siteOptions).sort().forEach(site => {
                    if (site) siteFilter.innerHTML += `<option value="${site}">${site}</option>`;
                });

                renderStats();
                renderKesalahanCards(kesalahanData);

            } catch (error) {
                console.error('Error loading kesalahan data:', error);
                document.getElementById('kesalahanCards').innerHTML = 
                    `<div class="error">❌ Gagal memuat data: ${error.message}<br>Pastikan Google Sheet dalam mode PUBLIC (siapa saja bisa lihat)</div>`;
                document.getElementById('statsGrid').innerHTML = '';
            }
        }

        // Load Fatal data
        async function loadFatalData() {
            try {
                document.getElementById('fatalCards').innerHTML = '<div class="loading">Memuat data...</div>';

                const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(FATAL_SHEET)}`;
                const response = await fetch(url);
                const csv = await response.text();
                
                const rows = parseCSV(csv);
                const siteOptions = new Set();
                
                // Extract fatal data (B5:B=col1, D5:D=col3, E5:E=col4, F5:F=col5, H5:H=col7, I5:I=col8, J5:J=col9, K5:K=col10)
                fatalData = [];
                for (let i = 4; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row) continue;

                    const date = (row[1] || '').trim();
                    const staffName = (row[3] || '').trim();
                    const status = (row[4] || '').trim();
                    const siteName = (row[5] || '').trim();
                    const bonusCut = (row[7] || '').trim();
                    const fatalDesc = (row[8] || '').trim();
                    const ssLinks = parseMultipleLinks((row[9] || '').trim());
                    const ssLcLinks = parseMultipleLinks((row[10] || '').trim());

                    // Abaikan baris kosong
                    if (!staffName && !date && !siteName && !fatalDesc) continue;

                    fatalData.push({
                        date,
                        staffName,
                        status,
                        siteName,
                        bonusCut,
                        fatalDesc,
                        ssLinks,
                        ssLcLinks
                    });
                    if (siteName) siteOptions.add(siteName);
                }

                // Populate fatal site filter
                const fatalSiteFilter = document.getElementById('fatalSiteFilter');
                fatalSiteFilter.innerHTML = '<option value="all">Semua Situs</option>';
                Array.from(siteOptions).sort().forEach(site => {
                    if (site) fatalSiteFilter.innerHTML += `<option value="${site}">${site}</option>`;
                });

                renderFatalCards(fatalData);

            } catch (error) {
                console.error('Error loading fatal data:', error);
                document.getElementById('fatalCards').innerHTML = 
                    `<div class="error">❌ Gagal memuat data: ${error.message}<br>Pastikan Google Sheet dalam mode PUBLIC (siapa saja bisa lihat)</div>`;
            }
        }

        // Parse CSV
        function parseCSV(csv) {
            const rows = [];
            let currentRow = [];
            let currentCell = '';
            let inQuotes = false;

            for (let i = 0; i < csv.length; i++) {
                const char = csv[i];
                
                if (char === '"') {
                    if (inQuotes && csv[i + 1] === '"') {
                        currentCell += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    currentRow.push(currentCell);
                    currentCell = '';
                } else if ((char === '\n' || char === '\r') && !inQuotes) {
                    if (currentCell !== '' || currentRow.length > 0) {
                        currentRow.push(currentCell);
                        rows.push(currentRow);
                        currentRow = [];
                        currentCell = '';
                    }
                    if (char === '\r' && csv[i + 1] === '\n') i++;
                } else {
                    currentCell += char;
                }
            }

            if (currentCell !== '' || currentRow.length > 0) {
                currentRow.push(currentCell);
                rows.push(currentRow);
            }

            return rows;
        }

        // Parse multiple links from a cell
        function parseMultipleLinks(text) {
            if (!text) return [];
            const urlRegex = /(https?:\/\/[^\s,;]+)/g;
            const links = text.match(urlRegex) || [];
            return links.map(link => link.trim()).filter(link => link);
        }

        // Check if string is valid image URL
        function isImageUrl(url) {
            return /\.(jpg|jpeg|png|gif|bmp|webp)(\?.*)?$/i.test(url);
        }

        // Render statistics
        function renderStats() {
            const statsGrid = document.getElementById('statsGrid');
            
            if (staffStats.length === 0) {
                statsGrid.innerHTML = '<div class="loading">Tidak ada data statistik</div>';
                return;
            }

            const html = staffStats
                .filter(stat => stat.count > 0)
                .sort((a, b) => b.count - a.count)
                .map(stat => `
                    <div class="stat-card">
                        <h3>${stat.name}</h3>
                        <div class="count">${stat.count}</div>
                        <div style="margin-top:10px;opacity:0.8;font-size:0.9em;">Total Kesalahan</div>
                    </div>
                `).join('');
            
            statsGrid.innerHTML = html || '<div class="loading">Tidak ada data</div>';
        }

        // Render kesalahan cards
        function renderKesalahanCards(data) {
            const container = document.getElementById('kesalahanCards');
            
            if (data.length === 0) {
                container.innerHTML = '<div class="loading" style="grid-column:1/-1">Tidak ada data kesalahan</div>';
                return;
            }

            container.innerHTML = data.map((item, index) => {
                let imagesHtml = '';
                let linksHtml = '';

                if (item.photoLinks && item.photoLinks.length > 0) {
                    imagesHtml = `<div class="card-images">
                        ${item.photoLinks.map((link, i) => `
                            <div>
                                ${isImageUrl(link) 
                                    ? `<img src="${link}" alt="Foto ${i+1}" onclick="openModal('${link}')" onerror="this.parentElement.innerHTML='<a href=\\'${link}\\' target=\\'_blank\\' class=\\'card-link\\'>🔗 Buka Link ${i+1}</a>'">`
                                    : `<a href="${link}" target="_blank" class="card-link">🔗 Buka Link ${i+1}</a>`
                                }
                            </div>
                        `).join('')}
                    </div>`;
                } else if (item.photoRaw) {
                    // Jika tidak ada URL tapi ada text
                    imagesHtml = `<div class="card-info"><strong>📎 Link:</strong> ${item.photoRaw}</div>`;
                }

                return `
                    <div class="card">
                        <div class="card-header">
                            <h3>👤 ${item.site || 'Situs Tidak Diketahui'}</h3>
                            <div class="status">Data Kesalahan #${index + 1}</div>
                        </div>
                        <div class="card-body">
                            <div class="card-description">
                                <strong>📝 Keterangan Kesalahan:</strong><br>
                                ${item.description || 'Tidak ada keterangan'}
                            </div>
                            ${imagesHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Render fatal cards
        function renderFatalCards(data) {
            const container = document.getElementById('fatalCards');
            
            if (data.length === 0) {
                container.innerHTML = '<div class="loading" style="grid-column:1/-1">Tidak ada data fatal</div>';
                return;
            }

            container.innerHTML = data.map((item, index) => {
                const ssHtml = item.ssLinks.length > 0 
                    ? `<h4 style="margin-top: 15px; color: #dc3545;">📸 SS Kesalahan:</h4>
                       <div class="card-images">
                        ${item.ssLinks.map((link, i) => `
                            <div>
                                ${isImageUrl(link) 
                                    ? `<img src="${link}" alt="SS ${i+1}" onclick="openModal('${link}')" onerror="this.parentElement.innerHTML='<a href=\\'${link}\\' target=\\'_blank\\' class=\\'card-link\\'>🔗 SS Link ${i+1}</a>'">`
                                    : `<a href="${link}" target="_blank" class="card-link">🔗 SS Link ${i+1}</a>`
                                }
                            </div>
                        `).join('')}
                       </div>`
                    : '';

                const ssLcHtml = item.ssLcLinks.length > 0 
                    ? `<h4 style="margin-top: 15px; color: #ffc107;">📸 SS Kesalahan LC:</h4>
                       <div class="card-images">
                        ${item.ssLcLinks.map((link, i) => `
                            <div>
                                ${isImageUrl(link) 
                                    ? `<img src="${link}" alt="SS LC ${i+1}" onclick="openModal('${link}')" onerror="this.parentElement.innerHTML='<a href=\\'${link}\\' target=\\'_blank\\' class=\\'card-link\\'>🔗 LC Link ${i+1}</a>'">`
                                    : `<a href="${link}" target="_blank" class="card-link">🔗 LC Link ${i+1}</a>`
                                }
                            </div>
                        `).join('')}
                       </div>`
                    : '';

                return `
                    <div class="card">
                        <div class="card-header" style="background: linear-gradient(135deg, #dc3545 0%, #764ba2 100%);">
                            <h3>⚠️ ${item.staffName || 'Staff Tidak Diketahui'}</h3>
                            <div class="status">${item.siteName || '-'} | ${item.date || 'No Date'}</div>
                        </div>
                        <div class="card-body">
                            <div class="card-info">
                                <strong>Status:</strong>
                                <span class="badge ${item.status ? '' : 'badge-warning'}">${item.status || '-'}</span>
                            </div>
                            <div class="card-info">
                                <strong>Potong Bonus:</strong>
                                <span class="badge badge-danger">${item.bonusCut || '0%'}</span>
                            </div>
                            <div class="card-description" style="border-left-color: #dc3545;">
                                <strong>📝 Keterangan Fatal:</strong><br>
                                ${item.fatalDesc || 'Tidak ada keterangan'}
                            </div>
                            ${ssHtml}
                            ${ssLcHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Filter kesalahan by site
        function filterKesalahanBySite() {
            const selectedSite = document.getElementById('siteFilter').value;
            
            if (selectedSite === 'all') {
                renderKesalahanCards(kesalahanData);
            } else {
                const filtered = kesalahanData.filter(item => item.site === selectedSite);
                renderKesalahanCards(filtered);
            }
        }

        // Filter fatal by site
        function filterFatalBySite() {
            const selectedSite = document.getElementById('fatalSiteFilter').value;
            
            if (selectedSite === 'all') {
                renderFatalCards(fatalData);
            } else {
                const filtered = fatalData.filter(item => item.siteName === selectedSite);
                renderFatalCards(filtered);
            }
        }

        // Modal functions
        function openModal(imageUrl) {
            document.getElementById('modalImage').src = imageUrl;
            document.getElementById('imageModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('imageModal').classList.remove('active');
        }

        // Close modal with Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadKesalahanData();
        });
    </script>
</body>
</html>
