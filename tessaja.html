<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#04101f">
<title>⚡ FOTO - LINE TOGEL 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Exo+2:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --bg:#04101f; --surface:rgba(9,32,58,.72); --surface-2:rgba(10,33,64,.88);
  --elevated:rgba(13,40,72,.55); --line:rgba(0,229,255,.18); --line-strong:rgba(0,229,255,.45);
  --cyan:#00e5ff; --cyan-soft:#7df9ff; --gold:#ffc247; --coral:#ff5d73; --mint:#00ff9d;
  --text:#dff6ff; --muted:#7fa8c4; --dim:#54689a;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Exo 2',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;line-height:1.6}
::selection{background:rgba(0,229,255,.35);color:#fff}
::-webkit-scrollbar{width:9px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--cyan),var(--gold));border-radius:6px;border:2px solid var(--bg)}

/* ===== Latar ===== */
.bg-canvas{position:fixed;inset:0;z-index:-3;background:
  radial-gradient(ellipse at 18% 12%,rgba(0,229,255,.13),transparent 50%),
  radial-gradient(ellipse at 85% 88%,rgba(255,194,71,.09),transparent 55%),
  radial-gradient(ellipse at 50% 50%,#071a30,#04101f 72%)}
.grid-overlay{position:fixed;inset:0;z-index:-2;
  background-image:linear-gradient(rgba(0,229,255,.05) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(0,229,255,.05) 1px,transparent 1px);
  background-size:48px 48px;
  -webkit-mask-image:radial-gradient(ellipse 75% 65% at 50% 38%,#000 25%,transparent 78%);
  mask-image:radial-gradient(ellipse 75% 65% at 50% 38%,#000 25%,transparent 78%);
  animation:gridMove 40s linear infinite}
@keyframes gridMove{to{background-position:48px 48px}}
.particles{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.particle{position:absolute;width:3px;height:3px;background:var(--cyan);border-radius:50%;opacity:.6;
  box-shadow:0 0 8px var(--cyan);animation:particleFloat 22s infinite ease-in-out}
.particle:nth-child(3n){background:var(--gold);box-shadow:0 0 8px var(--gold)}
@keyframes particleFloat{
  0%,100%{transform:translateY(100vh) rotate(0);opacity:0}
  10%{opacity:.6} 90%{opacity:.6}
  100%{transform:translateY(-100vh) rotate(540deg);opacity:0}
}

/* ===== Topbar ===== */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px clamp(16px,4vw,40px);background:rgba(4,16,31,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand-mark{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px;color:#04101f;
  background:linear-gradient(135deg,var(--cyan),#3aa8ff);animation:brandPulse 3s ease-in-out infinite}
@keyframes brandPulse{0%,100%{box-shadow:0 0 18px rgba(0,229,255,.4)}50%{box-shadow:0 0 30px rgba(0,229,255,.75)}}
.brand-text b{font-family:'Orbitron';font-size:17px;font-weight:900;color:var(--text);letter-spacing:.06em;display:block;line-height:1.1}
.brand-text small{font-family:'Share Tech Mono';font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan)}
.back-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;background:rgba(0,229,255,.06);
  border:1.5px solid rgba(0,229,255,.5);border-radius:10px;color:var(--cyan);text-decoration:none;
  font-family:'Exo 2';font-weight:700;font-size:13px;transition:.25s}
.back-btn:hover{background:rgba(0,229,255,.16);border-color:var(--cyan);box-shadow:0 0 20px rgba(0,229,255,.3);transform:translateX(-3px)}

/* ===== Layout ===== */
.container{max-width:1400px;margin:0 auto;padding:0 clamp(14px,3vw,26px) 40px;position:relative}
.hero{text-align:center;padding:38px 0 26px;animation:headerEntrance .8s cubic-bezier(.16,1,.3,1) backwards}
@keyframes headerEntrance{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:none}}
.eyebrow{font-family:'Share Tech Mono';font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);
  display:inline-flex;align-items:center;gap:9px;margin-bottom:14px}
.title{font-family:'Orbitron';font-size:clamp(30px,6vw,50px);font-weight:900;line-height:1.05;color:var(--text);
  letter-spacing:1px;text-shadow:0 0 40px rgba(0,229,255,.35)}
.title .accent{color:var(--cyan)}
.chip{font-family:'Share Tech Mono';font-size:13px;vertical-align:middle;color:#241500;
  background:linear-gradient(120deg,var(--gold),#ffab2e);padding:5px 13px;border-radius:99px;margin-left:12px;
  box-shadow:0 3px 14px rgba(255,180,60,.4);white-space:nowrap}
.status-badge{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;background:rgba(0,255,157,.1);
  border:1px solid rgba(0,255,157,.4);border-radius:99px;font-family:'Share Tech Mono';font-size:10px;font-weight:600;
  color:var(--mint);text-transform:uppercase;letter-spacing:2px;margin-top:16px;animation:statusPulse 2.5s ease-in-out infinite}
@keyframes statusPulse{0%,100%{box-shadow:0 0 12px rgba(0,255,157,.2)}50%{box-shadow:0 0 24px rgba(0,255,157,.45)}}
.status-dot{width:7px;height:7px;background:var(--mint);border-radius:50%;box-shadow:0 0 10px var(--mint);animation:dotBeat 1.5s ease-in-out infinite}
@keyframes dotBeat{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.7}}

/* ===== Menu / Tab ===== */
.nav-wrap{display:flex;justify-content:center;margin-bottom:28px}
.nav-tabs{position:relative;display:inline-flex;gap:6px;padding:6px;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(10px)}
.tab-indicator{position:absolute;top:6px;left:0;height:calc(100% - 12px);width:0;border-radius:10px;
  background:linear-gradient(135deg,rgba(0,229,255,.28),rgba(0,229,255,.1));border:1px solid var(--line-strong);
  box-shadow:0 0 22px rgba(0,229,255,.3);z-index:0;
  transition:transform .45s cubic-bezier(.16,1,.3,1),width .45s cubic-bezier(.16,1,.3,1)}
.nav-tab{position:relative;z-index:1;overflow:hidden;border:none;background:transparent;padding:12px 28px;border-radius:10px;
  color:var(--muted);font-family:'Orbitron';font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;
  cursor:pointer;transition:color .3s;display:inline-flex;align-items:center;gap:9px}
.nav-tab i{font-size:13px}
.nav-tab:hover{color:var(--text)}
.nav-tab.active{color:var(--cyan)}

.section{display:none}
.section.active{display:block;animation:fadeIn .5s cubic-bezier(.16,1,.3,1)}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

/* ===== Pencarian ===== */
.search-container{max-width:560px;margin:0 auto 28px;position:relative}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.search-box{width:100%;padding:13px 18px 13px 44px;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  color:var(--text);font-family:'Exo 2';font-size:14px;transition:.3s;backdrop-filter:blur(10px)}
.search-box:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,229,255,.12),0 0 20px rgba(0,229,255,.2)}
.search-box::placeholder{color:var(--dim)}

/* ===== Galeri ===== */
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.photo-card{background:linear-gradient(180deg,var(--surface-2),rgba(6,22,42,.85));border:1px solid var(--line);
  border-radius:16px;overflow:hidden;position:relative;opacity:0;transform:translateY(20px);
  transition:transform .35s cubic-bezier(.16,1,.3,1),border-color .35s,box-shadow .35s;animation:cardEnter .5s ease forwards}
.photo-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;z-index:2;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:0;transition:.35s}
.photo-card:nth-child(1){animation-delay:.08s}.photo-card:nth-child(2){animation-delay:.14s}
.photo-card:nth-child(3){animation-delay:.2s}.photo-card:nth-child(4){animation-delay:.26s}.photo-card:nth-child(5){animation-delay:.32s}
@keyframes cardEnter{to{opacity:1;transform:translateY(0)}}
.photo-card:hover{transform:translateY(-6px);border-color:var(--line-strong);
  box-shadow:0 0 30px rgba(0,229,255,.2),0 18px 40px rgba(0,0,0,.4)}
.photo-card:hover::before{opacity:.75}
.photo-wrapper{position:relative;width:100%;height:270px;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at center,#0d2137 0%,#050d18 100%)}
.photo-wrapper img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .4s ease}
.photo-card:hover .photo-wrapper img{transform:scale(1.05)}
.photo-info{padding:15px}
.photo-title{font-family:'Orbitron';font-size:13px;font-weight:700;color:var(--cyan);margin-bottom:6px;word-break:break-word;
  text-align:center;text-shadow:0 0 10px rgba(0,229,255,.4)}
.photo-meta{font-family:'Share Tech Mono';font-size:10px;letter-spacing:.1em;color:var(--muted);text-align:center;margin-bottom:13px}

/* Tombol aksi kartu */
.action-buttons-row{display:flex;gap:8px;padding-top:13px;border-top:1px solid rgba(0,229,255,.15)}
.action-btn-cool{position:relative;overflow:hidden;flex:1;height:42px;background:rgba(0,229,255,.05);
  border:1px solid rgba(0,229,255,.2);border-radius:9px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;transition:.25s;font-family:'Exo 2'}
.action-btn-cool i{font-size:14px}
.action-btn-cool span{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.action-btn-cool:hover{transform:translateY(-3px);color:#04101f}
.copy-btn{color:var(--mint)} .download-btn{color:var(--cyan)} .edit-btn{color:var(--gold)}
.copy-btn:hover{background:var(--mint);border-color:var(--mint);box-shadow:0 6px 18px rgba(0,255,157,.4)}
.download-btn:hover{background:var(--cyan);border-color:var(--cyan);box-shadow:0 6px 18px rgba(0,229,255,.4)}
.edit-btn:hover{background:var(--gold);border-color:var(--gold);box-shadow:0 6px 18px rgba(255,194,71,.4)}

/* ===== Editor ===== */
.editor-container{background:linear-gradient(180deg,var(--surface-2),rgba(6,22,42,.85));border:1px solid var(--line);
  border-radius:20px;padding:clamp(18px,3vw,26px);margin-bottom:20px;position:relative;overflow:hidden;
  backdrop-filter:blur(12px);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.editor-container::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.6}
.editor-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:16px;
  border-bottom:1px solid rgba(0,229,255,.2)}
.editor-title{font-family:'Orbitron';font-size:16px;color:var(--cyan);display:flex;align-items:center;gap:10px}
.upload-area{border:2px dashed rgba(0,229,255,.35);border-radius:14px;padding:42px 25px;text-align:center;cursor:pointer;
  transition:.3s;margin-bottom:22px;background:rgba(0,229,255,.02)}
.upload-area:hover,.upload-area.dragover{border-color:var(--cyan);background:rgba(0,229,255,.07);box-shadow:inset 0 0 30px rgba(0,229,255,.12)}
.upload-icon{font-size:44px;color:var(--cyan);margin-bottom:14px;text-shadow:0 0 20px rgba(0,229,255,.5)}
.upload-text{font-size:15px;color:var(--text);margin-bottom:6px;font-weight:600}
.upload-hint{font-size:12px;color:var(--muted)}
.canvas-wrapper{position:relative;background:rgba(4,16,31,.6);border:1px solid var(--line);border-radius:14px;padding:14px;
  margin-bottom:20px;overflow:auto;max-height:62vh;display:flex;justify-content:center}
#mainCanvas{max-width:100%;border:1px solid var(--line-strong);border-radius:8px;background:#fff;box-shadow:0 0 30px rgba(0,229,255,.15)}
.tools-panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:20px}
.tool-group{background:var(--elevated);border:1px solid rgba(0,229,255,.16);border-radius:14px;padding:16px;transition:.25s}
.tool-group:hover{border-color:rgba(0,229,255,.35)}
.tool-title{font-family:'Share Tech Mono';font-size:11px;color:var(--gold);margin-bottom:12px;text-transform:uppercase;
  letter-spacing:1.5px;display:flex;align-items:center;gap:8px}
.tool-btn{position:relative;overflow:hidden;width:100%;padding:9px 12px;margin-bottom:8px;background:rgba(0,229,255,.08);
  border:1px solid rgba(0,229,255,.2);border-radius:9px;color:var(--text);font-family:'Exo 2';font-size:12px;font-weight:600;
  cursor:pointer;transition:.25s;display:flex;align-items:center;gap:9px}
.tool-group .tool-btn:last-child{margin-bottom:0}
.tool-btn i{color:var(--cyan);width:16px;text-align:center}
.tool-btn:hover{background:rgba(0,229,255,.18);border-color:var(--cyan);transform:translateX(4px)}
.tool-btn.active{background:linear-gradient(135deg,var(--cyan),var(--cyan-soft));color:#04101f}
.tool-btn.active i{color:#04101f}
input[type="range"]{width:100%;height:4px;background:rgba(4,16,31,.9);border-radius:2px;outline:none;-webkit-appearance:none;margin-bottom:12px}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;background:var(--cyan);border-radius:50%;cursor:pointer;box-shadow:0 0 10px rgba(0,229,255,.6)}
.color-picker{width:100%;height:36px;border:1px solid var(--line);border-radius:9px;cursor:pointer;background:none;margin-bottom:8px}
.input-field{width:100%;padding:9px 11px;background:rgba(4,16,31,.7);border:1px solid var(--line);border-radius:9px;
  color:var(--text);font-family:'Exo 2';font-size:12px;margin-bottom:8px;transition:.25s}
.input-field:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,229,255,.12)}

/* ===== Tombol Utama ===== */
.action-buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{position:relative;overflow:hidden;padding:11px 24px;border-radius:10px;font-family:'Orbitron';font-size:11px;font-weight:700;
  cursor:pointer;transition:.25s;border:1.5px solid transparent;display:inline-flex;align-items:center;gap:8px;
  text-transform:uppercase;letter-spacing:1px}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--cyan),#3aa8ff);color:#04101f;box-shadow:0 4px 18px rgba(0,229,255,.3)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(0,229,255,.45)}
.btn-secondary{background:transparent;border-color:rgba(0,229,255,.5);color:var(--cyan)}
.btn-secondary:hover{background:rgba(0,229,255,.12);border-color:var(--cyan);transform:translateY(-2px)}
.btn-danger{background:rgba(255,93,115,.12);border-color:rgba(255,93,115,.4);color:var(--coral)}
.btn-danger:hover{background:rgba(255,93,115,.22);border-color:var(--coral);transform:translateY(-2px)}
.ripple{position:absolute;transform:translate(-50%,-50%);pointer-events:none;border-radius:50%;
  background:rgba(255,255,255,.4);animation:rip .6s ease-out forwards}
@keyframes rip{from{width:0;height:0;opacity:.5}to{width:260px;height:260px;opacity:0}}

/* ===== Loading ===== */
.loading{display:none;text-align:center;padding:30px;grid-column:1/-1}
.loading.active{display:block}
.loader{width:44px;height:44px;border:3px solid rgba(0,229,255,.2);border-top-color:var(--cyan);border-radius:50%;
  animation:spin 1s linear infinite;margin:0 auto 14px;box-shadow:0 0 20px rgba(0,229,255,.3)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== Modal ===== */
.modal-backdrop{position:fixed;inset:0;background:rgba(3,10,20,.92);backdrop-filter:blur(15px);z-index:1000;
  display:none;align-items:center;justify-content:center;padding:16px}
.modal-backdrop.active{display:flex;animation:fadeIn .3s}
.modal-content{background:linear-gradient(180deg,var(--surface-2),rgba(6,22,42,.95));border:1px solid var(--line-strong);
  border-radius:18px;max-width:900px;width:100%;max-height:95vh;overflow:auto;display:flex;flex-direction:column;
  box-shadow:0 0 60px rgba(0,229,255,.2)}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid rgba(0,229,255,.2)}
.modal-title{font-family:'Orbitron';font-size:14px;color:var(--cyan)}
.modal-close{width:34px;height:34px;background:transparent;border:1.5px solid var(--coral);border-radius:50%;
  color:var(--coral);font-size:14px;cursor:pointer;transition:.3s}
.modal-close:hover{background:var(--coral);color:#04101f;transform:rotate(90deg)}
.modal-body{padding:20px;text-align:center;overflow-y:auto;flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;background:radial-gradient(circle at center,#0d2137 0%,#050d18 100%)}
.modal-body img{max-width:100%;max-height:72vh;object-fit:contain;border-radius:10px;box-shadow:0 0 30px rgba(0,229,255,.25)}
.modal-actions{margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ===== Toast ===== */
.toast{position:fixed;bottom:22px;right:22px;background:linear-gradient(180deg,var(--surface-2),rgba(6,22,42,.95));
  border:1px solid var(--cyan);color:var(--cyan);padding:13px 22px;border-radius:12px;font-weight:600;font-size:12px;
  z-index:10000;display:flex;align-items:center;gap:10px;box-shadow:0 0 30px rgba(0,229,255,.3);
  transform:translateX(220px);opacity:0;transition:.5s cubic-bezier(.34,1.56,.64,1);backdrop-filter:blur(10px)}
.toast.show{transform:translateX(0);opacity:1}

@media(max-width:768px){
  .gallery-grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .photo-wrapper{height:170px}
  .tools-panel{grid-template-columns:1fr}
  .nav-tabs{width:100%;display:flex}
  .nav-tab{flex:1;justify-content:center;padding:12px 8px;font-size:10px}
  .brand-text small{display:none}
  .action-btn-cool{height:38px}.action-btn-cool span{font-size:8px}
}
@media(max-width:400px){.gallery-grid{grid-template-columns:1fr}.photo-wrapper{height:230px}}
</style>
</head>
<body>
<div class="bg-canvas"></div>
<div class="grid-overlay"></div>
<div class="particles" id="particles"></div>

<header class="topbar">
  <a class="brand" href="index.html">
    <span class="brand-mark"><i class="fa-solid fa-bolt"></i></span>
    <span class="brand-text"><b>LINE TOGEL</b><small>Cyber Portal 2026</small></span>
  </a>
  <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Kembali</a>
</header>

<div class="container">
  <div class="hero">
    <p class="eyebrow"><i class="fa-solid fa-images"></i> Galeri Media</p>
    <h1 class="title">Foto <span class="accent">Gallery</span><span class="chip">2026</span></h1>
    <div><span class="status-badge"><span class="status-dot"></span><span>System Online</span></span></div>
  </div>

  <!-- Menu Tab dengan indikator geser -->
  <div class="nav-wrap">
    <div class="nav-tabs">
      <span class="tab-indicator"></span>
      <button class="nav-tab active" onclick="showSection('gallery', this)"><i class="fa-solid fa-images"></i> Galeri Foto</button>
      <button class="nav-tab" onclick="showSection('editor', this)"><i class="fa-solid fa-wand-magic-sparkles"></i> Photo Editor</button>
    </div>
  </div>

  <!-- Section: Galeri -->
  <section id="gallery" class="section active">
    <div class="search-container">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" class="search-box" id="searchInput" placeholder="Cari foto berdasarkan judul..." onkeyup="searchPhotos()">
    </div>
    <div class="loading" id="loading">
      <div class="loader"></div>
      <div style="color:var(--cyan);font-family:'Share Tech Mono';font-size:11px;letter-spacing:.15em">⚡ LOADING PHOTOS...</div>
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
  </section>

  <!-- Section: Editor -->
  <section id="editor" class="section">
    <div class="editor-container">
      <div class="editor-header">
        <h2 class="editor-title"><i class="fa-solid fa-palette"></i> PHOTO EDITOR STUDIO</h2>
      </div>
      <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        <div class="upload-icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
        <div class="upload-text">Klik atau seret foto ke sini</div>
        <div class="upload-hint">Support: JPG, PNG, WEBP (bisa banyak file)</div>
        <input type="file" id="fileInput" multiple accept="image/*" style="display:none" onchange="handleFiles(event)">
      </div>
      <div class="canvas-wrapper"><canvas id="mainCanvas" width="800" height="600"></canvas></div>
      <div class="tools-panel">
        <div class="tool-group">
          <div class="tool-title"><i class="fa-solid fa-circle-half-stroke"></i> Filter & Adjust</div>
          <button class="tool-btn" onclick="applyFilter('grayscale')"><i class="fa-solid fa-circle"></i> Grayscale</button>
          <button class="tool-btn" onclick="applyFilter('sepia')"><i class="fa-solid fa-mug-hot"></i> Sepia</button>
          <button class="tool-btn" onclick="applyFilter('invert')"><i class="fa-solid fa-arrow-right-arrow-left"></i> Invert</button>
          <button class="tool-btn" onclick="applyFilter('blur')"><i class="fa-solid fa-droplet"></i> Blur</button>
          <label class="tool-title" style="margin-top:12px">Brightness</label>
          <input type="range" id="brightness" min="0" max="200" value="100" onchange="adjustImage()">
          <label class="tool-title">Contrast</label>
          <input type="range" id="contrast" min="0" max="200" value="100" onchange="adjustImage()">
          <label class="tool-title">Saturation</label>
          <input type="range" id="saturation" min="0" max="200" value="100" onchange="adjustImage()">
        </div>
        <div class="tool-group">
          <div class="tool-title"><i class="fa-solid fa-crop-simple"></i> Transform</div>
          <button class="tool-btn" onclick="rotateImage(-90)"><i class="fa-solid fa-rotate-left"></i> Rotate -90°</button>
          <button class="tool-btn" onclick="rotateImage(90)"><i class="fa-solid fa-rotate-right"></i> Rotate +90°</button>
          <button class="tool-btn" onclick="flipImage('h')"><i class="fa-solid fa-left-right"></i> Flip Horizontal</button>
          <button class="tool-btn" onclick="flipImage('v')"><i class="fa-solid fa-up-down"></i> Flip Vertical</button>
          <button class="tool-btn" onclick="resizeCanvas()"><i class="fa-solid fa-minimize"></i> Resize Canvas</button>
        </div>
        <div class="tool-group">
          <div class="tool-title"><i class="fa-solid fa-font"></i> Text & Draw</div>
          <input type="text" class="input-field" id="textInput" placeholder="Teks...">
          <input type="color" class="color-picker" id="textColor" value="#00e5ff">
          <input type="number" class="input-field" id="textSize" placeholder="Ukuran (px)" value="40">
          <button class="tool-btn" onclick="addText()"><i class="fa-solid fa-plus"></i> Tambah Teks</button>
          <button class="tool-btn" onclick="startDrawing()"><i class="fa-solid fa-pencil"></i> Draw Mode</button>
        </div>
        <div class="tool-group">
          <div class="tool-title"><i class="fa-solid fa-layer-group"></i> Combine</div>
          <button class="tool-btn" onclick="combinePhotos('h')"><i class="fa-solid fa-left-right"></i> Gabung Horizontal</button>
          <button class="tool-btn" onclick="combinePhotos('v')"><i class="fa-solid fa-up-down"></i> Gabung Vertikal</button>
          <button class="tool-btn" onclick="addFrame()"><i class="fa-solid fa-border-all"></i> Tambah Frame</button>
          <button class="tool-btn" onclick="addWatermark()"><i class="fa-solid fa-copyright"></i> Watermark</button>
        </div>
      </div>
      <div class="action-buttons">
        <button class="btn btn-primary" onclick="downloadImage()"><i class="fa-solid fa-download"></i> Download Foto</button>
        <button class="btn btn-secondary" onclick="undoAction()"><i class="fa-solid fa-rotate-left"></i> Undo</button>
        <button class="btn btn-danger" onclick="clearCanvas()"><i class="fa-solid fa-trash"></i> Clear</button>
      </div>
    </div>
  </section>
</div>

<!-- Modal -->
<div class="modal-backdrop" id="imageModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 class="modal-title" id="modalTitle">Foto Detail</h3>
      <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body">
      <img src="" alt="" id="modalImage">
      <div class="modal-actions">
        <button class="btn btn-primary" onclick="copyImage()"><i class="fa-solid fa-copy"></i> Copy Foto</button>
        <button class="btn btn-secondary" onclick="downloadModalImage()"><i class="fa-solid fa-download"></i> Download</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"><i class="fa-solid fa-bolt"></i><span id="toastText">Berhasil!</span></div>

<script>
let allPhotos = [];
let currentImageUrl = '';
let currentImageTitle = '';
let canvas = document.getElementById('mainCanvas');
let ctx = canvas ? canvas.getContext('2d') : null;
let currentEditorImage = null;
let history = [];
let isDrawing = false;

document.addEventListener('DOMContentLoaded', () => {
  createParticles();
  if (document.getElementById('gallery')) fetchPhotosFromSheet();
  initCanvas();
  initUploadDragDrop();
  moveIndicator(document.querySelector('.nav-tab.active'));
});
window.addEventListener('load', () => moveIndicator(document.querySelector('.nav-tab.active')));
window.addEventListener('resize', () => moveIndicator(document.querySelector('.nav-tab.active')));

/* Indikator tab geser */
function moveIndicator(tab){
  const ind = document.querySelector('.tab-indicator');
  if(!ind || !tab) return;
  ind.style.width = tab.offsetWidth + 'px';
  ind.style.transform = 'translateX(' + tab.offsetLeft + 'px)';
}

/* Efek riak (delegasi, berlaku juga untuk elemen dinamis) */
document.addEventListener('click', function(e){
  const el = e.target.closest('.btn,.action-btn-cool,.nav-tab,.tool-btn');
  if(!el) return;
  const r = document.createElement('span'); r.className = 'ripple';
  const rect = el.getBoundingClientRect();
  r.style.left = (e.clientX - rect.left) + 'px';
  r.style.top = (e.clientY - rect.top) + 'px';
  el.appendChild(r); setTimeout(() => r.remove(), 650);
});

/* Drag & drop upload */
function initUploadDragDrop(){
  const area = document.querySelector('.upload-area');
  if(!area) return;
  ['dragenter','dragover'].forEach(ev => area.addEventListener(ev, e => { e.preventDefault(); area.classList.add('dragover'); }));
  ['dragleave','drop'].forEach(ev => area.addEventListener(ev, e => { e.preventDefault(); area.classList.remove('dragover'); }));
  area.addEventListener('drop', e => {
    const files = e.dataTransfer.files;
    if(files.length){ document.getElementById('fileInput').files = files; handleFiles({ target:{ files } }); }
  });
}

function createParticles() {
  const container = document.getElementById('particles');
  if (!container) return;
  for(let i = 0; i < 40; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDelay = Math.random() * 22 + 's';
    p.style.animationDuration = (16 + Math.random() * 18) + 's';
    container.appendChild(p);
  }
}

function showSection(sectionId, tabEl) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById(sectionId).classList.add('active');
  const tab = tabEl || (window.event && window.event.target ? window.event.target.closest('.nav-tab') : document.querySelector('.nav-tab'));
  if(tab){ tab.classList.add('active'); moveIndicator(tab); }
}

async function fetchPhotosFromSheet() {
  document.getElementById('loading').classList.add('active');
  document.getElementById('galleryGrid').innerHTML = '';
  try {
    const sheetId = '1z5FYVvB0E9BeE3cRbl4id1YWi6lRB_2qzMhIvgz4Xx0';
    const gid = '1246502038';
    try {
      const gvizUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&gid=${gid}&range=C2:D150`;
      const response = await fetch(gvizUrl);
      const text = await response.text();
      const json = JSON.parse(text.substring(47).slice(0, -2));
      const rows = json.table.rows;
      allPhotos = [];
      rows.forEach((row, index) => {
        const c = row.c;
        if (!c) return;
        const judul = c[0] ? (c[0].v || '') : '';
        const foto = c[1] ? (c[1].v || '') : '';
        if (judul && foto) allPhotos.push({ judul, foto, index: index + 2 });
      });
    } catch (e) {
      console.log('GVIZ failed, trying CSV...', e);
      const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=${gid}&range=C2:D150`;
      const csvResponse = await fetch(csvUrl);
      const csvText = await csvResponse.text();
      const csvRows = csvText.split('\n').map(row => row.split(','));
      allPhotos = [];
      csvRows.forEach((row, index) => {
        if (row.length < 2) return;
        const judul = row[0] ? row[0].replace(/"/g, '').trim() : '';
        const foto = row[1] ? row[1].replace(/"/g, '').trim() : '';
        if (judul && foto) allPhotos.push({ judul, foto, index: index + 2 });
      });
    }
    renderGallery(allPhotos);
    showToast(`⚡ Berhasil memuat ${allPhotos.length} foto`);
  } catch (error) {
    console.error('Error fetching photos:', error);
    showToast('❗ Gagal mengambil data dari Google Sheets');
    document.getElementById('galleryGrid').innerHTML = `
      <div class="no-results" style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted);">
        <i class="fa-solid fa-triangle-exclamation" style="font-size:42px;color:var(--coral);margin-bottom:14px;"></i>
        <h3>Gagal Memuat Foto</h3>
        <p>Pastikan Google Sheets sudah dipublikasikan</p>
      </div>`;
  }
  document.getElementById('loading').classList.remove('active');
}

function renderGallery(photos) {
  const grid = document.getElementById('galleryGrid');
  grid.innerHTML = '';
  if (photos.length === 0) {
    grid.innerHTML = `
      <div class="no-results" style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted);">
        <i class="fa-solid fa-magnifying-glass" style="font-size:42px;margin-bottom:14px;opacity:.5;"></i>
        <h3>Tidak Ada Foto</h3>
        <p>Tidak ada foto yang sesuai dengan pencarian</p>
      </div>`;
    return;
  }
  photos.forEach((photo, idx) => grid.appendChild(createPhotoCard(photo.foto, photo.judul, idx)));
}

function createPhotoCard(url, title, index) {
  const card = document.createElement('div');
  card.className = 'photo-card';
  card.innerHTML = `
    <div class="photo-wrapper">
      <img src="${url}" alt="${title}" onerror="this.src='https://via.placeholder.com/400x300/0a1a2f/00e5ff?text=No+Image'" loading="lazy" onclick="viewFullImage('${url}', '${title.replace(/'/g, "\\'")}')" style="cursor:pointer;">
    </div>
    <div class="photo-info">
      <div class="photo-title">${title}</div>
      <div class="photo-meta">FOTO #${index + 1}</div>
      <div class="action-buttons-row">
        <button class="action-btn-cool copy-btn" onclick="copyPhoto('${url}')" title="Copy Foto"><i class="fa-solid fa-copy"></i><span>Copy</span></button>
        <button class="action-btn-cool download-btn" onclick="downloadPhoto('${url}', '${title.replace(/'/g, "\\'")}')" title="Download"><i class="fa-solid fa-download"></i><span>Download</span></button>
        <button class="action-btn-cool edit-btn" onclick="editImageFromUrl('${url}')" title="Edit"><i class="fa-solid fa-pen-to-square"></i><span>Edit</span></button>
      </div>
    </div>`;
  return card;
}

function searchPhotos() {
  const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
  if (!searchTerm) { renderGallery(allPhotos); return; }
  const filtered = allPhotos.filter(photo => photo.judul.toLowerCase().includes(searchTerm));
  renderGallery(filtered);
  if (filtered.length > 0) showToast(`⚡ Ditemukan ${filtered.length} foto`);
}

function viewFullImage(url, title) {
  currentImageUrl = url; currentImageTitle = title;
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalImage').src = url;
  document.getElementById('imageModal').classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('imageModal').classList.remove('active');
  document.body.style.overflow = '';
  currentImageUrl = ''; currentImageTitle = '';
}

async function copyPhoto(url) {
  try {
    const response = await fetch(url);
    const blob = await response.blob();
    await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
    showToast('✅ Foto berhasil disalin ke clipboard!');
  } catch (error) {
    console.error('Copy error:', error);
    showToast('❗ Buka foto lalu klik kanan > Copy Image');
  }
}
async function copyImage() { if (currentImageUrl) await copyPhoto(currentImageUrl); }

function downloadPhoto(url, filename) {
  const link = document.createElement('a');
  link.href = url;
  link.download = `${filename.replace(/[^a-z0-9]/gi, '_').toLowerCase()}_${Date.now()}.jpg`;
  link.target = '_blank';
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  showToast('⚡ Download dimulai...');
}
function downloadModalImage() { if (currentImageUrl && currentImageTitle) downloadPhoto(currentImageUrl, currentImageTitle); }

function initCanvas() {
  if (!canvas || !ctx) return;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.font = '20px "Exo 2"';
  ctx.fillStyle = '#7fa8c4';
  ctx.textAlign = 'center';
  ctx.fillText('Upload foto untuk mulai mengedit', canvas.width/2, canvas.height/2);
}

function handleFiles(event) {
  const files = event.target.files;
  if (files.length === 0) return;
  loadImage(files[0]);
  if (files.length > 1) {
    setTimeout(() => {
      if (confirm(`Load ${files.length} foto? Klik OK untuk combine, Cancel untuk load satu per satu.`)) combineMultipleFiles(files);
    }, 500);
  }
}

function loadImage(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      currentEditorImage = img;
      saveHistory();
      canvas.width = img.width; canvas.height = img.height;
      ctx.drawImage(img, 0, 0);
      showToast('✅ Foto berhasil dimuat');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function combineMultipleFiles(files) {
  const images = []; let loaded = 0;
  Array.from(files).forEach(file => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => { images.push(img); loaded++; if (loaded === files.length) combineImages(images); };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function combineImages(images) {
  const totalWidth = images.reduce((sum, img) => sum + img.width, 0);
  const maxHeight = Math.max(...images.map(img => img.height));
  canvas.width = totalWidth; canvas.height = maxHeight;
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  let x = 0;
  images.forEach(img => { ctx.drawImage(img, x, 0); x += img.width; });
  saveHistory();
  showToast(`✅ ${images.length} foto digabungkan`);
}

function applyFilter(filterType) {
  if (!currentEditorImage) { showToast('⚠️ Upload foto terlebih dahulu'); return; }
  saveHistory();
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imageData.data;
  switch(filterType) {
    case 'grayscale':
      for (let i = 0; i < data.length; i += 4) { const avg = (data[i]+data[i+1]+data[i+2])/3; data[i]=data[i+1]=data[i+2]=avg; }
      break;
    case 'sepia':
      for (let i = 0; i < data.length; i += 4) {
        const r=data[i],g=data[i+1],b=data[i+2];
        data[i]=Math.min(255,(r*.393)+(g*.769)+(b*.189));
        data[i+1]=Math.min(255,(r*.349)+(g*.686)+(b*.168));
        data[i+2]=Math.min(255,(r*.272)+(g*.534)+(b*.131));
      }
      break;
    case 'invert':
      for (let i = 0; i < data.length; i += 4) { data[i]=255-data[i]; data[i+1]=255-data[i+1]; data[i+2]=255-data[i+2]; }
      break;
    case 'blur':
      ctx.filter = 'blur(5px)'; ctx.drawImage(canvas, 0, 0); ctx.filter = 'none';
      break;
  }
  if (filterType !== 'blur') ctx.putImageData(imageData, 0, 0);
  showToast(`✅ Filter ${filterType} diterapkan`);
}

function adjustImage() {
  if (!currentEditorImage) return;
  const brightness = document.getElementById('brightness').value;
  const contrast = document.getElementById('contrast').value;
  const saturation = document.getElementById('saturation').value;
  ctx.filter = `brightness(${brightness}%) contrast(${contrast}%) saturate(${saturation}%)`;
  ctx.drawImage(currentEditorImage, 0, 0, canvas.width, canvas.height);
  ctx.filter = 'none';
}

function rotateImage(degrees) {
  if (!currentEditorImage) return;
  saveHistory();
  const tempCanvas = document.createElement('canvas');
  const tempCtx = tempCanvas.getContext('2d');
  if (degrees === 90 || degrees === -90) { tempCanvas.width = canvas.height; tempCanvas.height = canvas.width; }
  else { tempCanvas.width = canvas.width; tempCanvas.height = canvas.height; }
  tempCtx.translate(tempCanvas.width/2, tempCanvas.height/2);
  tempCtx.rotate(degrees * Math.PI/180);
  tempCtx.drawImage(canvas, -canvas.width/2, -canvas.height/2);
  canvas.width = tempCanvas.width; canvas.height = tempCanvas.height;
  ctx.drawImage(tempCanvas, 0, 0);
}

function flipImage(direction) {
  if (!currentEditorImage) return;
  saveHistory();
  const tempCanvas = document.createElement('canvas');
  const tempCtx = tempCanvas.getContext('2d');
  tempCanvas.width = canvas.width; tempCanvas.height = canvas.height;
  if (direction === 'h') { tempCtx.translate(canvas.width, 0); tempCtx.scale(-1, 1); }
  else { tempCtx.translate(0, canvas.height); tempCtx.scale(1, -1); }
  tempCtx.drawImage(canvas, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(tempCanvas, 0, 0);
}

function resizeCanvas() {
  const width = prompt('Lebar baru (px):', canvas.width);
  const height = prompt('Tinggi baru (px):', canvas.height);
  if (width && height) {
    saveHistory();
    const tempCanvas = document.createElement('canvas');
    const tempCtx = tempCanvas.getContext('2d');
    tempCanvas.width = canvas.width; tempCanvas.height = canvas.height;
    tempCtx.drawImage(canvas, 0, 0);
    canvas.width = parseInt(width); canvas.height = parseInt(height);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(tempCanvas, 0, 0);
  }
}

function addText() {
  const text = document.getElementById('textInput').value;
  const color = document.getElementById('textColor').value;
  const size = document.getElementById('textSize').value;
  if (!text) { showToast('⚠️ Masukkan teks terlebih dahulu'); return; }
  saveHistory();
  ctx.font = `${size}px Orbitron`;
  ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 10;
  ctx.fillText(text, canvas.width/2, canvas.height/2);
  ctx.shadowBlur = 0;
  showToast('✅ Teks ditambahkan');
}

function startDrawing() {
  isDrawing = !isDrawing;
  if (isDrawing) {
    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDraw);
    showToast('✏️ Mode gambar aktif - Klik & drag untuk menggambar');
  } else {
    canvas.removeEventListener('mousedown', startDraw);
    canvas.removeEventListener('mousemove', draw);
    canvas.removeEventListener('mouseup', stopDraw);
    showToast('Mode gambar nonaktif');
  }
}
function startDraw(e) {
  isDrawing = true;
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (canvas.width / rect.width);
  const y = (e.clientY - rect.top) * (canvas.height / rect.height);
  ctx.beginPath(); ctx.moveTo(x, y);
  ctx.strokeStyle = document.getElementById('textColor').value;
  ctx.lineWidth = 3; ctx.lineCap = 'round';
}
function draw(e) {
  if (!isDrawing) return;
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (canvas.width / rect.width);
  const y = (e.clientY - rect.top) * (canvas.height / rect.height);
  ctx.lineTo(x, y); ctx.stroke();
}
function stopDraw() { isDrawing = false; saveHistory(); }

function combinePhotos(direction) {
  const input = document.createElement('input');
  input.type = 'file'; input.multiple = true; input.accept = 'image/*';
  input.onchange = (e) => {
    const files = e.target.files;
    if (files.length < 2) { showToast('⚠️ Pilih minimal 2 foto'); return; }
    combineMultipleFiles(files);
  };
  input.click();
}

function addFrame() {
  saveHistory();
  ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 20;
  ctx.strokeRect(0, 0, canvas.width, canvas.height);
  showToast('✅ Frame ditambahkan');
}

function addWatermark() {
  saveHistory();
  ctx.font = 'bold 30px Orbitron';
  ctx.fillStyle = 'rgba(0, 229, 255, 0.3)';
  ctx.textAlign = 'right';
  ctx.fillText('LINE TOGEL', canvas.width - 20, canvas.height - 20);
  showToast('✅ Watermark ditambahkan');
}

function saveHistory() {
  if (!canvas) return;
  history.push(canvas.toDataURL());
  if (history.length > 10) history.shift();
}

function undoAction() {
  if (history.length > 1) {
    history.pop();
    const previous = history[history.length - 1];
    const img = new Image();
    img.onload = () => { canvas.width = img.width; canvas.height = img.height; ctx.drawImage(img, 0, 0); };
    img.src = previous;
    showToast('↩️ Undo');
  }
}

function clearCanvas() {
  if (confirm('Hapus semua?')) {
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    currentEditorImage = null; history = [];
    showToast('🗑️ Canvas dibersihkan');
  }
}

function downloadImage() {
  const link = document.createElement('a');
  link.download = `edited-photo-${Date.now()}.png`;
  link.href = canvas.toDataURL();
  link.click();
  showToast('⚡ Foto didownload');
}

function editImageFromUrl(url) {
  const tabs = document.querySelectorAll('.nav-tab');
  showSection('editor', tabs[1]);
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    currentEditorImage = img;
    canvas.width = img.width; canvas.height = img.height;
    ctx.drawImage(img, 0, 0);
    saveHistory();
    showToast('✅ Foto dimuat ke editor');
  };
  img.src = url;
}

function showToast(message) {
  const toast = document.getElementById('toast');
  document.getElementById('toastText').textContent = message;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

document.getElementById('imageModal').addEventListener('click', (e) => { if (e.target.id === 'imageModal') closeModal(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
  if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undoAction(); }
});
</script>
</body>
</html>
