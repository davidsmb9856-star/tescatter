<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6fa3cf">
<title>🕊️ KENDALA ALL - LINE TOGEL · Dove Blue</title>

<!-- ✅ Google Fonts - SAMA PERSIS dengan ScriptVault Dove Blue -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* ============================================================ */
/* 🕊️ DOVE BLUE THEME - SAMA DENGAN ScriptVault               */
/* ============================================================ */
:root {
  --bg-primary: #0f1d2b;
  --bg-secondary: #132434;
  --bg-tertiary: #1a2f42;
  --bg-card: #1a2f42;
  --bg-input: rgba(0, 0, 0, 0.35);
  --bg-hover: #27455f;
  --field-bg: rgba(0, 0, 0, 0.35);
  --code-bg: rgba(0, 0, 0, 0.4);
  --overlay-bg: rgba(2, 4, 8, 0.88);

  --neon-cyan: #6fa3cf;
  --neon-blue: #8fbce0;
  --neon-purple: #aacfeb;
  --neon-pink: #ef5350;
  --neon-green: #34d399;
  --neon-yellow: #f0a830;
  --neon-red: #ef5350;

  --text-primary: #e8f0f8;
  --text-secondary: #9fb2c4;
  --text-tertiary: #7f96ab;
  --text-muted: #5a7186;

  --border-subtle: rgba(255, 255, 255, 0.06);
  --border-normal: rgba(255, 255, 255, 0.12);
  --border-strong: rgba(255, 255, 255, 0.2);
  --border-color: rgba(111, 163, 207, 0.3);
  --border-glow: rgba(111, 163, 207, 0.5);
  --neon-glow: rgba(111, 163, 207, 0.4);

  --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.4);
  --shadow-md: 0 6px 18px rgba(0, 0, 0, 0.5);
  --shadow-lg: 0 14px 40px rgba(0, 0, 0, 0.6);
  --shadow-glow: 0 0 18px rgba(111, 163, 207, 0.25);

  --radius-sm: 8px;
  --radius-md: 11px;
  --radius-lg: 14px;
  --radius-xl: 18px;

  --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-bounce: 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ========== BACKGROUND EFFECTS ========== */
.bg-animated {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  background:
    radial-gradient(ellipse at 8% -8%, rgba(111, 163, 207, 0.14) 0%, transparent 55%),
    radial-gradient(ellipse at 108% 6%, rgba(170, 207, 235, 0.12) 0%, transparent 50%),
    linear-gradient(180deg, var(--bg-primary), var(--bg-secondary));
}

.bg-grid {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  background-image:
    linear-gradient(rgba(111, 163, 207, 0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(111, 163, 207, 0.025) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black 30%, transparent 75%);
  animation: gridMove 30s linear infinite;
}

@keyframes gridMove {
  0% { transform: translate(0, 0); }
  100% { transform: translate(44px, 44px); }
}

.particle {
  position: fixed;
  width: 4px;
  height: 4px;
  background: var(--neon-cyan);
  border-radius: 50%;
  pointer-events: none;
  z-index: -1;
  box-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-blue);
  animation: floatParticle 15s infinite linear;
  opacity: 0.5;
}

@keyframes floatParticle {
  0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
  10% { opacity: 0.5; }
  90% { opacity: 0.5; }
  100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
}

.scan-line {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(111, 163, 207, 0.4), transparent);
  opacity: 0.4;
  animation: scanDown 9s linear infinite;
  z-index: 1;
  pointer-events: none;
  filter: blur(1px);
}

@keyframes scanDown {
  0% { top: -2px; opacity: 0; }
  5% { opacity: 0.4; }
  95% { opacity: 0.4; }
  100% { top: 100%; opacity: 0; }
}

/* ========== CONTAINER ========== */
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 28px 20px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 2;
}

/* ========== HEADER ========== */
.header {
  text-align: center;
  margin-bottom: 32px;
  padding: 20px 16px;
  position: relative;
  animation: headerEntrance 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
}

@keyframes headerEntrance {
  from { opacity: 0; transform: translateY(-30px); }
  to { opacity: 1; transform: translateY(0); }
}

.header::before {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 80%;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-blue), var(--neon-cyan), transparent);
  animation: glowLine 3.5s ease-in-out infinite;
  box-shadow: 0 0 15px var(--border-glow);
}

@keyframes glowLine {
  0%, 100% { opacity: 0.7; }
  50% { opacity: 1; box-shadow: 0 0 25px var(--border-glow); }
}

.back-btn {
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  background: var(--field-bg);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  color: var(--neon-cyan);
  padding: 9px 16px;
  text-decoration: none;
  font-weight: 600;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 7px;
  transition: var(--transition);
  backdrop-filter: blur(12px);
  font-family: 'Space Grotesk', sans-serif;
  letter-spacing: 0.5px;
}

.back-btn:hover {
  background: rgba(111, 163, 207, 0.16);
  border-color: var(--neon-cyan);
  transform: translateY(-50%) translateX(-3px);
  box-shadow: var(--shadow-glow);
}

.theme-toggle {
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 40px;
  height: 40px;
  background: var(--field-bg);
  border: 1px solid var(--border-color);
  color: var(--neon-cyan);
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: grid;
  place-items: center;
  font-size: 16px;
  transition: var(--transition);
  backdrop-filter: blur(12px);
}

.theme-toggle:hover {
  background: rgba(111, 163, 207, 0.16);
  border-color: var(--neon-cyan);
  transform: translateY(-50%) scale(1.06);
  box-shadow: var(--shadow-glow);
}

.judul-glow {
  font-family: 'Space Grotesk', sans-serif;
  font-size: clamp(1.8rem, 5vw, 2.8rem);
  font-weight: 700;
  text-align: center;
  letter-spacing: 3px;
  margin-bottom: 10px;
  background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue), var(--text-primary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-transform: uppercase;
}

.bonus-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: clamp(1.2rem, 3vw, 1.6rem);
  font-weight: 700;
  text-align: center;
  color: var(--neon-blue);
  letter-spacing: 2px;
  margin-bottom: 20px;
}

.subtitle {
  font-size: 12px;
  color: var(--text-secondary);
  text-align: center;
  margin-bottom: 16px;
  font-weight: 500;
  font-family: 'Space Grotesk', sans-serif;
  letter-spacing: 3px;
  text-transform: uppercase;
}

.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(52, 211, 153, 0.08);
  border: 1px solid rgba(52, 211, 153, 0.3);
  padding: 6px 16px;
  border-radius: 100px;
  font-size: 10px;
  color: var(--neon-green);
  margin-top: 13px;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.status-dot {
  width: 7px;
  height: 7px;
  background: var(--neon-green);
  border-radius: 50%;
  animation: pulse 2.5s infinite;
  box-shadow: 0 0 8px var(--neon-green);
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ========== SEARCH SECTION ========== */
.search-section {
  margin: 22px 0 28px;
  text-align: center;
}

.search-bar {
  position: relative;
  max-width: 600px;
  margin: 0 auto 16px;
}

.search-bar .bonus-input {
  width: 100%;
  padding: 13px 18px 13px 48px;
  background: var(--field-bg);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  color: var(--text-primary);
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  transition: var(--transition);
}

.search-bar .bonus-input::placeholder { color: var(--text-muted); }

.search-bar .bonus-input:focus {
  outline: none;
  border-color: var(--neon-cyan);
  background: rgba(111, 163, 207, 0.08);
  box-shadow: 0 0 0 3px rgba(111, 163, 207, 0.1);
}

.search-bar i {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 14px;
}

.stats-bar {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  max-width: 800px;
  margin: 0 auto;
}

.stat-item {
  flex: 1;
  min-width: 140px;
  background: linear-gradient(135deg, var(--bg-tertiary), var(--bg-secondary));
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 14px 18px;
  text-align: center;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}

.stat-item::before {
  content: '';
  position: absolute;
  top: -40px;
  right: -40px;
  width: 110px;
  height: 110px;
  border-radius: 50%;
  filter: blur(50px);
  opacity: 0.16;
  transition: opacity 0.4s;
}

.stat-item:nth-child(1)::before { background: var(--neon-cyan); }
.stat-item:nth-child(2)::before { background: var(--neon-blue); }
.stat-item:nth-child(3)::before { background: var(--neon-purple); }

.stat-item:hover {
  border-color: rgba(111, 163, 207, 0.3);
  transform: translateY(-3px);
  box-shadow: var(--shadow-glow);
}

.stat-item:hover::before { opacity: 0.3; }

.stat-value {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.03em;
  background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue), var(--text-primary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  display: block;
  line-height: 1.1;
}

.stat-label {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 9px;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-top: 6px;
  font-weight: 700;
}

/* ========== KENDALA CARDS ========== */
.kendala-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.kendala-card {
  background: linear-gradient(135deg, var(--bg-tertiary), var(--bg-secondary));
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 20px;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(12px);
  animation: fadeInUp 0.5s ease-out;
  box-shadow: var(--shadow-sm);
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.kendala-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 3px;
  height: 100%;
  background: linear-gradient(180deg, var(--neon-cyan), var(--neon-blue));
  border-radius: 3px 0 0 3px;
  box-shadow: 0 0 8px var(--border-glow);
  transition: width 0.3s ease;
}

.kendala-card::after {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(120deg, transparent, rgba(111, 163, 207, 0.08), transparent);
  transition: left 0.6s ease;
  z-index: 1;
  pointer-events: none;
}

.kendala-card:hover::after { left: 100%; }

.kendala-card:hover {
  border-color: rgba(111, 163, 207, 0.3);
  transform: translateY(-2px);
  box-shadow: var(--shadow-glow);
}

.kendala-card.expanded::before {
  width: 5px;
}

.kendala-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--neon-cyan);
  margin-bottom: 12px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border-subtle);
  transition: color 0.3s ease;
  letter-spacing: 0.8px;
  position: relative;
  z-index: 2;
}

.kendala-title:hover {
  color: var(--neon-blue);
}

.kendala-title::after {
  content: '\f107';
  font-family: 'Font Awesome 6 Free';
  font-weight: 900;
  font-size: 12px;
  transition: transform 0.3s ease;
  color: var(--neon-cyan);
  padding: 4px 8px;
  background: rgba(111, 163, 207, 0.1);
  border: 1px solid rgba(111, 163, 207, 0.3);
  border-radius: 5px;
}

.kendala-card.expanded .kendala-title::after {
  transform: rotate(180deg);
  background: rgba(111, 163, 207, 0.2);
}

/* ========== PHOTO & ANSWER SECTIONS ========== */
.title-photo-section {
  display: none;
  margin: 14px 0;
  padding: 14px;
  background: var(--field-bg);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  text-align: center;
  position: relative;
  z-index: 2;
}

.kendala-card.expanded .title-photo-section { display: block; }

.title-photo-img {
  max-width: 100%;
  max-height: 300px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
  cursor: pointer;
  transition: var(--transition);
}

.title-photo-img:hover {
  border-color: var(--neon-cyan);
  box-shadow: var(--shadow-glow);
}

.title-photo-actions {
  margin-top: 12px;
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
}

.copy-title-photo-btn, .view-title-photo-btn {
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: 11px;
  padding: 8px 14px;
  background: var(--field-bg);
  border: 1px solid var(--border-normal);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  cursor: pointer;
  transition: var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.copy-title-photo-btn:hover, .view-title-photo-btn:hover {
  background: rgba(111, 163, 207, 0.1);
  border-color: var(--neon-cyan);
  color: var(--neon-cyan);
  transform: translateY(-2px);
  box-shadow: var(--shadow-glow);
}

.kendala-answers {
  display: none;
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--border-subtle);
  position: relative;
  z-index: 2;
}

.kendala-card.expanded .kendala-answers { display: block; }

.answer-item {
  margin-bottom: 14px;
  padding: 14px 16px;
  background: var(--field-bg);
  border-radius: var(--radius-md);
  border-left: 3px solid var(--neon-cyan);
  transition: var(--transition);
}

.answer-item:hover {
  background: rgba(111, 163, 207, 0.08);
  border-left-color: var(--neon-blue);
}

.answer-label {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  color: var(--neon-cyan);
  margin-bottom: 8px;
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 6px;
}

.answer-label::before {
  content: '';
  width: 6px;
  height: 6px;
  background: var(--neon-cyan);
  border-radius: 50%;
  box-shadow: 0 0 6px var(--neon-cyan);
}

.answer-content {
  color: var(--text-primary);
  line-height: 1.65;
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 13px;
  font-family: 'Inter', sans-serif;
}

.answer-content a {
  color: var(--neon-cyan);
  text-decoration: none;
  font-weight: 600;
  padding: 1px 5px;
  background: rgba(111, 163, 207, 0.1);
  border-radius: 3px;
  transition: var(--transition);
}

.answer-content a:hover {
  color: #fff;
  background: rgba(111, 163, 207, 0.25);
  text-decoration: none;
}

.photo-container {
  margin: 14px 0;
  text-align: center;
  padding: 12px;
  background: var(--field-bg);
  border-radius: var(--radius-md);
  border: 1px dashed var(--border-normal);
}

.photo-img {
  max-width: 100%;
  max-height: 280px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
  cursor: pointer;
  transition: var(--transition);
}

.photo-img:hover {
  border-color: var(--neon-cyan);
  box-shadow: var(--shadow-glow);
}

.link-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
  align-items: center;
}

.open-link-btn {
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: 11px;
  padding: 8px 14px;
  background: var(--field-bg);
  border: 1px solid var(--border-normal);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  cursor: pointer;
  transition: var(--transition);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.open-link-btn:hover {
  background: rgba(111, 163, 207, 0.1);
  border-color: var(--neon-cyan);
  color: var(--neon-cyan);
  transform: translateY(-2px);
  box-shadow: var(--shadow-glow);
}

.open-all-links-btn {
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: 11px;
  padding: 8px 16px;
  background: linear-gradient(135deg, rgba(170, 207, 235, 0.15) 0%, rgba(111, 163, 207, 0.08) 100%);
  border: 1px solid rgba(170, 207, 235, 0.4);
  border-radius: var(--radius-sm);
  color: var(--neon-purple);
  cursor: pointer;
  transition: var(--transition);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-left: auto;
  position: relative;
  overflow: hidden;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.open-all-links-btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(170, 207, 235, 0.3), transparent);
  transition: left 0.5s ease;
}

.open-all-links-btn:hover::before { left: 100%; }

.open-all-links-btn:hover {
  background: linear-gradient(135deg, rgba(170, 207, 235, 0.25) 0%, rgba(111, 163, 207, 0.15) 100%);
  border-color: var(--neon-purple);
  color: var(--text-primary);
  transform: translateY(-2px);
  box-shadow: 0 0 20px rgba(170, 207, 235, 0.3);
}

.open-all-links-btn .link-count {
  background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  padding: 2px 7px;
  border-radius: 20px;
  margin-left: 3px;
  box-shadow: var(--shadow-sm);
}

/* ========== BUTTONS ========== */
.copy-btn, .sticky-btn {
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 11px;
  padding: 9px 16px;
  background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue));
  border: none;
  border-radius: var(--radius-sm);
  color: #fff;
  cursor: pointer;
  transition: var(--transition);
  letter-spacing: 0.8px;
  margin-top: 11px;
  margin-right: 7px;
  text-transform: uppercase;
  box-shadow: var(--shadow-sm);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.copy-btn:hover, .sticky-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 20px rgba(111, 163, 207, 0.4);
}

const SHEET_ID = '1z5FYVvB0E9BeE3cRbl4id1YWi6lRB_2qzMhIvgz4Xx0';

const RANGE = 'C2:F300';

let allKendala = [];

// ================= THEME TOGGLE =================
function applyTheme(light) {
  document.documentElement.classList.toggle('light', light);
  const b = document.getElementById('themeBtn');
  if (b) b.textContent = light ? '☀️' : '🌙';
  try { localStorage.setItem('kendala_theme', light ? '1' : '0'); } catch(e) {}
}
function toggleTheme() {
  applyTheme(!document.documentElement.classList.contains('light'));
}
try {
  const saved = localStorage.getItem('kendala_theme');
  if (saved === '1') applyTheme(true);
} catch(e) {}

// ================= PARTICLES =================
function createParticles() {
  const container = document.getElementById('particles');
  if (!container) return;
  container.innerHTML = '';
  for (let i = 0; i < 15; i++) {
    const particle = document.createElement('div');
    particle.className = 'particle';
    particle.style.left = Math.random() * 100 + '%';
    particle.style.animationDelay = Math.random() * 15 + 's';
    particle.style.animationDuration = (15 + Math.random() * 10) + 's';
    container.appendChild(particle);
  }
}

// ================= TOAST =================
function showToast(message, type = 'success') {
  const toast = document.getElementById('toast');
  if (!toast) return;
  toast.className = 'toast ' + type;
  const iconMap = {
    success: 'fas fa-check-circle',
    error: 'fas fa-times-circle',
    info: 'fas fa-info-circle'
  };
  toast.innerHTML = `<span class="icon"><i class="${iconMap[type] || iconMap.info}"></i></span><span>${message}</span>`;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

// ================= DATA LOADING =================
async function loadKendalaData() {
  try {
    const response = await fetch(DATA_URL);
    const text = await response.text();
    const jsonMatch = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);?/);
    if (!jsonMatch) throw new Error('Gagal parse');
    const data = JSON.parse(jsonMatch[1]);
    const rows = data.table?.rows || [];
    
    allKendala = rows.map(row => {
      const cells = row.c || [];
      return {
        judul: cells[0]?.v?.toString().trim() || '',
        jawaban1: cells[1]?.v?.toString().trim() || '',
        jawaban2: cells[2]?.v?.toString().trim() || '',
        jawaban3: cells[3]?.v?.toString().trim() || ''
      };
    }).filter(item => item.judul && item.judul !== '');
    
    filteredKendala = [...allKendala];
    renderKendala();
    updateStats();
    showToast(`✅ ${allKendala.length} kendala berhasil dimuat`, 'success');
  } catch (error) {
    document.getElementById('kendalaContainer').innerHTML = `
      <div class="error-msg">
        <i class="fas fa-exclamation-triangle" style="font-size: 40px; margin-bottom: 15px; color: var(--neon-red);"></i>
        <p style="font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 700; margin-bottom: 8px; color: var(--text-primary);">⚠️ Gagal Memuat Data</p>
        <p style="font-size: 12px; margin-top: 10px; color: var(--text-secondary);">Pastikan Google Sheet sudah dipublikasikan</p>
        <p style="font-size: 11px; margin-top: 12px; opacity: 0.7; color: var(--text-tertiary); font-family: 'JetBrains Mono', monospace;">${error.message}</p>
      </div>`;
    showToast('❌ Gagal memuat data', 'error');
  }
}

function renderKendala(data = filteredKendala) {
  const container = document.getElementById('kendalaContainer');
  if (data.length === 0) {
    container.innerHTML = '<div class="no-data"><i class="fas fa-inbox" style="font-size: 48px; opacity: 0.3; display: block; margin-bottom: 14px;"></i><p>Tidak ada data ditemukan</p></div>';
    return;
  }
  container.innerHTML = `<div class="kendala-list">${data.map((item, index) => createKendalaCard(item, index)).join('')}</div>`;
  
  document.querySelectorAll('.kendala-title').forEach(title => {
    title.addEventListener('click', function() {
      this.parentElement.classList.toggle('expanded');
    });
  });
}

function createKendalaCard(item, index) {
  const titlePhoto = extractTitlePhoto(item.judul);
  const cleanJudul = titlePhoto ? item.judul.replace(titlePhoto.url, '').trim() : item.judul;
  const hasPhoto = detectPhotoLink(item);
  const links1 = extractLinks(item.jawaban1);
  const links2 = extractLinks(item.jawaban2);
  const links3 = extractLinks(item.jawaban3);
  
  return `
    <div class="kendala-card" data-index="${index}">
      <h3 class="kendala-title">${escapeHtml(cleanJudul)}</h3>
      ${titlePhoto ? createTitlePhotoSection(titlePhoto.url, index) : ''}
      <div class="kendala-answers">
        ${item.jawaban1 ? `
          <div class="answer-item">
            <div class="answer-label">JAWABAN 1</div>
            <div class="answer-content">${formatContent(item.jawaban1, links1)}</div>
            ${hasPhoto && !titlePhoto ? createPhotoSection(item) : ''}
            ${links1.length > 0 ? createLinkButtons(links1) : ''}
            <button class="copy-btn" onclick="copyAnswer(${index}, 1)"><i class="fas fa-copy"></i> Copy</button>
            <button class="sticky-btn" onclick="addToSticky(${index}, 1)"><i class="fas fa-sticky-note"></i> Sticky</button>
          </div>` : ''}
        ${item.jawaban2 ? `
          <div class="answer-item">
            <div class="answer-label">JAWABAN 2</div>
            <div class="answer-content">${formatContent(item.jawaban2, links2)}</div>
            ${links2.length > 0 ? createLinkButtons(links2) : ''}
            <button class="copy-btn" onclick="copyAnswer(${index}, 2)"><i class="fas fa-copy"></i> Copy</button>
            <button class="sticky-btn" onclick="addToSticky(${index}, 2)"><i class="fas fa-sticky-note"></i> Sticky</button>
          </div>` : ''}
        ${item.jawaban3 ? `
          <div class="answer-item">
            <div class="answer-label">JAWABAN 3</div>
            <div class="answer-content">${formatContent(item.jawaban3, links3)}</div>
            ${links3.length > 0 ? createLinkButtons(links3) : ''}
            <button class="copy-btn" onclick="copyAnswer(${index}, 3)"><i class="fas fa-copy"></i> Copy</button>
            <button class="sticky-btn" onclick="addToSticky(${index}, 3)"><i class="fas fa-sticky-note"></i> Sticky</button>
          </div>` : ''}
      </div>
    </div>`;
}

// ================= HELPER FUNCTIONS =================
function extractTitlePhoto(judul) {
  if (!judul) return null;
  const photoPattern = /(https?:\/\/[^\s]+\.(jpg|jpeg|png|gif|webp))/i;
  const match = judul.match(photoPattern);
  if (match) return { url: match[1], fullMatch: match[0] };
  return null;
}

function createTitlePhotoSection(photoUrl, index) {
  if (!lightboxImages.includes(photoUrl)) lightboxImages.push(photoUrl);
  return `
    <div class="title-photo-section">
      <img src="${photoUrl}" alt="Foto Kendala" class="title-photo-img" onclick="openLightbox('${photoUrl}')" onerror="this.parentElement.style.display='none'">
      <div class="title-photo-actions">
        <button class="copy-title-photo-btn" onclick="copyTitlePhoto('${photoUrl}')"><i class="fas fa-copy"></i> Copy Foto</button>
        <button class="view-title-photo-btn" onclick="openLightbox('${photoUrl}')"><i class="fas fa-expand"></i> Lihat Penuh</button>
      </div>
    </div>`;
}

function detectPhotoLink(item) {
  const photoPattern = /(https?:\/\/[^\s]+\.(jpg|jpeg|png|gif|webp))/i;
  return photoPattern.test(item.jawaban1) || photoPattern.test(item.jawaban2) || photoPattern.test(item.jawaban3);
}

function extractLinks(text) {
  if (!text) return [];
  const urlPattern = /https?:\/\/[^\s<>"{}|\\^`\[\]]+/gi;
  return text.match(urlPattern) || [];
}

function formatContent(text, links = []) {
  if (!text) return '';
  let formatted = escapeHtml(text);
  links.forEach(link => {
    const escapedLink = escapeHtml(link);
    const displayText = link.length > 45 ? link.substring(0, 42) + '...' : link;
    const regex = new RegExp(`(^|[^"'=])${escapeRegExp(escapedLink)}`, 'g');
    formatted = formatted.replace(regex, `$1<a href="${escapedLink}" target="_blank" rel="noopener">${displayText}</a>`);
  });
  return formatted;
}

function createPhotoSection(item) {
  const photoPattern = /(https?:\/\/[^\s]+\.(jpg|jpeg|png|gif|webp))/i;
  const match = (item.jawaban1 + ' ' + item.jawaban2 + ' ' + item.jawaban3).match(photoPattern);
  if (!match) return '';
  const photoUrl = match[1];
  if (!lightboxImages.includes(photoUrl)) lightboxImages.push(photoUrl);
  return `
    <div class="photo-container">
      <img src="${photoUrl}" alt="Foto" class="photo-img" onclick="openLightbox('${photoUrl}')" onerror="this.parentElement.style.display='none'">
      <button class="copy-btn" onclick="copyPhoto('${photoUrl}')"><i class="fas fa-copy"></i> Copy Foto</button>
    </div>`;
}

function createLinkButtons(links) {
  if (links.length === 0) return '';
  const linksEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(links))));
  return `
    <div class="link-buttons">
      ${links.map((link, i) => {
        const label = links.length > 1 ? `Link ${i+1}` : 'Buka Link';
        return `<a href="${link}" target="_blank" rel="noopener" class="open-link-btn">
          <i class="fas fa-external-link-alt"></i> ${label}
        </a>`;
      }).join('')}
      ${links.length > 1 ? `
        <button class="open-all-links-btn" onclick="openAllLinks('${linksEncoded}')" title="Buka semua ${links.length} link sekaligus">
          <i class="fas fa-layer-group"></i> Buka Semua <span class="link-count">${links.length}</span>
        </button>
      ` : ''}
    </div>`;
}

function openAllLinks(linksEncoded) {
  try {
    const links = JSON.parse(decodeURIComponent(escape(atob(linksEncoded))));
    if (!links || links.length === 0) {
      showToast('⚠️ Tidak ada link untuk dibuka', 'error');
      return;
    }
    let openedCount = 0;
    let blockedCount = 0;
    links.forEach((link, index) => {
      setTimeout(() => {
        const newWindow = window.open(link, '_blank', 'noopener,noreferrer');
        if (newWindow && !newWindow.closed) {
          openedCount++;
        } else {
          blockedCount++;
        }
        if (index === links.length - 1) {
          setTimeout(() => {
            if (blockedCount > 0) {
              showToast(`⚠️ ${openedCount} dibuka, ${blockedCount} diblokir popup`, 'error');
            } else {
              showToast(`✅ ${openedCount} link berhasil dibuka!`, 'success');
            }
          }, 200);
        }
      }, index * 150);
    });
  } catch (error) {
    console.error('Error membuka semua link:', error);
    showToast('❌ Gagal membuka link', 'error');
  }
}

async function copyAnswer(index, answerNum) {
  const item = filteredKendala[index];
  const content = item[`jawaban${answerNum}`];
  if (!content) return;
  try {
    await navigator.clipboard.writeText(content);
    showToast('✅ Jawaban berhasil disalin!', 'success');
    const btn = event.target.closest('.copy-btn');
    if (btn) {
      const original = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.innerHTML = original;
        btn.classList.remove('copied');
      }, 1500);
    }
  } catch {
    fallbackCopy(content);
  }
}

async function copyTitlePhoto(url) {
  try {
    const response = await fetch(url);
    const blob = await response.blob();
    await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
    showToast('✅ Foto berhasil disalin!', 'success');
  } catch {
    await navigator.clipboard.writeText(url);
    showToast('📋 URL foto disalin!', 'info');
  }
}

async function copyPhoto(url) {
  try {
    const response = await fetch(url);
    const blob = await response.blob();
    await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
    showToast('✅ Foto berhasil disalin!', 'success');
  } catch {
    await navigator.clipboard.writeText(url);
    showToast('📋 URL foto disalin!', 'info');
  }
}

function fallbackCopy(text) {
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.left = '-9999px';
  document.body.appendChild(textarea);
  textarea.select();
  try {
    document.execCommand('copy');
    showToast('✅ Disalin!', 'success');
  } catch {
    showToast('❗ Gagal menyalin', 'error');
  }
  document.body.removeChild(textarea);
}

function searchKendala() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  filteredKendala = allKendala.filter(item =>
    item.judul.toLowerCase().includes(query) ||
    (item.jawaban1 && item.jawaban1.toLowerCase().includes(query)) ||
    (item.jawaban2 && item.jawaban2.toLowerCase().includes(query)) ||
    (item.jawaban3 && item.jawaban3.toLowerCase().includes(query))
  );
  renderKendala();
  updateStats();
}

function updateStats() {
  document.getElementById('totalItems').textContent = filteredKendala.length;
  const withPhotos = filteredKendala.filter(item => detectPhotoLink(item) || extractTitlePhoto(item.judul)).length;
  document.getElementById('withPhotos').textContent = withPhotos;
  const withLinks = filteredKendala.filter(item =>
    extractLinks(item.jawaban1).length > 0 ||
    extractLinks(item.jawaban2).length > 0 ||
    extractLinks(item.jawaban3).length > 0
  ).length;
  document.getElementById('withLinks').textContent = withLinks;
}

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function escapeRegExp(string) {
  return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

// ================= LIGHTBOX =================
function openLightbox(url) {
  lightboxIndex = lightboxImages.indexOf(url);
  if (lightboxIndex === -1) {
    lightboxImages.push(url);
    lightboxIndex = lightboxImages.length - 1;
  }
  document.getElementById('lightboxImg').src = url;
  document.getElementById('lightbox').classList.add('active');
  document.body.style.overflow = 'hidden';
  zoomLevel = 1;
  updateZoom();
}

function closeLightbox(event) {
  if (!event || event.target.id === 'lightbox' || event.target.classList.contains('lightbox-close')) {
    document.getElementById('lightbox').classList.remove('active');
    document.getElementById('lightboxImg').src = '';
    document.body.style.overflow = '';
  }
}

function changeLightbox(direction) {
  lightboxIndex += direction;
  if (lightboxIndex < 0) lightboxIndex = lightboxImages.length - 1;
  if (lightboxIndex >= lightboxImages.length) lightboxIndex = 0;
  document.getElementById('lightboxImg').src = lightboxImages[lightboxIndex];
  zoomLevel = 1;
  updateZoom();
}

function updateZoom() {
  zoomLevel = parseFloat(document.getElementById('zoomSlider').value);
  document.getElementById('lightboxImg').style.transform = `scale(${zoomLevel})`;
}

async function copyLightboxPhoto() {
  const url = document.getElementById('lightboxImg').src;
  if (url) await copyPhoto(url);
}

// ================= STICKY NOTES =================
function toggleStickyPanel() {
  const panel = document.getElementById("stickyPanel");
  panel.classList.toggle('active');
  if (panel.classList.contains('active')) loadStickyNotes();
}

function autoResize(el) {
  el.style.height = "auto";
  el.style.height = (el.scrollHeight) + "px";
}

async function addSticky() {
  const input = document.getElementById("stickyInput");
  const text = input.value.trim();
  const image = input.dataset.image || null;
  if (!text && !image) return;
  
  let stickies = JSON.parse(localStorage.getItem("stickies") || "[]");
  if (editIndex !== null) {
    stickies[editIndex] = { text, image };
    editIndex = null;
    document.getElementById("stickyAddBtn").querySelector("span").textContent = "Tambah";
  } else {
    stickies.push({ text, image });
  }
  localStorage.setItem("stickies", JSON.stringify(stickies));
  
  input.value = "";
  input.dataset.image = "";
  autoResize(input);
  removePhoto();
  loadStickyNotes();
  showToast('✅ Catatan ditambahkan!', 'success');
}

function loadStickyNotes() {
  const list = document.getElementById("stickyList");
  if (!list) return;
  list.innerHTML = "";
  const stickies = JSON.parse(localStorage.getItem("stickies") || "[]");
  
  if (stickies.length === 0) {
    list.innerHTML = '<div style="text-align:center; padding: 30px; color: var(--text-muted); font-size: 13px;"><i class="fas fa-sticky-note" style="font-size: 32px; opacity: 0.3; display: block; margin-bottom: 10px;"></i>Kosong - Tambahkan catatan</div>';
    return;
  }
  
  stickies.forEach((note, i) => {
    const div = document.createElement("div");
    div.className = "sticky-card";
    div.dataset.index = i;
    
    if (note.text) {
      const p = document.createElement("p");
      p.textContent = note.text;
      div.appendChild(p);
    }
    if (note.image) {
      const img = document.createElement("img");
      img.src = note.image;
      img.onclick = () => openLightbox(note.image);
      div.appendChild(img);
    }
    
    div.onclick = async (e) => {
      if (e.target.classList.contains('sticky-delete') || e.target.classList.contains('sticky-edit')) return;
      try {
        const items = {};
        if (note.text) items["text/plain"] = new Blob([note.text], { type: "text/plain" });
        if (note.image) {
          const resp = await fetch(note.image);
          const blob = await resp.blob();
          items[blob.type] = blob;
        }
        await navigator.clipboard.write([new ClipboardItem(items)]);
        showToast("✅ Teks + Gambar disalin!", 'success');
      } catch {
        showToast("⚠ Gagal menyalin", 'error');
      }
    };
    
    const del = document.createElement("span");
    del.innerHTML = '<i class="fas fa-trash"></i>';
    del.className = "sticky-delete";
    del.onclick = e => { e.stopPropagation(); deleteSticky(i); };
    
    const edit = document.createElement("span");
    edit.innerHTML = '<i class="fas fa-pen"></i>';
    edit.className = "sticky-edit";
    edit.onclick = e => { e.stopPropagation(); editSticky(i); };
    
    div.appendChild(del);
    div.appendChild(edit);
    div.setAttribute("draggable", true);
    div.ondragstart = e => e.dataTransfer.setData("text/plain", i);
    div.ondragover = e => { e.preventDefault(); div.style.borderColor = 'var(--neon-cyan)'; };
    div.ondragleave = () => div.style.borderColor = '';
    div.ondrop = e => {
      e.preventDefault();
      div.style.borderColor = '';
      reorderSticky(e.dataTransfer.getData("text/plain"), i);
    };
    
    list.appendChild(div);
  });
}

function reorderSticky(from, to) {
  let stickies = JSON.parse(localStorage.getItem("stickies") || "[]");
  const moved = stickies.splice(from, 1)[0];
  stickies.splice(to, 0, moved);
  localStorage.setItem("stickies", JSON.stringify(stickies));
  loadStickyNotes();
}

function deleteSticky(i) {
  let stickies = JSON.parse(localStorage.getItem("stickies") || "[]");
  stickies.splice(i, 1);
  localStorage.setItem("stickies", JSON.stringify(stickies));
  loadStickyNotes();
  showToast('🗑️ Catatan dihapus', 'info');
}

function editSticky(i) {
  const stickies = JSON.parse(localStorage.getItem("stickies") || "[]");
  const input = document.getElementById("stickyInput");
  input.value = stickies[i].text || "";
  input.dataset.image = stickies[i].image || "";
  autoResize(input);
  if (stickies[i].image) showPhotoPreview(stickies[i].image);
  else removePhoto();
  editIndex = i;
  document.getElementById("stickyAddBtn").querySelector("span").textContent = "Update";
  input.focus();
}

function handleFileSelect(event) {
  const file = event.target.files[0];
  if (file && file.type.startsWith('image/')) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const base64 = e.target.result;
      document.getElementById("stickyInput").dataset.image = base64;
      showPhotoPreview(base64);
      showToast('📸 Foto diunggah!', 'success');
    };
    reader.readAsDataURL(file);
  }
}

function handleStickyPaste(event) {
  const items = event.clipboardData.items;
  for (let i = 0; i < items.length; i++) {
    if (items[i].type.startsWith('image/')) {
      event.preventDefault();
      const blob = items[i].getAsFile();
      const reader = new FileReader();
      reader.onload = function(e) {
        const base64 = e.target.result;
        document.getElementById("stickyInput").dataset.image = base64;
        showPhotoPreview(base64);
        showToast('📸 Foto ditempel!', 'success');
      };
      reader.readAsDataURL(blob);
      break;
    }
  }
}

function showPhotoPreview(dataUrl) {
  const preview = document.getElementById('stickyPhotoPreview');
  const previewImg = document.getElementById('stickyPreviewImg');
  previewImg.src = dataUrl;
  preview.classList.add('show');
}

function removePhoto() {
  const input = document.getElementById("stickyInput");
  if(input) input.dataset.image = "";
  document.getElementById('stickyPhotoPreview').classList.remove('show');
  document.getElementById('fileInput').value = '';
}

function addToSticky(kendalaIndex, answerNum) {
  const item = filteredKendala[kendalaIndex];
  const content = item[`jawaban${answerNum}`];
  if (!content) return;
  const photoPattern = /(https?:\/\/[^\s]+\.(jpg|jpeg|png|gif|webp))/i;
  const match = content.match(photoPattern);
  const imageUrl = match ? match[1] : null;
  
  let stickies = JSON.parse(localStorage.getItem("stickies") || "[]");
  stickies.push({
    text: imageUrl ? content.replace(photoPattern, '').trim() : content,
    image: imageUrl
  });
  localStorage.setItem("stickies", JSON.stringify(stickies));
  loadStickyNotes();
  showToast('✅ Ditambahkan ke Sticky Notes!', 'success');
}

// ================= INITIALIZATION =================
document.addEventListener('DOMContentLoaded', () => {
  createParticles();
  loadKendalaData();
  const stickyInput = document.getElementById('stickyInput');
  if (stickyInput) {
    stickyInput.addEventListener('paste', handleStickyPaste);
  }
  setTimeout(() => showToast('🕊️ System Ready!', 'success'), 1000);
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeLightbox();
    const panel = document.getElementById("stickyPanel");
    if (panel.classList.contains('active')) toggleStickyPanel();
  }
});
