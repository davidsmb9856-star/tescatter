<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* ============================================================ */
/* 🕊️ DOVE BLUE THEME - SAMA DENGAN SCRIPTVAULT                 */
/* ============================================================ */
:root {
  --bg-primary: #0f1d2b;
  --bg-secondary: #132434;
  --bg-tertiary: #1a2f42;
  --bg-card: #1a2f42;
  --bg-hover: #27455f;
  --field-bg: rgba(0, 0, 0, 0.35);
  --code-bg: rgba(0, 0, 0, 0.4);
  --overlay-bg: rgba(2, 4, 8, 0.88);

  --neon-cyan: #6fa3cf;
  --neon-blue: #8fbce0;
  --neon-purple: #aacfeb;
  --neon-pink: #ef5350;
  --neon-green: #34d399;
  --neon-yellow: #f0a830;
  --neon-red: #ef5350;
  --neon-orange: #f0a830;

  --text-primary: #e8f0f8;
  --text-secondary: #9fb2c4;
  --text-tertiary: #7f96ab;
  --text-muted: #5a7186;

  --border-subtle: rgba(255, 255, 255, 0.06);
  --border-normal: rgba(255, 255, 255, 0.12);
  --border-strong: rgba(255, 255, 255, 0.2);
  --border-glow: rgba(111, 163, 207, 0.5);

  --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.4);
  --shadow-md: 0 6px 18px rgba(0, 0, 0, 0.5);
  --shadow-lg: 0 14px 40px rgba(0, 0, 0, 0.6);
  --shadow-glow: 0 0 18px rgba(111, 163, 207, 0.25);

  --radius-sm: 8px;
  --radius-md: 11px;
  --radius-lg: 14px;
  --radius-xl: 18px;
  --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-bounce: 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
}

html.light {
  --bg-primary: #eef5fb;
  --bg-secondary: #f7fbff;
  --bg-tertiary: #ffffff;
  --bg-card: #ffffff;
  --bg-hover: #e6f0f9;
  --field-bg: rgba(31, 58, 84, 0.05);
  --code-bg: rgba(31, 58, 84, 0.06);
  --overlay-bg: rgba(15, 28, 42, 0.45);
  --neon-cyan: #4682b4;
  --neon-blue: #37688f;
  --neon-purple: #2e5474;
  --neon-green: #15803d;
  --neon-yellow: #b45309;
  --neon-red: #c62828;
  --neon-orange: #b45309;
  --text-primary: #13232f;
  --text-secondary: #4a5d6e;
  --text-tertiary: #6b7c8c;
  --text-muted: #93a3b1;
  --border-subtle: rgba(31, 58, 84, 0.08);
  --border-normal: rgba(31, 58, 84, 0.16);
  --border-strong: rgba(31, 58, 84, 0.28);
  --border-glow: rgba(70, 130, 180, 0.5);
  --shadow-sm: 0 2px 6px rgba(31, 58, 84, 0.08);
  --shadow-md: 0 6px 18px rgba(31, 58, 84, 0.12);
  --shadow-lg: 0 14px 40px rgba(31, 58, 84, 0.18);
  --shadow-glow: 0 0 18px rgba(70, 130, 180, 0.18);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
html, body {
  font-family: 'Inter', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* Noise texture */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  opacity: 0.025;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* ========== BACKGROUND EFFECTS ========== */
.bg-animated {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
  background:
    radial-gradient(ellipse at 20% 20%, rgba(111, 163, 207, 0.1) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(52, 211, 153, 0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(143, 188, 224, 0.05) 0%, transparent 70%),
    var(--bg-primary);
}

.bg-grid {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
  background-image:
    linear-gradient(rgba(111, 163, 207, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(111, 163, 207, 0.03) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black 30%, transparent 75%);
  animation: gridMove 30s linear infinite;
  pointer-events: none;
}

@keyframes gridMove {
  0% { transform: translate(0, 0); }
  100% { transform: translate(44px, 44px); }
}

.particle {
  position: fixed; width: 4px; height: 4px; background: var(--neon-cyan);
  border-radius: 50%; pointer-events: none; z-index: -1;
  box-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
  animation: floatParticle 15s infinite linear; opacity: 0.5;
}

@keyframes floatParticle {
  0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
  10% { opacity: 0.5; } 90% { opacity: 0.5; }
  100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
}

.scan-line {
  position: fixed; top: 0; left: 0; width: 100%; height: 2px;
  background: linear-gradient(90deg, transparent, rgba(111, 163, 207, 0.4), transparent);
  opacity: 0.4;
  animation: scanDown 12s linear infinite;
  z-index: 1; pointer-events: none;
  filter: blur(1px);
}

@keyframes scanDown {
  0% { top: -10%; opacity: 0; }
  10% { opacity: 0.4; }
  90% { opacity: 0.4; }
  100% { top: 110%; opacity: 0; }
}

/* ========== CONTAINER & LAYOUT ========== */
.container {
  max-width: 1180px;
  margin: 0 auto;
  padding: 20px 15px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 2;
}

/* ========== HEADER ========== */
.header {
  text-align: center;
  margin-bottom: 28px;
  padding: 22px 15px;
  position: relative;
  animation: headerEntrance 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
}

@keyframes headerEntrance {
  from { opacity: 0; transform: translateY(-30px); }
  to { opacity: 1; transform: translateY(0); }
}

.header::before {
  content: '';
  position: absolute;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 80%;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-blue), var(--neon-cyan), transparent);
  animation: glowLine 3.5s ease-in-out infinite;
  box-shadow: 0 0 15px var(--neon-cyan);
}

@keyframes glowLine {
  0%, 100% { opacity: 0.7; }
  50% { opacity: 1; box-shadow: 0 0 25px var(--neon-blue), 0 0 45px var(--neon-cyan); }
}

.back-btn {
  position: absolute;
  left: 0; top: 50%;
  transform: translateY(-50%);
  background: var(--field-bg);
  border: 1px solid rgba(111, 163, 207, 0.3);
  border-radius: var(--radius-sm);
  color: var(--neon-cyan);
  padding: 9px 16px;
  text-decoration: none;
  font-weight: 600;
  font-size: 11px;
  display: flex;
  align-items: center;
  gap: 7px;
  transition: var(--transition);
  font-family: 'Space Grotesk', sans-serif;
  letter-spacing: 0.5px;
  backdrop-filter: blur(12px);
}

.back-btn:hover {
  background: rgba(111, 163, 207, 0.16);
  border-color: var(--neon-cyan);
  transform: translateY(-50%) translateX(-3px);
  box-shadow: var(--shadow-glow);
}

/* Theme toggle */
.theme-toggle {
  position: absolute;
  right: 0; top: 50%;
  transform: translateY(-50%);
  width: 40px;
  height: 40px;
  background: var(--field-bg);
  border: 1px solid rgba(111, 163, 207, 0.3);
  color: var(--neon-cyan);
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: grid;
  place-items: center;
  font-size: 16px;
  transition: var(--transition);
  backdrop-filter: blur(12px);
}
.theme-toggle:hover {
  background: rgba(111, 163, 207, 0.16);
  border-color: var(--neon-cyan);
  transform: translateY(-50%) scale(1.06);
  box-shadow: var(--shadow-glow);
}

.judul-glow {
  font-family: 'Space Grotesk', sans-serif;
  font-size: clamp(1.5rem, 4vw, 2.2rem);
  font-weight: 700;
  text-align: center;
  letter-spacing: 3px;
  margin-bottom: 10px;
  background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue), var(--text-primary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-transform: uppercase;
}

.bonus-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: clamp(1.2rem, 3vw, 1.8rem);
  font-weight: 700;
  text-align: center;
  color: var(--neon-blue);
  letter-spacing: 2px;
  margin-bottom: 20px;
}

.subtitle {
  font-size: 11px;
  color: var(--text-secondary);
  text-align: center;
  margin-bottom: 15px;
  font-weight: 500;
  font-family: 'Space Grotesk', sans-serif;
  letter-spacing: 4px;
  text-transform: uppercase;
}

.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  background: rgba(52, 211, 153, 0.08);
  border: 1px solid rgba(52, 211, 153, 0.3);
  padding: 7px 16px;
  border-radius: 100px;
  font-size: 10px;
  color: var(--neon-green);
  margin-top: 13px;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.status-dot {
  width: 7px; height: 7px;
  background: var(--neon-green);
  border-radius: 50%;
  animation: pulse 2.2s infinite;
  box-shadow: 0 0 8px var(--neon-green);
}

@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.35); opacity: 0.75; }
}

/* ========== STATS BENTO ========== */
.stats-bento {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  max-width: 720px;
  margin: 0 auto 28px;
}
.stat-card {
  background: linear-gradient(135deg, var(--bg-tertiary), var(--bg-secondary));
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}
.stat-card::before {
  content: '';
  position: absolute;
  top: -40px;
  right: -40px;
  width: 110px;
  height: 110px;
  border-radius: 50%;
  filter: blur(50px);
  opacity: 0.16;
  transition: opacity 0.4s;
}
.stat-card:nth-child(1)::before { background: var(--neon-cyan); }
.stat-card:nth-child(2)::before { background: var(--neon-green); }
.stat-card:nth-child(3)::before { background: var(--neon-purple); }
.stat-card:hover {
  border-color: rgba(111, 163, 207, 0.3);
  transform: translateY(-3px);
  box-shadow: var(--shadow-glow);
}
.stat-card:hover::before { opacity: 0.3; }
.stat-label {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 9px;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 7px;
}
.stat-label .icon { font-size: 14px; }
.stat-value {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 24px;
  font-weight: 800;
  margin-top: 6px;
  letter-spacing: -0.03em;
  background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue), var(--text-primary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  line-height: 1.1;
}
.stat-sub {
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 3px;
  font-weight: 500;
}

/* ========== SEARCH SECTION ========== */
.search-section {
  margin: 22px 0 28px;
  text-align: center;
}

.search-bar {
  position: relative;
  max-width: 520px;
  margin: 0 auto 16px;
}

.search-bar .bonus-input {
  width: 100%;
  padding: 13px 18px 13px 48px;
  background: var(--field-bg);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  color: var(--text-primary);
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  transition: var(--transition);
}

.search-bar .bonus-input::placeholder {
  color: var(--text-muted);
}

.search-bar .bonus-input:focus {
  outline: none;
  border-color: var(--neon-cyan);
  box-shadow: 0 0 0 3px rgba(111, 163, 207, 0.1);
  background: rgba(111, 163, 207, 0.05);
}

.search-bar i {
  position: absolute;
  left: 16px; top: 50%;
  transform: translateY(-50%);
  color: var(--neon-cyan);
  font-size: 15px;
}

.search-count {
  position: absolute;
  right: 14px; top: 50%;
  transform: translateY(-50%);
  font-size: 10px;
  color: var(--neon-cyan);
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 600;
  background: rgba(111, 163, 207, 0.1);
  padding: 3px 9px;
  border-radius: 6px;
  border: 1px solid rgba(111, 163, 207, 0.25);
  white-space: nowrap;
  display: none;
}
.search-count.show { display: inline-block; }

/* ========== KENDALA CARDS ========== */
.kendala-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.kendala-card {
  background: linear-gradient(135deg, var(--bg-tertiary), var(--bg-secondary));
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(12px);
  animation: fadeInUp 0.5s ease-out;
  box-shadow: var(--shadow-sm);
}

.kendala-card:nth-child(1) { animation-delay: 0.05s; }
.kendala-card:nth-child(2) { animation-delay: 0.1s; }
.kendala-card:nth-child(3) { animation-delay: 0.15s; }

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.kendala-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 4px; height: 100%;
  background: linear-gradient(to bottom, var(--neon-cyan), var(--neon-blue));
  transition: width 0.3s ease;
}

.kendala-card::after {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(120deg, transparent, rgba(111, 163, 207, 0.08), transparent);
  transition: left 0.6s ease;
  z-index: 0;
  pointer-events: none;
}

.kendala-card:hover::after { left: 100%; }

.kendala-card:hover {
  border-color: rgba(111, 163, 207, 0.3);
  transform: translateY(-2px);
  box-shadow: var(--shadow-glow);
}

.kendala-card:hover::before {
  width: 6px;
  box-shadow: 0 0 20px var(--neon-cyan);
}

.kendala-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 14px;
  font-weight: 700;
  color: var(--neon-cyan);
  margin-bottom: 14px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border-subtle);
  transition: color 0.3s ease;
  letter-spacing: 1px;
  text-transform: uppercase;
  position: relative;
  z-index: 1;
}

.kendala-title:hover {
  color: var(--neon-blue);
}

.kendala-title::after {
  content: '▼';
  font-size: 11px;
  transition: transform 0.28s ease;
  color: var(--neon-cyan);
}

.kendala-card.expanded .kendala-title::after {
  transform: rotate(180deg);
}

.kendala-badge-new {
  position: absolute;
  top: 12px;
  right: 12px;
  background: rgba(239, 83, 80, 0.85);
  color: #fff;
  padding: 3px 8px;
  border-radius: 5px;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 1px;
  font-family: 'Space Grotesk', sans-serif;
  z-index: 2;
  animation: badgePulse 1.8s ease-in-out infinite;
}

@keyframes badgePulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 0 rgba(239, 83, 80, 0.4); }
  50% { transform: scale(1.08); box-shadow: 0 0 12px rgba(239, 83, 80, 0.6); }
}

/* ========== PHOTO & ANSWER SECTIONS ========== */
.title-photo-section {
  display: none;
  margin: 14px 0;
  padding: 14px;
  background: rgba(111, 163, 207, 0.06);
  border: 1px solid rgba(111, 163, 207, 0.2);
  border-radius: var(--radius-md);
  text-align: center;
  position: relative;
  z-index: 1;
}

.kendala-card.expanded .title-photo-section {
  display: block;
}

.title-photo-img {
  max-width: 100%;
  max-height: 300px;
  border-radius: var(--radius-md);
  border: 2px solid rgba(111, 163, 207, 0.3);
  cursor: pointer;
  transition: var(--transition);
}

.title-photo-img:hover {
  border-color: var(--neon-cyan);
  box-shadow: 0 0 25px rgba(111, 163, 207, 0.3);
}

.title-photo-actions {
  margin-top: 12px;
  display: flex;
  gap: 9px;
  justify-content: center;
  flex-wrap: wrap;
}

.copy-title-photo-btn, .view-title-photo-btn {
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 11px;
  padding: 8px 14px;
  background: var(--field-bg);
  border: 1px solid rgba(111, 163, 207, 0.3);
  border-radius: var(--radius-sm);
  color: var(--neon-cyan);
  cursor: pointer;
  transition: var(--transition);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.copy-title-photo-btn:hover, .view-title-photo-btn:hover {
  background: rgba(111, 163, 207, 0.16);
  border-color: var(--neon-cyan);
  transform: translateY(-2px);
  box-shadow: var(--shadow-glow);
}

.kendala-answers {
  display: none;
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--border-subtle);
  position: relative;
  z-index: 1;
}

.kendala-card.expanded .kendala-answers {
  display: block;
}

.answer-item {
  margin-bottom: 14px;
  padding: 14px 16px;
  background: rgba(111, 163, 207, 0.06);
  border-radius: var(--radius-md);
  border-left: 3px solid var(--neon-cyan);
  transition: var(--transition);
}

.answer-item:hover {
  background: rgba(111, 163, 207, 0.1);
  border-left-color: var(--neon-blue);
}

.answer-label {
  font-weight: 700;
  color: var(--neon-cyan);
  margin-bottom: 9px;
  font-size: 10px;
  font-family: 'Space Grotesk', sans-serif;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 6px;
}

.answer-content {
  color: var(--text-primary);
  line-height: 1.65;
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 13px;
  font-family: 'Inter', sans-serif;
}

.answer-content a {
  color: var(--neon-blue);
  text-decoration: none;
  font-weight: 600;
  transition: color 0.3s ease;
  border-bottom: 1px dashed rgba(143, 188, 224, 0.4);
}

.answer-content a:hover {
  color: var(--neon-cyan);
  border-bottom-color: var(--neon-cyan);
}

.photo-container {
  margin: 14px 0;
  text-align: center;
  padding: 12px;
  background: var(--field-bg);
  border-radius: var(--radius-md);
  border: 1px dashed rgba(111, 163, 207, 0.3);
}

.photo-img {
  max-width: 100%;
  max-height: 280px;
  border-radius: var(--radius-md);
  border: 2px solid rgba(111, 163, 207, 0.3);
  cursor: pointer;
  transition: var(--transition);
}

.photo-img:hover {
  border-color: var(--neon-cyan);
  box-shadow: 0 0 20px rgba(111, 163, 207, 0.3);
}

.link-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 12px;
  align-items: center;
}

.open-link-btn {
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 11px;
  padding: 7px 13px;
  background: var(--field-bg);
  border: 1px solid rgba(111, 163, 207, 0.3);
  border-radius: var(--radius-sm);
  color: var(--neon-cyan);
  cursor: pointer;
  transition: var(--transition);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.open-link-btn:hover {
  background: rgba(111, 163, 207, 0.16);
  border-color: var(--neon-cyan);
  transform: translateY(-2px);
  box-shadow: var(--shadow-glow);
}

/* ========== TOMBOL BUKA SEMUA LINK ========== */
.open-all-links-btn {
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 11px;
  padding: 7px 14px;
  background: rgba(170, 207, 235, 0.1);
  border: 1px solid rgba(170, 207, 235, 0.4);
  border-radius: var(--radius-sm);
  color: var(--neon-purple);
  cursor: pointer;
  transition: var(--transition);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-left: auto;
  position: relative;
  overflow: hidden;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.open-all-links-btn::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(170, 207, 235, 0.2), transparent);
  transition: left 0.5s ease;
}

.open-all-links-btn:hover::before {
  left: 100%;
}

.open-all-links-btn:hover {
  background: rgba(170, 207, 235, 0.2);
  border-color: var(--neon-purple);
  transform: translateY(-2px);
  box-shadow: 0 5px 15px rgba(170, 207, 235, 0.25);
}

.open-all-links-btn:active {
  transform: translateY(0);
}

.open-all-links-btn .link-count {
  background: var(--neon-purple);
  color: var(--bg-primary);
  font-size: 9px;
  font-weight: 800;
  padding: 2px 7px;
  border-radius: 20px;
  margin-left: 3px;
  box-shadow: 0 0 8px rgba(170, 207, 235, 0.4);
}

/* ========== BUTTONS ========== */
.copy-btn, .sticky-btn {
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 11px;
  padding: 8px 14px;
  background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue));
  border: none;
  border-radius: var(--radius-sm);
  color: var(--bg-primary);
  cursor: pointer;
  transition: var(--transition);
  letter-spacing: 0.8px;
  margin-top: 11px;
  margin-right: 7px;
  text-transform: uppercase;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  box-shadow: var(--shadow-sm);
}

.copy-btn:hover, .sticky-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(111, 163, 207, 0.35);
}

.copy-btn.copied, .sticky-btn.added {
  background: var(--neon-green);
  color: var(--bg-primary);
}

.copy-btn.danger, .sticky-btn.danger {
  background: linear-gradient(135deg, var(--neon-red), #c62828);
}

.copy-btn.danger:hover {
  box-shadow: 0 8px 20px rgba(239, 83, 80, 0.35);
}

.sticky-btn {
  background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
}

/* ========== STICKY NOTES ========== */
.sticky-fab {
  position: fixed;
  bottom: 28px;
  right: 28px;
  width: 56px;
  height: 56px;
  background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue));
  border: none;
  border-radius: 50%;
  color: var(--bg-primary);
  font-size: 22px;
  cursor: pointer;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-glow);
  transition: var(--transition);
  font-family: 'Inter', sans-serif;
}

.sticky-fab:hover {
  transform: scale(1.1) rotate(10deg);
  box-shadow: 0 0 35px rgba(111, 163, 207, 0.5);
}

.sticky-panel {
  position: fixed;
  bottom: 95px;
  right: 28px;
  width: 370px;
  max-width: 92vw;
  height: 68vh;
  max-height: 580px;
  background: linear-gradient(135deg, var(--bg-tertiary), var(--bg-secondary));
  border: 1px solid rgba(111, 163, 207, 0.3);
  border-radius: var(--radius-xl);
  padding: 0;
  z-index: 999;
  display: none;
  flex-direction: column;
  backdrop-filter: blur(20px);
  box-shadow: var(--shadow-lg), var(--shadow-glow);
  animation: fadeInUp 0.4s ease-out;
}

.sticky-panel.active {
  display: flex;
}

.sticky-panel::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-blue), transparent);
  background-size: 200% 100%;
  animation: borderFlow 2.5s linear infinite;
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
}

@keyframes borderFlow {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

.sticky-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 20px;
  border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0;
}

.sticky-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 13px;
  color: var(--neon-cyan);
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 8px;
}

.sticky-title::before {
  content: '';
  width: 3px;
  height: 16px;
  background: linear-gradient(180deg, var(--neon-cyan), var(--neon-blue));
  border-radius: 2px;
  box-shadow: 0 0 8px var(--neon-cyan);
}

.sticky-close {
  background: var(--field-bg);
  border: 1px solid var(--border-normal);
  border-radius: var(--radius-sm);
  width: 32px;
  height: 32px;
  color: var(--text-secondary);
  font-size: 18px;
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
}

.sticky-close:hover {
  background: rgba(239, 83, 80, 0.1);
  border-color: var(--neon-red);
  color: var(--neon-red);
  transform: rotate(90deg);
}

.sticky-input-area {
  padding: 18px 20px;
  border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0;
}

.sticky-input {
  width: 100%;
  min-height: 58px;
  background: var(--field-bg);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 12px;
  color: var(--text-primary);
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  resize: vertical;
  transition: var(--transition);
}

.sticky-input:focus {
  outline: none;
  border-color: var(--neon-cyan);
  box-shadow: 0 0 0 3px rgba(111, 163, 207, 0.1);
}

.sticky-input::placeholder {
  color: var(--text-muted);
}

.sticky-photo-preview {
  margin-top: 12px;
  padding: 12px;
  background: rgba(111, 163, 207, 0.06);
  border: 1px solid rgba(111, 163, 207, 0.25);
  border-radius: var(--radius-md);
  display: none;
}

.sticky-photo-preview.show {
  display: block;
}

.sticky-photo-preview img {
  max-width: 100%;
  max-height: 150px;
  border-radius: var(--radius-sm);
  border: 2px solid rgba(111, 163, 207, 0.3);
}

.sticky-remove-photo {
  background: var(--neon-red);
  color: white;
  border: none;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  float: right;
  margin-top: -35px;
  margin-right: 5px;
}

.sticky-btn-group {
  display: flex;
  gap: 9px;
  margin-top: 11px;
  flex-wrap: wrap;
}

.sticky-add-btn {
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 11px;
  padding: 9px 16px;
  background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue));
  border: none;
  border-radius: var(--radius-sm);
  color: var(--bg-primary);
  cursor: pointer;
  transition: var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 7px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
}

.sticky-add-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(111, 163, 207, 0.35);
}

.sticky-upload-btn {
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 11px;
  padding: 9px 14px;
  background: var(--field-bg);
  border: 1px solid rgba(111, 163, 207, 0.3);
  border-radius: var(--radius-sm);
  color: var(--neon-cyan);
  cursor: pointer;
  transition: var(--transition);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.sticky-upload-btn:hover {
  background: rgba(111, 163, 207, 0.16);
  border-color: var(--neon-cyan);
  transform: translateY(-2px);
}

#fileInput { display: none; }

.sticky-list {
  flex: 1;
  overflow-y: auto;
  padding: 18px 20px;
}

.sticky-card {
  background: var(--field-bg);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 13px;
  margin-bottom: 11px;
  cursor: grab;
  transition: var(--transition);
  position: relative;
}

.sticky-card:hover {
  border-color: var(--neon-cyan);
  box-shadow: var(--shadow-glow);
  transform: translateY(-2px);
}

.sticky-card p {
  color: var(--text-primary);
  font-size: 13px;
  line-height: 1.55;
  white-space: pre-wrap;
  margin-bottom: 7px;
  font-family: 'Inter', sans-serif;
}

.sticky-card img {
  max-width: 100%;
  max-height: 140px;
  border-radius: var(--radius-sm);
  border: 2px solid rgba(111, 163, 207, 0.3);
  margin-top: 7px;
  cursor: pointer;
}

.sticky-card img:hover {
  border-color: var(--neon-cyan);
}

.sticky-delete, .sticky-edit {
  position: absolute;
  top: 7px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border-normal);
  border-radius: 50%;
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  cursor: pointer;
  color: var(--text-tertiary);
  transition: var(--transition);
}

.sticky-delete { right: 7px; }
.sticky-edit { right: 36px; }

.sticky-delete:hover {
  background: var(--neon-red);
  color: white;
  border-color: var(--neon-red);
}

.sticky-edit:hover {
  background: var(--neon-orange);
  color: var(--bg-primary);
  border-color: var(--neon-orange);
}

/* ========== LIGHTBOX ========== */
.lightbox {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: var(--overlay-bg);
  z-index: 10000;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 20px;
  backdrop-filter: blur(24px);
}

.lightbox.active { display: flex; }

.lightbox-close {
  position: absolute;
  top: 15px; right: 25px;
  width: 44px;
  height: 44px;
  background: var(--field-bg);
  border: 1px solid var(--border-normal);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: 20px;
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
}

.lightbox-close:hover {
  background: rgba(239, 83, 80, 0.1);
  border-color: var(--neon-red);
  color: var(--neon-red);
  transform: rotate(90deg);
}

.lightbox-img {
  max-width: 90%;
  max-height: 80vh;
  border-radius: var(--radius-md);
  border: 2px solid rgba(111, 163, 207, 0.4);
  box-shadow: 0 0 40px rgba(111, 163, 207, 0.3);
  cursor: grab;
}

.lightbox-controls {
  display: flex;
  gap: 10px;
  margin-top: 22px;
  flex-wrap: wrap;
  justify-content: center;
}

.lightbox-btn {
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 11px;
  padding: 9px 16px;
  background: var(--field-bg);
  border: 1px solid rgba(111, 163, 207, 0.3);
  border-radius: var(--radius-sm);
  color: var(--neon-cyan);
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  align-items: center;
  gap: 7px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  backdrop-filter: blur(12px);
}

.lightbox-btn:hover {
  background: rgba(111, 163, 207, 0.16);
  border-color: var(--neon-cyan);
  transform: translateY(-2px);
  box-shadow: var(--shadow-glow);
}

.zoom-slider {
  width: 220px;
  margin-top: 18px;
}

.zoom-slider input {
  width: 100%;
  accent-color: var(--neon-cyan);
}

/* ========== TOAST ========== */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: linear-gradient(135deg, var(--bg-hover), var(--bg-tertiary));
  backdrop-filter: blur(24px);
  border: 1px solid rgba(111, 163, 207, 0.3);
  border-left: 3px solid var(--neon-cyan);
  color: var(--text-primary);
  padding: 13px 18px;
  border-radius: var(--radius-md);
  font-weight: 500;
  font-size: 12px;
  z-index: 10000;
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: var(--shadow-glow);
  transform: translateX(200px);
  opacity: 0;
  transition: var(--transition-bounce);
  max-width: 340px;
  font-family: 'Inter', sans-serif;
}

.toast.show { transform: translateX(0); opacity: 1; }
.toast.success { border-left-color: var(--neon-green); }
.toast.error { border-left-color: var(--neon-red); }
.toast.warning { border-left-color: var(--neon-yellow); }

/* ========== LOADING & STATES ========== */
.loading, .no-data, .error-msg {
  text-align: center;
  padding: 55px 22px;
}

.loading {
  color: var(--neon-cyan);
}

.loading-spinner {
  width: 46px;
  height: 46px;
  border: 3px solid rgba(111, 163, 207, 0.15);
  border-top-color: var(--neon-cyan);
  border-radius: 50%;
  animation: spin 0.95s linear infinite;
  margin: 0 auto 16px;
  box-shadow: var(--shadow-glow);
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.error-msg {
  color: var(--text-primary);
  background: linear-gradient(135deg, var(--bg-tertiary), var(--bg-secondary));
  border-radius: var(--radius-lg);
  border: 1px solid rgba(239, 83, 80, 0.3);
  padding: 35px;
}

.no-data {
  color: var(--text-muted);
}

/* ========== SCROLLBAR ========== */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, var(--neon-cyan), var(--neon-blue));
  border-radius: 6px;
  border: 2px solid var(--bg-primary);
}

::-webkit-scrollbar-thumb:hover {
  background: var(--neon-cyan);
}

::selection {
  background: rgba(111, 163, 207, 0.35);
  color: var(--text-primary);
}

/* ========== COPY FLASH ========== */
.copy-flash {
  animation: copyFlash 0.6s ease;
}
@keyframes copyFlash {
  0% { background: var(--field-bg); }
  50% { background: rgba(52, 211, 153, 0.2); border-color: var(--neon-green); }
  100% { background: var(--field-bg); }
}

/* ========== RESPONSIVE ========== */
@media (max-width: 768px) {
  .container { padding: 14px 11px; }
  .judul-glow { font-size: clamp(1.3rem, 5vw, 1.8rem); }
  .bonus-title { font-size: clamp(1rem, 4vw, 1.4rem); }
  .sticky-panel {
    width: 96vw;
    right: 2vw;
    bottom: 85px;
    height: 58vh;
  }
  .sticky-fab {
    bottom: 16px;
    right: 16px;
    width: 48px;
    height: 48px;
  }
  .stats-bento { grid-template-columns: repeat(2, 1fr); }
  .kendala-card { padding: 18px; }
  .link-buttons { flex-direction: column; align-items: stretch; }
  .open-all-links-btn { margin-left: 0; justify-content: center; }
  .theme-toggle { width: 36px; height: 36px; }
  .back-btn { padding: 7px 12px; font-size: 10px; }
}

/* ========== ACCESSIBILITY ========== */
button:focus-visible,
input:focus-visible,
textarea:focus-visible {
  outline: 2px solid var(--neon-cyan);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* ========== LIGHT MODE ADJUSTMENTS ========== */
html.light .bg-animated {
  background:
    radial-gradient(ellipse at 20% 20%, rgba(70, 130, 180, 0.1) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(21, 128, 61, 0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(55, 104, 143, 0.05) 0%, transparent 70%),
    var(--bg-primary);
}
html.light .bg-grid {
  background-image:
    linear-gradient(rgba(70, 130, 180, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(70, 130, 180, 0.05) 1px, transparent 1px);
}
html.light .sticky-btn {
  color: #fff;
}
html.light .copy-btn, html.light .sticky-add-btn {
  color: #fff;
}
</style>
</head>
<body>
<!-- Background Effects -->
<div class="bg-animated"></div>
<div class="bg-grid"></div>
<div id="particles"></div>
<div class="scan-line"></div>
<div id="toast" class="toast"></div>

<div class="container">
  <header class="header">
    <a href="index.html" class="back-btn">
      <i class="fas fa-arrow-left"></i> Kembali
    </a>
    <button class="theme-toggle" onclick="toggleTheme()" title="Ganti Tema Terang/Gelap" id="themeBtn">🌙</button>
    <h1 class="judul-glow">🕊️ KENDALA ALL</h1>
    <p class="subtitle">Line Togel · Dove Blue 2026</p>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>System Online</span>
    </div>
  </header>

  <!-- Stats Bento -->
  <div class="stats-bento">
    <div class="stat-card">
      <div class="stat-label"><span class="icon"><i class="fas fa-database"></i></span> Total Data</div>
      <div class="stat-value" id="totalItems">0</div>
      <div class="stat-sub">Semua kendala</div>
    </div>
    <div class="stat-card">
      <div class="stat-label"><span class="icon"><i class="fas fa-camera"></i></span> Dengan Foto</div>
      <div class="stat-value" id="withPhotos">0</div>
      <div class="stat-sub">Foto tersedia</div>
    </div>
    <div class="stat-card">
      <div class="stat-label"><span class="icon"><i class="fas fa-link"></i></span> Dengan Link</div>
      <div class="stat-value" id="withLinks">0</div>
      <div class="stat-sub">Link tersedia</div>
    </div>
    <div class="stat-card">
      <div class="stat-label"><span class="icon"><i class="fas fa-filter"></i></span> Ditampilkan</div>
      <div class="stat-value" id="shownItems">0</div>
      <div class="stat-sub">Setelah filter</div>
    </div>
  </div>

  <div class="search-section">
    <div class="search-bar">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" class="bonus-input" placeholder="Cari kendala atau jawaban..." oninput="searchKendala()">
      <span class="search-count" id="searchCount"></span>
    </div>
  </div>

  <div id="kendalaContainer">
    <div class="loading">
      <div class="loading-spinner"></div>
      <p style="font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 3px; text-transform: uppercase;">Loading Data...</p>
      <p style="font-size: 11px; opacity: 0.7; margin-top: 8px; color: var(--text-muted);">Mengambil data dari Google Sheets</p>
    </div>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="closeLightbox()" aria-label="Tutup"><i class="fas fa-times"></i></button>
  <img class="lightbox-img" id="lightboxImg" src="" alt="Preview" draggable="false">
  <div class="lightbox-controls">
    <button class="lightbox-btn" onclick="changeLightbox(-1)">
      <i class="fas fa-chevron-left"></i> Prev
    </button>
    <button class="lightbox-btn" onclick="copyLightboxPhoto()">
      <i class="fas fa-image"></i> Copy Foto
    </button>
    <button class="lightbox-btn" onclick="changeLightbox(1)">
      Next <i class="fas fa-chevron-right"></i>
    </button>
  </div>
  <div class="zoom-slider">
    <input type="range" id="zoomSlider" min="0.5" max="4" step="0.1" value="1" oninput="updateZoom()">
  </div>
</div>

<!-- STICKY NOTES -->
<div class="sticky-fab" onclick="toggleStickyPanel()" title="Buka Sticky Notes">
  <i class="fas fa-sticky-note"></i>
</div>

<div class="sticky-panel" id="stickyPanel">
  <div class="sticky-header">
    <span class="sticky-title">Sticky Notes</span>
    <button class="sticky-close" onclick="toggleStickyPanel()" aria-label="Tutup"><i class="fas fa-times"></i></button>
  </div>
  <div class="sticky-input-area">
    <textarea class="sticky-input" id="stickyInput" placeholder="✏️ Tulis catatan...&#10;📸 Paste foto (Ctrl+V) atau Upload" oninput="autoResize(this)"></textarea>
    <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
    <div class="sticky-photo-preview" id="stickyPhotoPreview">
      <img id="stickyPreviewImg" src="" alt="Preview">
      <button class="sticky-remove-photo" onclick="removePhoto()"><i class="fas fa-times"></i></button>
    </div>
    <div class="sticky-btn-group">
      <button class="sticky-add-btn" id="stickyAddBtn" onclick="addSticky()">
        <i class="fas fa-plus"></i> <span>Tambah</span>
      </button>
      <button class="sticky-upload-btn" onclick="document.getElementById('fileInput').click()">
        <i class="fas fa-upload"></i> Upload
      </button>
    </div>
  </div>
  <div class="sticky-list" id="stickyList"></div>
</div>

<script>
// ================= DATA CONFIG =================
const SHEET_ID = '1z5FYVvB0E9BeE3cRbl4id1YWi6lRB_2qzMhIvgz4Xx0';
const GID = '1251944242';
const RANGE = 'C2:F300';
const DATA_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${GID}&range=${RANGE}`;

let allKendala = [];
let filteredKendala = [];
let lightboxImages = [];
let lightboxIndex = 0;
let zoomLevel = 1;
let editIndex = null;

// ================= THEME TOGGLE =================
function applyTheme(light) {
  document.documentElement.classList.toggle('light', light);
  document.documentElement.classList.remove(light ? 'dark' : '');
  const b = document.getElementById('themeBtn');
  if (b) b.textContent = light ? '☀️' : '🌙';
  try { localStorage.setItem('kendala_theme', light ? '1' : '0'); } catch(e) {}
}
function toggleTheme() {
  applyTheme(!document.documentElement.classList.contains('light'));
}
try {
  const saved = localStorage.getItem('kendala_theme');
  applyTheme(saved === '1');
} catch(e) {}

// ================= PARTICLES =================
function createParticles() {
  const container = document.getElementById('particles');
  if (!container) return;
  container.innerHTML = '';
  for (let i = 0; i < 20; i++) {
    const particle = document.createElement('div');
    particle.className = 'particle';
    particle.style.left = Math.random() * 100 + '%';
    particle.style.animationDelay = Math.random() * 15 + 's';
    particle.style.animationDuration = (15 + Math.random() * 10) + 's';
    container.appendChild(particle);
  }
}

// ================= TOAST =================
function showToast(message, type = 'success') {
  const toast = document.getElementById('toast');
  if (!toast) return;
  toast.className = 'toast ' + type;
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

// ================= DATA LOADING =================
async function loadKendalaData() {
  try {
    const response = await fetch(DATA_URL);
    const text = await response.text();
    const jsonMatch = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);?/);
    if (!jsonMatch) throw new Error('Gagal parse');
    const data = JSON.parse(jsonMatch[1]);
    const rows = data.table?.rows || [];
    
    allKendala = rows.map(row => {
      const cells = row.c || [];
      return {
        judul: cells[0]?.v?.toString().trim() || '',
        jawaban1: cells[1]?.v?.toString().trim() || '',
        jawaban2: cells[2]?.v?.toString().trim() || '',
        jawaban3: cells[3]?.v?.toString().trim() || ''
      };
    }).filter(item => item.judul && item.judul !== '');
    
    filteredKendala = [...allKendala];
    renderKendala();
    updateStats();
    showToast(`✅ ${allKendala.length} kendala berhasil dimuat`, 'success');
  } catch (error) {
    document.getElementById('kendalaContainer').innerHTML = `
      <div class="error-msg">
        <i class="fas fa-exclamation-triangle" style="font-size: 32px; margin-bottom: 15px; color: var(--neon-red);"></i>
        <p style="font-weight:700;font-size:15px;"><strong>⚠️ Gagal memuat data</strong></p>
        <p style="font-size: 12px; margin-top: 10px; color: var(--text-muted);">Pastikan Google Sheet sudah dipublikasikan</p>
        <p style="font-size: 11px; margin-top: 12px; opacity: 0.7; font-family: 'JetBrains Mono', monospace;">${error.message}</p>
      </div>`;
    showToast('❌ Gagal memuat data', 'error');
  }
}

function renderKendala(data = filteredKendala) {
  const container = document.getElementById('kendalaContainer');
  if (data.length === 0) {
    container.innerHTML = `
      <div class="no-data" style="background:var(--field-bg);border:1px dashed var(--border-normal);border-radius:var(--radius-lg);padding:60px 24px;">
        <i class="fas fa-search" style="font-size:48px;margin-bottom:14px;opacity:0.4;color:var(--neon-cyan);"></i>
        <h3 style="font-family:'Space Grotesk',sans-serif;font-size:17px;margin-bottom:8px;letter-spacing:1px;">TIDAK DITEMUKAN</h3>
        <p style="font-size:12.5px;color:var(--text-secondary);">Tidak ada kendala yang sesuai dengan pencarian</p>
      </div>`;
    return;
  }
  container.innerHTML = `<div class="kendala-list">${data.map((item, index) => createKendalaCard(item, index)).join('')}</div>`;
  
  document.querySelectorAll('.kendala-title').forEach(title => {
    title.addEventListener('click', function() {
      this.parentElement.classList.toggle('expanded');
    });
  });
}

function createKendalaCard(item, index) {
  const titlePhoto = extractTitlePhoto(item.judul);
  const cleanJudul = titlePhoto ? item.judul.replace(titlePhoto.url, '').trim() : item.judul;
  const hasPhoto = detectPhotoLink(item);
  const links1 = extractLinks(item.jawaban1);
  const links2 = extractLinks(item.jawaban2);
  const links3 = extractLinks(item.jawaban3);
  const isNew = index < 3;
  
  return `
    <div class="kendala-card" data-index="${index}">
      ${isNew ? '<span class="kendala-badge-new">NEW</span>' : ''}
      <h3 class="kendala-title">${escapeHtml(cleanJudul)}</h3>
      ${titlePhoto ? createTitlePhotoSection(titlePhoto.url, index) : ''}
      <div class="kendala-answers">
        ${item.jawaban1 ? `
          <div class="answer-item">
            <div class="answer-label"><i class="fas fa-comment-alt"></i> JAWABAN 1</div>
            <div class="answer-content">${formatContent(item.jawaban1, links1)}</div>
            ${hasPhoto && !titlePhoto ? createPhotoSection(item) : ''}
            ${links1.length > 0 ? createLinkButtons(links1) : ''}
            <button class="copy-btn" onclick="copyAnswer(${index}, 1)"><i class="fas fa-copy"></i> Copy</button>
            <button class="sticky-btn" onclick="addToSticky(${index}, 1)"><i class="fas fa-sticky-note"></i> Sticky</button>
          </div>` : ''}
        ${item.jawaban2 ? `
          <div class="answer-item">
            <div class="answer-label"><i class="fas fa-comment-alt"></i> JAWABAN 2</div>
            <div class="answer-content">${formatContent(item.jawaban2, links2)}</div>
            ${links2.length > 0 ? createLinkButtons(links2) : ''}
            <button class="copy-btn" onclick="copyAnswer(${index}, 2)"><i class="fas fa-copy"></i> Copy</button>
            <button class="sticky-btn" onclick="addToSticky(${index}, 2)"><i class="fas fa-sticky-note"></i> Sticky</button>
          </div>` : ''}
        ${item.jawaban3 ? `
          <div class="answer-item">
            <div class="answer-label"><i class="fas fa-comment-alt"></i> JAWABAN 3</div>
            <div class="answer-content">${formatContent(item.jawaban3, links3)}</div>
            ${links3.length > 0 ? createLinkButtons(links3) : ''}
            <button class="copy-btn" onclick="copyAnswer(${index}, 3)"><i class="fas fa-copy"></i> Copy</button>
            <button class="sticky-btn" onclick="addToSticky(${index}, 3)"><i class="fas fa-sticky-note"></i> Sticky</button>
          </div>` : ''}
      </div>
    </div>`;
}

// ================= HELPER FUNCTIONS =================
function extractTitlePhoto(judul) {
  if (!judul) return null;
  const photoPattern = /(https?:\/\/[^\s]+\.(jpg|jpeg|png|gif|webp))/i;
  const match = judul.match(photoPattern);
  if (match) return { url: match[1], fullMatch: match[0] };
  return null;
}

function createTitlePhotoSection(photoUrl, index) {
  if (!lightboxImages.includes(photoUrl)) lightboxImages.push(photoUrl);
  return `
    <div class="title-photo-section">
      <img src="${photoUrl}" alt="Foto Kendala" class="title-photo-img" onclick="openLightbox('${photoUrl}')" onerror="this.parentElement.style.display='none'">
      <div class="title-photo-actions">
        <button class="copy-title-photo-btn" onclick="copyTitlePhoto('${photoUrl}')"><i class="fas fa-copy"></i> Copy Foto</button>
        <button class="view-title-photo-btn" onclick="openLightbox('${photoUrl}')"><i class="fas fa-expand"></i> Lihat Penuh</button>
      </div>
    </div>`;
}

function detectPhotoLink(item) {
  const photoPattern = /(https?:\/\/[^\s]+\.(jpg|jpeg|png|gif|webp))/i;
  return photoPattern.test(item.jawaban1) || photoPattern.test(item.jawaban2) || photoPattern.test(item.jawaban3);
}

function extractLinks(text) {
  if (!text) return [];
  const urlPattern = /https?:\/\/[^\s<>"{}|\\^`\[\]]+/gi;
  return text.match(urlPattern) || [];
}

function formatContent(text, links = []) {
  if (!text) return '';
  let formatted = escapeHtml(text);
  links.forEach(link => {
    const escapedLink = escapeHtml(link);
    const displayText = link.length > 45 ? link.substring(0, 42) + '...' : link;
    const regex = new RegExp(`(^|[^"'=])${escapeRegExp(escapedLink)}`, 'g');
    formatted = formatted.replace(regex, `$1<a href="${escapedLink}" target="_blank" rel="noopener">${displayText}</a>`);
  });
  return formatted;
}

function createPhotoSection(item) {
  const photoPattern = /(https?:\/\/[^\s]+\.(jpg|jpeg|png|gif|webp))/i;
  const match = (item.jawaban1 + ' ' + item.jawaban2 + ' ' + item.jawaban3).match(photoPattern);
  if (!match) return '';
  const photoUrl = match[1];
  if (!lightboxImages.includes(photoUrl)) lightboxImages.push(photoUrl);
  return `
    <div class="photo-container">
      <img src="${photoUrl}" alt="Foto" class="photo-img" onclick="openLightbox('${photoUrl}')" onerror="this.parentElement.style.display='none'">
      <button class="copy-btn" onclick="copyPhoto('${photoUrl}')"><i class="fas fa-copy"></i> Copy Foto</button>
    </div>`;
}

function createLinkButtons(links) {
  if (links.length === 0) return '';
  const linksEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(links))));
  return `
    <div class="link-buttons">
      ${links.map((link, i) => {
        const label = links.length > 1 ? `Link ${i+1}` : 'Buka Link';
        return `<a href="${link}" target="_blank" rel="noopener" class="open-link-btn">
          <i class="fas fa-external-link-alt"></i> ${label}
        </a>`;
      }).join('')}
      ${links.length > 1 ? `
        <button class="open-all-links-btn" onclick="openAllLinks('${linksEncoded}')" title="Buka semua ${links.length} link sekaligus">
          <i class="fas fa-layer-group"></i> Buka Semua <span class="link-count">${links.length}</span>
        </button>
      ` : ''}
    </div>`;
}

function openAllLinks(linksEncoded) {
  try {
    const links = JSON.parse(decodeURIComponent(escape(atob(linksEncoded))));
    if (!links || links.length === 0) {
      showToast('⚠️ Tidak ada link untuk dibuka', 'warning');
      return;
    }
    let openedCount = 0;
    let blockedCount = 0;
    links.forEach((link, index) => {
      setTimeout(() => {
        const newWindow = window.open(link, '_blank', 'noopener,noreferrer');
        if (newWindow && !newWindow.closed) openedCount++;
        else blockedCount++;
        if (index === links.length - 1) {
          setTimeout(() => {
            if (blockedCount > 0) {
              showToast(`⚠️ ${openedCount} dibuka, ${blockedCount} diblokir popup`, 'warning');
            } else {
              showToast(`✅ ${openedCount} link berhasil dibuka!`, 'success');
            }
          }, 200);
        }
      }, index * 150);
    });
  } catch (error) {
    console.error('Error membuka semua link:', error);
    showToast('❌ Gagal membuka link', 'error');
  }
}

async function copyAnswer(index, answerNum) {
  const item = filteredKendala[index];
  const content = item[`jawaban${answerNum}`];
  if (!content) return;
  try {
    await navigator.clipboard.writeText(content);
    showToast('✅ Jawaban disalin!', 'success');
    const btn = event.target.closest('.copy-btn');
    if (btn) {
      const original = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
      btn.style.background = 'var(--neon-green)';
      btn.classList.add('copy-flash');
      setTimeout(() => {
        btn.innerHTML = original;
        btn.style.background = '';
        btn.classList.remove('copy-flash');
      }, 1500);
    }
  } catch {
    fallbackCopy(content);
  }
}

async function copyTitlePhoto(url) {
  try {
    const response = await fetch(url, {mode:'cors'});
    const blob = await response.blob();
    if (navigator.clipboard && typeof ClipboardItem !== 'undefined') {
      await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
      showToast('✅ Foto disalin!', 'success');
    } else {
      throw new Error('Not supported');
    }
  } catch {
    try {
      await navigator.clipboard.writeText(url);
      showToast('📋 URL foto disalin (CORS)', 'warning');
    } catch(e) {
      showToast('❌ Gagal copy foto', 'error');
    }
  }
}

async function copyPhoto(url) {
  try {
    const response = await fetch(url, {mode:'cors'});
    const blob = await response.blob();
    if (navigator.clipboard && typeof ClipboardItem !== 'undefined') {
      await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
      showToast('✅ Foto disalin!', 'success');
    } else {
      throw new Error('Not supported');
    }
  } catch {
    try {
      await navigator.clipboard.writeText(url);
      showToast('📋 URL foto disalin (CORS)', 'warning');
    } catch(e) {
      showToast('❌ Gagal copy foto', 'error');
    }
  }
}

function fallbackCopy(text) {
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.left = '-9999px';
  document.body.appendChild(textarea);
  textarea.select();
  try {
    document.execCommand('copy');
    showToast('✅ Disalin!', 'success');
  } catch {
    showToast('❗ Gagal menyalin', 'error');
  }
  document.body.removeChild(textarea);
}

function searchKendala() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  const countEl = document.getElementById('searchCount');
  if (!query) {
    filteredKendala = [...allKendala];
    renderKendala();
    updateStats();
    countEl.classList.remove('show');
    return;
  }
  filteredKendala = allKendala.filter(item =>
    item.judul.toLowerCase().includes(query) ||
    (item.jawaban1 && item.jawaban1.toLowerCase().includes(query)) ||
    (item.jawaban2 && item.jawaban2.toLowerCase().includes(query)) ||
    (item.jawaban3 && item.jawaban3.toLowerCase().includes(query))
  );
  renderKendala();
  updateStats();
  countEl.textContent = `${filteredKendala.length} ditemukan`;
  countEl.classList.add('show');
}

function updateStats() {
  document.getElementById('totalItems').textContent = allKendala.length;
  const withPhotos = allKendala.filter(item => detectPhotoLink(item) || extractTitlePhoto(item.judul)).length;
  document.getElementById('withPhotos').textContent = withPhotos;
  const withLinks = allKendala.filter(item =>
    extractLinks(item.jawaban1).length > 0 ||
    extractLinks(item.jawaban2).length > 0 ||
    extractLinks(item.jawaban3).length > 0
  ).length;
  document.getElementById('withLinks').textContent = withLinks;
  document.getElementById('shownItems').textContent = filteredKendala.length;
}

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function escapeRegExp(string) {
  return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

// ================= LIGHTBOX =================
function openLightbox(url) {
  lightboxIndex = lightboxImages.indexOf(url);
  if (lightboxIndex === -1) {
    lightboxImages.push(url);
    lightboxIndex = lightboxImages.length - 1;
  }
  document.getElementById('lightboxImg').src = url;
  document.getElementById('lightbox').classList.add('active');
  document.body.style.overflow = 'hidden';
  zoomLevel = 1;
  document.getElementById('zoomSlider').value = 1;
  updateZoom();
}

function closeLightbox(event) {
  if (!event || event.target.id === 'lightbox' || event.target.classList.contains('lightbox-close') || event.target.parentElement.classList.contains('lightbox-close')) {
    document.getElementById('lightbox').classList.remove('active');
    document.getElementById('lightboxImg').src = '';
    document.body.style.overflow = '';
  }
}

function changeLightbox(direction) {
  lightboxIndex += direction;
  if (lightboxIndex < 0) lightboxIndex = lightboxImages.length - 1;
  if (lightboxIndex >= lightboxImages.length) lightboxIndex = 0;
  document.getElementById('lightboxImg').src = lightboxImages[lightboxIndex];
  zoomLevel = 1;
  document.getElementById('zoomSlider').value = 1;
  updateZoom();
}

function updateZoom() {
  zoomLevel = parseFloat(document.getElementById('zoomSlider').value);
  document.getElementById('lightboxImg').style.transform = `scale(${zoomLevel})`;
}

async function copyLightboxPhoto() {
  const url = document.getElementById('lightboxImg').src;
  if (url) await copyPhoto(url);
}

// ================= STICKY NOTES =================
function toggleStickyPanel() {
  const panel = document.getElementById("stickyPanel");
  panel.style.display = panel.style.display === "flex" ? "none" : "flex";
  if (panel.style.display === "flex") loadStickyNotes();
}

function autoResize(el) {
  el.style.height = "auto";
  el.style.height = (el.scrollHeight) + "px";
}

async function addSticky() {
  const input = document.getElementById("stickyInput");
  const text = input.value.trim();
  const image = input.dataset.image || null;
  if (!text && !image) return;
  
  let stickies = JSON.parse(localStorage.getItem("stickies") || "[]");
  if (editIndex !== null) {
    stickies[editIndex] = { text, image };
    editIndex = null;
    document.getElementById("stickyAddBtn").querySelector("span").textContent = "Tambah";
  } else {
    stickies.push({ text, image });
  }
  localStorage.setItem("stickies", JSON.stringify(stickies));
  
  input.value = "";
  input.dataset.image = "";
  autoResize(input);
  removePhoto();
  loadStickyNotes();
  showToast('✅ Catatan ditambahkan!', 'success');
}

function loadStickyNotes() {
  const list = document.getElementById("stickyList");
  if (!list) return;
  list.innerHTML = "";
  const stickies = JSON.parse(localStorage.getItem("stickies") || "[]");
  
  if (stickies.length === 0) {
    list.innerHTML = '<div style="text-align:center; padding: 30px; color: var(--text-muted); font-size: 12px; font-family: Space Grotesk, sans-serif; letter-spacing: 1px;">Kosong - Tambahkan catatan</div>';
    return;
  }
  
  stickies.forEach((note, i) => {
    const div = document.createElement("div");
    div.className = "sticky-card";
    div.dataset.index = i;
    
    if (note.text) {
      const p = document.createElement("p");
      p.textContent = note.text;
      div.appendChild(p);
    }
    if (note.image) {
      const img = document.createElement("img");
      img.src = note.image;
      img.onclick = () => openLightbox(note.image);
      div.appendChild(img);
    }
    
    div.onclick = async (e) => {
      if (e.target.classList.contains('sticky-delete') || e.target.classList.contains('sticky-edit') || e.target.tagName === 'IMG') return;
      try {
        const items = {};
        if (note.text) items["text/plain"] = new Blob([note.text], { type: "text/plain" });
        if (note.image) {
          try {
            const resp = await fetch(note.image);
            const blob = await resp.blob();
            items[blob.type] = blob;
          } catch(err) {}
        }
        await navigator.clipboard.write([new ClipboardItem(items)]);
        showToast("✅ Teks + Gambar disalin!", 'success');
      } catch {
        showToast("⚠ Gagal menyalin", 'error');
      }
    };
    
    const del = document.createElement("button");
    del.innerHTML = '<i class="fas fa-times"></i>';
    del.className = "sticky-delete";
    del.onclick = e => { e.stopPropagation(); deleteSticky(i); };
    
    const edit = document.createElement("button");
    edit.innerHTML = '<i class="fas fa-edit"></i>';
    edit.className = "sticky-edit";
    edit.onclick = e => { e.stopPropagation(); editSticky(i); };
    
    div.appendChild(del);
    div.appendChild(edit);
    div.setAttribute("draggable", true);
    div.ondragstart = e => e.dataTransfer.setData("text/plain", i);
    div.ondragover = e => { e.preventDefault(); div.style.borderColor = 'var(--neon-cyan)'; };
    div.ondragleave = () => div.style.borderColor = '';
    div.ondrop = e => {
      e.preventDefault();
      div.style.borderColor = '';
      reorderSticky(e.dataTransfer.getData("text/plain"), i);
    };
    
    list.appendChild(div);
  });
}

function reorderSticky(from, to) {
  let stickies = JSON.parse(localStorage.getItem("stickies") || "[]");
  const moved = stickies.splice(from, 1)[0];
  stickies.splice(to, 0, moved);
  localStorage.setItem("stickies", JSON.stringify(stickies));
  loadStickyNotes();
}

function deleteSticky(i) {
  let stickies = JSON.parse(localStorage.getItem("stickies") || "[]");
  stickies.splice(i, 1);
  localStorage.setItem("stickies", JSON.stringify(stickies));
  loadStickyNotes();
  showToast('🗑️ Catatan dihapus', 'success');
}

function editSticky(i) {
  const stickies = JSON.parse(localStorage.getItem("stickies") || "[]");
  const input = document.getElementById("stickyInput");
  input.value = stickies[i].text || "";
  input.dataset.image = stickies[i].image || "";
  autoResize(input);
  if (stickies[i].image) showPhotoPreview(stickies[i].image);
  else removePhoto();
  editIndex = i;
  document.getElementById("stickyAddBtn").querySelector("span").textContent = "Update";
  input.focus();
}

function handleFileSelect(event) {
  const file = event.target.files[0];
  if (file && file.type.startsWith('image/')) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const base64 = e.target.result;
      document.getElementById("stickyInput").dataset.image = base64;
      showPhotoPreview(base64);
      showToast('📸 Foto diunggah!', 'success');
    };
    reader.readAsDataURL(file);
  }
}

function handleStickyPaste(event) {
  const items = event.clipboardData.items;
  for (let i = 0; i < items.length; i++) {
    if (items[i].type.startsWith('image/')) {
      event.preventDefault();
      const blob = items[i].getAsFile();
      const reader = new FileReader();
      reader.onload = function(e) {
        const base64 = e.target.result;
        document.getElementById("stickyInput").dataset.image = base64;
        showPhotoPreview(base64);
        showToast('📸 Foto ditempel!', 'success');
      };
      reader.readAsDataURL(blob);
      break;
    }
  }
}

function showPhotoPreview(dataUrl) {
  const preview = document.getElementById('stickyPhotoPreview');
  const previewImg = document.getElementById('stickyPreviewImg');
  previewImg.src = dataUrl;
  preview.classList.add('show');
}

function removePhoto() {
  const input = document.getElementById("stickyInput");
  if(input) input.dataset.image = "";
  document.getElementById('stickyPhotoPreview').classList.remove('show');
  document.getElementById('fileInput').value = '';
}

function addToSticky(kendalaIndex, answerNum) {
  const item = filteredKendala[kendalaIndex];
  const content = item[`jawaban${answerNum}`];
  if (!content) return;
  const photoPattern = /(https?:\/\/[^\s]+\.(jpg|jpeg|png|gif|webp))/i;
  const match = content.match(photoPattern);
  const imageUrl = match ? match[1] : null;
  
  let stickies = JSON.parse(localStorage.getItem("stickies") || "[]");
  stickies.push({
    text: imageUrl ? content.replace(photoPattern, '').trim() : content,
    image: imageUrl
  });
  localStorage.setItem("stickies", JSON.stringify(stickies));
  loadStickyNotes();
  showToast('✅ Ditambahkan ke Sticky Notes!', 'success');
}

// ================= INITIALIZATION =================
document.addEventListener('DOMContentLoaded', () => {
  createParticles();
  loadKendalaData();
  const stickyInput = document.getElementById('stickyInput');
  if (stickyInput) {
    stickyInput.addEventListener('paste', handleStickyPaste);
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeLightbox();
    const panel = document.getElementById("stickyPanel");
    if (panel.style.display === "flex") toggleStickyPanel();
  }
});
</script>
</body>
</html>
