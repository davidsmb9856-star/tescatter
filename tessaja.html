<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6fa3cf">
<title>⚡ FOTO - LINE TOGEL 2026 · Dove Blue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* ============================================================ */
/* 🕊️ DOVE BLUE THEME - sama dengan ScriptVault                */
/* ============================================================ */
:root {
  --bg-primary: #0f1d2b;
  --bg-secondary: #132434;
  --bg-tertiary: #1a2f42;
  --bg-card: #1a2f42;
  --bg-hover: #27455f;
  --field-bg: rgba(0, 0, 0, 0.35);
  --code-bg: rgba(0, 0, 0, 0.4);
  --overlay-bg: rgba(2, 4, 8, 0.88);

  --neon-cyan: #6fa3cf;
  --neon-blue: #8fbce0;
  --neon-purple: #aacfeb;
  --neon-pink: #ef5350;
  --neon-green: #34d399;
  --neon-yellow: #f0a830;
  --neon-red: #ef5350;

  --text-primary: #e8f0f8;
  --text-secondary: #9fb2c4;
  --text-tertiary: #7f96ab;
  --text-muted: #5a7186;

  --border-subtle: rgba(255, 255, 255, 0.06);
  --border-normal: rgba(255, 255, 255, 0.12);
  --border-strong: rgba(255, 255, 255, 0.2);
  --border-glow: rgba(111, 163, 207, 0.5);

  --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.4);
  --shadow-md: 0 6px 18px rgba(0, 0, 0, 0.5);
  --shadow-lg: 0 14px 40px rgba(0, 0, 0, 0.6);
  --shadow-glow: 0 0 18px rgba(111, 163, 207, 0.25);

  --radius-sm: 8px;
  --radius-md: 11px;
  --radius-lg: 14px;
  --radius-xl: 18px;
  --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-bounce: 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
html, body {
  font-family: 'Inter', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  line-height: 1.6;
}

/* Noise texture */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  opacity: 0.025;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

.bg-effects {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}
.bg-effects::before {
  content: '';
  position: absolute;
  width: 700px;
  height: 700px;
  background: radial-gradient(circle, rgba(111, 163, 207, 0.1) 0%, transparent 65%);
  top: -250px;
  left: -200px;
  animation: float1 22s ease-in-out infinite;
  filter: blur(20px);
}
.bg-effects::after {
  content: '';
  position: absolute;
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, rgba(170, 207, 235, 0.08) 0%, transparent 65%);
  bottom: -200px;
  right: -200px;
  animation: float2 26s ease-in-out infinite;
  filter: blur(20px);
}
@keyframes float1 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(100px, 80px) scale(1.12); }
}
@keyframes float2 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(-80px, -60px) scale(1.08); }
}

.grid-overlay {
  position: fixed;
  inset: 0;
  z-index: 0;
  background-image:
    linear-gradient(rgba(111, 163, 207, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(111, 163, 207, 0.03) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black 30%, transparent 75%);
  animation: gridMove 30s linear infinite;
  pointer-events: none;
}
@keyframes gridMove {
  0% { background-position: 0 0; }
  100% { background-position: 44px 44px; }
}

.scanline {
  position: fixed;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(111, 163, 207, 0.4), transparent);
  opacity: 0.4;
  animation: scanLine 9s linear infinite;
  z-index: 1;
  pointer-events: none;
  filter: blur(1px);
}
@keyframes scanLine {
  0% { top: -2px; opacity: 0; }
  5% { opacity: 0.4; }
  95% { opacity: 0.4; }
  100% { top: 100%; opacity: 0; }
}

/* Layout */
.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 30px 20px;
  min-height: 100vh;
  position: relative;
  z-index: 1;
}

.back-btn {
  position: fixed;
  left: 18px;
  top: 22px;
  background: var(--field-bg);
  border: 1px solid rgba(111, 163, 207, 0.3);
  color: var(--neon-cyan);
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  text-decoration: none;
  font-weight: 600;
  font-size: 11px;
  display: flex;
  align-items: center;
  gap: 7px;
  transition: var(--transition);
  backdrop-filter: blur(12px);
  z-index: 1000;
  font-family: 'Space Grotesk', sans-serif;
  letter-spacing: 0.5px;
}
.back-btn:hover {
  background: rgba(111, 163, 207, 0.16);
  border-color: var(--neon-cyan);
  transform: translateX(-3px);
  box-shadow: var(--shadow-glow);
}

/* Theme toggle */
.theme-toggle {
  position: fixed;
  right: 18px;
  top: 22px;
  width: 40px;
  height: 40px;
  background: var(--field-bg);
  border: 1px solid rgba(111, 163, 207, 0.3);
  color: var(--neon-cyan);
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: grid;
  place-items: center;
  font-size: 16px;
  transition: var(--transition);
  backdrop-filter: blur(12px);
  z-index: 1000;
}
.theme-toggle:hover {
  background: rgba(111, 163, 207, 0.16);
  border-color: var(--neon-cyan);
  transform: scale(1.06);
  box-shadow: var(--shadow-glow);
}

/* Header */
.header {
  text-align: center;
  margin-bottom: 32px;
  animation: headerEntrance 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
}
@keyframes headerEntrance {
  from { opacity: 0; transform: translateY(-30px); }
  to { opacity: 1; transform: translateY(0); }
}
.title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: clamp(26px, 6vw, 44px);
  font-weight: 700;
  letter-spacing: 2px;
  margin-bottom: 10px;
  background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue), var(--text-primary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-transform: uppercase;
}
.subtitle {
  font-size: 11px;
  color: var(--text-secondary);
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-bottom: 16px;
  font-weight: 500;
  font-family: 'Space Grotesk', sans-serif;
}
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 16px;
  background: rgba(52, 211, 153, 0.08);
  border: 1px solid rgba(52, 211, 153, 0.3);
  border-radius: 100px;
  font-size: 10px;
  font-weight: 700;
  color: var(--neon-green);
  text-transform: uppercase;
  letter-spacing: 2px;
  font-family: 'Space Grotesk', sans-serif;
}
.status-dot {
  width: 7px;
  height: 7px;
  background: var(--neon-green);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--neon-green);
  animation: pulse2 2.5s infinite;
}
@keyframes pulse2 {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* Stats Bento */
.stats-bento {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  max-width: 800px;
  margin: 0 auto 28px;
}
.stat-card {
  background: linear-gradient(135deg, var(--bg-tertiary), var(--bg-secondary));
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}
.stat-card::before {
  content: '';
  position: absolute;
  top: -40px;
  right: -40px;
  width: 110px;
  height: 110px;
  border-radius: 50%;
  filter: blur(50px);
  opacity: 0.16;
  transition: opacity 0.4s;
}
.stat-card:nth-child(1)::before { background: var(--neon-cyan); }
.stat-card:nth-child(2)::before { background: var(--neon-blue); }
.stat-card:nth-child(3)::before { background: var(--neon-purple); }
.stat-card:hover {
  border-color: rgba(111, 163, 207, 0.3);
  transform: translateY(-3px);
  box-shadow: var(--shadow-glow);
}
.stat-card:hover::before { opacity: 0.3; }
.stat-label {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 9px;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 7px;
}
.stat-label .icon { font-size: 14px; }
.stat-value {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 24px;
  font-weight: 800;
  margin-top: 6px;
  letter-spacing: -0.03em;
  background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue), var(--text-primary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  line-height: 1.1;
}
.stat-sub {
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 3px;
  font-weight: 500;
}

/* Search */
.search-container {
  max-width: 600px;
  margin: 0 auto 28px;
}
.search-box {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--field-bg);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 12px 16px;
  transition: var(--transition);
}
.search-box:focus-within {
  border-color: var(--neon-cyan);
  background: rgba(111, 163, 207, 0.08);
  box-shadow: 0 0 0 3px rgba(111, 163, 207, 0.1);
}
.search-box i { color: var(--text-muted); font-size: 14px; }
.search-box input {
  background: none;
  border: none;
  outline: none;
  color: var(--text-primary);
  flex: 1;
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  font-weight: 500;
}
.search-box input::placeholder { color: var(--text-muted); }
.search-count {
  font-size: 10px;
  color: var(--neon-cyan);
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 600;
  background: rgba(111, 163, 207, 0.1);
  padding: 3px 9px;
  border-radius: 6px;
  border: 1px solid rgba(111, 163, 207, 0.25);
  white-space: nowrap;
}

/* Gallery */
.gallery-section { margin-bottom: 30px; }
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}

/* Photo Card */
.photo-card {
  background: linear-gradient(135deg, var(--bg-tertiary), var(--bg-secondary));
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  overflow: hidden;
  transition: var(--transition);
  position: relative;
  animation: cardEnter 0.5s ease forwards;
  opacity: 0;
  transform: translateY(20px);
}
.photo-card:nth-child(1) { animation-delay: 0.05s; }
.photo-card:nth-child(2) { animation-delay: 0.1s; }
.photo-card:nth-child(3) { animation-delay: 0.15s; }
.photo-card:nth-child(4) { animation-delay: 0.2s; }
.photo-card:nth-child(5) { animation-delay: 0.25s; }
@keyframes cardEnter {
  to { opacity: 1; transform: translateY(0); }
}
.photo-card::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(120deg, transparent, rgba(111, 163, 207, 0.08), transparent);
  transition: left 0.6s ease;
  z-index: 1;
  pointer-events: none;
}
.photo-card:hover::before { left: 100%; }
.photo-card:hover {
  border-color: rgba(111, 163, 207, 0.3);
  transform: translateY(-4px);
  box-shadow: var(--shadow-glow);
}

.photo-wrapper {
  position: relative;
  width: 100%;
  height: 280px;
  background: radial-gradient(circle at center, #0f1d2b 0%, #0a1520 100%);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.photo-wrapper img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  transition: transform 0.3s ease;
  cursor: pointer;
}
.photo-card:hover .photo-wrapper img { transform: scale(1.05); }
.photo-badge-new {
  position: absolute;
  top: 8px;
  right: 8px;
  background: rgba(239, 83, 80, 0.85);
  color: #fff;
  padding: 3px 8px;
  border-radius: 5px;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 1px;
  font-family: 'Space Grotesk', sans-serif;
  z-index: 2;
  animation: badgePulse 1.8s ease-in-out infinite;
}
@keyframes badgePulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 0 rgba(239, 83, 80, 0.4); }
  50% { transform: scale(1.08); box-shadow: 0 0 12px rgba(239, 83, 80, 0.6); }
}

.photo-info { padding: 14px 16px; }
.photo-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 13.5px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 4px;
  word-break: break-word;
  text-align: center;
  letter-spacing: 0.5px;
}
.photo-meta {
  font-size: 10px;
  color: var(--text-tertiary);
  text-align: center;
  margin-bottom: 12px;
  font-family: 'Space Grotesk', sans-serif;
  letter-spacing: 1px;
}

/* Action buttons */
.action-buttons-row {
  display: flex;
  gap: 8px;
  justify-content: center;
  padding-top: 12px;
  border-top: 1px solid var(--border-subtle);
}
.action-btn-cool {
  flex: 1;
  height: 40px;
  background: var(--field-bg);
  border: 1px solid var(--border-normal);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-family: 'Inter', sans-serif;
}
.action-btn-cool i { font-size: 15px; }
.action-btn-cool span { font-size: 9px; font-weight: 600; }
.action-btn-cool.copy-btn:hover {
  background: rgba(52, 211, 153, 0.1);
  border-color: var(--neon-green);
  color: var(--neon-green);
  transform: translateY(-2px);
  box-shadow: 0 0 12px rgba(52, 211, 153, 0.25);
}
.action-btn-cool.download-btn:hover {
  background: rgba(111, 163, 207, 0.1);
  border-color: var(--neon-cyan);
  color: var(--neon-cyan);
  transform: translateY(-2px);
  box-shadow: 0 0 12px rgba(111, 163, 207, 0.25);
}

/* Loading */
.loading {
  display: none;
  text-align: center;
  padding: 40px;
  grid-column: 1 / -1;
}
.loading.active { display: block; }
.loader {
  width: 46px;
  height: 46px;
  border: 3px solid rgba(111, 163, 207, 0.15);
  border-top-color: var(--neon-cyan);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 16px;
  box-shadow: var(--shadow-glow);
}
@keyframes spin { to { transform: rotate(360deg); } }
.no-results {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 24px;
  background: var(--field-bg);
  border: 1px dashed var(--border-normal);
  border-radius: var(--radius-lg);
  color: var(--text-secondary);
}
.no-results i { font-size: 48px; margin-bottom: 14px; opacity: 0.4; color: var(--neon-cyan); }
.no-results h3 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 17px;
  margin-bottom: 8px;
  letter-spacing: 1px;
  color: var(--text-primary);
}
.no-results p { font-size: 12.5px; }

/* Modal */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: var(--overlay-bg);
  backdrop-filter: blur(24px);
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.modal-backdrop.active { display: flex; animation: fadeIn 0.3s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-content {
  background: linear-gradient(135deg, var(--bg-tertiary), var(--bg-secondary));
  border: 1px solid rgba(111, 163, 207, 0.3);
  border-radius: var(--radius-xl);
  max-width: 900px;
  width: 100%;
  max-height: 95vh;
  overflow: auto;
  display: flex;
  flex-direction: column;
  position: relative;
  box-shadow: var(--shadow-lg), var(--shadow-glow);
}
.modal-content::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-blue), transparent);
  background-size: 200% 100%;
  animation: borderFlow 2.5s linear infinite;
}
@keyframes borderFlow {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 22px;
  border-bottom: 1px solid var(--border-subtle);
}
.modal-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--neon-cyan);
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.modal-title .bar {
  width: 4px;
  height: 18px;
  background: linear-gradient(180deg, var(--neon-cyan), var(--neon-blue));
  border-radius: 2px;
  box-shadow: 0 0 8px var(--neon-cyan);
}
.modal-close {
  width: 34px;
  height: 34px;
  background: var(--field-bg);
  border: 1px solid var(--border-normal);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: 14px;
  cursor: pointer;
  transition: var(--transition);
}
.modal-close:hover {
  background: rgba(239, 83, 80, 0.1);
  border-color: var(--neon-red);
  color: var(--neon-red);
  transform: rotate(90deg);
}
.modal-body {
  padding: 22px;
  text-align: center;
  overflow-y: auto;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at center, #0f1d2b 0%, #0a1520 100%);
}
.modal-body img {
  max-width: 100%;
  max-height: 70vh;
  width: auto;
  object-fit: contain;
  border-radius: var(--radius-sm);
  box-shadow: 0 0 20px rgba(111, 163, 207, 0.2);
}
.modal-url-display {
  width: 100%;
  background: var(--code-bg);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-tertiary);
  word-break: break-all;
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 14px;
}
.modal-url-display .url {
  flex: 1;
  user-select: all;
  text-align: left;
}
.modal-url-display .copy-url-btn {
  background: rgba(111, 163, 207, 0.1);
  border: 1px solid rgba(111, 163, 207, 0.3);
  color: var(--neon-cyan);
  padding: 5px 10px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 10px;
  font-weight: 700;
  transition: var(--transition);
  font-family: 'Inter', sans-serif;
  white-space: nowrap;
}
.modal-url-display .copy-url-btn:hover {
  background: rgba(111, 163, 207, 0.2);
  border-color: var(--neon-cyan);
}
.modal-actions {
  margin-top: 18px;
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}
.btn {
  padding: 10px 20px;
  border-radius: var(--radius-md);
  font-family: 'Inter', sans-serif;
  font-size: 11.5px;
  font-weight: 700;
  cursor: pointer;
  transition: var(--transition);
  border: none;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
}
.btn-primary {
  background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue));
  color: #fff;
  box-shadow: var(--shadow-glow);
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 24px rgba(111, 163, 207, 0.45);
}
.btn-secondary {
  background: var(--field-bg);
  color: var(--text-primary);
  border: 1px solid var(--border-normal);
}
.btn-secondary:hover {
  background: rgba(111, 163, 207, 0.08);
  border-color: var(--neon-cyan);
  color: var(--neon-cyan);
  transform: translateY(-2px);
}

/* Toast */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: linear-gradient(135deg, var(--bg-hover), var(--bg-tertiary));
  backdrop-filter: blur(24px);
  border: 1px solid rgba(111, 163, 207, 0.3);
  border-left: 3px solid var(--neon-cyan);
  color: var(--text-primary);
  padding: 13px 18px;
  border-radius: var(--radius-md);
  font-weight: 500;
  font-size: 12px;
  z-index: 10000;
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: var(--shadow-glow);
  transform: translateX(200px);
  opacity: 0;
  transition: var(--transition-bounce);
  max-width: 340px;
}
.toast.show { transform: translateX(0); opacity: 1; }
.toast.success { border-left-color: var(--neon-green); }
.toast.success .icon { color: var(--neon-green); }
.toast.error { border-left-color: var(--neon-red); }
.toast.error .icon { color: var(--neon-red); }
.toast .icon { font-size: 17px; color: var(--neon-cyan); }

.copy-flash {
  animation: copyFlash 0.6s ease;
}
@keyframes copyFlash {
  0% { background: var(--field-bg); }
  50% { background: rgba(52, 211, 153, 0.2); border-color: var(--neon-green); }
  100% { background: var(--field-bg); }
}

/* Light mode */
html.light {
  --bg-primary: #eef5fb;
  --bg-secondary: #f7fbff;
  --bg-tertiary: #ffffff;
  --bg-card: #ffffff;
  --bg-hover: #e6f0f9;
  --field-bg: rgba(31, 58, 84, 0.05);
  --code-bg: rgba(31, 58, 84, 0.06);
  --overlay-bg: rgba(15, 28, 42, 0.45);
  --neon-cyan: #4682b4;
  --neon-blue: #37688f;
  --neon-purple: #2e5474;
  --neon-green: #15803d;
  --neon-yellow: #b45309;
  --neon-red: #c62828;
  --text-primary: #13232f;
  --text-secondary: #4a5d6e;
  --text-tertiary: #6b7c8c;
  --text-muted: #93a3b1;
  --border-subtle: rgba(31, 58, 84, 0.08);
  --border-normal: rgba(31, 58, 84, 0.16);
  --border-strong: rgba(31, 58, 84, 0.28);
  --border-glow: rgba(70, 130, 180, 0.5);
  --shadow-sm: 0 2px 6px rgba(31, 58, 84, 0.08);
  --shadow-md: 0 6px 18px rgba(31, 58, 84, 0.12);
  --shadow-lg: 0 14px 40px rgba(31, 58, 84, 0.18);
  --shadow-glow: 0 0 18px rgba(70, 130, 180, 0.18);
}
html.light .grid-overlay {
  background-image:
    linear-gradient(rgba(70, 130, 180, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(70, 130, 180, 0.05) 1px, transparent 1px);
}
html.light .photo-wrapper {
  background: radial-gradient(circle at center, #f0f5fa 0%, #e5edf5 100%);
}
html.light .modal-body {
  background: radial-gradient(circle at center, #f0f5fa 0%, #e5edf5 100%);
}

@media (max-width: 768px) {
  .container { padding: 18px 12px; }
  .back-btn { left: 10px; top: 12px; padding: 6px 10px; font-size: 9px; }
  .theme-toggle { right: 10px; top: 12px; width: 36px; height: 36px; font-size: 14px; }
  .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .photo-wrapper { height: 180px; }
  .action-btn-cool { height: 36px; }
  .action-btn-cool i { font-size: 13px; }
  .action-btn-cool span { font-size: 8px; }
  .stats-bento { grid-template-columns: repeat(2, 1fr); }
}

::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, var(--neon-cyan), var(--neon-blue));
  border-radius: 6px;
  border: 2px solid var(--bg-primary);
}
::selection { background: rgba(111, 163, 207, 0.35); color: var(--text-primary); }
</style>
</head>
<body>
<div class="bg-effects"></div>
<div class="grid-overlay"></div>
<div class="scanline"></div>

<a href="index.html" class="back-btn">
  <i class="fas fa-arrow-left"></i> Kembali
</a>

<button class="theme-toggle" onclick="toggleTheme()" title="Ganti Tema Terang/Gelap" id="themeBtn">🌙</button>

<div class="container">
  <header class="header">
    <h1 class="title">⚡ Foto Gallery</h1>
    <p class="subtitle">Line Togel · Dove Blue 2026</p>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>System Online</span>
    </div>
  </header>

  <!-- Stats Bento -->
  <div class="stats-bento">
    <div class="stat-card">
      <div class="stat-label"><span class="icon"><i class="fas fa-camera"></i></span> Total Foto</div>
      <div class="stat-value" id="statTotal">0</div>
      <div class="stat-sub">Galeri foto</div>
    </div>
    <div class="stat-card">
      <div class="stat-label"><span class="icon"><i class="fas fa-filter"></i></span> Ditampilkan</div>
      <div class="stat-value" id="statShown">0</div>
      <div class="stat-sub">Foto aktif</div>
    </div>
    <div class="stat-card">
      <div class="stat-label"><span class="icon"><i class="fas fa-clock"></i></span> Terbaru</div>
      <div class="stat-value" id="statRecent" style="font-size:15px">-</div>
      <div class="stat-sub">Update terakhir</div>
    </div>
  </div>

  <section id="gallery" class="gallery-section">
    <div class="search-container">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Cari foto berdasarkan judul..." onkeyup="searchPhotos()">
        <span class="search-count" id="searchCount" style="display:none"></span>
      </div>
    </div>

    <div class="loading" id="loading">
      <div class="loader"></div>
      <div style="color: var(--neon-cyan); font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 3px; text-transform: uppercase;">Loading Photos...</div>
    </div>

    <div class="gallery-grid" id="galleryGrid"></div>
  </section>
</div>

<!-- Modal -->
<div class="modal-backdrop" id="imageModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 class="modal-title"><span class="bar"></span><i class="fas fa-image"></i> <span id="modalTitle">Foto Detail</span></h3>
      <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body">
      <img src="" alt="" id="modalImage">
      <div class="modal-url-display">
        <span class="url" id="modalUrl"></span>
        <button class="copy-url-btn" onclick="copyUrl()"><i class="fas fa-copy"></i> COPY LINK</button>
      </div>
      <div class="modal-actions">
        <button class="btn btn-primary" onclick="copyImage()">
          <i class="fas fa-image"></i> Copy Foto
        </button>
        <button class="btn btn-secondary" onclick="downloadModalImage()">
          <i class="fas fa-download"></i> Download
        </button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast">
  <span class="icon"><i class="fas fa-bolt"></i></span>
  <span id="toastText">Berhasil!</span>
</div>

<script>
let allPhotos = [];
let currentImageUrl = '';
let currentImageTitle = '';

// ============ THEME TOGGLE ============
function applyTheme(light) {
  document.documentElement.classList.toggle('light', light);
  document.documentElement.classList.remove(light ? 'dark' : '');
  const b = document.getElementById('themeBtn');
  if (b) b.textContent = light ? '☀️' : '🌙';
  try { localStorage.setItem('foto_theme', light ? '1' : '0'); } catch(e) {}
}
function toggleTheme() {
  applyTheme(!document.documentElement.classList.contains('light'));
}
try {
  const saved = localStorage.getItem('foto_theme');
  applyTheme(saved === '1');
} catch(e) {}

document.addEventListener('DOMContentLoaded', () => {
  fetchPhotosFromSheet();
});

async function fetchPhotosFromSheet() {
  document.getElementById('loading').classList.add('active');
  document.getElementById('galleryGrid').innerHTML = '';

  try {
    const sheetId = '1z5FYVvB0E9BeE3cRbl4id1YWi6lRB_2qzMhIvgz4Xx0';
    const gid = '1246502038';

    try {
      const gvizUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&gid=${gid}&range=C2:D150`;
      const response = await fetch(gvizUrl);
      const text = await response.text();
      const json = JSON.parse(text.substring(47).slice(0, -2));
      const rows = json.table.rows;

      allPhotos = [];
      rows.forEach((row, index) => {
        const c = row.c;
        if (!c) return;
        const judul = c[0] ? (c[0].v || '') : '';
        const foto = c[1] ? (c[1].v || '') : '';
        if (judul && foto) {
          allPhotos.push({ judul, foto, index: index + 2, loadedAt: Date.now() });
        }
      });
    } catch (e) {
      console.log('GVIZ failed, trying CSV...', e);
      const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=${gid}&range=C2:D150`;
      const csvResponse = await fetch(csvUrl);
      const csvText = await csvResponse.text();
      const csvRows = csvText.split('\n').map(row => row.split(','));

      allPhotos = [];
      csvRows.forEach((row, index) => {
        if (row.length < 2) return;
        const judul = row[0] ? row[0].replace(/"/g, '').trim() : '';
        const foto = row[1] ? row[1].replace(/"/g, '').trim() : '';
        if (judul && foto) {
          allPhotos.push({ judul, foto, index: index + 2, loadedAt: Date.now() });
        }
      });
    }

    renderGallery(allPhotos);
    updateStats(allPhotos.length, allPhotos.length);
    showToast(`Berhasil memuat ${allPhotos.length} foto`, 'success');
  } catch (error) {
    console.error('Error fetching photos:', error);
    showToast('Gagal mengambil data dari Google Sheets', 'error');
    document.getElementById('galleryGrid').innerHTML = `
      <div class="no-results">
        <i class="fas fa-exclamation-triangle"></i>
        <h3>GAGAL MEMUAT FOTO</h3>
        <p>Pastikan Google Sheets sudah dipublikasikan</p>
      </div>
    `;
  }

  document.getElementById('loading').classList.remove('active');
}

function updateStats(total, shown) {
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statShown').textContent = shown;
  const now = new Date();
  document.getElementById('statRecent').textContent = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
}

function renderGallery(photos) {
  const grid = document.getElementById('galleryGrid');
  grid.innerHTML = '';

  if (photos.length === 0) {
    grid.innerHTML = `
      <div class="no-results">
        <i class="fas fa-search"></i>
        <h3>TIDAK ADA FOTO</h3>
        <p>Tidak ada foto yang sesuai dengan pencarian</p>
      </div>
    `;
    return;
  }

  photos.forEach((photo, idx) => {
    const card = createPhotoCard(photo.foto, photo.judul, idx);
    grid.appendChild(card);
  });
}

function createPhotoCard(url, title, index) {
  const card = document.createElement('div');
  card.className = 'photo-card';
  const safeTitle = title.replace(/'/g, "\\'");
  const safeUrl = url.replace(/'/g, "\\'");
  const isNew = index < 3; // 3 foto pertama dianggap baru
  card.innerHTML = `
    <div class="photo-wrapper">
      ${isNew ? '<span class="photo-badge-new">NEW</span>' : ''}
      <img src="${url}" alt="${title}" onerror="this.src='https://via.placeholder.com/400x300/1a2f42/6fa3cf?text=No+Image'" loading="lazy" onclick="viewFullImage('${safeUrl}', '${safeTitle}')" style="cursor: pointer;">
    </div>
    <div class="photo-info">
      <div class="photo-title">${title}</div>
      <div class="photo-meta">FOTO #${index + 1}</div>
      <div class="action-buttons-row">
        <button class="action-btn-cool copy-btn" onclick="copyPhoto('${safeUrl}', this)" title="Copy Foto">
          <i class="fas fa-copy"></i>
          <span>Copy</span>
        </button>
        <button class="action-btn-cool download-btn" onclick="downloadPhoto('${safeUrl}', '${safeTitle}')" title="Download">
          <i class="fas fa-download"></i>
          <span>Download</span>
        </button>
      </div>
    </div>
  `;
  return card;
}

function searchPhotos() {
  const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
  const countEl = document.getElementById('searchCount');
  if (!searchTerm) {
    renderGallery(allPhotos);
    updateStats(allPhotos.length, allPhotos.length);
    countEl.style.display = 'none';
    return;
  }
  const filtered = allPhotos.filter(photo =>
    photo.judul.toLowerCase().includes(searchTerm)
  );
  renderGallery(filtered);
  updateStats(allPhotos.length, filtered.length);
  countEl.textContent = `${filtered.length} ditemukan`;
  countEl.style.display = 'inline-block';
}

function viewFullImage(url, title) {
  currentImageUrl = url;
  currentImageTitle = title;
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalImage').src = url;
  document.getElementById('modalUrl').textContent = url;
  document.getElementById('imageModal').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('imageModal').classList.remove('active');
  document.body.style.overflow = '';
  currentImageUrl = '';
  currentImageTitle = '';
}

async function copyPhoto(url, btnElement) {
  try {
    const response = await fetch(url, { mode: 'cors' });
    const blob = await response.blob();
    if (navigator.clipboard && typeof ClipboardItem !== 'undefined') {
      await navigator.clipboard.write([
        new ClipboardItem({ [blob.type]: blob })
      ]);
      showToast('✅ Foto berhasil disalin ke clipboard', 'success');
      if (btnElement) {
        btnElement.classList.add('copy-flash');
        setTimeout(() => btnElement.classList.remove('copy-flash'), 600);
      }
    } else {
      throw new Error('Clipboard API not supported');
    }
  } catch (error) {
    console.error('Copy error:', error);
    try {
      await navigator.clipboard.writeText(url);
      showToast('⚠️ Copy gambar gagal, link URL di-copy', 'error');
    } catch(e) {
      showToast('⚠️ Buka foto lalu klik kanan > Copy Image', 'error');
    }
  }
}

async function copyImage() {
  if (currentImageUrl) await copyPhoto(currentImageUrl, null);
}

async function copyUrl() {
  if (currentImageUrl) {
    try {
      await navigator.clipboard.writeText(currentImageUrl);
      showToast('✅ Link URL berhasil di-copy', 'success');
    } catch(e) {
      showToast('❌ Gagal copy link', 'error');
    }
  }
}

function downloadPhoto(url, filename) {
  const link = document.createElement('a');
  link.href = url;
  link.download = `${filename.replace(/[^a-z0-9]/gi, '_').toLowerCase()}_${Date.now()}.jpg`;
  link.target = '_blank';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  showToast('📥 Download dimulai...', 'success');
}

function downloadModalImage() {
  if (currentImageUrl && currentImageTitle) {
    downloadPhoto(currentImageUrl, currentImageTitle);
  }
}

function showToast(message, type = 'success') {
  const toast = document.getElementById('toast');
  toast.className = 'toast ' + type;
  document.getElementById('toastText').textContent = message;
  const iconEl = toast.querySelector('.icon i');
  if (iconEl) {
    if (type === 'success') iconEl.className = 'fas fa-check-circle';
    else if (type === 'error') iconEl.className = 'fas fa-times-circle';
    else iconEl.className = 'fas fa-bolt';
  }
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

document.getElementById('imageModal').addEventListener('click', (e) => {
  if (e.target.id === 'imageModal') closeModal();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});
</script>
</body>
</html>
