<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4682b4">
<title>🔷 KENDALA ALL — Dove Blue Edition</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* ============================================================ */
/* 🕊️ DOVE BLUE THEME — EXACT MATCH SCRIPTVAULT × CYBER PORTAL */
/* ============================================================ */
:root {
  --bg-primary:#eef5fb;
  --bg-secondary:#f7fbff;
  --bg-tertiary:#ffffff;
  --bg-card:#ffffff;
  --bg-hover:#e6f0f9;
  --field-bg:rgba(31,58,84,.05);
  --code-bg:rgba(31,58,84,.06);
  --overlay-bg:rgba(15,28,42,.45);

  --neon-cyan:#4682b4;
  --neon-blue:#37688f;
  --neon-purple:#2e5474;
  --neon-pink:#c62828;
  --neon-green:#15803d;
  --neon-yellow:#b45309;
  --neon-red:#c62828;

  --text-primary:#13232f;
  --text-secondary:#4a5d6e;
  --text-tertiary:#6b7c8c;
  --text-muted:#93a3b1;

  --border-subtle:rgba(31,58,84,.08);
  --border-normal:rgba(31,58,84,.16);
  --border-strong:rgba(31,58,84,.28);
  --border-glow:rgba(70,130,180,.5);

  --shadow-sm:0 2px 6px rgba(31,58,84,.08);
  --shadow-md:0 6px 18px rgba(31,58,84,.12);
  --shadow-lg:0 14px 40px rgba(31,58,84,.18);
  --shadow-glow:0 0 18px rgba(70,130,180,.18);

  --radius-sm:8px;
  --radius-md:11px;
  --radius-lg:14px;
  --radius-xl:18px;
  --transition:all .25s cubic-bezier(.4,0,.2,1);
  --transition-bounce:.45s cubic-bezier(.34,1.56,.64,1);
}
html.dark {
  --bg-primary:#0f1d2b;
  --bg-secondary:#132434;
  --bg-tertiary:#1a2f42;
  --bg-card:#1a2f42;
  --bg-hover:#27455f;
  --field-bg:rgba(0,0,0,.35);
  --code-bg:rgba(0,0,0,.4);
  --overlay-bg:rgba(2,4,8,.88);

  --neon-cyan:#6fa3cf;
  --neon-blue:#8fbce0;
  --neon-purple:#aacfeb;
  --neon-pink:#ef5350;
  --neon-green:#34d399;
  --neon-yellow:#f0a830;
  --neon-red:#ef5350;

  --text-primary:#e8f0f8;
  --text-secondary:#9fb2c4;
  --text-tertiary:#7f96ab;
  --text-muted:#5a7186;

  --border-subtle:rgba(255,255,255,.06);
  --border-normal:rgba(255,255,255,.12);
  --border-strong:rgba(255,255,255,.2);
  --border-glow:rgba(111,163,207,.5);

  --shadow-sm:0 2px 6px rgba(0,0,0,.4);
  --shadow-md:0 6px 18px rgba(0,0,0,.5);
  --shadow-lg:0 14px 40px rgba(0,0,0,.6);
  --shadow-glow:0 0 18px rgba(111,163,207,.25);
}

* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
html, body {
  font-family:'Inter',sans-serif;
  background:var(--bg-primary);
  color:var(--text-primary);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  line-height:1.6;
  transition:background .3s, color .3s;
}
body {
  background:
    radial-gradient(1100px 500px at 8% -8%, rgba(70,130,180,.14) 0%, transparent 55%),
    radial-gradient(900px 500px at 108% 6%, rgba(111,163,207,.12) 0%, transparent 50%),
    linear-gradient(180deg, var(--bg-primary), var(--bg-secondary));
}

/* ========== BACKGROUND EFFECTS ========== */
.bg-effects {
  position:fixed; inset:0; z-index:0;
  pointer-events:none; overflow:hidden;
}
.bg-effects::before {
  content:''; position:absolute;
  width:700px; height:700px;
  background:radial-gradient(circle, rgba(70,130,180,.12) 0%, transparent 65%);
  top:-250px; left:-200px;
  animation:float1 22s ease-in-out infinite;
  filter:blur(20px);
}
.bg-effects::after {
  content:''; position:absolute;
  width:600px; height:600px;
  background:radial-gradient(circle, rgba(46,84,116,.10) 0%, transparent 65%);
  bottom:-200px; right:-200px;
  animation:float2 26s ease-in-out infinite;
  filter:blur(20px);
}
@keyframes float1 { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(100px,80px) scale(1.12);} }
@keyframes float2 { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-80px,-60px) scale(1.08);} }

.grid-overlay {
  position:fixed; inset:0; z-index:0;
  background-image:
    linear-gradient(rgba(70,130,180,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(70,130,180,.03) 1px, transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse 70% 60% at 50% 50%, black 30%, transparent 75%);
  animation:gridMove 30s linear infinite;
  pointer-events:none;
}
@keyframes gridMove { 0%{background-position:0 0;} 100%{background-position:44px 44px;} }

.scanline {
  position:fixed; left:0; right:0; height:2px;
  background:linear-gradient(90deg, transparent, rgba(70,130,180,.35), transparent);
  opacity:.5;
  animation:scanLine 9s linear infinite;
  z-index:1; pointer-events:none;
  filter:blur(1px);
}
@keyframes scanLine {
  0%{top:-2px; opacity:0;} 5%{opacity:.5;} 95%{opacity:.5;} 100%{top:100%; opacity:0;}
}

/* ========== LAYOUT ========== */
.container {
  max-width:1180px;
  margin:0 auto;
  padding:24px 18px 60px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  position:relative;
  z-index:2;
}

/* ========== HEADER ========== */
.header {
  text-align:center;
  margin-bottom:32px;
  padding:22px 15px;
  position:relative;
  animation:fadeInUp .6s cubic-bezier(.34,1.56,.64,1) backwards;
}
@keyframes fadeInUp { from{opacity:0; transform:translateY(30px);} to{opacity:1; transform:translateY(0);} }

.header::before {
  content:'';
  position:absolute;
  bottom:0; left:50%;
  transform:translateX(-50%);
  width:80%;
  height:2px;
  background:linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-blue), var(--neon-cyan), transparent);
  animation:glowLine 3.5s ease-in-out infinite;
  box-shadow:0 0 15px var(--neon-cyan);
}
@keyframes glowLine {
  0%,100% { opacity:.7; }
  50% { opacity:1; box-shadow:0 0 25px var(--neon-cyan), 0 0 45px var(--neon-blue); }
}

.back-btn {
  position:absolute;
  left:0; top:50%;
  transform:translateY(-50%);
  background:var(--field-bg);
  border:1px solid var(--border-subtle);
  border-radius:var(--radius-md);
  color:var(--text-secondary);
  padding:9px 16px;
  text-decoration:none;
  font-weight:600;
  font-size:12px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  transition:var(--transition);
  font-family:'Space Grotesk',sans-serif;
  letter-spacing:.5px;
  backdrop-filter:blur(12px);
}
.back-btn:hover {
  color:var(--neon-cyan);
  border-color:var(--neon-cyan);
  background:rgba(70,130,180,.1);
  transform:translateY(-50%) translateX(-3px);
  box-shadow:var(--shadow-glow);
}

.theme-toggle {
  position:absolute;
  right:0; top:50%;
  transform:translateY(-50%);
  width:42px; height:42px;
  background:var(--field-bg);
  border:1px solid var(--border-subtle);
  border-radius:var(--radius-md);
  color:var(--text-secondary);
  cursor:pointer;
  display:grid;
  place-items:center;
  font-size:16px;
  transition:var(--transition);
  backdrop-filter:blur(12px);
}
.theme-toggle:hover {
  color:var(--neon-cyan);
  border-color:var(--neon-cyan);
  background:rgba(70,130,180,.1);
  transform:translateY(-50%) scale(1.06);
  box-shadow:var(--shadow-glow);
}

.judul-glow {
  font-family:'Space Grotesk',sans-serif;
  font-size:clamp(1.6rem, 4vw, 2.4rem);
  font-weight:700;
  text-align:center;
  letter-spacing:2px;
  margin-bottom:10px;
  text-transform:uppercase;
  background:linear-gradient(135deg, var(--neon-cyan), var(--neon-blue), var(--text-primary));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}

.subtitle {
  font-size:12px;
  color:var(--text-secondary);
  text-align:center;
  margin-bottom:16px;
  font-weight:500;
  letter-spacing:.5px;
  font-family:'Space Grotesk',sans-serif;
}

.status-badge {
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:6px 16px;
  background:rgba(70,130,180,.08);
  border:1px solid rgba(70,130,180,.3);
  border-radius:100px;
  font-size:10px;
  color:var(--neon-cyan);
  margin-top:13px;
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
}

.status-dot {
  width:7px; height:7px;
  background:var(--neon-green);
  border-radius:50%;
  animation:pulse2 2.5s infinite;
  box-shadow:0 0 8px var(--neon-green);
}
@keyframes pulse2 { 0%,100%{opacity:1;} 50%{opacity:.4;} }

/* ========== SEARCH SECTION ========== */
.search-section {
  margin:22px 0 28px;
  text-align:center;
}

.search-bar {
  position:relative;
  max-width:560px;
  margin:0 auto 16px;
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--field-bg);
  border:1px solid var(--border-subtle);
  border-radius:var(--radius-md);
  padding:11px 15px;
  transition:var(--transition);
}
.search-bar:focus-within {
  border-color:var(--neon-cyan);
  background:rgba(70,130,180,.08);
  box-shadow:0 0 0 3px rgba(70,130,180,.1);
}
.search-bar i {
  color:var(--neon-cyan);
  font-size:14px;
  flex-shrink:0;
}
.search-bar input {
  background:none;
  border:none;
  outline:none;
  color:var(--text-primary);
  flex:1;
  font-size:12.5px;
  font-family:'Inter',sans-serif;
  font-weight:500;
}
.search-bar input::placeholder { color:var(--text-muted); }
.search-clear {
  background:none;
  border:none;
  color:var(--text-muted);
  cursor:pointer;
  font-size:14px;
  padding:2px 6px;
  border-radius:4px;
  transition:var(--transition);
  flex-shrink:0;
  display:none;
}
.search-clear.show { display:block; }
.search-clear:hover { color:var(--neon-red); background:rgba(198,40,40,.1); }

.stats-bar {
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:12px;
  max-width:720px;
  margin:0 auto;
}

.stat-item {
  background:linear-gradient(135deg, var(--bg-tertiary), var(--bg-secondary));
  border:1px solid var(--border-subtle);
  border-radius:var(--radius-lg);
  padding:16px 18px;
  transition:var(--transition);
  position:relative;
  overflow:hidden;
  text-align:left;
}
.stat-item::before {
  content:''; position:absolute;
  top:-40px; right:-40px;
  width:110px; height:110px;
  border-radius:50%;
  filter:blur(50px);
  opacity:.16;
  transition:opacity .4s;
}
.stat-item:nth-child(1)::before { background:var(--neon-cyan); }
.stat-item:nth-child(2)::before { background:var(--neon-blue); }
.stat-item:nth-child(3)::before { background:var(--neon-purple); }
.stat-item:hover {
  border-color:rgba(70,130,180,.3);
  transform:translateY(-3px);
  box-shadow:var(--shadow-glow);
}
.stat-item:hover::before { opacity:.3; }

.stat-label {
  font-family:'Space Grotesk',sans-serif;
  font-size:9px;
  color:var(--text-tertiary);
  text-transform:uppercase;
  letter-spacing:1.5px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:7px;
}
.stat-label .icon { font-size:14px; }
.stat-value {
  font-family:'Space Grotesk',sans-serif;
  font-size:28px;
  font-weight:800;
  margin-top:8px;
  letter-spacing:-.03em;
  background:linear-gradient(135deg, var(--neon-cyan), var(--neon-blue), var(--text-primary));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  line-height:1.1;
}
.stat-sub {
  font-size:10px;
  color:var(--text-muted);
  margin-top:4px;
  font-weight:500;
}

/* ========== KENDALA CARDS ========== */
.kendala-list {
  display:flex;
  flex-direction:column;
  gap:14px;
}

.kendala-card {
  background:linear-gradient(135deg, var(--bg-tertiary), var(--bg-secondary));
  border:1px solid var(--border-subtle);
  border-radius:var(--radius-lg);
  padding:22px 24px;
  transition:var(--transition);
  position:relative;
  overflow:hidden;
  backdrop-filter:blur(12px);
  animation:fadeInUp .5s ease-out backwards;
}
.kendala-card::before {
  content:'';
  position:absolute;
  top:0; left:0; right:0;
  height:2px;
  background:linear-gradient(90deg, transparent, rgba(70,130,180,.5), transparent);
  opacity:.3;
}
.kendala-card::after {
  content:'';
  position:absolute;
  top:0; left:-100%;
  width:100%; height:100%;
  background:linear-gradient(120deg, transparent, rgba(70,130,180,.08), transparent);
  transition:left .6s ease;
  pointer-events:none;
}
.kendala-card:hover::after { left:100%; }
.kendala-card:hover {
  border-color:rgba(70,130,180,.3);
  transform:translateY(-2px);
  box-shadow:var(--shadow-glow);
}
.kendala-card.expanded {
  border-color:rgba(70,130,180,.4);
  box-shadow:var(--shadow-glow);
}
.kendala-card.expanded::before {
  background:linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-blue), transparent);
  opacity:.6;
}

.kendala-title {
  font-family:'Space Grotesk',sans-serif;
  font-size:15px;
  font-weight:700;
  color:var(--text-primary);
  margin-bottom:14px;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding-bottom:12px;
  border-bottom:1px solid var(--border-subtle);
  transition:color .3s ease;
  letter-spacing:.5px;
}
.kendala-title:hover { color:var(--neon-cyan); }
.kendala-title::after {
  content:'\f078';
  font-family:'Font Awesome 6 Free';
  font-weight:900;
  font-size:11px;
  transition:transform .28s ease;
  color:var(--neon-cyan);
}
.kendala-card.expanded .kendala-title::after { transform:rotate(180deg); }

/* ========== PHOTO & ANSWER SECTIONS ========== */
.title-photo-section {
  display:none;
  margin:14px 0;
  padding:14px;
  background:var(--field-bg);
  border:1px solid var(--border-subtle);
  border-radius:var(--radius-md);
  text-align:center;
}
.kendala-card.expanded .title-photo-section { display:block; }

.title-photo-img {
  max-width:100%;
  max-height:300px;
  border-radius:var(--radius-md);
  border:1px solid var(--border-subtle);
  cursor:pointer;
  transition:var(--transition);
}
.title-photo-img:hover {
  border-color:var(--neon-cyan);
  box-shadow:var(--shadow-glow);
  transform:scale(1.02);
}

.title-photo-actions {
  margin-top:12px;
  display:flex;
  gap:9px;
  justify-content:center;
  flex-wrap:wrap;
}

.copy-title-photo-btn, .view-title-photo-btn {
  font-family:'Inter',sans-serif;
  font-weight:600;
  font-size:11px;
  padding:8px 14px;
  background:var(--field-bg);
  border:1px solid var(--border-normal);
  border-radius:var(--radius-sm);
  color:var(--text-secondary);
  cursor:pointer;
  transition:var(--transition);
  text-transform:uppercase;
  letter-spacing:.5px;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.copy-title-photo-btn:hover, .view-title-photo-btn:hover {
  background:rgba(70,130,180,.1);
  border-color:var(--neon-cyan);
  color:var(--neon-cyan);
  transform:translateY(-2px);
  box-shadow:var(--shadow-glow);
}

.kendala-answers {
  display:none;
  margin-top:16px;
  padding-top:16px;
  border-top:1px solid var(--border-subtle);
}
.kendala-card.expanded .kendala-answers { display:block; }

.answer-item {
  margin-bottom:14px;
  padding:16px 18px;
  background:var(--field-bg);
  border-radius:var(--radius-md);
  border-left:3px solid var(--neon-cyan);
  transition:var(--transition);
  position:relative;
}
.answer-item:hover {
  background:rgba(70,130,180,.08);
  border-left-color:var(--neon-blue);
  transform:translateX(4px);
}

.answer-label {
  font-weight:700;
  color:var(--neon-cyan);
  margin-bottom:10px;
  font-size:10px;
  font-family:'Space Grotesk',sans-serif;
  letter-spacing:1.5px;
  text-transform:uppercase;
  display:flex;
  align-items:center;
  gap:7px;
}
.answer-label i { font-size:12px; }

.answer-content {
  color:var(--text-secondary);
  line-height:1.7;
  white-space:pre-wrap;
  word-break:break-word;
  font-size:12.5px;
  font-weight:500;
}
.answer-content a {
  color:var(--neon-cyan);
  text-decoration:none;
  font-weight:600;
  transition:color .3s ease;
  background:rgba(70,130,180,.08);
  padding:2px 6px;
  border-radius:4px;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
}
.answer-content a:hover {
  color:var(--neon-blue);
  background:rgba(70,130,180,.15);
}

.photo-container {
  margin:14px 0;
  text-align:center;
  padding:14px;
  background:var(--field-bg);
  border-radius:var(--radius-md);
  border:1px dashed var(--border-normal);
}

.photo-img {
  max-width:100%;
  max-height:280px;
  border-radius:var(--radius-md);
  border:1px solid var(--border-subtle);
  cursor:pointer;
  transition:var(--transition);
}
.photo-img:hover {
  border-color:var(--neon-cyan);
  box-shadow:var(--shadow-glow);
  transform:scale(1.02);
}

.link-buttons {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
  align-items:center;
}

.open-link-btn {
  font-family:'Inter',sans-serif;
  font-weight:600;
  font-size:10.5px;
  padding:7px 13px;
  background:var(--field-bg);
  border:1px solid var(--border-normal);
  border-radius:var(--radius-sm);
  color:var(--text-secondary);
  cursor:pointer;
  transition:var(--transition);
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  gap:5px;
  text-transform:uppercase;
  letter-spacing:.5px;
}
.open-link-btn:hover {
  background:rgba(70,130,180,.1);
  border-color:var(--neon-cyan);
  color:var(--neon-cyan);
  transform:translateY(-2px);
  box-shadow:var(--shadow-glow);
}

/* ========== TOMBOL BUKA SEMUA LINK ========== */
.open-all-links-btn {
  font-family:'Inter',sans-serif;
  font-weight:700;
  font-size:10.5px;
  padding:7px 14px;
  background:linear-gradient(135deg, rgba(46,84,116,.12), rgba(46,84,116,.05));
  border:1px solid rgba(46,84,116,.4);
  border-radius:var(--radius-sm);
  color:var(--neon-purple);
  cursor:pointer;
  transition:var(--transition);
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-left:auto;
  position:relative;
  overflow:hidden;
  text-transform:uppercase;
  letter-spacing:.5px;
}
.open-all-links-btn::before {
  content:'';
  position:absolute;
  top:0; left:-100%;
  width:100%; height:100%;
  background:linear-gradient(90deg, transparent, rgba(46,84,116,.2), transparent);
  transition:left .5s ease;
}
.open-all-links-btn:hover::before { left:100%; }
.open-all-links-btn:hover {
  background:linear-gradient(135deg, rgba(46,84,116,.25), rgba(46,84,116,.15));
  border-color:var(--neon-purple);
  color:var(--neon-purple);
  transform:translateY(-2px);
  box-shadow:var(--shadow-glow);
}
.open-all-links-btn:active { transform:translateY(0); }

.open-all-links-btn .link-count {
  background:var(--neon-purple);
  color:#fff;
  font-size:10px;
  font-weight:800;
  padding:2px 7px;
  border-radius:20px;
  margin-left:3px;
  box-shadow:0 0 8px rgba(46,84,116,.4);
}

/* ========== BUTTONS ========== */
.copy-btn, .sticky-btn {
  font-family:'Inter',sans-serif;
  font-weight:700;
  font-size:10.5px;

// ================= DATA CONFIG =================
const SHEET_ID = '1z5FYVvB0E9BeE3cRbl4id1YWi6lRB_2qzMhIvgz4Xx0';
const GID = '1251944242';
const RANGE = 'C2:F300';
const DATA_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${GID}&range=${RANGE}`;

let allKendala = [];
let filteredKendala = [];
let lightboxImages = [];
let lightboxIndex = 0;
let zoomLevel = 1;
let editIndex = null;

// ========== THEME ==========
function applyTheme(dark) {
  document.documentElement.classList.toggle('dark', dark);
  const b = document.getElementById('themeBtn');
  if (b) b.textContent = dark ? '☀️' : '🌙';
  try { localStorage.setItem('kendala_theme', dark ? '1' : '0'); } catch(e) {}
}
function toggleTheme() {
  applyTheme(!document.documentElement.classList.contains('dark'));
}
try {
  const saved = localStorage.getItem('kendala_theme');
  if (saved === '1') applyTheme(true);
} catch(e) {}

// ========== TOAST ==========
function showToast(message, type = 'success') {
  type = type || 'info';
  const w = document.getElementById('toasts');
  if (!w) return;
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const im = {
    success: '<i class="fas fa-check-circle"></i>',
    error: '<i class="fas fa-times-circle"></i>',
    info: '<i class="fas fa-info-circle"></i>',
    warning: '<i class="fas fa-exclamation-triangle"></i>'
  };
  el.innerHTML = '<span class="icon">' + (im[type] || '') + '</span><span>' + escHtml(message) + '</span><div class="toast-progress"></div>';
  w.appendChild(el);
  setTimeout(() => {
    el.style.animation = 'toastSlideIn 0.3s reverse';
    setTimeout(() => el.remove(), 300);
  }, 3500);
}
function escHtml(t) {
  if (!t) return '';
  return String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ================= DATA LOADING =================
async function loadKendalaData() {
  try {
    const response = await fetch(DATA_URL);
    const text = await response.text();
    const jsonMatch = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);?/);
    if (!jsonMatch) throw new Error('Gagal parse');
    const data = JSON.parse(jsonMatch[1]);
    const rows = data.table?.rows || [];
    
    allKendala = rows.map(row => {
      const cells = row.c || [];
      return {
        judul: cells[0]?.v?.toString().trim() || '',
        jawaban1: cells[1]?.v?.toString().trim() || '',
        jawaban2: cells[2]?.v?.toString().trim() || '',
        jawaban3: cells[3]?.v?.toString().trim() || ''
      };
    }).filter(item => item.judul && item.judul !== '');
    
    filteredKendala = [...allKendala];
    renderKendala();
    updateStats();
    showToast('✅ Berhasil memuat ' + allKendala.length + ' kendala', 'success');
  } catch (error) {
    console.error(error);
    document.getElementById('kendalaContainer').innerHTML = `
      <div class="error-msg">
        <i class="fas fa-exclamation-triangle" style="font-size:32px; margin-bottom:15px; color:var(--neon-red);"></i>
        <p><strong>⚠️ Gagal memuat data</strong></p>
        <p style="font-size:11px; margin-top:10px; color:var(--text-muted);">Pastikan Google Sheet sudah dipublikasikan</p>
        <p style="font-size:10px; margin-top:12px; opacity:.7;">${escHtml(error.message)}</p>
      </div>`;
    showToast('❌ Gagal memuat data', 'error');
  }
}

function renderKendala(data = filteredKendala) {
  const container = document.getElementById('kendalaContainer');
  if (data.length === 0) {
    container.innerHTML = '<div class="no-data" style="text-align:center; padding:60px 20px; background:var(--field-bg); border:1px dashed var(--border-normal); border-radius:var(--radius-lg); color:var(--text-tertiary); font-size:13px;"><i class="fas fa-search" style="font-size:48px; opacity:.4; margin-bottom:14px; display:block; color:var(--neon-cyan);"></i><h4 style="font-family:Space Grotesk,sans-serif; font-size:17px; margin-bottom:8px; letter-spacing:1px; color:var(--text-primary);">TIDAK DITEMUKAN</h4><p>Tidak ada kendala cocok dengan pencarian</p></div>';
    return;
  }
  container.innerHTML = `<div class="kendala-list">${data.map((item, index) => createKendalaCard(item, index)).join('')}</div>`;
  
  document.querySelectorAll('.kendala-title').forEach(title => {
    title.addEventListener('click', function() {
      this.parentElement.classList.toggle('expanded');
    });
  });
}

function createKendalaCard(item, index) {
  const titlePhoto = extractTitlePhoto(item.judul);
  const cleanJudul = titlePhoto ? item.judul.replace(titlePhoto.url, '').trim() : item.judul;
  const hasPhoto = detectPhotoLink(item);
  const links1 = extractLinks(item.jawaban1);
  const links2 = extractLinks(item.jawaban2);
  const links3 = extractLinks(item.jawaban3);
  
  return `
    <div class="kendala-card" data-index="${index}" style="animation-delay:${index * 0.04}s">
      <h3 class="kendala-title">${escHtml(cleanJudul)}</h3>
      ${titlePhoto ? createTitlePhotoSection(titlePhoto.url, index) : ''}
      <div class="kendala-answers">
        ${item.jawaban1 ? `
          <div class="answer-item">
            <div class="answer-label"><i class="fas fa-comment-alt"></i> JAWABAN 1</div>
            <div class="answer-content">${formatContent(item.jawaban1, links1)}</div>
            ${hasPhoto && !titlePhoto ? createPhotoSection(item) : ''}
            ${links1.length > 0 ? createLinkButtons(links1) : ''}
            <button class="copy-btn" onclick="copyAnswer(${index}, 1, this)"><i class="fas fa-copy"></i> COPY</button>
            <button class="sticky-btn" onclick="addToSticky(${index}, 1)"><i class="fas fa-sticky-note"></i> STICKY</button>
          </div>` : ''}
        ${item.jawaban2 ? `
          <div class="answer-item">
            <div class="answer-label"><i class="fas fa-comment-alt"></i> JAWABAN 2</div>
            <div class="answer-content">${formatContent(item.jawaban2, links2)}</div>
            ${links2.length > 0 ? createLinkButtons(links2) : ''}
            <button class="copy-btn" onclick="copyAnswer(${index}, 2, this)"><i class="fas fa-copy"></i> COPY</button>
            <button class="sticky-btn" onclick="addToSticky(${index}, 2)"><i class="fas fa-sticky-note"></i> STICKY</button>
          </div>` : ''}
        ${item.jawaban3 ? `
          <div class="answer-item">
            <div class="answer-label"><i class="fas fa-comment-alt"></i> JAWABAN 3</div>
            <div class="answer-content">${formatContent(item.jawaban3, links3)}</div>
            ${links3.length > 0 ? createLinkButtons(links3) : ''}
            <button class="copy-btn" onclick="copyAnswer(${index}, 3, this)"><i class="fas fa-copy"></i> COPY</button>
            <button class="sticky-btn" onclick="addToSticky(${index}, 3)"><i class="fas fa-sticky-note"></i> STICKY</button>
          </div>` : ''}
      </div>
    </div>`;
}

// ================= HELPER FUNCTIONS =================
function extractTitlePhoto(judul) {
  if (!judul) return null;
  const photoPattern = /(https?:\/\/[^\s]+\.(jpg|jpeg|png|gif|webp))/i;
  const match = judul.match(photoPattern);
  if (match) return { url: match[1], fullMatch: match[0] };
  return null;
}

function createTitlePhotoSection(photoUrl, index) {
  if (!lightboxImages.includes(photoUrl)) lightboxImages.push(photoUrl);
  const safeUrl = photoUrl.replace(/'/g, "\\'");
  return `
    <div class="title-photo-section">
      <img src="${escHtml(photoUrl)}" alt="Foto Kendala" class="title-photo-img" onclick="openLightbox('${safeUrl}')" onerror="this.parentElement.style.display='none'">
      <div class="title-photo-actions">
        <button class="copy-title-photo-btn" onclick="copyTitlePhoto('${safeUrl}')"><i class="fas fa-copy"></i> Copy Foto</button>
        <button class="view-title-photo-btn" onclick="openLightbox('${safeUrl}')"><i class="fas fa-expand"></i> Lihat Penuh</button>
      </div>
    </div>`;
}

function detectPhotoLink(item) {
  const photoPattern = /(https?:\/\/[^\s]+\.(jpg|jpeg|png|gif|webp))/i;
  return photoPattern.test(item.jawaban1) || photoPattern.test(item.jawaban2) || photoPattern.test(item.jawaban3);
}

function extractLinks(text) {
  if (!text) return [];
  const urlPattern = /https?:\/\/[^\s<>"{}|\\^`\[\]]+/gi;
  return text.match(urlPattern) || [];
}

function formatContent(text, links = []) {
  if (!text) return '';
  let formatted = escHtml(text);
  links.forEach(link => {
    const escapedLink = escHtml(link);
    const displayText = link.length > 45 ? link.substring(0, 42) + '...' : link;
    const regex = new RegExp(`(^|[^"'=])${escapeRegExp(escapedLink)}`, 'g');
    formatted = formatted.replace(regex, `$1<a href="${escapedLink}" target="_blank" rel="noopener">${escHtml(displayText)}</a>`);
  });
  return formatted;
}

function createPhotoSection(item) {
  const photoPattern = /(https?:\/\/[^\s]+\.(jpg|jpeg|png|gif|webp))/i;
  const match = (item.jawaban1 + ' ' + item.jawaban2 + ' ' + item.jawaban3).match(photoPattern);
  if (!match) return '';
  const photoUrl = match[1];
  if (!lightboxImages.includes(photoUrl)) lightboxImages.push(photoUrl);
  const safeUrl = photoUrl.replace(/'/g, "\\'");
  return `
    <div class="photo-container">
      <img src="${escHtml(photoUrl)}" alt="Foto" class="photo-img" onclick="openLightbox('${safeUrl}')" onerror="this.parentElement.style.display='none'">
      <button class="copy-btn" onclick="copyPhoto('${safeUrl}')"><i class="fas fa-copy"></i> Copy Foto</button>
    </div>`;
}

function createLinkButtons(links) {
  if (links.length === 0) return '';
  const linksEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(links))));
  return `
    <div class="link-buttons">
      ${links.map((link, i) => {
        const label = links.length > 1 ? `Link ${i+1}` : 'Buka Link';
        return `<a href="${escHtml(link)}" target="_blank" rel="noopener" class="open-link-btn">
          <i class="fas fa-external-link-alt"></i> ${escHtml(label)}
        </a>`;
      }).join('')}
      ${links.length > 1 ? `
        <button class="open-all-links-btn" onclick="openAllLinks('${linksEncoded}')" title="Buka semua ${links.length} link sekaligus">
          <i class="fas fa-layer-group"></i> Buka Semua <span class="link-count">${links.length}</span>
        </button>
      ` : ''}
    </div>`;
}

// ================= FUNGSI BUKA SEMUA LINK =================
function openAllLinks(linksEncoded) {
  try {
    const links = JSON.parse(decodeURIComponent(escape(atob(linksEncoded))));
    if (!links || links.length === 0) {
      showToast('⚠️ Tidak ada link untuk dibuka', 'warning');
      return;
    }
    
    let openedCount = 0;
    let blockedCount = 0;
    
    showToast('🚀 Membuka ' + links.length + ' link sekaligus...', 'info');
    
    links.forEach((link, index) => {
      setTimeout(() => {
        const newWindow = window.open(link, '_blank', 'noopener,noreferrer');
        if (newWindow && !newWindow.closed) {
          openedCount++;
        } else {
          blockedCount++;
        }
        
        if (index === links.length - 1) {
          setTimeout(() => {
            if (blockedCount > 0) {
              showToast('⚠️ ' + openedCount + ' dibuka, ' + blockedCount + ' diblokir popup', 'warning');
            } else {
              showToast('✅ ' + openedCount + ' link berhasil dibuka!', 'success');
            }
          }, 200);
        }
      }, index * 180);
    });
  } catch (error) {
    console.error('Error membuka semua link:', error);
    showToast('❌ Gagal membuka link', 'error');
  }
}

async function copyAnswer(index, answerNum, btnElement) {
  const item = filteredKendala[index];
  const content = item[`jawaban${answerNum}`];
  if (!content) return;
  try {
    await navigator.clipboard.writeText(content);
    showToast('✅ Jawaban berhasil disalin!', 'success');
    if (btnElement) {
      const original = btnElement.innerHTML;
      btnElement.innerHTML = '<i class="fas fa-check"></i> COPIED!';
      btnElement.classList.add('copied');
      setTimeout(() => {
        btnElement.innerHTML = original;
        btnElement.classList.remove('copied');
      }, 1500);
    }
  } catch {
    fallbackCopy(content);
  }
}

async function copyTitlePhoto(url) {
  try {
    const response = await fetch(url, { mode: 'cors' });
    const blob = await response.blob();
    await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
    showToast('✅ Foto berhasil disalin!', 'success');
  } catch {
    try {
      await navigator.clipboard.writeText(url);
      showToast('📋 URL foto disalin (CORS fallback)', 'warning');
    } catch(e) {
      fallbackCopy(url);
    }
  }
}

async function copyPhoto(url) {
  try {
    const response = await fetch(url, { mode: 'cors' });
    const blob = await response.blob();
    await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
    showToast('✅ Foto berhasil disalin!', 'success');
  } catch {
    try {
      await navigator.clipboard.writeText(url);
      showToast('📋 URL foto disalin (CORS fallback)', 'warning');
    } catch(e) {
      fallbackCopy(url);
    }
  }
}

function fallbackCopy(text) {
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.left = '-9999px';
  document.body.appendChild(textarea);
  textarea.select();
  try {
    document.execCommand('copy');
    showToast('✅ Disalin (fallback)', 'success');
  } catch {
    showToast('❗ Gagal menyalin', 'error');
  }
  document.body.removeChild(textarea);
}

function searchKendala() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  const clearBtn = document.getElementById('searchClear');
  clearBtn.classList.toggle('show', query.length > 0);
  
  filteredKendala = allKendala.filter(item =>
    item.judul.toLowerCase().includes(query) ||
    (item.jawaban1 && item.jawaban1.toLowerCase().includes(query)) ||
    (item.jawaban2 && item.jawaban2.toLowerCase().includes(query)) ||
    (item.jawaban3 && item.jawaban3.toLowerCase().includes(query))
  );
  renderKendala();
  updateStats();
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('searchClear').classList.remove('show');
  filteredKendala = [...allKendala];
  renderKendala();
  updateStats();
  document.getElementById('searchInput').focus();
}

function updateStats() {
  document.getElementById('totalItems').textContent = filteredKendala.length;
  const withPhotos = filteredKendala.filter(item => detectPhotoLink(item) || extractTitlePhoto(item.judul)).length;
  document.getElementById('withPhotos').textContent = withPhotos;
  const withLinks = filteredKendala.filter(item =>
    extractLinks(item.jawaban1).length > 0 ||
    extractLinks(item.jawaban2).length > 0 ||
    extractLinks(item.jawaban3).length > 0
  ).length;
  document.getElementById('withLinks').textContent = withLinks;
}

function escapeRegExp(string) {
  return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

// ================= LIGHTBOX =================
function openLightbox(url) {
  lightboxIndex = lightboxImages.indexOf(url);
  if (lightboxIndex === -1) {
    lightboxImages.push(url);
    lightboxIndex = lightboxImages.length - 1;
  }
  document.getElementById('lightboxImg').src = url;
  document.getElementById('lightbox').classList.add('active');
  document.body.style.overflow = 'hidden';
  zoomLevel = 1;
  updateZoom();
}

function closeLightbox(event) {
  if (!event || event.target.id === 'lightbox' || event.target.closest('.lightbox-close')) {
    document.getElementById('lightbox').classList.remove('active');
    document.getElementById('lightboxImg').src = '';
    document.body.style.overflow = '';
  }
}

function changeLightbox(direction) {
  lightboxIndex += direction;
  if (lightboxIndex < 0) lightboxIndex = lightboxImages.length - 1;
  if (lightboxIndex >= lightboxImages.length) lightboxIndex = 0;
  document.getElementById('lightboxImg').src = lightboxImages[lightboxIndex];
  zoomLevel = 1;
  updateZoom();
}

function updateZoom() {
  zoomLevel = parseFloat(document.getElementById('zoomSlider').value);
  document.getElementById('lightboxImg').style.transform = `scale(${zoomLevel})`;
}

async function copyLightboxPhoto() {
  const url = document.getElementById('lightboxImg').src;
  if (url) await copyPhoto(url);
}

// ================= STICKY NOTES =================
function toggleStickyPanel() {
  const panel = document.getElementById("stickyPanel");
  panel.classList.toggle('active');
  if (panel.classList.contains('active')) loadStickyNotes();
}

function autoResize(el) {
  el.style.height = "auto";
  el.style.height = (el.scrollHeight) + "px";
}

async function addSticky() {
  const input = document.getElementById("stickyInput");
  const text = input.value.trim();
  const image = input.dataset.image || null;
  if (!text && !image) {
    showToast('⚠️ Catatan tidak boleh kosong', 'warning');
    return;
  }
  
  let stickies = JSON.parse(localStorage.getItem("stickies") || "[]");
  if (editIndex !== null) {
    stickies[editIndex] = { text, image };
    editIndex = null;
    document.getElementById("stickyAddBtn").querySelector("span").textContent = "Tambah";
    showToast('✅ Catatan di-update!', 'success');
  } else {
    stickies.push({ text, image });
    showToast('✅ Catatan ditambahkan!', 'success');
  }
  localStorage.setItem("stickies", JSON.stringify(stickies));
  
  input.value = "";
  input.dataset.image = "";
  autoResize(input);
  removePhoto();
  loadStickyNotes();
}

function loadStickyNotes() {
  const list = document.getElementById("stickyList");
  if (!list) return;
  list.innerHTML = "";
  const stickies = JSON.parse(localStorage.getItem("stickies") || "[]");
  
  if (stickies.length === 0) {
    list.innerHTML = '<div style="text-align:center; padding:40px 20px; color:var(--text-tertiary); font-size:12px;"><i class="fas fa-sticky-note" style="font-size:32px; opacity:.4; margin-bottom:10px; display:block; color:var(--neon-cyan);"></i>Kosong - Tambahkan catatan</div>';
    return;
  }
  
  stickies.forEach((note, i) => {
    const div = document.createElement("div");
    div.className = "sticky-card";
    div.dataset.index = i;
    div.style.animationDelay = (i * 0.04) + 's';
    
    if (note.text) {
      const p = document.createElement("p");
      p.textContent = note.text;
      div.appendChild(p);
    }
    if (note.image) {
      const img = document.createElement("img");
      img.src = note.image;
      img.onclick = (e) => { e.stopPropagation(); openLightbox(note.image); };
      div.appendChild(img);
    }
    
    div.onclick = async (e) => {
      if (e.target.closest('.sticky-delete') || e.target.closest('.sticky-edit')) return;
      try {
        const items = {};
        if (note.text) items["text/plain"] = new Blob([note.text], { type: "text/plain" });
        if (note.image) {
          const resp = await fetch(note.image);
          const blob = await resp.blob();
          items[blob.type] = blob;
        }
        await navigator.clipboard.write([new ClipboardItem(items)]);
        showToast("✅ Teks + Gambar disalin!", 'success');
      } catch {
        showToast("⚠ Gagal menyalin", 'warning');
      }
    };
    
    const del = document.createElement("span");
    del.innerHTML = '<i class="fas fa-trash"></i>';
    del.className = "sticky-delete";
    del.onclick = e => { e.stopPropagation(); deleteSticky(i); };
    
    const edit = document.createElement("span");
    edit.innerHTML = '<i class="fas fa-pen"></i>';
    edit.className = "sticky-edit";
    edit.onclick = e => { e.stopPropagation(); editSticky(i); };
    
    div.appendChild(del);
    div.appendChild(edit);
    div.setAttribute("draggable", true);
    div.ondragstart = e => e.dataTransfer.setData("text/plain", i);
    div.ondragover = e => { e.preventDefault(); div.style.borderColor = 'var(--neon-cyan)'; };
    div.ondragleave = () => div.style.borderColor = '';
    div.ondrop = e => {
      e.preventDefault();
      div.style.borderColor = '';
      reorderSticky(e.dataTransfer.getData("text/plain"), i);
    };
    
    list.appendChild(div);
  });
}

function reorderSticky(from, to) {
  let stickies = JSON.parse(localStorage.getItem("stickies") || "[]");
  const moved = stickies.splice(from, 1)[0];
  stickies.splice(to, 0, moved);
  localStorage.setItem("stickies", JSON.stringify(stickies));
  loadStickyNotes();
  showToast('✅ Urutan diperbarui', 'success');
}

function deleteSticky(i) {
  let stickies = JSON.parse(localStorage.getItem("stickies") || "[]");
  stickies.splice(i, 1);
  localStorage.setItem("stickies", JSON.stringify(stickies));
  loadStickyNotes();
  showToast('🗑️ Catatan dihapus', 'success');
}

function editSticky(i) {
  const stickies = JSON.parse(localStorage.getItem("stickies") || "[]");
  const input = document.getElementById("stickyInput");
  input.value = stickies[i].text || "";
  input.dataset.image = stickies[i].image || "";
  autoResize(input);
  if (stickies[i].image) showPhotoPreview(stickies[i].image);
  else removePhoto();
  editIndex = i;
  document.getElementById("stickyAddBtn").querySelector("span").textContent = "Update";
  input.focus();
  showToast('✏️ Mode edit aktif', 'info');
}

function handleFileSelect(event) {
  const file = event.target.files[0];
  if (file && file.type.startsWith('image/')) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const base64 = e.target.result;
      document.getElementById("stickyInput").dataset.image = base64;
      showPhotoPreview(base64);
      showToast('📸 Foto diunggah!', 'success');
    };
    reader.readAsDataURL(file);
  }
}

function handleStickyPaste(event) {
  const items = event.clipboardData.items;
  for (let i = 0; i < items.length; i++) {
    if (items[i].type.startsWith('image/')) {
      event.preventDefault();
      const blob = items[i].getAsFile();
      const reader = new FileReader();
      reader.onload = function(e) {
        const base64 = e.target.result;
        document.getElementById("stickyInput").dataset.image = base64;
        showPhotoPreview(base64);
        showToast('📸 Foto ditempel!', 'success');
      };
      reader.readAsDataURL(blob);
      break;
    }
  }
}

function showPhotoPreview(dataUrl) {
  const preview = document.getElementById('stickyPhotoPreview');
  const previewImg = document.getElementById('stickyPreviewImg');
  previewImg.src = dataUrl;
  preview.classList.add('show');
}

function removePhoto() {
  const input = document.getElementById("stickyInput");
  if(input) input.dataset.image = "";
  document.getElementById('stickyPhotoPreview').classList.remove('show');
  document.getElementById('fileInput').value = '';
}

function addToSticky(kendalaIndex, answerNum) {
  const item = filteredKendala[kendalaIndex];
  const content = item[`jawaban${answerNum}`];
  if (!content) return;
  const photoPattern = /(https?:\/\/[^\s]+\.(jpg|jpeg|png|gif|webp))/i;
  const match = content.match(photoPattern);
  const imageUrl = match ? match[1] : null;
  
  let stickies = JSON.parse(localStorage.getItem("stickies") || "[]");
  stickies.push({
    text: imageUrl ? content.replace(photoPattern, '').trim() : content,
    image: imageUrl
  });
  localStorage.setItem("stickies", JSON.stringify(stickies));
  loadStickyNotes();
  showToast('✅ Ditambahkan ke Sticky Notes!', 'success');
}

// ================= INITIALIZATION =================
document.addEventListener('DOMContentLoaded', () => {
  loadKendalaData();
  const stickyInput = document.getElementById('stickyInput');
  if (stickyInput) {
    stickyInput.addEventListener('paste', handleStickyPaste);
  }
  setTimeout(() => showToast('🔷 System Ready!', 'success'), 800);
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeLightbox();
    const panel = document.getElementById("stickyPanel");
    if (panel.classList.contains('active')) toggleStickyPanel();
  }
});
</script>
