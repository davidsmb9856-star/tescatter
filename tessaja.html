<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ScriptVault × Cyber Portal</title>

<!-- PRECONNECT untuk mempercepat koneksi -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="preconnect" href="https://www.gstatic.com">

<!-- Font + Icon async, tidak blocking -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">

<style>
:root{
  --bg-primary:#0a0e1a;--bg-secondary:#111827;--bg-card:#1a2332;--field-bg:#0f1623;
  --neon-cyan:#00e5ff;--neon-purple:#b14aff;--neon-pink:#ff3d8b;--neon-green:#00ff9d;
  --text-primary:#e8eef7;--text-secondary:#9aa5b8;--text-muted:#5a6478;
  --border-subtle:rgba(255,255,255,.08);--border-accent:rgba(0,229,255,.3);
  --grad-main:linear-gradient(135deg,#00e5ff 0%,#b14aff 100%);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;overflow-x:hidden}
.bg-effects{position:fixed;inset:0;background:radial-gradient(ellipse at top left,rgba(0,229,255,.08),transparent 50%),radial-gradient(ellipse at bottom right,rgba(177,74,255,.08),transparent 50%);pointer-events:none;z-index:0}

/* LAYOUT */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh;position:relative;z-index:1}
.sidebar{background:rgba(17,24,39,.7);backdrop-filter:blur(20px);border-right:1px solid var(--border-subtle);padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar-logo{display:flex;align-items:center;gap:10px;padding:8px 10px 22px;border-bottom:1px solid var(--border-subtle);margin-bottom:18px}
.sidebar-logo .logo-emoji{font-size:30px;filter:drop-shadow(0 0 10px var(--neon-cyan))}
.sidebar-logo h1{font-family:'Space Grotesk';font-size:18px;background:var(--grad-main);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:700}
.sidebar-logo p{font-size:9px;color:var(--text-muted);letter-spacing:2px}

.nav-label{font-size:9px;color:var(--text-muted);letter-spacing:2px;padding:14px 12px 6px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;cursor:pointer;color:var(--text-secondary);font-size:13px;font-weight:500;transition:all .2s;margin:2px 0;position:relative}
.nav-item:hover{background:rgba(0,229,255,.06);color:var(--text-primary)}
.nav-item.active{background:linear-gradient(90deg,rgba(0,229,255,.15),rgba(177,74,255,.1));color:var(--neon-cyan)}
.nav-item.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:3px;background:var(--grad-main);border-radius:2px}
.nav-icon{width:18px;text-align:center;font-size:14px}
.nav-badge{margin-left:auto;background:rgba(0,229,255,.15);color:var(--neon-cyan);padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;font-family:'JetBrains Mono'}
.user-card{margin-top:auto;padding:14px;background:rgba(0,229,255,.05);border:1px solid var(--border-accent);border-radius:12px}
.user-card .avatar{width:38px;height:38px;border-radius:50%;background:var(--grad-main);display:flex;align-items:center;justify-content:center;font-weight:700;color:#0a0e1a}

/* MAIN */
.main{padding:24px 32px;overflow-x:hidden}
.topbar{display:flex;align-items:center;gap:16px;margin-bottom:24px}
.page-title{font-family:'Space Grotesk';font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px}
.page-title i{color:var(--neon-cyan)}
.clock{margin-left:auto;font-family:'JetBrains Mono';font-size:13px;color:var(--neon-cyan);padding:6px 14px;background:rgba(0,229,255,.08);border:1px solid var(--border-accent);border-radius:8px}

.section{display:none;animation:fade .3s ease}
.section.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* CARDS */
.card{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:14px;padding:20px;margin-bottom:16px;transition:all .2s}
.card:hover{border-color:var(--border-accent);box-shadow:0 4px 24px rgba(0,229,255,.08)}
.card h3{font-family:'Space Grotesk';font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:8px}

/* BUTTONS */
.btn{padding:9px 18px;border:none;border-radius:9px;font-family:inherit;font-weight:600;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:all .2s}
.btn-primary{background:var(--grad-main);color:#0a0e1a}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,229,255,.3)}
.btn-ghost{background:transparent;color:var(--text-secondary);border:1px solid var(--border-subtle)}
.btn-ghost:hover{color:var(--text-primary);border-color:var(--border-accent)}
.btn-danger{background:rgba(255,61,139,.15);color:var(--neon-pink);border:1px solid rgba(255,61,139,.3)}
.btn-warning{background:rgba(255,170,0,.15);color:#ffaa00;border:1px solid rgba(255,170,0,.3)}
.btn-mini{padding:4px 10px;font-size:10px;border-radius:6px;background:rgba(0,229,255,.1);color:var(--neon-cyan);border:1px solid var(--border-accent);cursor:pointer}
.btn-mini:hover{background:rgba(0,229,255,.2)}

/* INPUTS */
.input-field,.input-field-wide{width:100%;padding:11px 14px;background:var(--field-bg);border:1px solid var(--border-subtle);border-radius:9px;color:var(--text-primary);font-family:inherit;font-size:13px;transition:all .2s}
.input-field:focus,.input-field-wide:focus{outline:none;border-color:var(--neon-cyan);box-shadow:0 0 0 3px rgba(0,229,255,.1)}
textarea.input-field{min-height:90px;resize:vertical;font-family:'JetBrains Mono';font-size:12px;line-height:1.6}
.input-label{display:block;font-size:10px;color:var(--text-secondary);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}

/* SEARCH BAR */
.search-bar{display:flex;align-items:center;gap:10px;background:var(--field-bg);border:1px solid var(--border-subtle);border-radius:10px;padding:10px 14px;margin-bottom:16px}
.search-bar i{color:var(--text-muted)}
.search-bar input{flex:1;background:transparent;border:none;color:var(--text-primary);font-family:inherit;font-size:13px;outline:none}

/* FILTER BAR (PENGGUNA) */
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;padding:14px;background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:12px}
.filter-chip{padding:7px 14px;background:transparent;border:1px solid var(--border-subtle);border-radius:20px;color:var(--text-secondary);cursor:pointer;font-size:11px;font-weight:600;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.filter-chip:hover{border-color:var(--border-accent);color:var(--text-primary)}
.filter-chip.active{background:var(--grad-main);color:#0a0e1a;border-color:transparent}
.filter-chip i{font-size:10px}

/* KENDALA */
.kendala-card{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:12px;padding:18px;margin-bottom:14px}
.kendala-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.kendala-num{width:32px;height:32px;border-radius:8px;background:var(--grad-main);color:#0a0e1a;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'JetBrains Mono';font-size:12px}
.kendala-title{font-family:'Space Grotesk';font-size:15px;font-weight:700;flex:1}
.kendala-badge{font-size:9px;padding:3px 8px;border-radius:10px;font-weight:700;letter-spacing:.5px}
.badge-public{background:rgba(0,255,157,.15);color:var(--neon-green);border:1px solid rgba(0,255,157,.3)}
.badge-admin{background:rgba(255,170,0,.15);color:#ffaa00;border:1px solid rgba(255,170,0,.3)}
.jawaban-box{background:var(--field-bg);border:1px solid var(--border-subtle);border-radius:9px;padding:12px 14px;margin-bottom:10px}
.jawaban-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.jawaban-label{font-size:10px;font-weight:700;color:var(--neon-cyan);letter-spacing:1px}
.jawaban-text{font-size:13px;line-height:1.7;color:var(--text-primary);white-space:pre-wrap;word-break:break-word}
.kendala-meta{display:flex;gap:14px;align-items:center;font-size:11px;color:var(--text-muted);margin-top:10px;padding-top:10px;border-top:1px dashed var(--border-subtle)}
.kendala-meta .icon{color:var(--neon-cyan);margin-right:4px}

/* KOMENTAR */
.comments-section{margin-top:14px;padding-top:14px;border-top:1px dashed var(--border-subtle)}
.comment-item{display:flex;gap:10px;padding:10px;background:rgba(0,229,255,.03);border-radius:8px;margin-bottom:8px}
.comment-avatar{width:28px;height:28px;border-radius:50%;background:var(--grad-main);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;color:#0a0e1a;flex-shrink:0}
.comment-body{flex:1}
.comment-author{font-size:11px;font-weight:700;color:var(--neon-cyan);margin-bottom:3px}
.comment-author span{color:var(--text-muted);font-weight:400;margin-left:6px;font-size:10px}
.comment-text{font-size:12px;line-height:1.5;color:var(--text-primary)}
.comment-input-row{display:flex;gap:8px;margin-top:8px}
.comment-input-row input{flex:1;padding:8px 12px;background:var(--field-bg);border:1px solid var(--border-subtle);border-radius:8px;color:var(--text-primary);font-size:12px}
.comment-input-row input:focus{outline:none;border-color:var(--neon-cyan)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-overlay.show{display:flex;animation:fade .25s}
.modal{background:var(--bg-secondary);border:1px solid var(--border-accent);border-radius:16px;width:100%;max-width:640px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal-header{padding:18px 22px;border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:space-between}
.modal-header h3{font-family:'Space Grotesk';display:flex;align-items:center;gap:10px;font-size:16px}
.modal-header .bar{width:4px;height:20px;background:var(--grad-main);border-radius:2px}
.modal-body{padding:22px;overflow-y:auto;flex:1}
.modal-footer{padding:16px 22px;border-top:1px solid var(--border-subtle);display:flex;gap:10px}

/* SETTINGS PANELS */
.set-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border-subtle)}
.set-row:last-child{border-bottom:none}
.switch{position:relative;width:42px;height:22px}
.switch input{opacity:0;width:0;height:0}
.sl{position:absolute;inset:0;background:var(--field-bg);border:1px solid var(--border-subtle);border-radius:12px;cursor:pointer;transition:.2s}
.sl::before{content:'';position:absolute;width:16px;height:16px;left:2px;top:2px;background:var(--text-muted);border-radius:50%;transition:.2s}
.switch input:checked+.sl{background:rgba(0,229,255,.2);border-color:var(--neon-cyan)}
.switch input:checked+.sl::before{transform:translateX(20px);background:var(--neon-cyan)}

/* MENU MANAGER ITEM */
.menu-mgr-item{display:flex;align-items:center;gap:8px;padding:10px;background:var(--field-bg);border:1px solid var(--border-subtle);border-radius:9px;margin-bottom:8px}
.menu-mgr-item .drag-handle{color:var(--text-muted);cursor:grab;padding:0 4px}
.menu-mgr-item input{flex:1;background:transparent;border:none;color:var(--text-primary);font-family:inherit;font-size:12.5px;outline:none;padding:4px 6px;border-bottom:1px dashed transparent}
.menu-mgr-item input:focus{border-bottom-color:var(--neon-cyan)}
.menu-mgr-item .mini-actions{display:flex;gap:4px}
.icon-btn{width:28px;height:28px;border-radius:6px;background:rgba(0,229,255,.08);color:var(--neon-cyan);border:1px solid var(--border-accent);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px}
.icon-btn:hover{background:rgba(0,229,255,.2)}
.icon-btn.danger{background:rgba(255,61,139,.08);color:var(--neon-pink);border-color:rgba(255,61,139,.3)}

/* ANSWER DYNAMIC */
.answer-item{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}
.answer-item .num{width:24px;height:24px;border-radius:6px;background:var(--grad-main);color:#0a0e1a;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;margin-top:8px}
.answer-item textarea{flex:1}

/* SKELETON */
.skeleton{background:linear-gradient(90deg,var(--field-bg) 25%,rgba(0,229,255,.05) 50%,var(--field-bg) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px;height:80px;margin-bottom:10px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* TOAST */
.toast-wrap{position:fixed;top:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 18px;background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:10px;font-size:12.5px;min-width:220px;animation:slideIn .3s;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.success{border-color:var(--neon-green);color:var(--neon-green)}
.toast.error{border-color:var(--neon-pink);color:var(--neon-pink)}
.toast.info{border-color:var(--neon-cyan);color:var(--neon-cyan)}
@keyframes slideIn{from{transform:translateX(400px);opacity:0}to{transform:none;opacity:1}}

/* AUTH */
.auth-gate{position:fixed;inset:0;background:var(--bg-primary);display:flex;align-items:center;justify-content:center;z-index:50}
.auth-gate.hidden{display:none}
.auth-box{background:var(--bg-card);border:1px solid var(--border-accent);padding:40px;border-radius:18px;text-align:center;max-width:400px}
.auth-box h1{font-family:'Space Grotesk';font-size:28px;background:var(--grad-main);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:16px 0 8px}
.auth-box p{color:var(--text-secondary);font-size:13px;margin-bottom:22px;line-height:1.6}
.google-btn{padding:12px 28px;background:#fff;color:#0a0e1a;border:none;border-radius:10px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:10px;font-family:inherit;font-size:13px}

/* EMPTY */
.empty{text-align:center;padding:40px 20px;color:var(--text-muted)}
.empty .icon{font-size:40px;margin-bottom:10px;opacity:.5}

/* PIN INPUT */
.pin-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:150}
.pin-overlay.show{display:flex}
.pin-input{width:54px;height:62px;background:var(--field-bg);border:2px solid var(--border-accent);border-radius:11px;color:var(--neon-cyan);font-family:'Space Grotesk';font-size:26px;font-weight:700;text-align:center}

/* RESPONSIVE */
@media(max-width:768px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:-280px;z-index:40;transition:left .3s}
  .sidebar.open{left:0}
  .main{padding:16px}
}
</style>
</head>
<body>
<div class="bg-effects"></div>

<!-- AUTH GATE -->
<div class="auth-gate" id="authGate">
  <div class="auth-box">
    <div style="font-size:50px;filter:drop-shadow(0 0 20px var(--neon-cyan))">🐒</div>
    <h1>SCRIPTVAULT</h1>
    <p>Login dengan Google untuk mengakses ScriptVault × Cyber Portal</p>
    <button class="google-btn" onclick="loginGoogle()"><i class="fab fa-google"></i> Login dengan Google</button>
  </div>
</div>

<!-- APP -->
<div class="app" id="app" style="display:none">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-emoji">🐒</div>
      <div>
        <h1 id="appTitle">SCRIPTVAULT</h1>
        <p id="appSubtitle">CYBER PORTAL</p>
      </div>
    </div>
    <nav id="sidebarNav"></nav>
    <div class="user-card" id="userCard"></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="page-title" id="pageTitle"></div>
      <div class="clock" id="clock">--:--:--</div>
    </div>
    <div id="sections"></div>
  </main>
</div>

<!-- MODAL: Portal Settings -->
<div class="modal-overlay" id="portalSettingsOverlay">
  <div class="modal" style="max-width:720px">
    <div class="modal-header">
      <h3><span class="bar"></span><i class="fas fa-cog"></i> PENGATURAN PORTAL</h3>
      <button class="btn btn-ghost" onclick="closePortalSettings()"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body" id="portalSettingsForm"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="resetPortal()" style="flex:1"><i class="fas fa-undo"></i> Reset Default</button>
      <button class="btn btn-primary" onclick="savePortalSettings()" style="flex:2"><i class="fas fa-save"></i> SIMPAN</button>
    </div>
  </div>
</div>

<!-- MODAL: PIN -->
<div class="pin-overlay" id="portalPinOverlay">
  <div class="modal" style="max-width:380px">
    <div class="modal-header">
      <h3><span class="bar"></span><i class="fas fa-lock"></i> PIN PORTAL</h3>
      <button class="btn btn-ghost" onclick="closePin()"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body" style="text-align:center">
      <p style="color:var(--text-secondary);font-size:13px;margin-bottom:20px">Masukkan PIN untuk membuka pengaturan</p>
      <div style="display:flex;gap:10px;justify-content:center;margin:20px 0" id="pinInputs"></div>
      <div id="portalPinError" style="color:var(--neon-pink);font-size:12px;min-height:18px"></div>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<!-- Firebase SDK (defer agar tidak blocking) -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

<script>
/* ============================================================
   KONFIGURASI FIREBASE — GANTI DENGAN MILIKMU
============================================================ */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "YOUR_DATABASE_URL",
  projectId: "YOUR_PROJECT_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();
const googleProvider = new firebase.auth.GoogleAuthProvider();
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

/* ============================================================
   GLOBAL STATE
============================================================ */
const STATE = {
  user: null, currentIP: 'unknown', currentSection: 'portal',
  scripts: [], kendalaList: [], fotoList: [], comments: {},
  portalConfig: { menus: [], settings: {}, pin: '1234', loaded: false },
  listeners: { portal:false, kendala:false, foto:false, comments:{} },
  initialized: false, initPromise: null
};

const DEFAULT_SETTINGS = {
  appTitle: 'SCRIPTVAULT', appSubtitle: 'CYBER PORTAL 2026', logoEmoji: '🐒',
  welcomeOn: true, clock24: true, autoRefreshOn: false, autoRefreshSec: 60,
  defaultPublic: true, maxHistory: 30,
  adminEmails: 'david.smb9856@gmail.com'
};

const DEFAULT_MENUS = [
  { id:'portal',     name:'Cyber Portal',   icon:'fa-rocket',     cat:'PORTAL' },
  { id:'dashboard',  name:'Dashboard',      icon:'fa-chart-line', cat:'VAULT' },
  { id:'scripts',    name:'Script Saya',    icon:'fa-box',        cat:'VAULT' },
  { id:'kendala',    name:'All Kendala',    icon:'fa-headset',    cat:'SUPPORT' },
  { id:'foto',       name:'Foto',           icon:'fa-camera',     cat:'SUPPORT' },
  { id:'history',    name:'Histori Login',  icon:'fa-user-shield',cat:'ADMIN', adminOnly:true }
];

/* ============================================================
   UTILITIES
============================================================ */
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stamp = () => new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
const ago = ts => {
  if(!ts) return '';
  const d = Date.now() - new Date(ts).getTime();
  const m = Math.floor(d/60000), h = Math.floor(m/60), D = Math.floor(h/24);
  if(D>0) return D+'h lalu'; if(h>0) return h+'j lalu'; if(m>0) return m+'m lalu'; return 'baru saja';
};
function toast(msg, type='info'){
  const t = document.createElement('div');
  t.className = 'toast '+type;
  t.innerHTML = msg;
  $('#toastWrap').appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateX(400px)'; setTimeout(()=>t.remove(),300); }, 3000);
}

/* ============================================================
   AUTH
============================================================ */
function loginGoogle(){ auth.signInWithPopup(googleProvider).catch(e=>toast('❌ '+e.message,'error')); }
function logout(){ auth.signOut(); }

async function fetchIP(){
  // 🚀 OPTIMASI: tidak blocking, fire-and-forget
  try {
    const r = await fetch('https://api.ipify.org?format=json', { signal: AbortSignal.timeout(3000) });
    const d = await r.json(); STATE.currentIP = d.ip || 'unknown';
  } catch { STATE.currentIP = 'unknown'; }
}

/* ============================================================
   FIREBASE REFS
============================================================ */
const REFS = {
  scripts:    () => db.ref('scripts'),
  portal:     () => db.ref('portal_settings/main'),
  userPin:    uid => db.ref('user_pins/'+uid),
  kendala:    () => db.ref('kendala'),
  foto:       () => db.ref('foto'),
  comments:   kid => db.ref('comments/'+kid),
  logins:     () => db.ref('login_history')
};

/* ============================================================
   ADMIN CHECK
============================================================ */
function getAdminEmails(){
  return String(STATE.portalConfig.settings.adminEmails||'').split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);
}
function isAdmin(){
  return STATE.user && getAdminEmails().includes((STATE.user.email||'').toLowerCase());
}

/* ============================================================
   LOAD PORTAL CONFIG
============================================================ */
async function loadPortalConfig(){
  try {
    const snap = await REFS.portal().once('value');
    const val = snap.val();
    if(val){
      STATE.portalConfig.menus = Array.isArray(val.menus) && val.menus.length ? val.menus : JSON.parse(JSON.stringify(DEFAULT_MENUS));
      STATE.portalConfig.settings = Object.assign({}, DEFAULT_SETTINGS, val.settings||{});
    } else {
      STATE.portalConfig.menus = JSON.parse(JSON.stringify(DEFAULT_MENUS));
      STATE.portalConfig.settings = {...DEFAULT_SETTINGS};
      if(isAdmin()) await REFS.portal().set({ menus: STATE.portalConfig.menus, settings: STATE.portalConfig.settings, updatedAt: new Date().toISOString(), reason:'init' });
    }
    STATE.portalConfig.loaded = true;
  } catch(e){
    console.error(e);
    STATE.portalConfig.menus = JSON.parse(JSON.stringify(DEFAULT_MENUS));
    STATE.portalConfig.settings = {...DEFAULT_SETTINGS};
    STATE.portalConfig.loaded = true;
  }
}

async function loadUserPin(){
  if(!STATE.user) return;
  try {
    const snap = await REFS.userPin(STATE.user.uid).once('value');
    const val = snap.val();
    STATE.portalConfig.pin = (val && val.portalPin) ? String(val.portalPin) : '1234';
  } catch {}
}

async function savePortalConfigToFirebase(reason='manual'){
  if(!isAdmin()) throw new Error('Hanya admin');
  await REFS.portal().set({
    menus: STATE.portalConfig.menus,
    settings: STATE.portalConfig.settings,
    updatedAt: new Date().toISOString(),
    updatedBy: STATE.user.email, reason
  });
}

/* ============================================================
   REAL-TIME LISTENERS (LAZY)
============================================================ */
function startPortalListener(){
  if(STATE.listeners.portal) return;
  STATE.listeners.portal = true;
  REFS.portal().on('value', snap=>{
    const val = snap.val();
    if(!val) return;
    STATE.portalConfig.menus = Array.isArray(val.menus) && val.menus.length ? val.menus : STATE.portalConfig.menus;
    STATE.portalConfig.settings = Object.assign({}, DEFAULT_SETTINGS, val.settings||{});
    renderSidebar();
    if(STATE.currentSection==='portal') renderPortal();
  });
}

function startKendalaListener(){
  if(STATE.listeners.kendala) return;
  STATE.listeners.kendala = true;
  REFS.kendala().on('value', snap=>{
    const val = snap.val() || {};
    STATE.kendalaList = Object.entries(val).map(([id,k])=>({id,...k})).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
    if(STATE.currentSection==='kendala') renderKendala();
  });
}

function startFotoListener(){
  if(STATE.listeners.foto) return;
  STATE.listeners.foto = true;
  REFS.foto().on('value', snap=>{
    const val = snap.val() || {};
    STATE.fotoList = Object.entries(val).map(([id,f])=>({id,...f})).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
    if(STATE.currentSection==='foto') renderFoto();
  });
}

function startCommentsListener(kid){
  if(STATE.listeners.comments[kid]) return;
  STATE.listeners.comments[kid] = true;
  REFS.comments(kid).on('value', snap=>{
    const val = snap.val() || {};
    STATE.comments[kid] = Object.entries(val).map(([id,c])=>({id,...c})).sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));
    renderComments(kid);
  });
}

/* ============================================================
   INIT APP (PARALEL!)
============================================================ */
async function initApp(){
  if(STATE.initPromise) return STATE.initPromise;
  STATE.initPromise = (async()=>{
    // 🚀 OPTIMASI: semua fetch paralel
    showSkeleton();
    await Promise.all([
      loadPortalConfig(),
      loadUserPin(),
      fetchIP() // tidak blocking hasil
    ]);

    renderSidebar();
    renderUserCard();
    navigate('portal');
    startClock();
    startPortalListener();
    STATE.initialized = true;
    hideSkeleton();
  })();
  return STATE.initPromise;
}

/* ============================================================
   AUTH STATE
============================================================ */
auth.onAuthStateChanged(async user=>{
  if(user){
    STATE.user = { uid:user.uid, email:user.email, name:user.displayName||user.email.split('@')[0], photo:user.photoURL };
    $('#authGate').classList.add('hidden');
    $('#app').style.display = 'grid';
    await initApp();
    if(STATE.portalConfig.settings.welcomeOn) showWelcome();
  } else {
    STATE.user = null;
    $('#authGate').classList.remove('hidden');
    $('#app').style.display = 'none';
  }
});

/* ============================================================
   SIDEBAR RENDER (dari portalConfig.menus — bisa di-reorder!)
============================================================ */
function renderSidebar(){
  const menus = STATE.portalConfig.menus.filter(m=>{
    if(m.adminOnly && !isAdmin()) return false;
    return true;
  });
  const nav = $('#sidebarNav');
  let html = '';
  let lastCat = '';
  menus.forEach(m=>{
    if(m.cat && m.cat!==lastCat){
      html += `<div class="nav-label">${esc(m.cat)}</div>`;
      lastCat = m.cat;
    }
    const active = STATE.currentSection===m.id ? 'active':'';
    html += `<div class="nav-item ${active}" onclick="navigate('${m.id}')">
      <span class="nav-icon"><i class="fas ${m.icon||'fa-circle'}"></i></span>
      ${esc(m.name)}
      <span class="nav-badge" id="badge-${m.id}">0</span>
    </div>`;
  });
  // logout
  html += `<div class="nav-label">AKUN</div>
    <div class="nav-item" onclick="openPortalSettings()"><span class="nav-icon"><i class="fas fa-cog"></i></span>Pengaturan Portal</div>
    <div class="nav-item" onclick="logout()"><span class="nav-icon"><i class="fas fa-sign-out-alt"></i></span>Logout</div>`;
  nav.innerHTML = html;

  // apply branding
  $('#appTitle').textContent = STATE.portalConfig.settings.appTitle || 'SCRIPTVAULT';
  $('#appSubtitle').textContent = STATE.portalConfig.settings.appSubtitle || 'CYBER PORTAL';
}

/* ============================================================
   NAVIGATION (LAZY RENDER)
============================================================ */
const TITLES = {
  portal:    '<i class="fas fa-rocket"></i> CYBER PORTAL',
  dashboard: '<i class="fas fa-chart-line"></i> DASHBOARD',
  scripts:   '<i class="fas fa-box"></i> SCRIPT SAYA',
  kendala:   '<i class="fas fa-headset"></i> ALL KENDALA',
  foto:      '<i class="fas fa-camera"></i> GALERI FOTO',
  history:   '<i class="fas fa-user-shield"></i> HISTORI LOGIN'
};

function navigate(section){
  // guard admin
  const menu = STATE.portalConfig.menus.find(m=>m.id===section);
  if(menu?.adminOnly && !isAdmin()){ toast('⛔ Khusus admin','error'); return; }

  STATE.currentSection = section;
  $('#pageTitle').innerHTML = TITLES[section] || TITLES.portal;

  // update active sidebar
  $$('#sidebarNav .nav-item').forEach(n=>n.classList.remove('active'));
  const active = $(`#sidebarNav .nav-item[onclick*="'${section}'"]`);
  if(active) active.classList.add('active');

  // lazy render section
  const container = $('#sections');
  let secEl = $(`#section-${section}`);
  if(!secEl){
    secEl = document.createElement('div');
    secEl.id = 'section-'+section;
    secEl.className = 'section';
    container.appendChild(secEl);
  }
  $$('.section').forEach(s=>s.classList.remove('active'));
  secEl.classList.add('active');

  // lazy load data + render
  if(section==='portal')    renderPortal();
  if(section==='dashboard') renderDashboard();
  if(section==='scripts')   renderScripts();
  if(section==='kendala')   { startKendalaListener(); renderKendala(); }
  if(section==='foto')      { startFotoListener(); renderFoto(); }
  if(section==='history')   renderHistory();
}

/* ============================================================
   PORTAL (Menu Grid)
============================================================ */
function renderPortal(){
  const sec = $('#section-portal');
  const menus = STATE.portalConfig.menus.filter(m=>!m.adminOnly || isAdmin());
  const grouped = {};
  menus.forEach(m=>{ const c = m.cat||'LAINNYA'; (grouped[c]=grouped[c]||[]).push(m); });

  let html = '';
  Object.entries(grouped).forEach(([cat,items])=>{
    html += `<section style="margin-bottom:24px">
      <h3 style="font-family:Space Grotesk;font-size:12px;color:var(--text-muted);letter-spacing:2px;margin-bottom:12px">${esc(cat)}</h3>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px">`;
    items.forEach(m=>{
      html += `<div class="card" onclick="navigate('${m.id}')" style="cursor:pointer">
        <h3><i class="fas ${m.icon||'fa-circle'}" style="color:var(--neon-cyan)"></i> ${esc(m.name)}</h3>
        <p style="font-size:12px;color:var(--text-secondary)">${esc(m.desc||'Buka section '+m.name)}</p>
      </div>`;
    });
    html += `</div></section>`;
  });
  sec.innerHTML = html || '<div class="empty"><div class="icon">🗂️</div><p>Belum ada menu</p></div>';
}

/* ============================================================
   KENDALA — dengan jawaban DINAMIS & visibility
============================================================ */
let kendalaFilter = 'all';
let kendalaSearch = '';

function renderKendala(){
  const sec = $('#section-kendala');
  const visible = STATE.kendalaList.filter(k=>{
    // visibility filter
    if(k.visibility==='admin' && !isAdmin()) return false;
    // search
    if(kendalaSearch){
      const q = kendalaSearch.toLowerCase();
      const inTitle = (k.judul||'').toLowerCase().includes(q);
      const inAns = (k.answers||[]).some(a=>(a||'').toLowerCase().includes(q));
      if(!inTitle && !inAns) return false;
    }
    // filter tab
    if(kendalaFilter==='mine') return k.ownerUid===STATE.user?.uid;
    if(kendalaFilter==='admin') return k.visibility==='admin';
    return true;
  });

  sec.innerHTML = `
    <div class="card">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px">
        <h3 style="flex:1"><i class="fas fa-headset" style="color:var(--neon-cyan)"></i> ALL KENDALA <span style="color:var(--text-muted);font-size:12px;font-weight:400">(${visible.length})</span></h3>
        <button class="btn btn-primary" onclick="openKendalaForm()"><i class="fas fa-plus"></i> TAMBAH</button>
      </div>

      <div class="filter-bar">
        <div class="filter-chip ${kendalaFilter==='all'?'active':''}" onclick="setKendalaFilter('all')"><i class="fas fa-globe"></i> Semua</div>
        <div class="filter-chip ${kendalaFilter==='public'?'active':''}" onclick="setKendalaFilter('public')"><i class="fas fa-users"></i> Publik</div>
        <div class="filter-chip ${kendalaFilter==='admin'?'active':''}" onclick="setKendalaFilter('admin')"><i class="fas fa-user-shield"></i> Admin Only</div>
        <div class="filter-chip ${kendalaFilter==='mine'?'active':''}" onclick="setKendalaFilter('mine')"><i class="fas fa-user"></i> Punya Saya</div>
      </div>

      <div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Cari judul atau jawaban..." value="${esc(kendalaSearch)}" oninput="kendalaSearch=this.value;renderKendala()">
      </div>

      <div id="kendalaList">${renderKendalaList(visible)}</div>
    </div>

    <div id="kendalaFormContainer"></div>`;
}

function renderKendalaList(list){
  if(!list.length) return '<div class="empty"><div class="icon">📭</div><p>Belum ada kendala</p></div>';
  return list.map((k,idx)=>{
    const answers = Array.isArray(k.answers) ? k.answers : (k.jawaban1?[k.jawaban1,k.jawaban2,k.jawaban3].filter(Boolean):[]);
    const answersHtml = answers.map((a,i)=>`
      <div class="jawaban-box">
        <div class="jawaban-top">
          <span class="jawaban-label">JAWABAN ${i+1}</span>
          <button class="btn-mini" onclick="copyAns(this,${idx},${i})"><i class="fas fa-copy"></i> COPY</button>
        </div>
        <div class="jawaban-text">${esc(a)}</div>
      </div>`).join('') || '<div style="color:var(--text-muted);font-size:11px;font-style:italic;padding:8px">Belum ada jawaban</div>';

    const badge = k.visibility==='admin'
      ? '<span class="kendala-badge badge-admin"><i class="fas fa-user-shield"></i> ADMIN</span>'
      : '<span class="kendala-badge badge-public"><i class="fas fa-globe"></i> PUBLIK</span>';

    const canEdit = isAdmin() || k.ownerUid===STATE.user?.uid;

    return `<div class="kendala-card">
      <div class="kendala-head">
        <div class="kendala-num">${idx+1}</div>
        <div class="kendala-title">${esc(k.judul)}</div>
        ${badge}
      </div>
      ${answersHtml}
      <div class="kendala-meta">
        <span><span class="icon"><i class="fas fa-user"></i></span>${esc(k.ownerName||'?')}</span>
        <span><span class="icon"><i class="fas fa-clock"></i></span>${ago(k.createdAt)}</span>
        ${canEdit?`
          <button class="btn-mini" onclick="editKendala('${k.id}')" style="margin-left:auto"><i class="fas fa-edit"></i> EDIT</button>
          <button class="btn-mini" onclick="deleteKendala('${k.id}')" style="background:rgba(255,61,139,.1);color:var(--neon-pink);border-color:rgba(255,61,139,.3)"><i class="fas fa-trash"></i></button>
        `:''}
      </div>
      <div class="comments-section">
        <div style="font-size:11px;font-weight:700;color:var(--text-secondary);letter-spacing:1px;margin-bottom:8px"><i class="fas fa-comments" style="color:var(--neon-cyan)"></i> KOMENTAR</div>
        <div id="comments-${k.id}"><div class="skeleton" style="height:40px"></div></div>
        <div class="comment-input-row">
          <input type="text" id="cmt-input-${k.id}" placeholder="Tulis komentar..." onkeydown="if(event.key==='Enter')addComment('${k.id}')">
          <button class="btn-mini" onclick="addComment('${k.id}')"><i class="fas fa-paper-plane"></i></button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderComments(kid){
  const el = $(`#comments-${kid}`);
  if(!el) return;
  const list = STATE.comments[kid] || [];
  if(!list.length){ el.innerHTML = '<div style="color:var(--text-muted);font-size:11px;font-style:italic">Belum ada komentar</div>'; return; }
  el.innerHTML = list.map(c=>{
    const initial = (c.authorName||'U').charAt(0).toUpperCase();
    const canDel = isAdmin() || c.authorUid===STATE.user?.uid;
    return `<div class="comment-item">
      <div class="comment-avatar">${initial}</div>
      <div class="comment-body">
        <div class="comment-author">${esc(c.authorName||'?')} <span>${ago(c.createdAt)}</span></div>
        <div class="comment-text">${esc(c.text)}</div>
      </div>
      ${canDel?`<button class="btn-mini" onclick="deleteComment('${kid}','${c.id}')" style="background:rgba(255,61,139,.1);color:var(--neon-pink);border-color:rgba(255,61,139,.3);padding:3px 7px"><i class="fas fa-trash"></i></button>`:''}
    </div>`;
  }).join('');
}

function setKendalaFilter(f){ kendalaFilter = f; renderKendala(); }

function copyAns(btn,ki,ai){
  const k = STATE.kendalaList.filter(k=>k.visibility!=='admin' || isAdmin())[ki];
  const answers = Array.isArray(k.answers) ? k.answers : [k.jawaban1,k.jawaban2,k.jawaban3].filter(Boolean);
  navigator.clipboard.writeText(answers[ai]||'');
  toast('✅ Jawaban disalin','success');
}

function addComment(kid){
  const input = $(`#cmt-input-${kid}`);
  const text = input.value.trim();
  if(!text) return;
  if(!STATE.user){ toast('⛔ Login dulu','error'); return; }
  startCommentsListener(kid);
  REFS.comments(kid).push({
    text, authorUid: STATE.user.uid, authorName: STATE.user.name, authorEmail: STATE.user.email,
    createdAt: new Date().toISOString()
  });
  input.value = '';
}

function deleteComment(kid,cid){
  if(!confirm('Hapus komentar ini?')) return;
  REFS.comments(kid).child(cid).remove();
}

/* KENDALA FORM — jawaban DINAMIS */

let formAnswers = [''];

function openKendalaForm(){
  if(!STATE.user){ toast('⛔ Login dulu','error'); return; }
  editingKendalaId = null;
  formAnswers = [''];
  renderKendalaForm('SIMPAN KENDALA', 'Simpan');

function editKendala(id){
  const k = STATE.kendalaList.find(x=>x.id===id);
  if(!k){ toast('❌ Tidak ditemukan','error'); return; }
  editingKendalaId = id;
  formAnswers = Array.isArray(k.answers) && k.answers.length ? [...k.answers] : (k.jawaban1?[k.jawaban1,k.jawaban2,k.jawaban3].filter(Boolean):['']);
  renderKendalaForm('EDIT KENDALA', 'Update', k);
}

      <div style="display:flex;gap:8px">
        <label class="filter-chip ${visibility==='public'?'active':''}" style="flex:1;justify-content:center"><input type="radio" name="vis" value="public" ${visibility==='public'?'checked':''} style="display:none" onchange="$$('.vis-chip').forEach(c=>c.classList.remove('active'));this.parentNode.classList.add('active')"><i class="fas fa-globe"></i> Publik (semua user)</label>
        <label class="filter-chip vis-chip ${visibility==='admin'?'active':''}" style="flex:1;justify-content:center"><input type="radio" name="vis" value="admin" ${visibility==='admin'?'checked':''} style="display:none" onchange="$$('.vis-chip').forEach(c=>c.classList.remove('active'));this.parentNode.classList.add('active')"><i class="fas fa-user-shield"></i> Admin Only</label>
      </div>
    </div>
    <div style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <label class="input-label" style="margin:0">JAWABAN</label>
        <button class="btn-mini" onclick="addAnswerField()"><i class="fas fa-plus"></i> TAMBAH JAWABAN</button>
      </div>
      <div id="answersContainer"></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--border-subtle)">
      <button class="btn btn-ghost" onclick="closeKendalaForm()" style="flex:1"><i class="fas fa-times"></i> Batal</button>
      <button class="btn btn-primary" onclick="saveKendala()" style="flex:1"><i class="fas fa-save"></i> ${btnLabel}</button>

function renderAnswerFields(){
  const container = $('#answersContainer');
  if(!container) return;
  container.innerHTML = formAnswers.map((a,i)=>`
    <div class="answer-item">
      <div class="num">${i+1}</div>
      <textarea class="input-field" placeholder="Jawaban ${i+1}..." oninput="formAnswers[${i}]=this.value">${esc(a)}</textarea>
      ${formAnswers.length>1?`<button class="icon-btn danger" onclick="removeAnswerField(${i})" title="Hapus"><i class="fas fa-trash"></i></button>`:''}
    </div>`).join('');
}

function addAnswerField(){ formAnswers.push(''); renderAnswerFields(); }
function removeAnswerField(i){ formAnswers.splice(i,1); renderAnswerFields(); }

function closeKendalaForm(){ editingKendalaId=null; formAnswers=['']; $('#kendalaFormContainer').innerHTML=''; }

async function saveKendala(){
  if(!STATE.user){ toast('⛔ Login dulu','error'); return; }
  const judul = $('#kJudul').value.trim();
  if(!judul){ toast('❌ Judul wajib diisi','error'); return; }
  const answers = formAnswers.map(a=>a.trim()).filter(Boolean);
  if(!answers.length){ toast('❌ Minimal 1 jawaban','error'); return; }
  const vis = document.querySelector('input[name="vis"]:checked')?.value || 'public';

  try {
    const data = {
      judul, answers, visibility: vis,
      updatedAt: new Date().toISOString(), updatedBy: STATE.user.email
    };
    if(editingKendalaId){
      await REFS.kendala().child(editingKendalaId).update(data);
      toast('✅ Kendala diupdate','success');
    } else {
      data.createdAt = new Date().toISOString();
      data.ownerUid = STATE.user.uid;
      data.ownerName = STATE.user.name;
      data.ownerEmail = STATE.user.email;
      data.ip = STATE.currentIP;
      await REFS.kendala().push(data);
      toast('✅ Kendala disimpan','success');
    }
    closeKendalaForm();
  } catch(e){ toast('❌ '+e.message,'error'); }
}

async function deleteKendala(id){
  if(!confirm('Hapus kendala ini beserta semua komentarnya?')) return;
  try {
    await REFS.kendala().child(id).remove();
    await REFS.comments(id).remove();
    toast('✅ Dihapus','success');
  } catch(e){ toast('❌ '+e.message,'error'); }
}

/* ============================================================
   HISTORY (Filter Pengguna Modern)
============================================================ */
let historyFilter = { period:'all', user:'' };

function renderHistory(){
  if(!isAdmin()){
    $('#section-history').innerHTML = `<div class="card"><div class="empty"><div class="icon">⛔</div><p>Khusus admin</p></div></div>`;
    return;
  }
  $('#section-history').innerHTML = `
    <div class="card">
      <h3><i class="fas fa-user-shield" style="color:var(--neon-cyan)"></i> HISTORI LOGIN</h3>
      <div class="filter-bar" style="margin-top:14px">
        <div style="flex:1;min-width:200px">
          <label class="input-label">Cari User</label>
          <input type="text" class="input-field" placeholder="Nama atau email..." oninput="historyFilter.user=this.value;renderHistoryList()">
        </div>
        <div>
          <label class="input-label">Periode</label>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <div class="filter-chip ${historyFilter.period==='all'?'active':''}" onclick="historyFilter.period='all';renderHistory()"><i class="fas fa-infinity"></i> Semua</div>
            <div class="filter-chip ${historyFilter.period==='today'?'active':''}" onclick="historyFilter.period='today';renderHistory()">Hari ini</div>
            <div class="filter-chip ${historyFilter.period==='week'?'active':''}" onclick="historyFilter.period='week';renderHistory()">7 Hari</div>
            <div class="filter-chip ${historyFilter.period==='month'?'active':''}" onclick="historyFilter.period='month';renderHistory()">30 Hari</div>
          </div>
        </div>
      </div>
      <div id="historyList"><div class="skeleton"></div><div class="skeleton"></div></div>
    </div>`;
  REFS.logins().once('value').then(snap=>{
    const val = snap.val() || {};
    window._historyData = Object.entries(val).map(([id,h])=>({id,...h})).sort((a,b)=>new Date(b.at)-new Date(a.at));
    renderHistoryList();
  });
}

function renderHistoryList(){
  const el = $('#historyList');
  if(!el) return;
  let data = window._historyData || [];
  const now = Date.now();
  if(historyFilter.period==='today') data = data.filter(h=>now-new Date(h.at).getTime()<86400000);
  if(historyFilter.period==='week')  data = data.filter(h=>now-new Date(h.at).getTime()<7*86400000);
  if(historyFilter.period==='month') data = data.filter(h=>now-new Date(h.at).getTime()<30*86400000);
  if(historyFilter.user){
    const q = historyFilter.user.toLowerCase();
    data = data.filter(h=>(h.email||'').toLowerCase().includes(q)||(h.name||'').toLowerCase().includes(q));
  }
  if(!data.length){ el.innerHTML='<div class="empty"><div class="icon">📭</div><p>Tidak ada data</p></div>'; return; }
  el.innerHTML = data.slice(0,100).map(h=>`
    <div style="display:flex;gap:12px;align-items:center;padding:12px;background:var(--field-bg);border-radius:9px;margin-bottom:8px">
      <div style="width:36px;height:36px;border-radius:50%;background:var(--grad-main);display:flex;align-items:center;justify-content:center;font-weight:700;color:#0a0e1a">${(h.name||'?').charAt(0).toUpperCase()}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(h.name||'?')}</div>
        <div style="font-size:11px;color:var(--text-muted)">${esc(h.email||'?')}</div>
      </div>
      <div style="text-align:right;font-family:JetBrains Mono">
        <div style="font-size:11px;color:var(--neon-cyan)">${new Date(h.at).toLocaleTimeString('id-ID')}</div>
        <div style="font-size:10px;color:var(--text-muted)">${new Date(h.at).toLocaleDateString('id-ID')}</div>
      </div>
    </div>`).join('');
}

/* ============================================================
   PORTAL SETTINGS — REORDER + RENAME
============================================================ */
let editMenus = [];

function openPortalSettings(){
  if(!isAdmin()){ toast('⛔ Khusus admin','error'); return; }
  // minta PIN
  renderPinInputs();
  $('#portalPinOverlay').classList.add('show');
  setTimeout(()=>{ const f = $('.pin-input[data-index="0"]'); if(f) f.focus(); },100);
}

function renderPinInputs(){
  const host = $('#pinInputs');
  host.innerHTML = [0,1,2,3].map(i=>`<input type="password" class="pin-input" maxlength="1" data-index="${i}">`).join('');
  host.querySelectorAll('.pin-input').forEach((inp,i)=>{
    inp.addEventListener('input',e=>{
      const all = Array.from(host.querySelectorAll('.pin-input'));
      const pin = all.map(x=>x.value).join('');
      if(e.target.value && i<3) all[i+1].focus();
      if(pin.length===4){
        setTimeout(()=>{
          if(pin===STATE.portalConfig.pin){
            $('#portalPinOverlay').classList.remove('show');
            showPortalSettingsForm();
          } else {
            $('#portalPinError').textContent = '❌ PIN salah';
            all.forEach(x=>x.value='');
            all[0].focus();
          }
        },200);
      }
    });
    inp.addEventListener('keydown',e=>{
      if(e.key==='Backspace' && !e.target.value && i>0){
        host.querySelectorAll('.pin-input')[i-1].focus();
      }
    });
  });
}
function closePin(){ $('#portalPinOverlay').classList.remove('show'); }

function showPortalSettingsForm(){
  editMenus = JSON.parse(JSON.stringify(STATE.portalConfig.menus));
  const s = STATE.portalConfig.settings;
  const form = $('#portalSettingsForm');

  const switchRow = (label,key) => `
    <div class="set-row">
      <label style="font-size:13px">${label}</label>
      <span class="switch"><input type="checkbox" data-set="${key}" ${s[key]?'checked':''}><span class="sl"></span></span>
    </div>`;
  const inputRow = (label,key,ph,type='text') => `
    <div style="margin-bottom:12px">
      <label class="input-label">${label}</label>
      <input type="${type}" data-set="${key}" value="${esc(s[key]??'')}" placeholder="${ph}" class="input-field">
    </div>`;

  form.innerHTML = `
    <div style="margin-bottom:20px">
      <h4 style="font-family:Space Grotesk;font-size:13px;color:var(--neon-cyan);margin-bottom:12px;letter-spacing:1px">⚙️ PERILAKU</h4>
      ${switchRow('Animasi welcome saat login','welcomeOn')}
      ${switchRow('Jam format 24 jam','clock24')}
      ${switchRow('Auto refresh data','autoRefreshOn')}
      ${inputRow('Interval auto refresh (detik)','autoRefreshSec','60','number')}
      ${inputRow('Maks. histori per script','maxHistory','30','number')}
    </div>

    <div style="margin-bottom:20px">
      <h4 style="font-family:Space Grotesk;font-size:13px;color:var(--neon-cyan);margin-bottom:12px;letter-spacing:1px">🔐 KEAMANAN</h4>
      ${inputRow('Email Admin (pisah koma)','adminEmails','admin@mail.com,user@mail.com')}
      <div style="margin-bottom:12px">
        <label class="input-label">PIN Portal Baru (4 digit, kosongkan = tidak ubah)</label>
        <input type="password" id="newPinInput" maxlength="4" placeholder="••••" class="input-field">
      </div>
    </div>

    <div style="margin-bottom:10px">
      <h4 style="font-family:Space Grotesk;font-size:13px;color:var(--neon-cyan);margin-bottom:12px;letter-spacing:1px">🗂️ MANAJEMEN MENU — GESER & UBAH NAMA</h4>
      <p style="font-size:11px;color:var(--text-muted);margin-bottom:10px">Gunakan ▲▼ untuk geser posisi, edit langsung nama di kolom.</p>
      <div id="menuMgrList"></div>
      <button class="btn btn-ghost" onclick="addMenu()" style="margin-top:10px;width:100%;justify-content:center"><i class="fas fa-plus"></i> TAMBAH MENU BARU</button>
    </div>

    <div>
      <h4 style="font-family:Space Grotesk;font-size:13px;color:var(--neon-cyan);margin-bottom:12px;letter-spacing:1px">🎨 BRANDING</h4>
      ${inputRow('Judul Aplikasi','appTitle','SCRIPTVAULT')}
      ${inputRow('Subtitle','appSubtitle','CYBER PORTAL')}
      ${inputRow('Emoji Logo','logoEmoji','🐒')}
    </div>`;

  renderMenuMgr();
}

function renderMenuMgr(){
  const list = $('#menuMgrList');
  if(!list) return;
  list.innerHTML = editMenus.map((m,i)=>`
    <div class="menu-mgr-item">
      <span class="drag-handle"><i class="fas fa-grip-vertical"></i></span>
      <input type="text" value="${esc(m.name)}" oninput="editMenus[${i}].name=this.value" placeholder="Nama menu">
      <div class="mini-actions">
        <button class="icon-btn" onclick="moveMenu(${i},-1)" ${i===0?'disabled style="opacity:.3"':''} title="Geser ke atas"><i class="fas fa-arrow-up"></i></button>
        <button class="icon-btn" onclick="moveMenu(${i},1)" ${i===editMenus.length-1?'disabled style="opacity:.3"':''} title="Geser ke bawah"><i class="fas fa-arrow-down"></i></button>
        <button class="icon-btn danger" onclick="removeMenu(${i})" title="Hapus"><i class="fas fa-trash"></i></button>
      </div>
    </div>`).join('');
}

function moveMenu(i,dir){
  const j = i+dir;
  if(j<0||j>=editMenus.length) return;
  [editMenus[i],editMenus[j]] = [editMenus[j],editMenus[i]];
  renderMenuMgr();
}
function removeMenu(i){
  if(!confirm('Hapus menu "'+editMenus[i].name+'"?')) return;
  editMenus.splice(i,1);
  renderMenuMgr();
}
function addMenu(){
  editMenus.push({ id:'menu-'+Date.now(), name:'Menu Baru', icon:'fa-circle', cat:'LAINNYA' });
  renderMenuMgr();
}

function collectSettings(){
  const s = {...STATE.portalConfig.settings};
  $$('#portalSettingsForm [data-set]').forEach(el=>{
    const k = el.dataset.set;
    if(el.type==='checkbox') s[k] = el.checked;
    else if(el.type==='number') s[k] = parseInt(el.value)||0;
    else s[k] = el.value;
  });
  return s;
}

async function savePortalSettings(){
  try {
    if(!isAdmin()) throw new Error('Hanya admin');
    STATE.portalConfig.menus = editMenus.filter(m=>m && (m.name||'').trim());
    STATE.portalConfig.settings = collectSettings();
    const newPin = $('#newPinInput')?.value.trim();
    if(newPin){
      if(!/^\d{4}$/.test(newPin)) throw new Error('PIN harus 4 digit angka');
      await REFS.userPin(STATE.user.uid).set({ portalPin:newPin, updatedAt:new Date().toISOString(), email:STATE.user.email });
      STATE.portalConfig.pin = newPin;
    }
    await savePortalConfigToFirebase('manual save');
    renderSidebar();
    if(STATE.currentSection==='portal') renderPortal();
    closePortalSettings();
    toast('✅ Pengaturan tersimpan','success');
  } catch(e){ toast('❌ '+e.message,'error'); }
}

async function resetPortal(){
  if(!confirm('Reset menu & pengaturan ke default?')) return;
  editMenus = JSON.parse(JSON.stringify(DEFAULT_MENUS));
  STATE.portalConfig.settings = {...DEFAULT_SETTINGS};
  showPortalSettingsForm();
  toast('🔄 Form direset. Klik SIMPAN untuk menerapkan','info');
}

function closePortalSettings(){ $('#portalSettingsOverlay').classList.remove('show'); }

   CLOCK
============================================================ */
function startClock(){
  const update = ()=>{
    const d = new Date();
    const h = STATE.portalConfig.settings.clock24 ? d.getHours() : (d.getHours()%12||12);
    const pad = n=>String(n).padStart(2,'0');
    $('#clock').textContent = `${pad(h)}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  };
  update();
  setInterval(update,1000);
}
