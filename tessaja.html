<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4682b4">
<title>📸 Galeri Foto — Dove Blue Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* ============================================================ */
/* 🕊️ DOVE BLUE THEME — EXACT MATCH SCRIPTVAULT × CYBER PORTAL */
/* ============================================================ */
:root {
  --bg-primary:#eef5fb;
  --bg-secondary:#f7fbff;
  --bg-tertiary:#ffffff;
  --bg-card:#ffffff;
  --bg-hover:#e6f0f9;
  --field-bg:rgba(31,58,84,.05);
  --code-bg:rgba(31,58,84,.06);
  --overlay-bg:rgba(15,28,42,.45);

  --neon-cyan:#4682b4;
  --neon-blue:#37688f;
  --neon-purple:#2e5474;
  --neon-pink:#c62828;
  --neon-green:#15803d;
  --neon-yellow:#b45309;
  --neon-red:#c62828;

  --text-primary:#13232f;
  --text-secondary:#4a5d6e;
  --text-tertiary:#6b7c8c;
  --text-muted:#93a3b1;

  --border-subtle:rgba(31,58,84,.08);
  --border-normal:rgba(31,58,84,.16);
  --border-strong:rgba(31,58,84,.28);
  --border-glow:rgba(70,130,180,.5);

  --shadow-sm:0 2px 6px rgba(31,58,84,.08);
  --shadow-md:0 6px 18px rgba(31,58,84,.12);
  --shadow-lg:0 14px 40px rgba(31,58,84,.18);
  --shadow-glow:0 0 18px rgba(70,130,180,.18);

  --radius-sm:8px;
  --radius-md:11px;
  --radius-lg:14px;
  --radius-xl:18px;
  --transition:all .25s cubic-bezier(.4,0,.2,1);
  --transition-bounce:.45s cubic-bezier(.34,1.56,.64,1);
}
html.dark {
  --bg-primary:#0f1d2b;
  --bg-secondary:#132434;
  --bg-tertiary:#1a2f42;
  --bg-card:#1a2f42;
  --bg-hover:#27455f;
  --field-bg:rgba(0,0,0,.35);
  --code-bg:rgba(0,0,0,.4);
  --overlay-bg:rgba(2,4,8,.88);

  --neon-cyan:#6fa3cf;
  --neon-blue:#8fbce0;
  --neon-purple:#aacfeb;
  --neon-pink:#ef5350;
  --neon-green:#34d399;
  --neon-yellow:#f0a830;
  --neon-red:#ef5350;

  --text-primary:#e8f0f8;
  --text-secondary:#9fb2c4;
  --text-tertiary:#7f96ab;
  --text-muted:#5a7186;

  --border-subtle:rgba(255,255,255,.06);
  --border-normal:rgba(255,255,255,.12);
  --border-strong:rgba(255,255,255,.2);
  --border-glow:rgba(111,163,207,.5);

  --shadow-sm:0 2px 6px rgba(0,0,0,.4);
  --shadow-md:0 6px 18px rgba(0,0,0,.5);
  --shadow-lg:0 14px 40px rgba(0,0,0,.6);
  --shadow-glow:0 0 18px rgba(111,163,207,.25);
}

* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
html, body {
  font-family:'Inter',sans-serif;
  background:var(--bg-primary);
  color:var(--text-primary);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  line-height:1.6;
  transition:background .3s, color .3s;
}
body {
  background:
    radial-gradient(1100px 500px at 8% -8%, rgba(70,130,180,.14) 0%, transparent 55%),
    radial-gradient(900px 500px at 108% 6%, rgba(111,163,207,.12) 0%, transparent 50%),
    linear-gradient(180deg, var(--bg-primary), var(--bg-secondary));
}

/* ========== BACKGROUND EFFECTS ========== */
.bg-effects {
  position:fixed; inset:0; z-index:0;
  pointer-events:none; overflow:hidden;
}
.bg-effects::before {
  content:''; position:absolute;
  width:700px; height:700px;
  background:radial-gradient(circle, rgba(70,130,180,.12) 0%, transparent 65%);
  top:-250px; left:-200px;
  animation:float1 22s ease-in-out infinite;
  filter:blur(20px);
}
.bg-effects::after {
  content:''; position:absolute;
  width:600px; height:600px;
  background:radial-gradient(circle, rgba(46,84,116,.10) 0%, transparent 65%);
  bottom:-200px; right:-200px;
  animation:float2 26s ease-in-out infinite;
  filter:blur(20px);
}
@keyframes float1 { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(100px,80px) scale(1.12);} }
@keyframes float2 { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-80px,-60px) scale(1.08);} }

.grid-overlay {
  position:fixed; inset:0; z-index:0;
  background-image:
    linear-gradient(rgba(70,130,180,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(70,130,180,.03) 1px, transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse 70% 60% at 50% 50%, black 30%, transparent 75%);
  animation:gridMove 30s linear infinite;
  pointer-events:none;
}
@keyframes gridMove { 0%{background-position:0 0;} 100%{background-position:44px 44px;} }

.scanline {
  position:fixed; left:0; right:0; height:2px;
  background:linear-gradient(90deg, transparent, rgba(70,130,180,.35), transparent);
  opacity:.5;
  animation:scanLine 9s linear infinite;
  z-index:1; pointer-events:none;
  filter:blur(1px);
}
@keyframes scanLine {
  0%{top:-2px; opacity:0;} 5%{opacity:.5;} 95%{opacity:.5;} 100%{top:100%; opacity:0;}
}

/* ========== LAYOUT ========== */
.container {
  max-width:1400px;
  margin:0 auto;
  padding:30px 20px;
  min-height:100vh;
  position:relative;
  z-index:1;
}

.back-btn {
  position:fixed; left:18px; top:22px;
  background:var(--field-bg);
  border:1px solid var(--border-subtle);
  color:var(--text-secondary);
  padding:9px 14px;
  border-radius:var(--radius-md);
  text-decoration:none;
  font-weight:600; font-size:11px;
  display:inline-flex; align-items:center; gap:7px;
  transition:var(--transition);
  backdrop-filter:blur(12px);
  z-index:1000;
  font-family:'Space Grotesk',sans-serif;
  letter-spacing:.5px;
}
.back-btn:hover {
  color:var(--neon-cyan);
  border-color:var(--neon-cyan);
  background:rgba(70,130,180,.1);
  transform:translateX(-3px);
  box-shadow:var(--shadow-glow);
}

.theme-toggle {
  position:fixed; right:18px; top:22px;
  width:42px; height:42px;
  background:var(--field-bg);
  border:1px solid var(--border-subtle);
  color:var(--text-secondary);
  border-radius:var(--radius-md);
  cursor:pointer;
  display:grid; place-items:center;
  font-size:16px;
  transition:var(--transition);
  backdrop-filter:blur(12px);
  z-index:1000;
}
.theme-toggle:hover {
  color:var(--neon-cyan);
  border-color:var(--neon-cyan);
  background:rgba(70,130,180,.1);
  transform:scale(1.06);
  box-shadow:var(--shadow-glow);
}

/* ========== HEADER ========== */
.header {
  text-align:center;
  margin-bottom:32px;
  animation:fadeInUp .6s cubic-bezier(.34,1.56,.64,1) backwards;
}
@keyframes fadeInUp { from{opacity:0; transform:translateY(30px);} to{opacity:1; transform:translateY(0);} }

.header-badge {
  display:inline-flex; align-items:center; gap:8px;
  padding:6px 16px;
  background:rgba(70,130,180,.08);
  border:1px solid rgba(70,130,180,.3);
  border-radius:100px;
  font-size:10px;
  color:var(--neon-cyan);
  margin-bottom:16px;
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
}
.status-dot {
  width:7px; height:7px;
  background:var(--neon-green);
  border-radius:50%;
  animation:pulse2 2.5s infinite;
  box-shadow:0 0 8px var(--neon-green);
}
@keyframes pulse2 { 0%,100%{opacity:1;} 50%{opacity:.4;} }

.title {
  font-family:'Space Grotesk',sans-serif;
  font-size:clamp(26px, 6vw, 44px);
  font-weight:700;
  letter-spacing:2px;
  margin-bottom:10px;
  background:linear-gradient(135deg, var(--neon-cyan), var(--neon-blue), var(--text-primary));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  text-transform:uppercase;
}
.subtitle {
  font-size:12px;
  color:var(--text-secondary);
  letter-spacing:3px;
  text-transform:uppercase;
  margin-bottom:16px;
  font-weight:500;
  font-family:'Space Grotesk',sans-serif;
}

/* ========== BENTO STATS ========== */
.stats-bento {
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
  gap:12px;
  max-width:800px;
  margin:0 auto 28px;
}
.stat-card {
  background:linear-gradient(135deg, var(--bg-tertiary), var(--bg-secondary));
  border:1px solid var(--border-subtle);
  border-radius:var(--radius-lg);
  padding:16px 18px;
  transition:var(--transition);
  position:relative;
  overflow:hidden;
}
.stat-card::before {
  content:''; position:absolute;
  top:-40px; right:-40px;
  width:110px; height:110px;
  border-radius:50%;
  filter:blur(50px);
  opacity:.16;
  transition:opacity .4s;
}
.stat-card:nth-child(1)::before { background:var(--neon-cyan); }
.stat-card:nth-child(2)::before { background:var(--neon-blue); }
.stat-card:nth-child(3)::before { background:var(--neon-purple); }
.stat-card:hover {
  border-color:rgba(70,130,180,.3);
  transform:translateY(-3px);
  box-shadow:var(--shadow-glow);
}
.stat-card:hover::before { opacity:.3; }

.stat-label {
  font-family:'Space Grotesk',sans-serif;
  font-size:9px;
  color:var(--text-tertiary);
  text-transform:uppercase;
  letter-spacing:1.5px;
  font-weight:700;
  display:flex; align-items:center; gap:7px;
}
.stat-label .icon { font-size:14px; }
.stat-value {
  font-family:'Space Grotesk',sans-serif;
  font-size:28px;
  font-weight:800;
  margin-top:8px;
  letter-spacing:-.03em;
  background:linear-gradient(135deg, var(--neon-cyan), var(--neon-blue), var(--text-primary));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  line-height:1.1;
}
.stat-sub {
  font-size:10px;
  color:var(--text-muted);
  margin-top:4px;
  font-weight:500;
}

/* ========== SEARCH ========== */
.search-container {
  max-width:600px;
  margin:0 auto 28px;
}
.search-box {
  display:flex; align-items:center; gap:10px;
  background:var(--field-bg);
  border:1px solid var(--border-subtle);
  border-radius:var(--radius-md);
  padding:11px 15px;
  transition:var(--transition);
  position:relative;
}
.search-box:focus-within {
  border-color:var(--neon-cyan);
  background:rgba(70,130,180,.08);
  box-shadow:0 0 0 3px rgba(70,130,180,.1);
}
.search-box i { color:var(--neon-cyan); font-size:14px; flex-shrink:0; }
.search-box input {
  background:none; border:none; outline:none;
  color:var(--text-primary); flex:1;
  font-size:12.5px;
  font-family:'Inter',sans-serif;
  font-weight:500;
}
.search-box input::placeholder { color:var(--text-muted); }
.search-count {
  font-size:10px;
  color:var(--neon-cyan);
  font-family:'Space Grotesk',sans-serif;
  font-weight:600;
  background:rgba(70,130,180,.1);
  padding:3px 9px;
  border-radius:6px;
  border:1px solid rgba(70,130,180,.25);
  white-space:nowrap;
  flex-shrink:0;
}
.search-clear {
  background:none; border:none;
  color:var(--text-muted);
  cursor:pointer;
  font-size:14px;
  padding:2px 6px;
  border-radius:4px;
  transition:var(--transition);
  flex-shrink:0;
  display:none;
}
.search-clear.show { display:block; }
.search-clear:hover { color:var(--neon-red); background:rgba(198,40,40,.1); }

/* ========== GALLERY ========== */
.gallery-section {
  margin-bottom:30px;
}
.gallery-section .section-header {
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:16px; flex-wrap:wrap; gap:10px;
  padding-bottom:12px;
  border-bottom:1px solid var(--border-subtle);
  position:relative;
}
.gallery-section .section-header::after {
  content:''; position:absolute;
  bottom:-1px; left:0;
  width:60px; height:2px;
  background:linear-gradient(90deg, var(--neon-cyan), var(--neon-blue));
  box-shadow:0 0 12px var(--neon-cyan);
}
.gallery-section .section-header h3 {
  font-family:'Space Grotesk',sans-serif;
  font-size:14px;
  font-weight:700;
  letter-spacing:1.5px;
  display:flex; align-items:center; gap:10px;
  text-transform:uppercase;
}
.gallery-section .section-header h3 .bar {
  width:3px; height:18px;
  background:linear-gradient(180deg, var(--neon-cyan), var(--neon-blue));
  border-radius:2px;
  box-shadow:0 0 8px var(--neon-cyan);
}
.gallery-section .section-header small {
  font-family:'Space Grotesk',sans-serif;
  font-size:10px;
  color:var(--neon-cyan);
  font-weight:600;
  background:rgba(70,130,180,.1);
  padding:4px 12px;
  border-radius:16px;
  border:1px solid rgba(70,130,180,.3);
  letter-spacing:1px;
}

.gallery-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
  gap:16px;
}

/* ========== PHOTO CARD ========== */
.photo-card {
  background:linear-gradient(135deg, var(--bg-tertiary), var(--bg-secondary));
  border:1px solid var(--border-subtle);
  border-radius:var(--radius-md);
  overflow:hidden;
  transition:var(--transition);
  position:relative;
  animation:cardEnter .5s ease forwards;
  opacity:0;
  transform:translateY(20px);
}
@keyframes cardEnter { to { opacity:1; transform:translateY(0); } }
.photo-card::before {
  content:''; position:absolute;
  top:0; left:-100%;
  width:100%; height:100%;
  background:linear-gradient(120deg, transparent, rgba(70,130,180,.08), transparent);
  transition:left .6s ease;
  z-index:1; pointer-events:none;
}
.photo-card:hover::before { left:100%; }
.photo-card:hover {
  border-color:rgba(70,130,180,.3);
  transform:translateY(-4px);
  box-shadow:var(--shadow-glow);
}

.photo-wrapper {
  position:relative;
  width:100%; height:280px;
  background:var(--field-bg);
  overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  border-bottom:1px solid var(--border-subtle);
}
.photo-wrapper img {
  width:100%; height:100%;
  object-fit:cover;
  display:block;
  transition:transform .4s ease;
  cursor:pointer;
}
.photo-card:hover .photo-wrapper img { transform:scale(1.06); }

.photo-badge-new {
  position:absolute;
  top:8px; right:8px;
  background:rgba(198,40,40,.85);
  color:#fff;
  padding:3px 8px;
  border-radius:5px;
  font-size:9px;
  font-weight:800;
  letter-spacing:1px;
  font-family:'Space Grotesk',sans-serif;
  z-index:2;
  animation:badgePulse 1.8s ease-in-out infinite;
  backdrop-filter:blur(8px);
  display:flex; align-items:center; gap:4px;
}
@keyframes badgePulse {
  0%,100% { transform:scale(1); box-shadow:0 0 0 rgba(198,40,40,.4); }
  50% { transform:scale(1.08); box-shadow:0 0 12px rgba(198,40,40,.6); }
}

.photo-info { padding:14px 16px; }
.photo-title {
  font-family:'Space Grotesk',sans-serif;
  font-size:13.5px;
  font-weight:700;
  color:var(--text-primary);
  margin-bottom:6px;
  word-break:break-word;
  letter-spacing:.5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.photo-meta {
  font-size:10px;
  color:var(--text-tertiary);
  margin-bottom:12px;
  font-family:'JetBrains Mono',monospace;
  letter-spacing:.5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* ========== ACTION BUTTONS ========== */
.action-buttons-row {
  display:flex;
  gap:6px;
  padding-top:12px;
  border-top:1px solid var(--border-subtle);
  margin-top:8px;
}
.action-btn-cool {
  flex:1;
  padding:8px 10px;
  background:var(--field-bg);
  border:1px solid var(--border-subtle);
  border-radius:var(--radius-sm);
  color:var(--text-secondary);
  font-size:10px;
  font-weight:700;
  cursor:pointer;
  transition:var(--transition);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  text-transform:uppercase;
  letter-spacing:.5px;
  font-family:'Inter',sans-serif;
}
.action-btn-cool i { font-size:12px; }
.action-btn-cool.copy-btn:hover {
  background:rgba(21,128,61,.08);
  border-color:var(--neon-green);
  color:var(--neon-green);
  transform:translateY(-2px);
  box-shadow:0 0 12px rgba(21,128,61,.2);
}
.action-btn-cool.download-btn:hover {
  background:rgba(70,130,180,.1);
  border-color:var(--neon-cyan);
  color:var(--neon-cyan);
  transform:translateY(-2px);
  box-shadow:0 0 12px rgba(70,130,180,.25);
}
.action-btn-cool.view-btn:hover {
  background:rgba(111,163,207,.1);
  border-color:var(--neon-blue);
  color:var(--neon-blue);
  transform:translateY(-2px);
}

/* ========== LOADING & EMPTY ========== */
.loading {
  display:none;
  text-align:center;
  padding:40px;
  grid-column:1 / -1;
}
.loading.active { display:block; }
.loader {
  width:46px; height:46px;
  border:3px solid rgba(70,130,180,.15);
  border-top-color:var(--neon-cyan);
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:0 auto 16px;
  box-shadow:var(--shadow-glow);
}
@keyframes spin { to { transform:rotate(360deg); } }
.loading-text {
  color:var(--neon-cyan);
  font-family:'Space Grotesk',sans-serif;
  font-size:11px;
  letter-spacing:3px;
  text-transform:uppercase;
  font-weight:600;
}

.no-results {
  grid-column:1 / -1;
  text-align:center;
  padding:60px 24px;
  background:var(--field-bg);
  border:1px dashed var(--border-normal);
  border-radius:var(--radius-lg);
  color:var(--text-secondary);
}
.no-results i {
  font-size:52px;
  margin-bottom:14px;
  opacity:.5;
  color:var(--neon-cyan);
  animation:float 3.5s ease-in-out infinite;
  filter:drop-shadow(0 0 16px rgba(70,130,180,.3));
}
@keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
.no-results h3 {
  font-family:'Space Grotesk',sans-serif;
  font-size:17px;
  margin-bottom:8px;
  letter-spacing:1px;
  color:var(--text-primary);
  font-weight:700;
}
.no-results p { font-size:12.5px; color:var(--text-secondary); }

/* ========== MODAL ========== */
.modal-backdrop {
  position:fixed; inset:0;
  background:var(--overlay-bg);
  backdrop-filter:blur(24px);
  z-index:1000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:24px;
  overflow-y:auto;
}
.modal-backdrop.active { display:flex; animation:fadeIn .3s; }
@keyframes fadeIn { from{opacity:0;} to{opacity:1;} }

.modal-content {
  background:linear-gradient(135deg, var(--bg-tertiary), var(--bg-secondary));
  border:1px solid rgba(70,130,180,.35);
  border-radius:var(--radius-xl);
  max-width:900px;
  width:100%;
  max-height:95vh;
  overflow:auto;
  display:flex; flex-direction:column;
  position:relative;
  box-shadow:var(--shadow-lg), var(--shadow-glow);
  animation:slideUp .4s cubic-bezier(.4,0,.2,1);
}
@keyframes slideUp { from{opacity:0; transform:translateY(30px);} to{opacity:1; transform:translateY(0);} }
.modal-content::before {
  content:''; position:absolute;
  top:0; left:0; right:0;
  height:2px;
  background:linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-blue), transparent);
  background-size:200% 100%;
  animation:borderFlow 2.5s linear infinite;
}
@keyframes borderFlow { 0%{background-position:-200% 0;} 100%{background-position:200% 0;} }

.modal-header {
  display:flex; justify-content:space-between; align-items:center;
  padding:18px 22px;
  border-bottom:1px solid var(--border-subtle);
  position:relative;
}
.modal-title {
  font-family:'Space Grotesk',sans-serif;
  font-size:15px;
  font-weight:700;
  color:var(--text-primary);
  letter-spacing:1px;
  display:flex; align-items:center; gap:10px;
  text-transform:uppercase;
}
.modal-title .bar {
  width:4px; height:20px;
  background:linear-gradient(180deg, var(--neon-cyan), var(--neon-blue));
  border-radius:2px;
  box-shadow:0 0 8px var(--neon-cyan);
}
.modal-close {
  width:36px; height:36px;
  background:var(--field-bg);
  border:1px solid var(--border-normal);
  border-radius:var(--radius-sm);
  color:var(--text-secondary);
  font-size:14px;
  cursor:pointer;
  transition:var(--transition);
  display:grid; place-items:center;
}
.modal-close:hover {
  background:rgba(198,40,40,.1);
  border-color:var(--neon-red);
  color:var(--neon-red);
  transform:rotate(90deg);
}
.modal-body {
  padding:22px;
  text-align:center;
  overflow-y:auto;
  flex:1;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  background:var(--field-bg);
}
.modal-body img {
  max-width:100%;
  max-height:70vh;
  width:auto;
  object-fit:contain;
  border-radius:var(--radius-sm);
  box-shadow:0 0 20px rgba(70,130,180,.2);
}
.modal-url-display {
  width:100%;
  background:var(--code-bg);
  border:1px solid var(--border-subtle);
  border-radius:var(--radius-sm);
  padding:10px 14px;
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  color:var(--text-secondary);
  word-break:break-all;
  display:flex; align-items:center; gap:10px;
  margin-top:14px;
  flex-wrap:wrap;
}
.modal-url-display .url {
  flex:1;
  user-select:all;
  text-align:left;
  min-width:0;
}
.modal-url-display .copy-url-btn {
  background:rgba(70,130,180,.1);
  border:1px solid rgba(70,130,180,.3);
  color:var(--neon-cyan);
  padding:5px 10px;
  border-radius:5px;
  cursor:pointer;
  font-size:10px;
  font-weight:700;
  transition:var(--transition);
  font-family:'Inter',sans-serif;
  white-space:nowrap;
  text-transform:uppercase;
  letter-spacing:.5px;
}
.modal-url-display .copy-url-btn:hover {
  background:rgba(70,130,180,.2);
  border-color:var(--neon-cyan);
  transform:translateY(-1px);
}
.modal-actions {
  margin-top:18px;
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
  width:100%;
}
.btn {
  padding:10px 20px;
  border-radius:var(--radius-md);
  font-family:'Inter',sans-serif;
  font-size:11.5px;
  font-weight:700;
  cursor:pointer;
  transition:var(--transition);
  border:none;
  display:inline-flex;
  align-items:center;
  gap:7px;
  text-transform:uppercase;
  letter-spacing:.8px;
}
.btn-primary {
  background:linear-gradient(135deg, var(--neon-cyan), var(--neon-blue));
  color:#fff;
  box-shadow:var(--shadow-glow);
}
.btn-primary:hover {
  transform:translateY(-2px);
  box-shadow:0 0 24px rgba(70,130,180,.45);
}
.btn-success {
  background:linear-gradient(135deg, var(--neon-green), #0e5c2f);
  color:#fff;
  box-shadow:var(--shadow-sm);
}
.btn-success:hover {
  transform:translateY(-2px);
  box-shadow:0 0 20px rgba(21,128,61,.4);
}
.btn-warning {
  background:linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
  color:#fff;
  box-shadow:var(--shadow-sm);
}
.btn-warning:hover { transform:translateY(-2px); }
.btn-secondary {
  background:var(--field-bg);
  color:var(--text-primary);
  border:1px solid var(--border-normal);
}
.btn-secondary:hover {
  background:rgba(70,130,180,.08);
  border-color:var(--neon-cyan);
  color:var(--neon-cyan);
  transform:translateY(-2px);
}

/* ========== TOAST ========== */
.toasts {
  position:fixed;
  bottom:24px; right:24px;
  z-index:10000;
  display:flex; flex-direction:column;
  gap:10px;
  max-width:340px;
}
.toast {
  background:linear-gradient(135deg, var(--bg-hover), var(--bg-tertiary));
  backdrop-filter:blur(24px);
  border:1px solid rgba(70,130,180,.3);
  border-radius:var(--radius-md);
  padding:13px 16px;
  display:flex; align-items:center;
  gap:12px;
  box-shadow:var(--shadow-glow);
  font-size:12px;
  font-weight:500;
  position:relative;
  overflow:hidden;
  animation:toastSlideIn .45s cubic-bezier(.34,1.56,.64,1);
}
.toast.success { border-left:3px solid var(--neon-green); }
.toast.error { border-left:3px solid var(--neon-red); }
.toast.info { border-left:3px solid var(--neon-cyan); }
.toast.warning { border-left:3px solid var(--neon-yellow); }
@keyframes toastSlideIn {
  from { transform:translateX(150%) scale(.9); opacity:0; }
  to { transform:translateX(0) scale(1); opacity:1; }
}
.toast .icon { font-size:18px; }
.toast.success .icon { color:var(--neon-green); }
.toast.error .icon { color:var(--neon-red); }
.toast.info .icon { color:var(--neon-cyan); }
.toast.warning .icon { color:var(--neon-yellow); }
.toast-progress {
  position:absolute;
  bottom:0; left:0;
  height:2px;
  background:linear-gradient(90deg, var(--neon-cyan), var(--neon-blue));
  animation:progressShrink 3.5s linear forwards;
  box-shadow:0 0 8px var(--neon-cyan);
}
@keyframes progressShrink { from{width:100%;} to{width:0;} }

.copy-flash {
  animation:copyFlash .6s ease;
}
@keyframes copyFlash {
  0% { background:var(--field-bg); }
  50% { background:rgba(21,128,61,.2); border-color:var(--neon-green); }
  100% { background:var(--field-bg); }
}

/* ========== FOOTER ========== */
.footer {
  text-align:center;
  padding:24px;
  font-size:10px;
  color:var(--text-muted);
  letter-spacing:2px;
  text-transform:uppercase;
  font-weight:600;
  font-family:'Space Grotesk',sans-serif;
  margin-top:20px;
}
.footer strong { color:var(--neon-cyan); letter-spacing:2px; }

/* ========== SCROLLBAR ========== */
::-webkit-scrollbar { width:8px; }
::-webkit-scrollbar-track { background:var(--bg-primary); }
::-webkit-scrollbar-thumb {
  background:linear-gradient(180deg, var(--neon-cyan), var(--neon-blue));
  border-radius:6px;
  border:2px solid var(--bg-primary);
}
::-webkit-scrollbar-thumb:hover { background:var(--neon-cyan); }
::selection { background:rgba(70,130,180,.35); color:var(--text-primary); }

/* ========== RESPONSIVE ========== */
@media (max-width:768px) {
  .container { padding:18px 12px; }
  .back-btn { left:10px; top:12px; padding:6px 10px; font-size:9px; }
  .theme-toggle { right:10px; top:12px; width:36px; height:36px; font-size:14px; }
  .gallery-grid { grid-template-columns:repeat(2, 1fr); gap:10px; }
  .photo-wrapper { height:180px; }
  .action-btn-cool { height:36px; padding:6px; }
  .action-btn-cool i { font-size:11px; }
  .action-btn-cool span { font-size:8px; }
  .stats-bento { grid-template-columns:repeat(2, 1fr); }
  .toasts { left:12px; right:12px; max-width:none; }
  .toast { max-width:none; }
}
@media (max-width:480px) {
  .gallery-grid { grid-template-columns:1fr; }
}

button:focus-visible, input:focus-visible {
  outline:2px solid var(--neon-cyan);
  outline-offset:2px;
}
@media (prefers-reduced-motion:reduce) {
  * { animation-duration:.01ms !important; transition-duration:.01ms !important; }
}
</style>
</head>
<body>
<div class="bg-effects"></div>
<div class="grid-overlay"></div>
<div class="scanline"></div>

<a href="index.html" class="back-btn">
  <i class="fas fa-arrow-left"></i> Kembali
</a>

<button class="theme-toggle" onclick="toggleTheme()" title="Ganti Tema Terang/Gelap" id="themeBtn">🌙</button>

<div class="container">
  <header class="header">
    <div class="header-badge">
      <span class="status-dot"></span>
      <span>Sistem Aktif · Dove Blue</span>
    </div>
    <h1 class="title">📸 Galeri Foto</h1>
    <p class="subtitle">Line Togel · Dove Blue 2026</p>
  </header>

  <!-- Stats Bento -->
  <div class="stats-bento">
    <div class="stat-card">
      <div class="stat-label"><span class="icon"><i class="fas fa-camera"></i></span> Total Foto</div>
      <div class="stat-value" id="statTotal">0</div>
      <div class="stat-sub">Galeri foto</div>
    </div>
    <div class="stat-card">
      <div class="stat-label"><span class="icon"><i class="fas fa-filter"></i></span> Ditampilkan</div>
      <div class="stat-value" id="statShown">0</div>
      <div class="stat-sub">Foto aktif</div>
    </div>
    <div class="stat-card">
      <div class="stat-label"><span class="icon"><i class="fas fa-bolt"></i></span> Baru</div>
      <div class="stat-value" id="statNew">0</div>
      <div class="stat-sub">Terakhir ditambah</div>
    </div>
    <div class="stat-card">
      <div class="stat-label"><span class="icon"><i class="fas fa-clock"></i></span> Update</div>
      <div class="stat-value" id="statRecent" style="font-size:15px">-</div>
      <div class="stat-sub">Waktu terakhir</div>
    </div>
  </div>

  <section id="gallery" class="gallery-section">
    <div class="section-header">
      <h3><span class="bar"></span><i class="fas fa-images"></i> DAFTAR FOTO</h3>
      <small id="galleryCount">0 FOTO</small>
    </div>

    <div class="search-container">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Cari foto berdasarkan judul..." oninput="searchPhotos()">
        <span class="search-count" id="searchCount" style="display:none"></span>
        <button class="search-clear" id="searchClear" onclick="clearSearch()"><i class="fas fa-times-circle"></i></button>
      </div>
    </div>

    <div class="loading" id="loading">
      <div class="loader"></div>
      <div class="loading-text">Memuat Foto...</div>
    </div>

    <div class="gallery-grid" id="galleryGrid"></div>
  </section>

  <div class="footer">👑 Created by <strong>SCRIPTVAULT</strong> · Dove Blue Edition</div>
</div>

<!-- Modal -->
<div class="modal-backdrop" id="imageModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 class="modal-title"><span class="bar"></span><i class="fas fa-image"></i> <span id="modalTitle">Detail Foto</span></h3>
      <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body">
      <img src="" alt="" id="modalImage">
      <div class="modal-url-display">
        <span class="url" id="modalUrl"></span>
        <button class="copy-url-btn" onclick="copyUrl()"><i class="fas fa-copy"></i> COPY LINK</button>
      </div>
      <div class="modal-actions">
        <button class="btn btn-success" onclick="copyImage()">
          <i class="fas fa-image"></i> Copy Foto
        </button>
        <button class="btn btn-warning" onclick="openInNewTab()">
          <i class="fas fa-external-link-alt"></i> Buka Tab
        </button>
        <button class="btn btn-secondary" onclick="downloadModalImage()">
          <i class="fas fa-download"></i> Download
        </button>
      </div>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
let allPhotos = [];
let currentImageUrl = '';
let currentImageTitle = '';

// ========== THEME ==========
function applyTheme(dark) {
  document.documentElement.classList.toggle('dark', dark);
  const b = document.getElementById('themeBtn');
  if (b) b.textContent = dark ? '☀️' : '🌙';
  try { localStorage.setItem('foto_theme', dark ? '1' : '0'); } catch(e) {}
}
function toggleTheme() {
  applyTheme(!document.documentElement.classList.contains('dark'));
}
try {
  const saved = localStorage.getItem('foto_theme');
  if (saved === '1') applyTheme(true);
} catch(e) {}

// ========== TOAST ==========
function showToast(message, type = 'success') {
  type = type || 'info';
  const w = document.getElementById('toasts');
  if (!w) return;
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const im = {
    success: '<i class="fas fa-check-circle"></i>',
    error: '<i class="fas fa-times-circle"></i>',
    info: '<i class="fas fa-info-circle"></i>',
    warning: '<i class="fas fa-exclamation-triangle"></i>'
  };
  el.innerHTML = '<span class="icon">' + (im[type] || '') + '</span><span>' + escHtml(message) + '</span><div class="toast-progress"></div>';
  w.appendChild(el);
  setTimeout(() => {
    el.style.animation = 'toastSlideIn 0.3s reverse';
    setTimeout(() => el.remove(), 300);
  }, 3500);
}
function escHtml(t) {
  if (!t) return '';
  return String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ========== DATA ==========
document.addEventListener('DOMContentLoaded', () => {
  fetchPhotosFromSheet();
});

async function fetchPhotosFromSheet() {
  document.getElementById('loading').classList.add('active');
  document.getElementById('galleryGrid').innerHTML = '';

  try {
    const sheetId = '1z5FYVvB0E9BeE3cRbl4id1YWi6lRB_2qzMhIvgz4Xx0';
    const gid = '1246502038';

    try {
      const gvizUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&gid=${gid}&range=C2:D150`;
      const response = await fetch(gvizUrl);
      const text = await response.text();
      const json = JSON.parse(text.substring(47).slice(0, -2));
      const rows = json.table.rows;

      allPhotos = [];
      rows.forEach((row, index) => {
        const c = row.c;
        if (!c) return;
        const judul = c[0] ? (c[0].v || '') : '';
        const foto = c[1] ? (c[1].v || '') : '';
        if (judul && foto) {
          allPhotos.push({ judul, foto, index: index + 2, loadedAt: Date.now() });
        }
      });
    } catch (e) {
      console.log('GVIZ failed, trying CSV...', e);
      const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=${gid}&range=C2:D150`;
      const csvResponse = await fetch(csvUrl);
      const csvText = await csvResponse.text();
      const csvRows = csvText.split('\n').map(row => row.split(','));

      allPhotos = [];
      csvRows.forEach((row, index) => {
        if (row.length < 2) return;
        const judul = row[0] ? row[0].replace(/"/g, '').trim() : '';
        const foto = row[1] ? row[1].replace(/"/g, '').trim() : '';
        if (judul && foto) {
          allPhotos.push({ judul, foto, index: index + 2, loadedAt: Date.now() });
        }
      });
    }

    renderGallery(allPhotos);
    updateStats(allPhotos.length, allPhotos.length);
    showToast(`✅ Berhasil memuat ${allPhotos.length} foto`, 'success');
  } catch (error) {
    console.error('Error fetching photos:', error);
    showToast('❌ Gagal mengambil data dari Google Sheets', 'error');
    document.getElementById('galleryGrid').innerHTML = `
      <div class="no-results">
        <i class="fas fa-exclamation-triangle"></i>
        <h3>GAGAL MEMUAT FOTO</h3>
        <p>Pastikan Google Sheets sudah dipublikasikan</p>
      </div>
    `;
  }

  document.getElementById('loading').classList.remove('active');
}

function updateStats(total, shown) {
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statShown').textContent = shown;
  const newCount = Math.min(3, total); // 3 pertama dianggap baru
  document.getElementById('statNew').textContent = newCount;
  const now = new Date();
  document.getElementById('statRecent').textContent = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
  document.getElementById('galleryCount').textContent = shown + ' FOTO';
}

function renderGallery(photos) {
  const grid = document.getElementById('galleryGrid');
  grid.innerHTML = '';

  if (photos.length === 0) {
    grid.innerHTML = `
      <div class="no-results">
        <i class="fas fa-search"></i>
        <h3>TIDAK DITEMUKAN</h3>
        <p>Tidak ada foto yang sesuai dengan pencarian</p>
      </div>
    `;
    return;
  }

  photos.forEach((photo, idx) => {
    const card = createPhotoCard(photo.foto, photo.judul, idx);
    grid.appendChild(card);
  });
}

function createPhotoCard(url, title, index) {
  const card = document.createElement('div');
  card.className = 'photo-card';
  card.style.animationDelay = (index * 0.04) + 's';
  const safeTitle = escHtml(title);
  const safeUrl = escHtml(url);
  const jsUrl = url.replace(/'/g, "\\'").replace(/"/g, '&quot;');
  const jsTitle = title.replace(/'/g, "\\'");
  const isNew = index < 3;
  card.innerHTML = `
    <div class="photo-wrapper">
      ${isNew ? '<span class="photo-badge-new"><i class="fas fa-bolt"></i> NEW</span>' : ''}
      <img src="${safeUrl}" alt="${safeTitle}" onerror="this.src='https://via.placeholder.com/400x300/1a2f42/6fa3cf?text=No+Image'" loading="lazy" onclick="viewFullImage('${jsUrl}', '${jsTitle}')" style="cursor:pointer;">
    </div>
    <div class="photo-info">
      <div class="photo-title">${safeTitle}</div>
      <div class="photo-meta">FOTO #${index + 1}</div>
      <div class="action-buttons-row">
        <button class="action-btn-cool copy-btn" onclick="event.stopPropagation();copyPhoto('${jsUrl}', this)" title="Copy Foto">
          <i class="fas fa-copy"></i><span>Copy</span>
        </button>
        <button class="action-btn-cool view-btn" onclick="event.stopPropagation();viewFullImage('${jsUrl}', '${jsTitle}')" title="Lihat Penuh">
          <i class="fas fa-eye"></i><span>View</span>
        </button>
        <button class="action-btn-cool download-btn" onclick="event.stopPropagation();downloadPhoto('${jsUrl}', '${jsTitle}')" title="Download">
          <i class="fas fa-download"></i><span>Unduh</span>
        </button>
      </div>
    </div>
  `;
  return card;
}

function searchPhotos() {
  const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
  const countEl = document.getElementById('searchCount');
  const clearBtn = document.getElementById('searchClear');
  
  if (!searchTerm) {
    renderGallery(allPhotos);
    updateStats(allPhotos.length, allPhotos.length);
    countEl.style.display = 'none';
    clearBtn.classList.remove('show');
    return;
  }
  
  const filtered = allPhotos.filter(photo =>
    photo.judul.toLowerCase().includes(searchTerm)
  );
  renderGallery(filtered);
  updateStats(allPhotos.length, filtered.length);
  countEl.textContent = `${filtered.length} dari ${allPhotos.length}`;
  countEl.style.display = 'inline-block';
  clearBtn.classList.add('show');
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  searchPhotos();
  document.getElementById('searchInput').focus();
}

function viewFullImage(url, title) {
  currentImageUrl = url;
  currentImageTitle = title;
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalImage').src = url;
  document.getElementById('modalUrl').textContent = url;
  document.getElementById('imageModal').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('imageModal').classList.remove('active');
  document.body.style.overflow = '';
  currentImageUrl = '';
  currentImageTitle = '';
}

async function copyPhoto(url, btnElement) {
  try {
    const response = await fetch(url, { mode: 'cors' });
    const blob = await response.blob();
    if (navigator.clipboard && typeof ClipboardItem !== 'undefined') {
      await navigator.clipboard.write([
        new ClipboardItem({ [blob.type]: blob })
      ]);
      showToast('✅ Foto berhasil disalin ke clipboard', 'success');
      if (btnElement) {
        btnElement.classList.add('copy-flash');
        setTimeout(() => btnElement.classList.remove('copy-flash'), 600);
      }
    } else {
      throw new Error('Clipboard API not supported');
    }
  } catch (error) {
    console.error('Copy error:', error);
    try {
      await navigator.clipboard.writeText(url);
      showToast('⚠️ CORS: Link URL di-copy sebagai fallback', 'warning');
    } catch(e) {
      fallbackCopy(url);
      showToast('⚠️ Buka foto lalu klik kanan > Copy Image', 'warning');
    }
  }
}

function fallbackCopy(text) {
  const t = document.createElement('textarea');
  t.value = text;
  t.style.position = 'fixed';
  t.style.opacity = '0';
  document.body.appendChild(t);
  t.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(t);
}

async function copyImage() {
  if (currentImageUrl) await copyPhoto(currentImageUrl, null);
}

async function copyUrl() {
  if (currentImageUrl) {
    try {
      await navigator.clipboard.writeText(currentImageUrl);
      showToast('✅ Link URL berhasil di-copy', 'success');
    } catch(e) {
      fallbackCopy(currentImageUrl);
      showToast('✅ Link URL di-copy (fallback)', 'success');
    }
  }
}

function openInNewTab() {
  if (currentImageUrl) {
    window.open(currentImageUrl, '_blank');
    showToast('✅ Foto dibuka di tab baru', 'success');
  }
}

function downloadPhoto(url, filename) {
  const link = document.createElement('a');
  link.href = url;
  link.download = `${filename.replace(/[^a-z0-9]/gi, '_').toLowerCase()}_${Date.now()}.jpg`;
  link.target = '_blank';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  showToast('📥 Download dimulai...', 'success');
}

function downloadModalImage() {
  if (currentImageUrl && currentImageTitle) {
    downloadPhoto(currentImageUrl, currentImageTitle);
  }
}

document.getElementById('imageModal').addEventListener('click', (e) => {
  if (e.target.id === 'imageModal') closeModal();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});
</script>
</body>
