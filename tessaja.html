<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4682b4">
<title>🐒 FOTO - ScriptVault × Dove Blue 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
--bg-primary:#eef5fb;--bg-secondary:#f7fbff;--bg-tertiary:#ffffff;--bg-card:#ffffff;--bg-hover:#e6f0f9;
--neon-cyan:#4682b4;--neon-blue:#37688f;--neon-purple:#2e5474;--neon-pink:#c62828;--neon-green:#15803d;--neon-yellow:#b45309;--neon-red:#c62828;
--text-primary:#13232f;--text-secondary:#4a5d6e;--text-tertiary:#6b7c8c;--text-muted:#93a3b1;
--border-subtle:rgba(31,58,84,.08);--border-normal:rgba(31,58,84,.16);--border-strong:rgba(31,58,84,.28);--border-glow:rgba(70,130,180,.5);
--shadow-sm:0 2px 6px rgba(31,58,84,.08);--shadow-md:0 6px 18px rgba(31,58,84,.12);--shadow-lg:0 14px 40px rgba(31,58,84,.18);--shadow-glow:0 0 18px rgba(70,130,180,.18);
--radius-sm:8px;--radius-md:11px;--radius-lg:14px;--radius-xl:18px;
--transition:all .25s cubic-bezier(.4,0,.2,1);--transition-bounce:.45s cubic-bezier(.34,1.56,.64,1);
--field-bg:rgba(31,58,84,.05);--overlay-bg:rgba(15,28,42,.45);
}
html.dark{
--bg-primary:#0f1d2b;--bg-secondary:#132434;--bg-tertiary:#1a2f42;--bg-card:#1a2f42;--bg-hover:#27455f;
--neon-cyan:#6fa3cf;--neon-blue:#8fbce0;--neon-purple:#aacfeb;--neon-pink:#ef5350;--neon-green:#34d399;--neon-yellow:#f0a830;--neon-red:#ef5350;
--text-primary:#e8f0f8;--text-secondary:#9fb2c4;--text-tertiary:#7f96ab;--text-muted:#5a7186;
--border-subtle:rgba(255,255,255,.06);--border-normal:rgba(255,255,255,.12);--border-strong:rgba(255,255,255,.2);--border-glow:rgba(111,163,207,.5);
--shadow-sm:0 2px 6px rgba(0,0,0,.4);--shadow-md:0 6px 18px rgba(0,0,0,.5);--shadow-lg:0 14px 40px rgba(0,0,0,.6);--shadow-glow:0 0 18px rgba(111,163,207,.25);
--field-bg:rgba(0,0,0,.35);--overlay-bg:rgba(2,4,8,.88);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{font-family:'Inter',sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.6;transition:background .3s,color .3s}
body{background:radial-gradient(1100px 500px at 8% -8%,rgba(70,130,180,.14) 0%,transparent 55%),radial-gradient(900px 500px at 108% 6%,rgba(111,163,207,.12) 0%,transparent 50%),linear-gradient(180deg,var(--bg-primary),var(--bg-secondary))}
.bg-effects{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-effects::before{content:'';position:absolute;width:700px;height:700px;background:radial-gradient(circle,rgba(70,130,180,.12) 0%,transparent 65%);top:-250px;left:-200px;animation:float1 22s ease-in-out infinite;filter:blur(20px)}
.bg-effects::after{content:'';position:absolute;width:600px;height:600px;background:radial-gradient(circle,rgba(46,84,116,.10) 0%,transparent 65%);bottom:-200px;right:-200px;animation:float2 26s ease-in-out infinite;filter:blur(20px)}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(100px,80px) scale(1.12)}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-80px,-60px) scale(1.08)}}

/* ========== LOADING SCREEN ========== */
.loading-screen{position:fixed;inset:0;background:var(--bg-primary);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;z-index:9999;transition:opacity .6s}
.loading-screen.hide{opacity:0;pointer-events:none}
.loader-wrap{position:relative;width:84px;height:84px}
.loader-ring{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;border-top-color:var(--neon-cyan);border-right-color:rgba(70,130,180,.25);animation:spin 1.8s cubic-bezier(.5,0,.5,1) infinite;box-shadow:0 0 20px rgba(70,130,180,.25)}
.loader-ring:nth-child(2){inset:9px;border-top-color:var(--neon-blue);animation-duration:1.2s;animation-direction:reverse}
.loader-core{position:absolute;inset:18px;border-radius:50%;background:linear-gradient(135deg,var(--bg-tertiary),var(--bg-card));border:1px solid rgba(70,130,180,.3);display:grid;place-items:center;font-size:28px;animation:pulse 2.5s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.loading-screen p{color:var(--neon-cyan);font-size:13px;font-weight:600;font-family:'Space Grotesk',sans-serif;letter-spacing:3px;text-transform:uppercase}
.loading-screen small{color:var(--text-muted);font-size:10px;letter-spacing:3px;text-transform:uppercase;font-weight:600}

.container{max-width:1400px;margin:0 auto;padding:30px 20px;min-height:100vh;position:relative;z-index:1}

/* ========== BACK BUTTON ========== */
.back-btn{position:fixed;left:18px;top:22px;background:var(--field-bg);border:1px solid var(--border-normal);color:var(--text-primary);padding:8px 14px;border-radius:var(--radius-sm);text-decoration:none;font-weight:600;font-size:11px;display:flex;align-items:center;gap:7px;transition:var(--transition);backdrop-filter:blur(12px);z-index:1000;font-family:'Space Grotesk',sans-serif;letter-spacing:.5px}
.back-btn:hover{background:rgba(70,130,180,.1);border-color:var(--neon-cyan);color:var(--neon-cyan);transform:translateX(-3px);box-shadow:var(--shadow-glow)}

/* ========== THEME TOGGLE ========== */
.theme-toggle{position:fixed;right:18px;top:22px;width:40px;height:40px;background:var(--field-bg);border:1px solid var(--border-normal);border-radius:var(--radius-md);color:var(--text-secondary);cursor:pointer;transition:var(--transition);backdrop-filter:blur(12px);z-index:1000;font-size:15px;display:grid;place-items:center}
.theme-toggle:hover{color:var(--neon-cyan);border-color:var(--neon-cyan);background:rgba(70,130,180,.1);transform:scale(1.06);box-shadow:var(--shadow-glow)}

/* ========== HEADER ========== */
.header{text-align:center;margin-bottom:32px;animation:headerEntrance .8s cubic-bezier(.34,1.56,.64,1) backwards;padding-top:10px}
@keyframes headerEntrance{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:translateY(0)}}
.logo-icon-big{font-size:56px;margin-bottom:14px;animation:bounce 3s ease-in-out infinite;filter:drop-shadow(0 0 20px rgba(70,130,180,.4));display:inline-block}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.title{font-family:'Space Grotesk',sans-serif;font-size:clamp(26px,6vw,44px);font-weight:700;letter-spacing:2px;margin-bottom:10px;background:linear-gradient(135deg,var(--neon-cyan),var(--neon-blue),var(--text-primary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-transform:uppercase}
.subtitle{font-size:11px;color:var(--text-secondary);letter-spacing:4px;text-transform:uppercase;margin-bottom:16px;font-weight:500;font-family:'Space Grotesk',sans-serif}
.status-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;background:rgba(21,128,61,.1);border:1px solid rgba(21,128,61,.3);border-radius:100px;font-size:10px;font-weight:700;color:var(--neon-green);text-transform:uppercase;letter-spacing:2px;font-family:'Space Grotesk',sans-serif}
html.dark .status-badge{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.3)}
.status-dot{width:7px;height:7px;background:var(--neon-green);border-radius:50%;box-shadow:0 0 8px var(--neon-green);animation:pulse2 2.5s infinite}
@keyframes pulse2{0%,100%{opacity:1}50%{opacity:.4}}

/* ========== STATS BENTO ========== */
.stats-bento{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:700px;margin:0 auto 24px}
.stat-card{background:linear-gradient(135deg,var(--bg-tertiary),var(--bg-secondary));border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:14px 16px;text-align:center;transition:var(--transition);position:relative;overflow:hidden}
.stat-card:hover{border-color:rgba(70,130,180,.3);transform:translateY(-3px);box-shadow:var(--shadow-glow)}
.stat-label{font-family:'Space Grotesk',sans-serif;font-size:9px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:1.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.stat-value{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:800;margin-top:6px;letter-spacing:-.03em;background:linear-gradient(135deg,var(--neon-cyan),var(--neon-blue),var(--text-primary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.1}

/* ========== SEARCH ========== */
.search-container{max-width:600px;margin:0 auto 28px}
.search-box{display:flex;align-items:center;gap:10px;background:var(--field-bg);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:12px 16px;transition:var(--transition)}
.search-box:focus-within{border-color:var(--neon-cyan);background:rgba(70,130,180,.05);box-shadow:0 0 0 3px rgba(70,130,180,.1)}
.search-box i{color:var(--text-muted);font-size:14px}
.search-box input{background:none;border:none;outline:none;color:var(--text-primary);flex:1;font-size:13px;font-family:'Inter',sans-serif;font-weight:500}
.search-box input::placeholder{color:var(--text-muted)}
.search-clear{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:14px;padding:4px;display:none;transition:var(--transition)}
.search-clear.show{display:block}
.search-clear:hover{color:var(--neon-red)}

/* ========== GALLERY ========== */
.gallery-section{margin-bottom:30px}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}

/* Photo Card - Dove Blue Theme */
.photo-card{background:linear-gradient(135deg,var(--bg-tertiary),var(--bg-secondary));border:1px solid var(--border-subtle);border-radius:var(--radius-md);overflow:hidden;transition:var(--transition);position:relative;animation:cardEnter .5s ease forwards;opacity:0;transform:translateY(20px)}
.photo-card:nth-child(1){animation-delay:.05s}
.photo-card:nth-child(2){animation-delay:.1s}
.photo-card:nth-child(3){animation-delay:.15s}
.photo-card:nth-child(4){animation-delay:.2s}
.photo-card:nth-child(5){animation-delay:.25s}
.photo-card:nth-child(6){animation-delay:.3s}
@keyframes cardEnter{to{opacity:1;transform:translateY(0)}}
.photo-card::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(120deg,transparent,rgba(70,130,180,.08),transparent);transition:left .6s ease;z-index:1;pointer-events:none}
.photo-card:hover::before{left:100%}
.photo-card:hover{border-color:rgba(70,130,180,.3);transform:translateY(-4px);box-shadow:var(--shadow-glow)}
.photo-wrapper{position:relative;width:100%;height:280px;background:var(--field-bg);overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer}
.photo-wrapper img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s ease}
.photo-card:hover .photo-wrapper img{transform:scale(1.06)}
.photo-wrapper .fallback{font-size:56px;color:var(--text-muted);opacity:.3}
.photo-badge{position:absolute;top:10px;right:10px;background:rgba(70,130,180,.9);color:#fff;padding:3px 10px;border-radius:5px;font-size:9px;font-weight:800;letter-spacing:1px;font-family:'Space Grotesk',sans-serif;z-index:2;backdrop-filter:blur(8px)}

.photo-info{padding:14px 16px}
.photo-title{font-family:'Space Grotesk',sans-serif;font-size:13.5px;font-weight:700;color:var(--text-primary);margin-bottom:4px;word-break:break-word;text-align:center;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.photo-meta{font-size:10px;color:var(--text-tertiary);text-align:center;margin-bottom:12px;font-family:'Space Grotesk',sans-serif;letter-spacing:1px}

/* Action buttons - ScriptVault style */
.action-buttons-row{display:flex;gap:8px;justify-content:center;padding-top:12px;border-top:1px solid var(--border-subtle)}
.action-btn{flex:1;height:40px;background:var(--field-bg);border:1px solid var(--border-normal);border-radius:var(--radius-sm);color:var(--text-primary);font-size:11px;font-weight:700;cursor:pointer;transition:var(--transition);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-transform:uppercase;letter-spacing:.5px;font-family:'Inter',sans-serif}
.action-btn i{font-size:14px}
.action-btn span{font-size:9px;font-weight:600}
.action-btn.view-btn:hover{background:rgba(70,130,180,.1);border-color:var(--neon-cyan);color:var(--neon-cyan);transform:translateY(-2px);box-shadow:var(--shadow-glow)}
.action-btn.copy-btn:hover{background:rgba(21,128,61,.1);border-color:var(--neon-green);color:var(--neon-green);transform:translateY(-2px);box-shadow:0 0 12px rgba(21,128,61,.25)}
html.dark .action-btn.copy-btn:hover{background:rgba(52,211,153,.1);border-color:var(--neon-green);color:var(--neon-green)}
.action-btn.download-btn:hover{background:rgba(70,130,180,.1);border-color:var(--neon-cyan);color:var(--neon-cyan);transform:translateY(-2px);box-shadow:var(--shadow-glow)}

.copy-flash{animation:copyFlash .6s ease;background:rgba(21,128,61,.15)!important;border-color:var(--neon-green)!important}
@keyframes copyFlash{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}

/* Loading inline */
.loading-inline{display:none;text-align:center;padding:40px;grid-column:1/-1}
.loading-inline.active{display:block}
.loader-inline{width:46px;height:46px;border:3px solid rgba(70,130,180,.15);border-top-color:var(--neon-cyan);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px;box-shadow:var(--shadow-glow)}

.no-results{grid-column:1/-1;text-align:center;padding:60px 24px;background:var(--field-bg);border:1px dashed var(--border-normal);border-radius:var(--radius-lg);color:var(--text-secondary)}
.no-results i{font-size:48px;margin-bottom:14px;opacity:.5;color:var(--neon-cyan);animation:float 3.5s ease-in-out infinite;filter:drop-shadow(0 0 16px rgba(70,130,180,.3))}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.no-results h3{font-family:'Space Grotesk',sans-serif;font-size:17px;margin-bottom:8px;letter-spacing:1px;color:var(--text-primary)}
.no-results p{font-size:12.5px}

/* ========== MODAL ========== */
.modal-backdrop{position:fixed;inset:0;background:var(--overlay-bg);backdrop-filter:blur(24px);z-index:1000;display:none;align-items:center;justify-content:center;padding:24px}
.modal-backdrop.active{display:flex;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-content{background:linear-gradient(135deg,var(--bg-tertiary),var(--bg-secondary));border:1px solid rgba(70,130,180,.35);border-radius:var(--radius-xl);max-width:900px;width:100%;max-height:95vh;overflow:auto;display:flex;flex-direction:column;position:relative;box-shadow:var(--shadow-lg),var(--shadow-glow);animation:slideUp .4s cubic-bezier(.4,0,.2,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.modal-content::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--neon-cyan),var(--neon-blue),transparent);background-size:200% 100%;animation:borderFlow 2.5s linear infinite}
@keyframes borderFlow{0%{background-position:-200% 0}100%{background-position:200% 0}}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border-subtle)}
.modal-title{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;color:var(--neon-cyan);letter-spacing:1px;display:flex;align-items:center;gap:10px}
.modal-title .bar{width:3px;height:18px;background:linear-gradient(180deg,var(--neon-cyan),var(--neon-blue));border-radius:2px;box-shadow:0 0 8px var(--neon-cyan)}
.modal-close{width:34px;height:34px;background:var(--field-bg);border:1px solid var(--border-normal);border-radius:var(--radius-sm);color:var(--text-secondary);font-size:14px;cursor:pointer;transition:var(--transition)}
.modal-close:hover{background:rgba(198,40,40,.1);border-color:var(--neon-red);color:var(--neon-red);transform:rotate(90deg)}
.modal-body{padding:22px;text-align:center;overflow-y:auto;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--field-bg)}
.modal-body img{max-width:100%;max-height:65vh;width:auto;object-fit:contain;border-radius:var(--radius-sm);box-shadow:0 0 20px rgba(70,130,180,.2)}
.modal-info{margin-top:14px;padding:10px 14px;background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-secondary);word-break:break-all;max-width:100%;user-select:all}
.modal-actions{margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;width:100%}
.btn{padding:10px 20px;border-radius:var(--radius-md);font-family:'Inter',sans-serif;font-size:11.5px;font-weight:700;cursor:pointer;transition:var(--transition);border:none;display:inline-flex;align-items:center;gap:7px;text-transform:uppercase;letter-spacing:.8px}
.btn-primary{background:linear-gradient(135deg,var(--neon-cyan),var(--neon-blue));color:#fff;box-shadow:var(--shadow-glow)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 0 24px rgba(70,130,180,.45)}
.btn-success{background:linear-gradient(135deg,var(--neon-green),#166534);color:#fff;box-shadow:var(--shadow-sm)}
.btn-success:hover{transform:translateY(-2px);box-shadow:0 0 20px rgba(21,128,61,.4)}
.btn-warning{background:linear-gradient(135deg,var(--neon-blue),var(--neon-purple));color:#fff;box-shadow:var(--shadow-sm)}
.btn-warning:hover{transform:translateY(-2px)}
.btn-secondary{background:var(--field-bg);color:var(--text-primary);border:1px solid var(--border-normal);backdrop-filter:blur(12px)}
.btn-secondary:hover{background:rgba(70,130,180,.1);border-color:var(--neon-cyan);color:var(--neon-cyan);transform:translateY(-2px)}

/* ========== TOAST ========== */
.toast-container{position:fixed;bottom:24px;right:24px;z-index:10000;display:flex;flex-direction:column;gap:10px;max-width:340px}
.toast{background:linear-gradient(135deg,var(--bg-hover),var(--bg-tertiary));backdrop-filter:blur(24px);border:1px solid rgba(70,130,180,.3);border-left:3px solid var(--neon-cyan);color:var(--text-primary);padding:13px 16px;border-radius:var(--radius-md);font-weight:500;font-size:12px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-glow);animation:toastSlideIn .45s cubic-bezier(.34,1.56,.64,1);position:relative;overflow:hidden}
.toast.success{border-left-color:var(--neon-green)}
.toast.error{border-left-color:var(--neon-red)}
.toast.info{border-left-color:var(--neon-cyan)}
.toast.warning{border-left-color:var(--neon-yellow)}
@keyframes toastSlideIn{from{transform:translateX(150%) scale(.9);opacity:0}to{transform:translateX(0) scale(1);opacity:1}}
.toast .icon{font-size:18px}
.toast.success .icon{color:var(--neon-green)}
.toast.error .icon{color:var(--neon-red)}
.toast.info .icon{color:var(--neon-cyan)}
.toast.warning .icon{color:var(--neon-yellow)}
.toast-progress{position:absolute;bottom:0;left:0;height:2px;background:linear-gradient(90deg,var(--neon-cyan),var(--neon-blue));animation:progressShrink 3.5s linear forwards;box-shadow:0 0 8px var(--neon-cyan)}
@keyframes progressShrink{from{width:100%}to{width:0}}

/* Footer credit */
.footer-credit{text-align:center;padding:30px 0 20px;font-size:10px;color:var(--text-muted);letter-spacing:2px;font-family:'Space Grotesk',sans-serif;text-transform:uppercase}
.footer-credit strong{color:var(--neon-cyan);font-weight:700;letter-spacing:2.5px}

@media(max-width:768px){
  .container{padding:18px 12px;padding-top:70px}
  .back-btn{left:10px;top:12px;padding:6px 10px;font-size:9px}
  .theme-toggle{right:10px;top:12px;width:36px;height:36px;font-size:13px}
  .gallery-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .photo-wrapper{height:180px}
  .action-btn{height:36px}
  .action-btn i{font-size:12px}
  .action-btn span{font-size:8px}
  .stats-bento{grid-template-columns:repeat(3,1fr);gap:8px}
  .stat-value{font-size:18px}
  .stat-label{font-size:8px}
  .title{font-size:22px;letter-spacing:1px}
  .modal-actions{flex-direction:column}
  .modal-actions .btn{width:100%;justify-content:center}
}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:var(--bg-primary)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--neon-cyan),var(--neon-blue));border-radius:6px;border:2px solid var(--bg-primary)}
::selection{background:rgba(70,130,180,.35);color:var(--text-primary)}
</style>
</head>
<body>

<div class="bg-effects"></div>

<!-- Loading Screen -->
<div class="loading-screen" id="loadingScreen">
<div class="loader-wrap">
<div class="loader-ring"></div>
<div class="loader-ring"></div>
<div class="loader-core">🐒</div>
</div>
<p id="loadTxt">INITIALIZING</p>
<small>SCRIPTVAULT × DOVE BLUE v40</small>
</div>

<a href="index.html" class="back-btn">
<i class="fas fa-arrow-left"></i> Kembali
</a>

<button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Ganti Tema">
<span id="themeIcon">🌙</span>
</button>

<div class="container">
  <header class="header">
    <div class="logo-icon-big">🐒</div>
    <h1 class="title">FOTO GALLERY</h1>
    <p class="subtitle">ScriptVault · Dove Blue 2026</p>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>System Online</span>
    </div>
  </header>

  <div class="stats-bento">
    <div class="stat-card">
      <div class="stat-label"><i class="fas fa-images"></i> Total Foto</div>
      <div class="stat-value" id="statTotal">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label"><i class="fas fa-search"></i> Ditemukan</div>
      <div class="stat-value" id="statFiltered">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label"><i class="fas fa-server"></i> Status</div>
      <div class="stat-value" id="statStatus" style="font-size:16px">...</div>
    </div>
  </div>

  <section id="gallery" class="gallery-section">
    <div class="search-container">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Cari foto berdasarkan judul..." onkeyup="searchPhotos()">
        <button class="search-clear" id="searchClear" onclick="clearSearch()"><i class="fas fa-times-circle"></i></button>
      </div>
    </div>

    <div class="loading-inline" id="loadingInline">
      <div class="loader-inline"></div>
      <div style="color:var(--neon-cyan);font-family:'Space Grotesk',sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase">Loading Photos...</div>
    </div>

    <div class="gallery-grid" id="galleryGrid"></div>
  </section>

  <div class="footer-credit">
    👑 Created by <strong>SCRIPTVAULT</strong>
  </div>
</div>

<!-- Modal -->
<div class="modal-backdrop" id="imageModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 class="modal-title"><span class="bar"></span> <i class="fas fa-image"></i> <span id="modalTitle">Foto Detail</span></h3>
      <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body">
      <img src="" alt="" id="modalImage">
      <div class="modal-info" id="modalUrl"></div>
      <div class="modal-actions">
        <button class="btn btn-success" onclick="copyImage()">
          <i class="fas fa-copy"></i> Copy Foto
        </button>
        <button class="btn btn-primary" onclick="copyImageLink()">
          <i class="fas fa-link"></i> Copy Link
        </button>
        <button class="btn btn-warning" onclick="downloadModalImage()">
          <i class="fas fa-download"></i> Download
        </button>
      </div>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
let allPhotos = [];
let currentImageUrl = '';
let currentImageTitle = '';

// ========== THEME TOGGLE ==========
function applyTheme(dark) {
  document.documentElement.classList.toggle('dark', dark);
  const icon = document.getElementById('themeIcon');
  if (icon) icon.textContent = dark ? '☀️' : '🌙';
  try { localStorage.setItem('sv_foto_theme', dark ? '1' : '0'); } catch(e) {}
}

function toggleTheme() {
  applyTheme(!document.documentElement.classList.contains('dark'));
}

// Load theme
try {
  if (localStorage.getItem('sv_foto_theme') === '1') applyTheme(true);
  else applyTheme(false);
} catch(e) { applyTheme(false); }

// ========== LOADING SCREEN ==========
function hideLoadingScreen() {
  const ls = document.getElementById('loadingScreen');
  if (ls) {
    ls.classList.add('hide');
    setTimeout(() => ls.remove(), 600);
  }
}

// ========== FETCH PHOTOS ==========
document.addEventListener('DOMContentLoaded', () => {
  fetchPhotosFromSheet();
});

async function fetchPhotosFromSheet() {
  const loadTxt = document.getElementById('loadTxt');
  if (loadTxt) loadTxt.textContent = 'LOADING PHOTOS';
  document.getElementById('loadingInline').classList.add('active');
  document.getElementById('galleryGrid').innerHTML = '';
  document.getElementById('statStatus').textContent = 'Loading';

  try {
    const sheetId = '1z5FYVvB0E9BeE3cRbl4id1YWi6lRB_2qzMhIvgz4Xx0';
    const gid = '1246502038';

    try {
      const gvizUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&gid=${gid}&range=C2:D150`;
      const response = await fetch(gvizUrl);
      const text = await response.text();
      const json = JSON.parse(text.substring(47).slice(0, -2));
      const rows = json.table.rows;

      allPhotos = [];
      rows.forEach((row, index) => {
        const c = row.c;
        if (!c) return;
        const judul = c[0] ? (c[0].v || '') : '';
        const foto = c[1] ? (c[1].v || '') : '';
        if (judul && foto) {
          allPhotos.push({ judul, foto, index: index + 2 });
        }
      });
    } catch (e) {
      console.log('GVIZ failed, trying CSV...', e);
      const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=${gid}&range=C2:D150`;
      const csvResponse = await fetch(csvUrl);
      const csvText = await csvResponse.text();
      const csvRows = csvText.split('\n').map(row => row.split(','));

      allPhotos = [];
      csvRows.forEach((row, index) => {
        if (row.length < 2) return;
        const judul = row[0] ? row[0].replace(/"/g, '').trim() : '';
        const foto = row[1] ? row[1].replace(/"/g, '').trim() : '';
        if (judul && foto) {
          allPhotos.push({ judul, foto, index: index + 2 });
        }
      });
    }

    renderGallery(allPhotos);
    document.getElementById('statTotal').textContent = allPhotos.length;
    document.getElementById('statStatus').textContent = 'Online';
    showToast('✅ Berhasil memuat ' + allPhotos.length + ' foto', 'success');
  } catch (error) {
    console.error('Error fetching photos:', error);
    showToast('❌ Gagal mengambil data dari Google Sheets', 'error');
    document.getElementById('statStatus').textContent = 'Error';
    document.getElementById('galleryGrid').innerHTML = `
      <div class="no-results">
        <i class="fas fa-exclamation-triangle"></i>
        <h3>GAGAL MEMUAT FOTO</h3>
        <p>Pastikan Google Sheets sudah dipublikasikan</p>
      </div>
    `;
  }

  document.getElementById('loadingInline').classList.remove('active');
  hideLoadingScreen();
}

function renderGallery(photos) {
  const grid = document.getElementById('galleryGrid');
  grid.innerHTML = '';
  document.getElementById('statFiltered').textContent = photos.length;

  if (photos.length === 0) {
    grid.innerHTML = `
      <div class="no-results">
        <i class="fas fa-search"></i>
        <h3>TIDAK ADA FOTO</h3>
        <p>Tidak ada foto yang sesuai dengan pencarian</p>
      </div>
    `;
    return;
  }

  photos.forEach((photo, idx) => {
    const card = createPhotoCard(photo.foto, photo.judul, idx);
    grid.appendChild(card);
  });
}

function createPhotoCard(url, title, index) {
  const card = document.createElement('div');
  card.className = 'photo-card';
  const safeTitle = title.replace(/'/g, "\\'");
  const safeUrl = url.replace(/'/g, "\\'");
  card.innerHTML = `
    <div class="photo-wrapper" onclick="viewFullImage('${safeUrl}', '${safeTitle}')">
      <span class="photo-badge">#${index + 1}</span>
      <img src="${url}" alt="${escapeHtml(title)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
      <div class="fallback" style="display:none"><i class="fas fa-image"></i></div>
    </div>
    <div class="photo-info">
      <div class="photo-title" title="${escapeHtml(title)}">${escapeHtml(title)}</div>
      <div class="photo-meta">FOTO #${index + 1}</div>
      <div class="action-buttons-row">
        <button class="action-btn view-btn" onclick="viewFullImage('${safeUrl}', '${safeTitle}')" title="Lihat Full">
          <i class="fas fa-eye"></i>
          <span>View</span>
        </button>
        <button class="action-btn copy-btn" onclick="copyPhoto('${safeUrl}', this)" title="Copy Foto">
          <i class="fas fa-copy"></i>
          <span>Copy</span>
        </button>
        <button class="action-btn download-btn" onclick="downloadPhoto('${safeUrl}', '${safeTitle}')" title="Download">
          <i class="fas fa-download"></i>
          <span>Download</span>
        </button>
      </div>
    </div>
  `;
  return card;
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

// ========== SEARCH ==========
function searchPhotos() {
  const input = document.getElementById('searchInput');
  const clearBtn = document.getElementById('searchClear');
  const searchTerm = input.value.toLowerCase().trim();
  
  clearBtn.classList.toggle('show', searchTerm.length > 0);
  
  if (!searchTerm) {
    renderGallery(allPhotos);
    return;
  }
  const filtered = allPhotos.filter(photo =>
    photo.judul.toLowerCase().includes(searchTerm)
  );
  renderGallery(filtered);
}

function clearSearch() {
  const input = document.getElementById('searchInput');
  input.value = '';
  document.getElementById('searchClear').classList.remove('show');
  renderGallery(allPhotos);
  input.focus();
}

// ========== MODAL ==========
function viewFullImage(url, title) {
  currentImageUrl = url;
  currentImageTitle = title;
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalImage').src = url;
  document.getElementById('modalUrl').textContent = url;
  document.getElementById('imageModal').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('imageModal').classList.remove('active');
  document.body.style.overflow = '';
  currentImageUrl = '';
  currentImageTitle = '';
}

// ========== COPY IMAGE (BLOB to Clipboard) ==========
async function copyPhoto(url, btnElement) {
  try {
    showToast('📋 Meng-copy gambar...', 'info');
    const response = await fetch(url, { mode: 'cors' });
    if (!response.ok) throw new Error('Fetch failed');
    const blob = await response.blob();
    
    if (navigator.clipboard && typeof ClipboardItem !== 'undefined') {
      const clipboardItem = new ClipboardItem({ [blob.type]: blob });
      await navigator.clipboard.write([clipboardItem]);
      showToast('✅ Foto berhasil disalin! Paste (Ctrl+V)', 'success');
      if (btnElement) {
        btnElement.classList.add('copy-flash');
        setTimeout(() => btnElement.classList.remove('copy-flash'), 600);
      }
    } else {
      throw new Error('Browser tidak support ClipboardItem');
    }
  } catch (error) {
    console.error('Copy error:', error);
    // Fallback: copy URL
    try {
      await navigator.clipboard.writeText(url);
      showToast('⚠️ Copy gambar gagal, URL di-copy sebagai gantinya', 'warning');
    } catch (e2) {
      fallbackCopy(url);
      showToast('⚠️ URL di-copy (gambar tidak bisa di-copy)', 'warning');
    }
  }
}

async function copyImage() {
  if (currentImageUrl) await copyPhoto(currentImageUrl, null);
}

function copyImageLink() {
  if (!currentImageUrl) return;
  navigator.clipboard.writeText(currentImageUrl).then(() => {
    showToast('✅ Link foto berhasil di-copy!', 'success');
  }).catch(() => {
    fallbackCopy(currentImageUrl);
    showToast('✅ Link foto di-copy!', 'success');
  });
}

function fallbackCopy(text) {
  const t = document.createElement('textarea');
  t.value = text;
  t.style.position = 'fixed';
  t.style.opacity = '0';
  document.body.appendChild(t);
  t.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(t);
}

// ========== DOWNLOAD ==========
function downloadPhoto(url, filename) {
  const link = document.createElement('a');
  link.href = url;
  link.download = `${filename.replace(/[^a-z0-9]/gi, '_').toLowerCase()}_${Date.now()}.jpg`;
  link.target = '_blank';
  link.rel = 'noopener noreferrer';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  showToast('⬇️ Download dimulai...', 'info');
}

function downloadModalImage() {
  if (currentImageUrl && currentImageTitle) {
    downloadPhoto(currentImageUrl, currentImageTitle);
  }
}

// ========== TOAST ==========
function showToast(message, type) {
  type = type || 'info';
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const icons = {
    success: '<i class="fas fa-check-circle"></i>',
    error: '<i class="fas fa-times-circle"></i>',
    info: '<i class="fas fa-info-circle"></i>',
    warning: '<i class="fas fa-exclamation-triangle"></i>'
  };
  el.innerHTML = '<span class="icon">' + (icons[type] || '') + '</span><span>' + escapeHtml(message) + '</span><div class="toast-progress"></div>';
  container.appendChild(el);
  setTimeout(() => {
    el.style.animation = 'toastSlideIn 0.3s reverse';
    setTimeout(() => el.remove(), 300);
  }, 3500);
}

// ========== EVENT LISTENERS ==========
document.getElementById('imageModal').addEventListener('click', (e) => {
  if (e.target.id === 'imageModal') closeModal();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});
</script>
</body>
</html>
