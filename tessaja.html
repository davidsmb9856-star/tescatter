<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BUKU DOSA ALL — Drag Frey Dove Blue</title>
<style>
  :root{
    --dove-50:#f0f6fc;
    --dove-100:#e1edf8;
    --dove-200:#c6dbf0;
    --dove-300:#9fc2e4;
    --dove-400:#6fa0d2;
    --dove-500:#4682b4; /* steel blue - dove */
    --dove-600:#376995;
    --dove-700:#2d5477;
    --dove-800:#1f3b54;
    --dove-900:#152a3c;
    --ink:#0f1d2b;
    --ink-soft:#374a5c;
    --warn:#d97706;
    --danger:#b91c1c;
    --ok:#059669;
    --shadow: 0 10px 30px rgba(31,59,84,.15), 0 2px 6px rgba(31,59,84,.08);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:'Segoe UI', Roboto, "Helvetica Neue", Arial, sans-serif;
    background:
      radial-gradient(1200px 600px at 10% -10%, var(--dove-200) 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, var(--dove-300) 0%, transparent 55%),
      linear-gradient(180deg, var(--dove-50) 0%, #eef5fb 100%);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    scroll-behavior:smooth;
  }

  /* ===== HEADER ===== */
  header.topbar{
    position:sticky; top:0; z-index:50;
    backdrop-filter: blur(14px);
    background:linear-gradient(90deg, rgba(70,130,180,.92), rgba(45,84,119,.92));
    color:#fff;
    border-bottom:1px solid rgba(255,255,255,.15);
    box-shadow:0 6px 20px rgba(31,59,84,.2);
  }
  .topbar-inner{
    max-width:1600px; margin:0 auto;
    padding:14px 22px;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .brand{
    display:flex; align-items:center; gap:12px;
  }
  .brand .logo{
    width:44px;height:44px;border-radius:12px;
    background:linear-gradient(135deg,#fff,#cfe2f2);
    display:grid;place-items:center;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.4), 0 6px 14px rgba(0,0,0,.15);
  }
  .brand .logo svg{width:26px;height:26px;fill:var(--dove-700)}
  .brand h1{
    margin:0; font-size:22px; letter-spacing:.5px; font-weight:700;
    text-shadow:0 1px 2px rgba(0,0,0,.15);
  }
  .brand small{display:block;opacity:.85;font-weight:400;font-size:12px}
  .status{
    font-size:12px; opacity:.9;
    display:flex; align-items:center; gap:8px;
    background:rgba(255,255,255,.12);
    padding:6px 12px; border-radius:999px; border:1px solid rgba(255,255,255,.18);
  }
  .dot{width:8px;height:8px;border-radius:50%;background:#7dd3fc;box-shadow:0 0 10px #7dd3fc}
  .dot.ok{background:#6ee7b7;box-shadow:0 0 10px #6ee7b7}
  .dot.err{background:#fca5a5;box-shadow:0 0 10px #fca5a5}

  /* ===== TABS ===== */
  nav.tabs{
    max-width:1600px; margin:18px auto 0; padding:0 22px;
    display:flex; gap:10px; flex-wrap:wrap;
  }
  .tab{
    cursor:pointer; user-select:none;
    padding:12px 22px; border-radius:12px 12px 4px 4px;
    background:linear-gradient(180deg,#ffffff,#e6f0f8);
    color:var(--dove-700); font-weight:600; letter-spacing:.3px;
    border:1px solid var(--dove-200);
    box-shadow:0 2px 6px rgba(31,59,84,.08);
    transition:all .2s ease;
    display:flex; align-items:center; gap:10px;
  }
  .tab:hover{transform:translateY(-1px); box-shadow:0 4px 12px rgba(31,59,84,.12)}
  .tab.active{
    background:linear-gradient(180deg,var(--dove-500),var(--dove-600));
    color:#fff; border-color:var(--dove-700);
    box-shadow:0 6px 16px rgba(55,105,149,.35);
  }
  .tab .pill{
    font-size:11px; padding:2px 8px; border-radius:999px;
    background:rgba(255,255,255,.25); color:inherit;
  }
  .tab.active .pill{background:rgba(255,255,255,.3)}

  /* ===== CONTROLS ===== */
  .controls{
    max-width:1600px; margin:14px auto; padding:0 22px;
    display:flex; gap:12px; flex-wrap:wrap; align-items:center;
  }
  .ctrl{
    display:flex; align-items:center; gap:8px;
    background:#fff; border:1px solid var(--dove-200);
    padding:8px 12px; border-radius:12px;
    box-shadow:0 2px 6px rgba(31,59,84,.06);
  }
  .ctrl label{font-size:12px;color:var(--ink-soft);font-weight:600;white-space:nowrap}
  .ctrl select, .ctrl input{
    border:none; outline:none; background:transparent;
    color:var(--ink); font-size:14px; padding:4px 6px; min-width:180px;
  }
  .btn{
    padding:9px 16px; border-radius:10px; border:1px solid var(--dove-200);
    background:linear-gradient(180deg,#fff,#eaf3fb);
    color:var(--dove-700); font-weight:600; cursor:pointer;
    transition:all .15s ease;
  }
  .btn:hover{transform:translateY(-1px); box-shadow:0 4px 10px rgba(31,59,84,.1)}
  .btn.primary{
    background:linear-gradient(180deg,var(--dove-500),var(--dove-600));
    color:#fff; border-color:var(--dove-700);
  }
  .btn.ghost{background:transparent}

  /* ===== MAIN ===== */
  main{
    max-width:1600px; margin:10px auto 40px; padding:0 22px;
  }
  .panel{display:none}
  .panel.active{display:block; animation:fade .25s ease}
  @keyframes fade{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}

  /* ===== CARD GRID (1 BARIS HORIZONTAL) ===== */
  .cards{
    display:flex;
    gap:14px;
    overflow-x:auto;
    padding:6px 2px 14px;
    scroll-snap-type:x mandatory;
  }
  .cards::-webkit-scrollbar{height:10px}
  .cards::-webkit-scrollbar-track{background:rgba(255,255,255,.4); border-radius:10px}
  .cards::-webkit-scrollbar-thumb{background:var(--dove-300); border-radius:10px}
  .cards::-webkit-scrollbar-thumb:hover{background:var(--dove-400)}

  .card{
    flex:0 0 340px;
    scroll-snap-align:start;
    background:#fff;
    border:1px solid var(--dove-200);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:14px 16px;
    display:flex; flex-direction:column; gap:10px;
    transition:transform .15s ease, box-shadow .15s ease;
    min-height:220px;
  }
  .card:hover{transform:translateY(-2px); box-shadow:0 14px 34px rgba(31,59,84,.18)}

  .card .head{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    border-bottom:1px dashed var(--dove-200); padding-bottom:8px;
  }
  .card .head .who{
    display:flex; align-items:center; gap:10px; min-width:0;
  }
  .avatar{
    width:38px;height:38px;border-radius:50%;
    background:linear-gradient(135deg,var(--dove-300),var(--dove-500));
    color:#fff; font-weight:700; display:grid;place-items:center;
    box-shadow:inset 0 0 0 2px #fff, 0 2px 6px rgba(31,59,84,.2);
    flex:0 0 auto;
  }
  .who .name{font-weight:700; color:var(--dove-800); font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .who .sub{font-size:11px; color:var(--ink-soft)}
  .tag{
    font-size:10px; font-weight:700; padding:3px 8px; border-radius:999px;
    background:var(--dove-100); color:var(--dove-700); border:1px solid var(--dove-200);
    white-space:nowrap;
  }
  .tag.fatal{background:#fde2e2; color:var(--danger); border-color:#fecaca}
  .tag.warn{background:#fef3c7; color:var(--warn); border-color:#fde68a}
  .tag.ok{background:#d1fae5; color:var(--ok); border-color:#a7f3d0}

  .card .meta{
    display:grid; grid-template-columns:1fr 1fr; gap:6px 10px;
    font-size:12px; color:var(--ink-soft);
  }
  .card .meta b{color:var(--ink); font-weight:600}

  .card .ket{
    font-size:13px; line-height:1.45; color:var(--ink-soft);
    background:var(--dove-50);
    border-left:3px solid var(--dove-400);
    padding:8px 10px; border-radius:6px;
    max-height:90px; overflow:auto;
  }
  .card .ket::-webkit-scrollbar{width:6px}
  .card .ket::-webkit-scrollbar-thumb{background:var(--dove-300);border-radius:6px}

  .card .photos{
    display:flex; flex-wrap:wrap; gap:6px;
  }
  .photo-link{
    display:inline-flex; align-items:center; gap:6px;
    padding:6px 10px; border-radius:10px;
    background:linear-gradient(180deg,#eef6fc,#dfeaf6);
    border:1px solid var(--dove-200);
    color:var(--dove-700); font-size:12px; font-weight:600;
    text-decoration:none; cursor:pointer;
    transition:all .15s ease;

  .photo-link svg{width:14px;height:14px;fill:currentColor}
  .photo-link .preview{
    width:32px;height:32px;border-radius:6px; object-fit:cover;
    border:1px solid var(--dove-200);
  }

  /* ===== SUMMARY CARDS ===== */
  .summary{
    display:flex; gap:12px; flex-wrap:wrap; margin-bottom:14px;
  }
  .stat{
    background:linear-gradient(180deg,#fff,#eaf3fb);
    border:1px solid var(--dove-200);
    border-radius:14px; padding:14px 18px; min-width:160px;
    box-shadow:0 4px 12px rgba(31,59,84,.06);
  }
  .stat .t{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.6px}
  .stat .v{font-size:22px;font-weight:800;color:var(--dove-700);margin-top:2px}

  /* ===== STAFF LIST TABLE ===== */
  .staff-wrap{
    background:#fff; border:1px solid var(--dove-200); border-radius:14px;
    padding:12px; box-shadow:var(--shadow); margin-bottom:16px;
  }
  .staff-wrap h3{margin:4px 6px 10px; color:var(--dove-800); font-size:15px}
  .staff-grid{
    display:flex; gap:8px; overflow-x:auto; padding-bottom:6px;
  }
  .staff-grid::-webkit-scrollbar{height:8px}
  .staff-grid::-webkit-scrollbar-thumb{background:var(--dove-300);border-radius:8px}
  .staff-item{
    flex:0 0 170px;
    background:linear-gradient(180deg,#f6faff,#e6f0f8);
    border:1px solid var(--dove-200);
    border-radius:12px; padding:10px 12px; cursor:pointer;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    transition:all .15s ease;
  }
  .staff-item:hover{transform:translateY(-1px); border-color:var(--dove-400)}
  .staff-item.active{background:linear-gradient(180deg,var(--dove-500),var(--dove-600)); color:#fff; border-color:var(--dove-700)}
  .staff-item .nm{font-weight:600; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .staff-item .cnt{
    background:rgba(255,255,255,.5); color:inherit; font-weight:800;
    padding:2px 8px; border-radius:999px; font-size:12px;
  }
  .staff-item.active .cnt{background:rgba(255,255,255,.25)}

  /* ===== MODAL ===== */
  .modal-bg{
    position:fixed; inset:0; background:rgba(15,29,43,.72);
    display:none; align-items:center; justify-content:center;
    z-index:100; padding:20px; backdrop-filter:blur(4px);
  }
  .modal-bg.show{display:flex; animation:fade .2s ease}
  .modal{
    background:#fff; border-radius:16px; max-width:min(960px,96vw);
    max-height:92vh; overflow:auto; padding:18px; box-shadow:0 30px 80px rgba(0,0,0,.4);
    border:1px solid var(--dove-200);
  }
  .modal .close{
    float:right; cursor:pointer; background:var(--dove-100);
    border:1px solid var(--dove-200); color:var(--dove-800);
    padding:6px 12px; border-radius:10px; font-weight:700;
  }
  .modal img{
    max-width:100%; max-height:78vh; border-radius:10px;
    display:block; margin:12px auto 0;
    border:1px solid var(--dove-200);
    box-shadow:0 10px 30px rgba(0,0,0,.2);
  }
  .modal .caption{
    text-align:center; color:var(--ink-soft); margin-top:10px; font-size:13px;
  }

  /* ===== EMPTY STATE ===== */
  .empty{
    text-align:center; padding:40px 20px; color:var(--ink-soft);
    background:#fff; border:1px dashed var(--dove-300); border-radius:14px;
  }
  .empty svg{width:64px;height:64px;fill:var(--dove-300); margin-bottom:8px}

  /* ===== LOADER ===== */
  .loader{
    display:flex; justify-content:center; align-items:center; gap:10px;
    padding:30px; color:var(--dove-600);
  }
  .spinner{
    width:28px;height:28px;border-radius:50%;
    border:3px solid var(--dove-200); border-top-color:var(--dove-500);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ===== RESPONSIVE ===== */
  @media (max-width:640px){
    .card{flex:0 0 88vw}
    .tab{padding:10px 14px; font-size:14px}
    .brand h1{font-size:18px}
    .ctrl{width:100%}
    .ctrl select, .ctrl input{min-width:0; flex:1}
  }
</style>
</head>

<script>
/* =========================================================
   CONFIG SHEET
========================================================= */
const SHEET_ID = '1camkXfvojs-YSBBPekYHTi4cwata4YCGTtmVIeOy1yc';
const URL_CHAT  = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent('Situs Lain')}`;
const URL_FATAL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent('Fatal All Situs')}`;

/* =========================================================
   STATE
========================================================= */
let CHAT_RAW = null;   // 2D array
let FATAL_RAW = null;
let STAFF_LIST = [];   // [{name,count}] dari I3:J40
let SITUS_DROPDOWN = []; // dari C2
let ACTIVE_STAFF = '';   // filter staff dari staff-grid
let ACTIVE_SITUS_CHAT = '';
let ACTIVE_SITUS_FATAL = '';
let ACTIVE_STAFF_FATAL = '';
let ACTIVE_DATE_FATAL = '';

/* =========================================================
   UTIL: CSV PARSER
========================================================= */
function parseCSV(text){
  // Simple RFC4180-ish parser
  const rows = [];
  let cur = [], field = '', inQuotes = false;
  for (let i=0;i<text.length;i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){
        if (text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ','){ cur.push(field); field=''; }
      else if (c === '\n'){ cur.push(field); rows.push(cur); cur=[]; field=''; }
      else if (c === '\r'){ /* ignore */ }
      else field += c;
    }
  }
  if (field.length || cur.length){ cur.push(field); rows.push(cur); }
  return rows;
}
const isBlank = v => v===undefined||v===null||String(v).trim()==='';
const clean = v => isBlank(v) ? '' : String(v).trim();
const colIdx = letter => { // A->0, B->1, ..., Z->25, AA->26
  let n=0;
  for (const ch of letter.toUpperCase()){ n = n*26 + (ch.charCodeAt(0)-64); }
  return n-1;
};

/* =========================================================
   EXTRACT LINKS
========================================================= */
function extractLinks(text){
  if (!text) return [];
  const s = String(text);
  const regex = /https?:\/\/[^\s,"'\n\r]+/gi;
  const arr = s.match(regex) || [];
  // dedupe
  return [...new Set(arr)];
}

/* =========================================================
   FETCH DATA
========================================================= */
async function fetchCSV(url){
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP '+res.status);
  const txt = await res.text();
  return parseCSV(txt);
}

/* =========================================================
   RENDER: KESALAHAN CHAT ALL
========================================================= */
function getSitusList(){
  // Ambil dari kolom A/C - kita scan nilai unik di kolom C (link) tapi situs lebih tepat dari C2 atau header situs
  // Strategi: C2 adalah dropdown situs; kita scan kolom A/B untuk label situs (biasanya header blok).
  // Fallback: kita buat dari data unik kolom C (jika ada pola) ATAU dari nama sheet = "Situs Lain" (satu situs saja)
  // Tapi instruksi: C2 = dropdown situs. Jadi kita baca C2 saja sebagai 1 nama situs.
  // Agar lebih lengkap, kita juga scan range A/C di row atas yang berisi label situs.
  const situs = new Set();

  // C2
  if (CHAT_RAW && CHAT_RAW[1] && CHAT_RAW[1][colIdx('C')]){
    situs.add(clean(CHAT_RAW[1][colIdx('C')]));
  }
  // Scan header di baris 3-4 kolom A,B,C untuk nama situs
  for (let r=0; r<Math.min(5, CHAT_RAW.length); r++){
    const row = CHAT_RAW[r]||[];
    [0,1,2].forEach(ci=>{
      const v = clean(row[ci]);
      if (v && !/^https?:/i.test(v) && !/tanggal/i.test(v) && !/nama/i.test(v) && v.length<80){
        // hanya yang seperti nama situs (mengandung titik atau domain-ish)
        if (/\./i.test(v) || /situs/i.test(v) || /\.com|\.net|\.org|\.id|\.co/i.test(v)){
          situs.add(v);
        }
      }
    });
  }
  // Scan seluruh kolom C untuk domain
  for (let r=3; r<CHAT_RAW.length; r++){
    const v = clean((CHAT_RAW[r]||[])[colIdx('C')]);
    if (!v) continue;
    const m = v.match(/https?:\/\/([^\/\s]+)/i);
    if (m && m[1] && !/google|docs|drive/.test(m[1])) situs.add(m[1]);
  }
  return [...situs].filter(Boolean).sort();
}

function renderChat(){
  const loader = document.getElementById('loaderChat');
  loader.style.display='none';

  if (!CHAT_RAW) return;

  const B = colIdx('B'), C = colIdx('C'), D = colIdx('D');
  const rows = [];

  // Data rows: 4..2547 -> index 3..2546
  for (let i=3; i<Math.min(CHAT_RAW.length,2547); i++){
    const row = CHAT_RAW[i] || [];
    const nama = clean(row[B]);
    const linkTxt = clean(row[C]);
    const ket = clean(row[D]);

    // Abaikan jika nama kosong
    if (!nama) continue;

    const links = extractLinks(linkTxt);
    // Tanggal: cari pola tanggal di linkTxt
    const tglMatch = linkTxt.match(/(\d{1,2}[\-\/]\d{1,2}[\-\/]\d{2,4}|\d{4}[\-\/]\d{1,2}[\-\/]\d{1,2})/);
    const tanggal = tglMatch ? tglMatch[1] : '';

    // Situs dari link pertama
    let situs = '';
    if (links[0]){
      const m = links[0].match(/^https?:\/\/([^\/]+)/i);
      if (m) situs = m[1];
    }

    // Filter
    if (ACTIVE_SITUS_CHAT && situs && !situs.toLowerCase().includes(ACTIVE_SITUS_CHAT.toLowerCase())) continue;
    if (ACTIVE_STAFF && nama.toLowerCase() !== ACTIVE_STAFF.toLowerCase()) continue;
    const q = (document.getElementById('searchChat').value||'').toLowerCase().trim();
    if (q && !(nama+' '+ket).toLowerCase().includes(q)) continue;

    rows.push({nama, linkTxt, ket, links, tanggal, situs, rowIndex:i+1});
  }

  // Stats
  const allNames = new Set();
  for (let i=3; i<Math.min(CHAT_RAW.length,2547); i++){
    const n = clean((CHAT_RAW[i]||[])[B]);
    if (n) allNames.add(n);
  }
  document.getElementById('stTotal').textContent = allNames.size;
  document.getElementById('stSitus').textContent = getSitusList().length || 1;
  document.getElementById('stShown').textContent = rows.length;
  document.getElementById('countChat').textContent = rows.length;

  // Render cards horizontal
  const box = document.getElementById('cardsChat');
  if (!rows.length){
    box.innerHTML = `
      <div class="empty" style="flex:1; min-width:300px">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 18c-4.4 0-8-3.6-8-8s3.6-8 8-8 8 3.6 8 8-3.6 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
        <div>Tidak ada data yang cocok dengan filter.</div>
      </div>`;
    return;
  }

  box.innerHTML = rows.map(r => {
    const initials = r.nama.split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase();
    const photos = r.links.length ? r.links.map((u,i)=>`
      <a class="photo-link" onclick="openModal('${u.replace(/'/g,"\\'")}','${escapeAttr(r.nama)} – Foto ${i+1}')">
        <svg viewBox="0 0 24 24"><path d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2zM8.5 13.5l2.5 3 3.5-4.5 4.5 6H5l3.5-5z"/></svg>
        📷 Foto ${i+1}
      </a>
    `).join('') : '<span style="color:#9ca3af;font-size:12px">— tidak ada foto —</span>';

    return `
      <div class="card">
        <div class="head">
          <div class="who">
            <div class="avatar">${initials||'?'}</div>
            <div style="min-width:0">
              <div class="name">${escapeHtml(r.nama)}</div>
              <div class="sub">${r.situs ? '🌐 '+escapeHtml(r.situs) : '📋 Baris '+r.rowIndex}</div>
            </div>
          </div>
          <span class="tag">CHAT</span>
        </div>
        <div class="meta">
          <div>📅 Tanggal <b>${escapeHtml(r.tanggal||'-')}</b></div>
          <div>📷 Foto <b>${r.links.length}</b></div>
        </div>
        ${r.ket ? `<div class="ket">${escapeHtml(r.ket)}</div>` : ''}
        <div class="photos">${photos}</div>
      </div>
    `;
  }).join('');
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function escapeAttr(s){
  return String(s||'').replace(/"/g,'&quot;').replace(/'/g,'\\\'');
}

/* =========================================================
   RENDER: STAFF GRID (I3:J40)
========================================================= */
function renderStaffGrid(){
  if (!CHAT_RAW) return;
  const I = colIdx('I'), J = colIdx('J');
  STAFF_LIST = [];
  // rows 3..40 -> index 2..39
  for (let i=2; i<Math.min(40, CHAT_RAW.length); i++){
    const row = CHAT_RAW[i]||[];
    const nama = clean(row[I]);
    const cnt  = clean(row[J]);
    if (!nama) continue;
    STAFF_LIST.push({name:nama, count:cnt||'0'});
  }

  const grid = document.getElementById('staffGrid');
  if (!STAFF_LIST.length){
    grid.innerHTML = '<div class="empty" style="flex:1">Belum ada data staff.</div>';
    return;
  }
  grid.innerHTML = STAFF_LIST.map(s=>`
    <div class="staff-item ${ACTIVE_STAFF===s.name?'active':''}" data-name="${escapeAttr(s.name)}">
      <div class="nm">👤 ${escapeHtml(s.name)}</div>
      <div class="cnt">${escapeHtml(s.count)}</div>
    </div>
  `).join('');

  grid.querySelectorAll('.staff-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      const nm = el.dataset.name;
      ACTIVE_STAFF = (ACTIVE_STAFF===nm) ? '' : nm;
      renderStaffGrid();
      renderChat();
    });
  });
}

   RENDER: SITUS DROPDOWN (C2)
========================================================= */
function renderSitusDropdown(){
  const select = document.getElementById('filterSitus');
  const list = getSitusList();
  SITUS_DROPDOWN = list;
  select.innerHTML = '<option value="">— Semua Situs —</option>' +
    list.map(s=>`<option value="${escapeAttr(s)}">${escapeHtml(s)}</option>`).join('');
  select.value = ACTIVE_SITUS_CHAT;
}

/* =========================================================
   RENDER: FATAL ALL SITUS
========================================================= */
function renderFatal(){
  const loader = document.getElementById('loaderFatal');
  loader.style.display='none';

  if (!FATAL_RAW) return;

  const B = colIdx('B'), D = colIdx('D'), E = colIdx('E'), F = colIdx('F');
  const H = colIdx('H'), I = colIdx('I'), J = colIdx('J'), K = colIdx('K');

  const rows = [];
  const staffSet = new Set();
  const situsSet = new Set();

  for (let i=4; i<Math.min(FATAL_RAW.length,1001); i++){
    const row = FATAL_RAW[i]||[];
    const tgl   = clean(row[B]);
    const staf  = clean(row[D]);
    const stat  = clean(row[E]);
    const situs = clean(row[F]);
    const bonus = clean(row[H]);
    const ket   = clean(row[I]);
    const ss1   = clean(row[J]);
    const ss2   = clean(row[K]);

    if (!staf && !ket) continue; // abaikan baris kosong

    if (staf) staffSet.add(staf);
    if (situs) situsSet.add(situs);

    // Filter
    if (ACTIVE_SITUS_FATAL && situs && !situs.toLowerCase().includes(ACTIVE_SITUS_FATAL.toLowerCase())) continue;
    if (ACTIVE_STAFF_FATAL && staf && !staf.toLowerCase().includes(ACTIVE_STAFF_FATAL.toLowerCase())) continue;
    if (ACTIVE_DATE_FATAL && tgl && !normalizeDate(tgl).includes(ACTIVE_DATE_FATAL)) continue;
    const q = (document.getElementById('searchFatal').value||'').toLowerCase().trim();
    if (q && !(staf+' '+ket+' '+situs+' '+stat).toLowerCase().includes(q)) continue;

    const links1 = extractLinks(ss1);
    const links2 = extractLinks(ss2);

    rows.push({tgl, staf, stat, situs, bonus, ket, links1, links2, rowIndex:i+1});
  }

  // Populate filter dropdowns (sekali)
  const fsSitus = document.getElementById('filterFatalSitus');
  if (fsSitus.options.length <= 1){
    fsSitus.innerHTML = '<option value="">— Semua Situs —</option>' +
      [...situsSet].sort().map(s=>`<option>${escapeHtml(s)}</option>`).join('');
  }
  const fsStaff = document.getElementById('filterFatalStaff');
  if (fsStaff.options.length <= 1){
    fsStaff.innerHTML = '<option value="">— Semua Staff —</option>' +
      [...staffSet].sort().map(s=>`<option>${escapeHtml(s)}</option>`).join('');
  }

  // Stats
  document.getElementById('ftTotal').textContent = rows.length;
  document.getElementById('ftStaff').textContent = staffSet.size;
  document.getElementById('ftSitus').textContent = situsSet.size;
  document.getElementById('ftShown').textContent = rows.length;
  document.getElementById('countFatal').textContent = rows.length;

  // Render cards horizontal
  const box = document.getElementById('cardsFatal');
  if (!rows.length){
    box.innerHTML = `
      <div class="empty" style="flex:1;min-width:300px">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 18c-4.4 0-8-3.6-8-8s3.6-8 8-8 8 3.6 8 8-3.6 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
        <div>Tidak ada data fatal yang cocok.</div>
      </div>`;
    return;
  }

  box.innerHTML = rows.map(r=>{
    const initials = (r.staf||'?').split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase();
    const bonusTag = r.bonus ? `<span class="tag fatal">💸 Potong ${escapeHtml(r.bonus)}%</span>` : '';
    const statusTag = r.stat ? `<span class="tag warn">${escapeHtml(r.stat)}</span>` : '';

    const renderLinks = (arr, label) => arr.length
      ? arr.map((u,i)=>`
        <a class="photo-link" onclick="openModal('${u.replace(/'/g,"\\'")}','${escapeAttr(r.staf)} – ${label} ${i+1}')">
          <svg viewBox="0 0 24 24"><path d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2zM8.5 13.5l2.5 3 3.5-4.5 4.5 6H5l3.5-5z"/></svg>
          ${label} ${i+1}
        </a>`).join('')
      : '';
    const ph1 = renderLinks(r.links1,'SS');
    const ph2 = renderLinks(r.links2,'LC');

    return `
      <div class="card">
        <div class="head">
          <div class="who">
            <div class="avatar" style="background:linear-gradient(135deg,#fecaca,#b91c1c)">${initials||'?'}</div>
            <div style="min-width:0">
              <div class="name">${escapeHtml(r.staf||'(tanpa nama)')}</div>
              <div class="sub">🌐 ${escapeHtml(r.situs||'-')}</div>
            </div>
          </div>
          <span class="tag fatal">FATAL</span>
        </div>
        <div class="meta">
          <div>📅 <b>${escapeHtml(r.tgl||'-')}</b></div>
          <div>📊 ${statusTag||'<b>-</b>'}</div>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${bonusTag}
        </div>
        ${r.ket ? `<div class="ket" style="border-left-color:var(--danger)">${escapeHtml(r.ket)}</div>` : ''}
        <div>
          <div style="font-size:11px;color:var(--ink-soft);font-weight:700;margin-bottom:4px">📸 SS KESALAHAN</div>
          <div class="photos">${ph1 || '<span style="color:#9ca3af;font-size:12px">— tidak ada —</span>'}</div>
        </div>
        <div>
          <div style="font-size:11px;color:var(--ink-soft);font-weight:700;margin-bottom:4px">📸 SS KESALAHAN LC</div>
          <div class="photos">${ph2 || '<span style="color:#9ca3af;font-size:12px">— tidak ada —</span>'}</div>
        </div>
      </div>
    `;
  }).join('');
}

/* =========================================================
   HELPERS
========================================================= */
function normalizeDate(s){
  if (!s) return '';
  const m = String(s).match(/(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})/);
  if (m){
    let [_,d,mo,y] = m;
    if (y.length===2) y = '20'+y;
    return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`;
  }
  return String(s);
}

/* =========================================================
   MODAL
========================================================= */
function openModal(url, cap){
  // Google Drive thumbnail preview: convert drive URL -> direct image
  let img = url;
  const m = url.match(/[?&]id=([^&]+)/);
  if (m) img = `https://drive.google.com/thumbnail?id=${m[1]}&sz=w1200`;
  else if (/drive\.google\.com\/file\/d\/([^\/]+)/.test(url)){
    const id = RegExp.$1;
    img = `https://drive.google.com/thumbnail?id=${id}&sz=w1200`;
  }
  document.getElementById('modalImg').src = img;
  document.getElementById('modalCap').innerHTML = cap + `<br><a href="${url}" target="_blank" style="color:var(--dove-600)">🔗 Buka di tab baru</a>`;
  document.getElementById('modal').classList.add('show');
}
function closeModal(){
  document.getElementById('modal').classList.remove('show');
  document.getElementById('modalImg').src='';
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

/* =========================================================
   RELOAD
========================================================= */
async function reloadAll(){
  setStatus('loading','Memuat data...');
  document.getElementById('loaderChat').style.display='flex';
  document.getElementById('loaderFatal').style.display='flex';
  document.getElementById('cardsChat').innerHTML='';
  document.getElementById('cardsFatal').innerHTML='';
  try{
    const [c, f] = await Promise.all([
      fetchCSV(URL_CHAT).catch(e=>{ console.error(e); return null; }),
      fetchCSV(URL_FATAL).catch(e=>{ console.error(e); return null; })
    ]);
    CHAT_RAW = c; FATAL_RAW = f;
    renderSitusDropdown();
    renderStaffGrid();
    renderChat();
    renderFatal();
    setStatus('ok','Data termuat ✓');
  }catch(e){
    console.error(e);
    setStatus('err','Gagal memuat: '+e.message);
  }
}

function setStatus(kind, text){
  const d = document.getElementById('statusDot');
  d.className = 'dot ' + (kind==='ok'?'ok':kind==='err'?'err':'');
  document.getElementById('statusText').textContent = text;
}

/* =========================================================
   BOOT
========================================================= */
reloadAll();
</script>
