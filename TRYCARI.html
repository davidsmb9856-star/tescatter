<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#0f1d2b">
<title>Multi-Tool Analyzer — Dove Blue v52 Dark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* ============================================================ */
/* 🕊️ DOVE BLUE v52 DARK THEME — DARK ONLY */
/* ============================================================ */
:root {
  --bg-primary:#0f1d2b;
  --bg-secondary:#132434;
  --bg-tertiary:#1a2f42;
  --bg-card:#1a2f42;
  --bg-hover:#27455f;
  --field-bg:rgba(0,0,0,.35);
  --code-bg:rgba(0,0,0,.4);
  --overlay-bg:rgba(2,4,8,.88);

  --neon-cyan:#6fa3cf;
  --neon-blue:#8fbce0;
  --neon-purple:#aacfeb;
  --neon-pink:#ef5350;
  --neon-green:#34d399;
  --neon-yellow:#f0a830;
  --neon-red:#ef5350;
  --neon-orange:#f0a830;

  --text-primary:#e8f0f8;
  --text-secondary:#9fb2c4;
  --text-tertiary:#7f96ab;
  --text-muted:#5a7186;

  --border-subtle:rgba(255,255,255,.06);
  --border-normal:rgba(255,255,255,.12);
  --border-strong:rgba(255,255,255,.2);
  --border-glow:rgba(111,163,207,.5);

  --shadow-sm:0 2px 6px rgba(0,0,0,.4);
  --shadow-md:0 6px 18px rgba(0,0,0,.5);
  --shadow-lg:0 14px 40px rgba(0,0,0,.6);
  --shadow-glow:0 0 18px rgba(111,163,207,.25);

  --radius-sm:8px;
  --radius-md:11px;
  --radius-lg:14px;
  --radius-xl:18px;
  --transition:all .25s cubic-bezier(.4,0,.2,1);
  --transition-bounce:.45s cubic-bezier(.34,1.56,.64,1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  background:
    radial-gradient(1100px 500px at 8% -8%, rgba(111,163,207,.12) 0%, transparent 55%),
    radial-gradient(900px 500px at 108% 6%, rgba(143,188,224,.10) 0%, transparent 50%),
    linear-gradient(180deg, var(--bg-primary), var(--bg-secondary));
}

/* ========== BACKGROUND EFFECTS v52 ========== */
.bg-effects {
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none; overflow: hidden;
}
.bg-effects::before {
  content: ''; position: absolute;
  width: 700px; height: 700px;
  background: radial-gradient(circle, rgba(111,163,207,.10) 0%, transparent 65%);
  top: -250px; left: -200px;
  animation: float1 22s ease-in-out infinite;
  filter: blur(20px);
}
.bg-effects::after {
  content: ''; position: absolute;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(143,188,224,.08) 0%, transparent 65%);
  bottom: -200px; right: -200px;
  animation: float2 26s ease-in-out infinite;
  filter: blur(20px);
}
@keyframes float1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(100px,80px) scale(1.12); } }
@keyframes float2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-80px,-60px) scale(1.08); } }

.grid-overlay {
  position: fixed; inset: 0; z-index: 0;
  background-image:
    linear-gradient(rgba(111,163,207,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(111,163,207,.04) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black 30%, transparent 75%);
  animation: gridMove 30s linear infinite;
  pointer-events: none;
}
@keyframes gridMove { 0% { background-position: 0 0; } 100% { background-position: 44px 44px; } }

.scanline {
  position: fixed; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, rgba(111,163,207,.4), transparent);
  opacity: .4;
  animation: scanLine 9s linear infinite;
  z-index: 1; pointer-events: none;
  filter: blur(1px);
}
@keyframes scanLine {
  0% { top: -2px; opacity: 0; } 5% { opacity: .4; } 95% { opacity: .4; } 100% { top: 100%; opacity: 0; }
}

.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 25px 20px;
  position: relative;
  z-index: 2;
}

/* Header */
.header {
  text-align: center;
  margin-bottom: 30px;
  animation: headerEntrance 1s var(--transition-bounce) backwards;
}
@keyframes headerEntrance {
  from { opacity: 0; transform: translateY(-30px); }
  to { opacity: 1; transform: translateY(0); }
}

.header-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: clamp(28px, 5vw, 42px);
  font-weight: 700;
  letter-spacing: 3px;
  margin-bottom: 8px;
  text-transform: uppercase;
  background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue), var(--text-primary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.header-subtitle {
  font-size: 12px;
  color: var(--text-secondary);
  letter-spacing: 4px;
  text-transform: uppercase;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 600;
}

/* Tab Navigation */
.tab-navigation {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-bottom: 30px;
  flex-wrap: wrap;
}

.tab-btn {
  padding: 12px 24px;
  background: var(--field-bg);
  border: 1px solid var(--border-normal);
  border-radius: var(--radius-md);
  color: var(--text-secondary);
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  transition: var(--transition);
  text-transform: uppercase;
  letter-spacing: 1px;
  backdrop-filter: blur(12px);
  display: flex;
  align-items: center;
  gap: 8px;
}

.tab-btn:hover {
  background: rgba(111,163,207,.1);
  border-color: var(--neon-cyan);
  color: var(--neon-cyan);
  transform: translateY(-2px);
  box-shadow: var(--shadow-glow);
}

.tab-btn.active {
  background: linear-gradient(135deg, rgba(111,163,207,.25), rgba(111,163,207,.08));
  border-color: var(--neon-cyan);
  color: var(--neon-cyan);
  box-shadow: var(--shadow-glow);
}

.tab-btn[data-tab="trycari"] {
  border-color: rgba(240,168,48,.4);
  color: var(--neon-orange);
}
.tab-btn[data-tab="trycari"].active {
  background: linear-gradient(135deg, rgba(240,168,48,.2), rgba(240,168,48,.08));
  border-color: var(--neon-orange);
  color: var(--neon-orange);
  box-shadow: 0 0 18px rgba(240,168,48,.3);
}

/* Panel */
.tab-panel { display: none; animation: fadeIn 0.5s ease; }
.tab-panel.active { display: block; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Mode Toggle */
.mode-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
  padding: 16px;
  background: linear-gradient(135deg, var(--bg-tertiary), var(--bg-secondary));
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  margin-bottom: 25px;
  backdrop-filter: blur(12px);
  position: relative;
  overflow: hidden;
}
.mode-toggle::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-blue), transparent);
  background-size: 200% 100%;
  animation: borderFlow 2.5s linear infinite;
}
@keyframes borderFlow { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

.toggle-label {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 11px;
  color: var(--text-secondary);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  font-weight: 700;
}

.switch {
  position: relative;
  width: 52px;
  height: 26px;
}

.switch input { opacity: 0; width: 0; height: 0; }

.slider {
  position: absolute;
  cursor: pointer;
  inset: 0;
  background: var(--field-bg);
  border: 1px solid var(--border-normal);
  border-radius: 30px;
  transition: var(--transition);
}

.slider:before {
  position: absolute;
  content: "";
  height: 18px;
  width: 18px;
  left: 3px;
  bottom: 3px;
  background: var(--text-tertiary);
  border-radius: 50%;
  transition: var(--transition);
}

input:checked + .slider { border-color: var(--neon-green); background: rgba(52,211,153,.1); }
input:checked + .slider:before {
  transform: translateX(26px);
  background: var(--neon-green);
  box-shadow: 0 0 12px rgba(52,211,153,.5);
}

.mode-text {
  font-size: 12px;
  color: var(--neon-cyan);
  font-weight: 700;
  font-family: 'Space Grotesk', sans-serif;
  letter-spacing: 1px;
  text-transform: uppercase;
}

/* Input Section */
.input-section {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 25px;
}

@media (max-width: 768px) {
  .input-section { grid-template-columns: 1fr; }
}

.section-box {
  background: linear-gradient(135deg, var(--bg-tertiary), var(--bg-secondary));
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xl);
  padding: 20px;
  backdrop-filter: blur(12px);
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}
.section-box::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-blue), transparent);
  background-size: 200% 100%;
  animation: borderFlow 2.5s linear infinite;
  opacity: .5;
}

.section-box:hover {
  border-color: rgba(111,163,207,.3);
  box-shadow: var(--shadow-glow);
  transform: translateY(-2px);
}

.section-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 12px;
  font-weight: 700;
  color: var(--neon-cyan);
  margin-bottom: 15px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  gap: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.section-title i { font-size: 14px; }
.section-title::before {
  content: '';
  width: 3px; height: 16px;
  background: linear-gradient(180deg, var(--neon-cyan), var(--neon-blue));
  border-radius: 2px;
  box-shadow: 0 0 8px var(--neon-cyan);
}

textarea {
  width: 100%;
  height: 130px;
  background: var(--field-bg);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 14px;
  color: var(--text-primary);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  resize: vertical;
  outline: none;
  transition: var(--transition);
  margin-bottom: 15px;
  line-height: 1.7;
}

textarea:focus {
  border-color: var(--neon-cyan);
  box-shadow: 0 0 0 3px rgba(111,163,207,.1), var(--shadow-glow);
  background: rgba(111,163,207,.06);
}

textarea::placeholder { color: var(--text-muted); }

/* Buttons */
.buttons {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.neon-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 18px;
  background: var(--field-bg);
  border: 1px solid var(--border-normal);
  border-radius: var(--radius-md);
  color: var(--text-secondary);
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 11px;
  cursor: pointer;
  transition: var(--transition);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.neon-btn:hover {
  background: rgba(111,163,207,.1);
  border-color: var(--neon-cyan);
  color: var(--neon-cyan);
  transform: translateY(-2px);
  box-shadow: var(--shadow-glow);
}

.neon-btn.primary {
  background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue));
  color: #fff;
  border: none;
  box-shadow: var(--shadow-glow);
}

.neon-btn.primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 24px rgba(111,163,207,.4);
}

.neon-btn.gold {
  border-color: rgba(240,168,48,.4);
  color: var(--neon-orange);
}
.neon-btn.gold:hover {
  background: rgba(240,168,48,.1);
  border-color: var(--neon-orange);
  box-shadow: 0 0 18px rgba(240,168,48,.3);
}

.neon-btn.primary.gold {
  background: linear-gradient(135deg, var(--neon-orange), #b4690e);
  color: #fff;
  border: none;
}

/* Result Cards */
.results-container { margin-top: 25px; }

.summary-box {
  background: linear-gradient(135deg, rgba(111,163,207,.15), rgba(111,163,207,.05));
  border: 1px solid rgba(111,163,207,.4);
  border-radius: var(--radius-lg);
  padding: 15px 20px;
  margin-bottom: 20px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 13px;
  color: var(--neon-cyan);
  text-align: center;
  backdrop-filter: blur(12px);
  font-weight: 700;
  letter-spacing: 1px;
  position: relative;
  overflow: hidden;
}
.summary-box::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-blue), transparent);
  background-size: 200% 100%;
  animation: borderFlow 2.5s linear infinite;
}

.user-card, .bank-card {
  background: linear-gradient(135deg, var(--bg-tertiary), var(--bg-secondary));
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xl);
  margin-bottom: 18px;
  overflow: hidden;
  backdrop-filter: blur(12px);
  transition: var(--transition);
  animation: cardEnter 0.5s ease forwards;
  opacity: 0;
  position: relative;
}
.user-card:nth-child(1), .bank-card:nth-child(1) { animation-delay: 0.1s; }
.user-card:nth-child(2), .bank-card:nth-child(2) { animation-delay: 0.15s; }
.user-card:nth-child(3), .bank-card:nth-child(3) { animation-delay: 0.2s; }

@keyframes cardEnter {
  to { opacity: 1; }
}

.user-card::before, .bank-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-blue), transparent);
  opacity: .5;
}

.user-card:hover, .bank-card:hover {
  border-color: rgba(111,163,207,.3);
  box-shadow: var(--shadow-glow);
  transform: translateY(-3px);
}

.card-header {
  padding: 14px 18px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 14px;
  font-weight: 700;
  color: var(--neon-cyan);
  background: linear-gradient(90deg, rgba(111,163,207,.1), transparent);
  border-bottom: 1px solid var(--border-subtle);
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.card-body {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  padding: 18px;
}

@media (max-width: 600px) {
  .card-body { grid-template-columns: 1fr; }
}

.col-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 10px;
  color: var(--text-secondary);
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px dashed var(--border-subtle);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
}

.entry-list {
  list-style: none;
  max-height: 100px;
  overflow-y: auto;
  margin-bottom: 12px;
}

.entry-list::-webkit-scrollbar { width: 4px; }
.entry-list::-webkit-scrollbar-track { background: var(--bg-primary); }
.entry-list::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--neon-cyan), var(--neon-blue)); border-radius: 2px; }

.entry-item {
  background: var(--field-bg);
  padding: 8px 12px;
  margin-bottom: 6px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  border: 1px solid var(--border-subtle);
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-primary);
  font-weight: 500;
}

.total-row {
  display: flex;
  justify-content: space-between;
  padding-top: 10px;
  border-top: 1px dashed var(--border-subtle);
  align-items: center;
}

.total-label {
  font-size: 10px;
  color: var(--text-secondary);
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  font-family: 'Space Grotesk', sans-serif;
}

.total-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  font-weight: 700;
}

.deposit-color { color: var(--neon-cyan); text-shadow: 0 0 10px rgba(111,163,207,.4); }
.withdraw-color { color: var(--neon-orange); text-shadow: 0 0 10px rgba(240,168,48,.4); }

.withdraw-note {
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 4px;
  padding-left: 8px;
  border-left: 2px solid var(--neon-orange);
  font-family: 'Inter', sans-serif;
  font-style: italic;
}

/* Selisih Status */
.selisih-besar {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 12px;
  font-weight: 700;
  text-align: center;
  padding: 10px;
  margin: 0 18px 5px;
  border-radius: var(--radius-md);
  letter-spacing: 2px;
  text-transform: uppercase;
}

.selisih-jumlah {
  font-family: 'JetBrains Mono', monospace;
  font-size: 22px;
  font-weight: 700;
  text-align: center;
  padding-bottom: 15px;
  letter-spacing: 1px;
}

.selisih-cocok {
  color: var(--neon-green);
  background: rgba(52,211,153,.1);
  border: 1px solid rgba(52,211,153,.3);
  text-shadow: 0 0 12px rgba(52,211,153,.4);
}
.selisih-lebih {
  color: var(--neon-orange);
  background: rgba(240,168,48,.1);
  border: 1px solid rgba(240,168,48,.3);
  text-shadow: 0 0 12px rgba(240,168,48,.4);
}
.selisih-kurang {
  color: var(--neon-red);
  background: rgba(239,83,80,.1);
  border: 1px solid rgba(239,83,80,.3);
  text-shadow: 0 0 12px rgba(239,83,80,.4);
}

/* Extractor Horizontal */
.extract-h-container {
  display: flex;
  gap: 15px;
  overflow-x: auto;
  padding: 15px 0;
  scrollbar-width: thin;
  scrollbar-color: var(--neon-cyan) var(--bg-primary);
}

.extract-h-container::-webkit-scrollbar { height: 6px; }
.extract-h-container::-webkit-scrollbar-track { background: var(--bg-primary); }
.extract-h-container::-webkit-scrollbar-thumb { background: linear-gradient(90deg, var(--neon-cyan), var(--neon-blue)); border-radius: 3px; }

.extract-h-card {
  min-width: 240px;
  background: linear-gradient(135deg, var(--bg-tertiary), var(--bg-secondary));
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 15px;
  flex-shrink: 0;
  transition: var(--transition);
  backdrop-filter: blur(12px);
}

.extract-h-card:hover {
  border-color: rgba(111,163,207,.4);
  box-shadow: var(--shadow-glow);
  transform: translateY(-3px);
}

.extract-h-card .label {
  font-size: 9px;
  color: var(--neon-cyan);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 5px;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
}

.extract-h-card .value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--text-primary);
  word-break: break-all;
  line-height: 1.4;
  font-weight: 500;
}

/* Tables for Try Cari */
.table-wrapper {
  overflow-x: auto;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-subtle);
  margin-top: 20px;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

th {
  background: linear-gradient(135deg, var(--bg-tertiary), var(--bg-card));
  padding: 12px 15px;
  text-align: left;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 10px;
  color: var(--neon-cyan);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  border-bottom: 2px solid rgba(111,163,207,.3);
  white-space: nowrap;
  font-weight: 700;
}

td {
  padding: 10px 15px;
  border-bottom: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
}

tr:hover td { background: rgba(111,163,207,.05); }

tr.cocok td { background: rgba(52,211,153,.08); }
tr.tidak-cocok td { background: rgba(239,83,80,.08); }

/* Toast */
#toast-container {
  position: fixed;
  bottom: 25px;
  right: 25px;
  z-index: 10000;

<script>
// === TOAST SYSTEM ===
function showToast(message, type = 'info') {
  const icons = { success: 'fa-check-circle', warning: 'fa-exclamation-triangle', error: 'fa-times-circle', info: 'fa-info-circle' };
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i> <span>${message}</span>`;
  document.getElementById('toast-container').appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(120%)';
    setTimeout(() => toast.remove(), 300);
  }, 3500);
}

// === UTILS ===
function clearField(id) { document.getElementById(id).value = ''; }

// === ANALYZER LOGIC ===
const SHEET_ID = '1JF1Mp58d4q6m3D0BLAxaQxxEUduXLFsp5em8Ww6MaNo';
const GID_DEPOSIT = '1211507274';
const GID_WITHDRAW = '1194549454';
const BANK_LIST = ['BCA','BRI','BNI','CIMB','DANAMON','BSI','DANA','OVO','LINKAJA','GOPAY','JAGO','MAYBANK','SEABANK','MANDIRI','QRIS'];
let modePerBank = false;

document.getElementById('modeToggle').addEventListener('change', e => {
  modePerBank = e.target.checked;
  document.getElementById('modeText').textContent = modePerBank ? 'Per Bank' : 'Per Pengguna';
});

function formatRupiah(n) {
  if (n == null || n === 0) return '0';
  return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

function clearDeposit() { document.getElementById('dataDeposit').value = ''; showToast('Data deposit dihapus', 'success'); }
function clearWithdraw() { document.getElementById('dataWithdraw').value = ''; showToast('Data withdraw dihapus', 'success'); }

function parseSheetResponse(text) {
  try {
    const s = text.indexOf('{'), e = text.lastIndexOf('}') + 1;
    const data = JSON.parse(text.substring(s, e));
    return data.table?.rows?.map(r => r.c?.map(c => c?.v ?? '').join('\t') || '') || [];
  } catch { return []; }
}

async function loadDeposit() {
  showToast('Mengambil data deposit...', 'info');
  try {
    const res = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${GID_DEPOSIT}&range=A102:B250`);
    const text = await res.text();
    const data = parseSheetResponse(text)
      .filter(l => l.split('\t').filter(x => x.trim()).length >= 2)
      .map(l => {
        const [d, n] = l.split('\t');
        const num = parseInt(n.replace(/[^0-9]/g, '')) || 0;
        return `${d}\t${formatRupiah(num)}`;
      }).join('\n');
    document.getElementById('dataDeposit').value = data;
    showToast('Data deposit berhasil dimuat', 'success');
  } catch (err) { showToast('Gagal memuat data deposit', 'error'); }
}

async function loadWithdraw() {
  showToast('Mengambil data withdraw...', 'info');
  try {
    const res = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${GID_WITHDRAW}&range=I8:K1809`);
    const text = await res.text();
    const data = parseSheetResponse(text)
      .filter(l => l.split('\t').filter(x => x.trim()).length >= 2)
      .map(l => {
        const [k, n, s] = l.split('\t');
        const num = parseInt(n.replace(/[^0-9]/g, '')) || 0;
        return `${k}\t${formatRupiah(num)}\t${s || ''}`;
      }).join('\n');
    document.getElementById('dataWithdraw').value = data;
    showToast('Data withdraw berhasil dimuat', 'success');
  } catch (err) { showToast('Gagal memuat data withdraw', 'error'); }
}

function detectBank(t) {
  const u = (t || '').toUpperCase();
  return BANK_LIST.find(b => u.includes(b)) || 'LAINNYA';
}

function extractName(t) {
  let c = t.trim(), i = c.toUpperCase().indexOf('DEPO ');
  if (i !== -1) c = c.substring(i + 5).trim();
  const s = c.lastIndexOf('/');
  return s !== -1 ? c.substring(s + 1).trim() : c;
}

function parseLine(l, isWd = false) {
  l = l.trim();
  if (!l) return null;
  const p = l.split('\t').map(x => x.trim()).filter(x => x);
  if (p.length < 2) return null;
  if (isWd) {
    const [k, nRaw, src] = p;
    const num = parseInt(nRaw.replace(/[^0-9]/g, '')) || 0;
    return { nama: extractName(src || k), bank: detectBank(src || k), nominalRaw: formatRupiah(num), nominalClean: num, asli: l, note: k };
  } else {
    const [desc, nRaw] = p;
    const num = parseInt(nRaw.replace(/[^0-9]/g, '')) || 0;
    return { nama: extractName(desc), bank: detectBank(desc), nominalRaw: formatRupiah(num), nominalClean: num, asli: l, note: '' };
  }
}

function prosesDepositWithdraw() {
  const d = document.getElementById('dataDeposit').value.trim();
  const w = document.getElementById('dataWithdraw').value.trim();
  if (!d || !w) {
    showToast("Harap isi kedua kolom data!", "warning");
    return;
  }

  const depo = d.split('\n').map(l => parseLine(l, false)).filter(Boolean);
  const wd = w.split('\n').map(l => parseLine(l, true)).filter(Boolean);
  if (!depo.length || !wd.length) {
    showToast("Format data tidak valid!", "error");
    return;
  }

  modePerBank ? analisisPerBank(depo, wd) : analisisPerPengguna(depo, wd);
}

function analisisPerPengguna(depo, wd) {
  const dTot = {}, wTot = {}, dDet = {}, wDet = {};
  depo.forEach(i => {
    const k = i.nama.toLowerCase().trim();
    dTot[k] = (dTot[k] || 0) + i.nominalClean;
    (dDet[k] = dDet[k] || []).push(i);
  });
  wd.forEach(i => {
    const k = i.nama.toLowerCase().trim();
    wTot[k] = (wTot[k] || 0) + i.nominalClean;
    (wDet[k] = wDet[k] || []).push(i);
  });

  const names = [...new Set([...Object.keys(dTot), ...Object.keys(wTot)])];
  const results = names.map(k => {
    const n = dDet[k] ? depo.find(x => x.nama.toLowerCase() === k)?.nama : wd.find(x => x.nama.toLowerCase() === k)?.nama || k;
    const d = dTot[k] || 0, w = wTot[k] || 0, diff = d - w;
    let selisihKet, selisihClass;
    if (d > 0 && w > 0) {
      if (diff === 0) { selisihKet = "COCOK"; selisihClass = "selisih-cocok"; }
      else if (diff > 0) { selisihKet = "LEBIH DEPOSIT"; selisihClass = "selisih-lebih"; }
      else { selisihKet = "KURANG DEPOSIT"; selisihClass = "selisih-kurang"; }
    } else {
      selisihKet = "TIDAK LENGKAP"; selisihClass = "selisih-kurang";
    }
    return { nama: n, depo: d, wd: w, diff, selisihKet, selisihClass, dEntries: dDet[k] || [], wEntries: wDet[k] || [] };
  });

  renderPerPengguna(results);
}

function analisisPerBank(depo, wd) {
  const dByBank = {}, wByBank = {}, dEntries = {}, wEntries = {};
  [...BANK_LIST, 'LAINNYA'].forEach(b => {
    dByBank[b] = 0; wByBank[b] = 0; dEntries[b] = []; wEntries[b] = [];
  });
  depo.forEach(i => { dByBank[i.bank] += i.nominalClean; dEntries[i.bank].push(i); });
  wd.forEach(i => { wByBank[i.bank] += i.nominalClean; wEntries[i.bank].push(i); });

  const results = [...BANK_LIST, 'LAINNYA']
    .map(bank => {
      const d = dByBank[bank], w = wByBank[bank], diff = d - w;
      if (d === 0 && w === 0) return null;
      let selisihKet, selisihClass;
      if (d > 0 && w > 0) {
        if (diff === 0) { selisihKet = "COCOK"; selisihClass = "selisih-cocok"; }
        else if (diff > 0) { selisihKet = "LEBIH DEPOSIT"; selisihClass = "selisih-lebih"; }
        else { selisihKet = "KURANG DEPOSIT"; selisihClass = "selisih-kurang"; }
      } else {
        selisihKet = "TIDAK LENGKAP"; selisihClass = "selisih-kurang";
      }
      return { bank, depo: d, wd: w, diff, selisihKet, selisihClass, dEntries: dEntries[bank], wEntries: wEntries[bank] };
    })
    .filter(Boolean);
  renderPerBank(results);
}

function renderPerPengguna(results) {
  let html = `<div class="results-container"><div class="summary-box"><i class="fas fa-users"></i> Total Pengguna: ${results.length}</div>`;
  results.forEach(r => {
    const depoFmt = r.depo > 0 ? formatRupiah(r.depo) : '–';
    const wdFmt = r.wd > 0 ? formatRupiah(r.wd) : '–';
    const selisihNum = r.diff === 0 ? '0' : (r.diff > 0 ? `+${formatRupiah(r.diff)}` : `-${formatRupiah(Math.abs(r.diff))}`);
    html += `
      <div class="user-card">
        <div class="card-header"><i class="fas fa-user"></i> ${r.nama}</div>
        <div class="card-body">
          <div class="col">
            <div class="col-title"><span><i class="fas fa-download"></i> DEPOSIT</span></div>
            <ul class="entry-list">
              ${r.dEntries.length ? r.dEntries.map(e => `<li class="entry-item">${e.nominalRaw}</li>`).join('') : '<li class="entry-item" style="text-align:center;color:var(--text-muted);">–</li>'}
            </ul>
            <div class="total-row">
              <span class="total-label">TOTAL:</span>
              <span class="total-value deposit-color">${depoFmt}</span>
            </div>
          </div>
          <div class="col">
            <div class="col-title"><span><i class="fas fa-upload"></i> WITHDRAW</span></div>
            <ul class="entry-list">
              ${r.wEntries.length ? r.wEntries.map(e => `
                <li class="entry-item">
                  <span>${e.nominalRaw}</span>
                  ${e.note ? `<div class="withdraw-note">${e.note}</div>` : ''}
                </li>
              `).join('') : '<li class="entry-item" style="text-align:center;color:var(--text-muted);">–</li>'}
            </ul>
            <div class="total-row">
              <span class="total-label">TOTAL:</span>
              <span class="total-value withdraw-color">${wdFmt}</span>
            </div>
          </div>
        </div>
        <div class="selisih-besar ${r.selisihClass}">${r.selisihKet}</div>
        <div class="selisih-jumlah ${r.selisihClass}">${selisihNum}</div>
      </div>`;
  });
  html += '</div>';
  document.getElementById('hasilDepoWd').innerHTML = html;
  showToast(`Analisis selesai: ${results.length} pengguna`, 'success');
}

function renderPerBank(results) {
  let html = `<div class="results-container"><div class="summary-box"><i class="fas fa-university"></i> Total Bank: ${results.length}</div>`;
  results.forEach(r => {
    const depoFmt = r.depo > 0 ? formatRupiah(r.depo) : '–';
    const wdFmt = r.wd > 0 ? formatRupiah(r.wd) : '–';
    const selisihNum = r.diff === 0 ? '0' : (r.diff > 0 ? `+${formatRupiah(r.diff)}` : `-${formatRupiah(Math.abs(r.diff))}`);
    html += `
      <div class="bank-card">
        <div class="card-header"><i class="fas fa-university"></i> ${r.bank}</div>
        <div class="card-body">
          <div class="col">
            <div class="col-title"><span><i class="fas fa-download"></i> DEPOSIT</span></div>
            <ul class="entry-list">
              ${r.dEntries.length ? r.dEntries.map(e => `<li class="entry-item">${e.nominalRaw}</li>`).join('') : '<li class="entry-item" style="text-align:center;color:var(--text-muted);">–</li>'}
            </ul>
            <div class="total-row">
              <span class="total-label">TOTAL:</span>
              <span class="total-value deposit-color">${depoFmt}</span>
            </div>
          </div>
          <div class="col">
            <div class="col-title"><span><i class="fas fa-upload"></i> WITHDRAW</span></div>
            <ul class="entry-list">
              ${r.wEntries.length ? r.wEntries.map(e => `
                <li class="entry-item">
                  <span>${e.nominalRaw}</span>
                  ${e.note ? `<div class="withdraw-note">${e.note}</div>` : ''}
                </li>
              `).join('') : '<li class="entry-item" style="text-align:center;color:var(--text-muted);">–</li>'}
            </ul>
            <div class="total-row">
              <span class="total-label">TOTAL:</span>
              <span class="total-value withdraw-color">${wdFmt}</span>
            </div>
          </div>
        </div>
        <div class="selisih-besar ${r.selisihClass}">${r.selisihKet}</div>
        <div class="selisih-jumlah ${r.selisihClass}">${selisihNum}</div>
      </div>`;
  });
  html += '</div>';
  document.getElementById('hasilDepoWd').innerHTML = html;
  showToast(`Analisis selesai: ${results.length} bank`, 'success');
}

// === EXTRACTOR LOGIC ===
const E_WALLET_CODES = { 'DANA': '3901', 'OVO': '39358', 'LINKAJA': '09110', 'GOPAY': '70001' };

function clearBulkExtract() {
  document.getElementById('bulkExtractInput').value = '';
  document.getElementById('bulkResultsContainer').innerHTML = '';
  showToast('Data extractor dihapus', 'success');
}

function copyBulkExtracted() {
  const container = document.getElementById('bulkResultsContainer');
  if (!container.children.length) {
    showToast("Tidak ada data untuk disalin!", "warning");
    return;
  }

  const items = Array.from(container.querySelectorAll('.extract-h-card'));
  let text = '';
  items.forEach(card => {
    const vals = card.querySelectorAll('.value');
    if (vals.length >= 4) {
      text += `${vals[0].textContent.trim()}\t${vals[1].textContent.trim()}\t${vals[2].textContent.trim()}\t${vals[3].textContent.trim()}\n`;
    }
  });
  navigator.clipboard.writeText(text.trim()).then(() => {
    showToast("Data berhasil disalin!", "success");
  }, () => {
    showToast("Gagal menyalin ke clipboard.", "error");
  });
}

function splitIntoBlocks(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(l => l !== '');
  const blocks = [];
  let currentBlock = [];

  for (const line of lines) {
    if (/^\d+(\s|\t|$)/.test(line)) {
      if (currentBlock.length > 0) { blocks.push(currentBlock); }
      currentBlock = [line];
    } else {
      currentBlock.push(line);
    }
  }
  if (currentBlock.length > 0) { blocks.push(currentBlock); }
  return blocks;
}

function parseSingleWithdrawBlock(lines) {
  lines = lines.map(l => l.trim()).filter(l => l !== '');
  let account = '–', username = '–', name = '–', nominal = '–';

  if (lines.length > 0) {
    const firstLine = lines[0];
    if (firstLine.includes('\t')) {
      const parts = firstLine.split('\t').filter(p => p.trim() !== '');
      if (parts.length >= 2) { username = parts[1].trim(); }
    } else {
      const parts = firstLine.split(/\s+/);
      if (parts.length >= 2) { username = parts[1].trim(); }
    }
  }

  for (let i = 0; i < lines.length; i++) {
    if (lines[i].toUpperCase().includes('WITHDRAW')) {
      const parts = lines[i].split('\t').filter(p => p.trim() !== '');
      if (parts.length >= 3) {
        nominal = parts[2].trim().replace(/\s+/g, '');
      }
      break;
    }
  }

  for (let i = lines.length - 1; i >= 0; i--) {
    const line = lines[i];
    if (line.includes(',')) {
      const parts = line.split(',').map(p => p.trim());
      if (parts.length >= 3) { name = parts[2].toUpperCase(); }
      else if (parts.length === 2) { name = parts[1].toUpperCase(); }

      const bankType = parts[0].toUpperCase();
      let accountNumber = '';
      if (parts.length >= 2) { accountNumber = parts[1].replace(/\D/g, ''); }

      if (E_WALLET_CODES.hasOwnProperty(bankType)) {
        account = E_WALLET_CODES[bankType] + accountNumber;
      } else {
        account = accountNumber || '–';
      }
      break;
    }
  }

  if (nominal !== '–') {
    nominal = nominal.replace(/[^\d,.]/g, '');
    if (!nominal.includes(',') && !nominal.includes('.')) {
      const num = parseInt(nominal.replace(/\D/g, ''));
      if (!isNaN(num) && num > 0) { nominal = formatRupiah(num); }
    }
  }

  return { account, username, name, nominal };
}

function processBulkExtract() {
  const input = document.getElementById('bulkExtractInput').value;
  if (!input.trim()) {
    clearBulkExtract();
    return;
  }

  const blocks = splitIntoBlocks(input);
  const container = document.getElementById('bulkResultsContainer');
  container.innerHTML = '';

  const limitedBlocks = blocks.slice(0, 100);
  limitedBlocks.forEach(block => {
    const data = parseSingleWithdrawBlock(block);
    const card = document.createElement('div');
    card.className = 'extract-h-card';
    card.innerHTML = `
      <div class="label">Rekening</div>
      <div class="value">${data.account}</div>
      <div class="label">User ID</div>
      <div class="value">${data.username}</div>
      <div class="label">Nama</div>
      <div class="value">${data.name}</div>
      <div class="label">Nominal</div>
      <div class="value">${data.nominal}</div>
    `;
    container.appendChild(card);
  });
  showToast(`${limitedBlocks.length} data berhasil diekstrak`, 'success');
}

// === TRY CARI LOGIC ===
function parseData_TRYCARI(raw) {
  return raw.split('\n').map(line => line.trim()).filter(line => line).map(line => {
    const parts = line.split('\t').map(p => p.trim());
    if (parts.length >= 4) {
      return { jam: parts[0], userID: parts[1], nama: parts[2], nominal: parts[3] };
    }
    return null;
  }).filter(row => row !== null);
}

function prosesData_TRYCARI() {
  const rawDataDocs = document.getElementById('dataDocs').value;
  const rawDataAdmin = document.getElementById('dataAdmin').value;

  if (!rawDataDocs.trim() || !rawDataAdmin.trim()) {
    document.getElementById('hasil_TRYCARI').innerHTML = '';
    showToast("Harap isi data di kedua kolom!", "warning");
    return;
  }

  const dataDocs = parseData_TRYCARI(rawDataDocs);
  const dataAdmin = parseData_TRYCARI(rawDataAdmin);

  if (dataDocs.length === 0 || dataAdmin.length === 0) {
    document.getElementById('hasil_TRYCARI').innerHTML = '';
    showToast("Format data tidak valid!", "error");
    return;
  }

  const adminKeyList = dataAdmin.map(row => {
    const userIDClean = String(row.userID).toLowerCase().trim();
    const nominalClean = String(row.nominal).replace(/[^0-9]/g, '');
    return `${userIDClean}|${nominalClean}`;
  });

  const adminCountMap = {};
  adminKeyList.forEach(key => { adminCountMap[key] = (adminCountMap[key] || 0) + 1; });

  const adminNominalMap = {};
  dataAdmin.forEach(row => {
    const userIDClean = String(row.userID).toLowerCase().trim();
    const nominalClean = String(row.nominal).replace(/[^0-9]/g, '');
    const key = `${userIDClean}|${nominalClean}`;
    if (!adminNominalMap[key]) { adminNominalMap[key] = row.nominal; }
  });

  const results = [];
  dataDocs.forEach(row => {
    const { jam, userID, nama, nominal } = row;
    const userIDClean = String(userID).toLowerCase().trim();
    const nominalClean = String(nominal).replace(/[^0-9]/g, '');
    const key = `${userIDClean}|${nominalClean}`;

    let status, kelas, nominalDiAdmin = '–';

    if (adminCountMap[key] > 0) {
      adminCountMap[key]--;
      status = 'COCOK';
      kelas = 'cocok';
      nominalDiAdmin = adminNominalMap[key] || nominal;
    } else {
      status = 'TIDAK COCOK';
      kelas = 'tidak-cocok';
    }

    results.push({ jam, userID, nama, nominal, nominalDiAdmin, status, kelas });
  });

  const usageCount = {};
  adminKeyList.forEach(key => { usageCount[key] = (usageCount[key] || 0) + 1; });

  for (const key in adminCountMap) {
    const used = (usageCount[key] || 0) - adminCountMap[key];
    usageCount[key] = used;
  }

  const adminRowsWithStatus = dataAdmin.map(row => {
    const userIDClean = String(row.userID).toLowerCase().trim();
    const nominalClean = String(row.nominal).replace(/[^0-9]/g, '');
    const key = `${userIDClean}|${nominalClean}`;
    const isUsed = usageCount[key] > 0;
    if (isUsed) usageCount[key]--;
    return { ...row, isUsed };
  });

  const totalDocs = dataDocs.length;
  const totalAdmin = dataAdmin.length;
  const totalCocok = results.filter(r => r.status === 'COCOK').length;
  const totalTidakCocok = totalDocs - totalCocok;

  let html = `<div class="input-section">`;

  // DOCS Table
  html += `
    <div class="section-box">
      <h3 class="section-title"><i class="fas fa-file-alt"></i> Data DOCS (Analisis)</h3>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>JAM</th><th>USER ID</th><th>NOMINAL</th><th>NOMINAL ADMIN</th><th>STATUS</th>
            </tr>
          </thead>
          <tbody>
  `;

  results.forEach(row => {
    html += `
      <tr class="${row.kelas}">
        <td>${row.jam}</td>
        <td style="font-weight:700;">${row.userID}</td>
        <td>${row.nominal}</td>
        <td>${row.nominalDiAdmin}</td>
        <td style="font-weight:700; color:var(${row.status === 'COCOK' ? '--neon-green' : '--neon-red'})">${row.status}</td>
      </tr>
    `;
  });

  html += `</tbody></table></div>`;

  html += `
    <div style="margin-top:15px; padding:15px; background:var(--field-bg); border:1px solid var(--border-normal); border-radius:var(--radius-lg); font-size:12px; font-family:'JetBrains Mono', monospace;">
      <strong style="color:var(--neon-cyan); letter-spacing:1px;">RINGKASAN:</strong><br>
      Total DOCS: <strong>${totalDocs}</strong> | Total ADMIN: <strong>${totalAdmin}</strong><br>
      <span style="color:var(--neon-green);">✓ COCOK: ${totalCocok}</span> | <span style="color:var(--neon-red);">✗ TIDAK COCOK: ${totalTidakCocok}</span>
    </div>
    </div>`;

  // ADMIN Table
  html += `
    <div class="section-box">
      <h3 class="section-title"><i class="fas fa-user-shield"></i> Data ADMIN (Referensi)</h3>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>JAM</th><th>USER ID</th><th>NAMA</th><th>NOMINAL</th><th>STATUS</th>
            </tr>
          </thead>
          <tbody>
  `;

  adminRowsWithStatus.forEach(row => {
    const statusText = row.isUsed ? 'Dipakai' : 'Tidak Terpakai';
    const statusColor = row.isUsed ? 'var(--neon-green)' : 'var(--text-muted)';
    html += `
      <tr>
        <td>${row.jam}</td>
        <td style="font-weight:700;">${row.userID}</td>
        <td>${row.nama}</td>
        <td>${row.nominal}</td>
        <td style="color:${statusColor}; font-weight:700;">${statusText}</td>
      </tr>
    `;
  });

  html += `</tbody></table></div></div></div>`;

  document.getElementById('hasil_TRYCARI').innerHTML = html;
  showToast(`Analisis selesai: ${totalCocok} cocok dari ${totalDocs} entri`, 'success');
}

// === TAB SWITCH ===
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const target = btn.dataset.tab;

    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.getElementById(`panel-${target}`).classList.add('active');
  });
});

// Init
document.addEventListener('DOMContentLoaded', () => {
  showToast("🔷 Sistem Analyzer siap digunakan", "success");
});
</script>
