<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4682b4">
<title>📷 FOTO - LINE TOGEL 2026 × Dove Blue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
--bg-primary:#0f1d2b;--bg-secondary:#132434;--bg-tertiary:#1a2f42;--bg-card:#1a2f42;--bg-hover:#27455f;
--neon-cyan:#6fa3cf;--neon-blue:#8fbce0;--neon-purple:#aacfeb;--neon-pink:#ef5350;--neon-green:#34d399;--neon-yellow:#f0a830;--neon-red:#ef5350;
--text-primary:#e8f0f8;--text-secondary:#9fb2c4;--text-tertiary:#7f96ab;--text-muted:#5a7186;
--border-subtle:rgba(255,255,255,.06);--border-normal:rgba(255,255,255,.12);--border-strong:rgba(255,255,255,.2);--border-glow:rgba(111,163,207,.5);
--shadow-sm:0 2px 6px rgba(0,0,0,.4);--shadow-md:0 6px 18px rgba(0,0,0,.5);--shadow-lg:0 14px 40px rgba(0,0,0,.6);--shadow-glow:0 0 18px rgba(111,163,207,.25);
--radius-sm:8px;--radius-md:11px;--radius-lg:14px;--radius-xl:18px;
--transition:all .25s cubic-bezier(.4,0,.2,1);--transition-bounce:.45s cubic-bezier(.34,1.56,.64,1);
--field-bg:rgba(0,0,0,.35);--code-bg:rgba(0,0,0,.4);--overlay-bg:rgba(2,4,8,.88);--hl:#7a6522;
--base-cyan:#4682b4;--base-blue:#37688f;--base-purple:#2e5474;
}
html.light{
--bg-primary:#eef5fb;--bg-secondary:#f7fbff;--bg-tertiary:#ffffff;--bg-card:#ffffff;--bg-hover:#e6f0f9;
--neon-cyan:#4682b4;--neon-blue:#37688f;--neon-purple:#2e5474;--neon-pink:#c62828;--neon-green:#15803d;--neon-yellow:#b45309;--neon-red:#c62828;
--text-primary:#13232f;--text-secondary:#4a5d6e;--text-tertiary:#6b7c8c;--text-muted:#93a3b1;
--border-subtle:rgba(31,58,84,.08);--border-normal:rgba(31,58,84,.16);--border-strong:rgba(31,58,84,.28);--border-glow:rgba(70,130,180,.5);
--shadow-sm:0 2px 6px rgba(31,58,84,.08);--shadow-md:0 6px 18px rgba(31,58,84,.12);--shadow-lg:0 14px 40px rgba(31,58,84,.18);--shadow-glow:0 0 18px rgba(70,130,180,.18);
--field-bg:rgba(31,58,84,.05);--code-bg:rgba(31,58,84,.06);--overlay-bg:rgba(15,28,42,.45);--hl:#fff3bf;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{
font-family:'Inter',sans-serif;
background:var(--bg-primary);
color:var(--text-primary);
min-height:100vh;
overflow-x:hidden;
-webkit-font-smoothing:antialiased;
line-height:1.6;
transition:background .3s,color .3s;
}
body{
background:radial-gradient(1100px 500px at 8% -8%,rgba(70,130,180,.14) 0%,transparent 55%),radial-gradient(900px 500px at 108% 6%,rgba(111,163,207,.12) 0%,transparent 50%),linear-gradient(180deg,var(--bg-primary),var(--bg-secondary));
}
body::after{
content:'';
position:fixed;
inset:0;
z-index:2;
pointer-events:none;
opacity:.025;
background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
.bg-effects{
position:fixed;
inset:0;
z-index:0;
pointer-events:none;
overflow:hidden;
}
.bg-effects::before{
content:'';
position:absolute;
width:700px;
height:700px;
background:radial-gradient(circle,rgba(70,130,180,.12) 0%,transparent 65%);
top:-250px;
left:-200px;
animation:float1 22s ease-in-out infinite;
filter:blur(20px);
}
.bg-effects::after{
content:'';
position:absolute;
width:600px;
height:600px;
background:radial-gradient(circle,rgba(46,84,116,.10) 0%,transparent 65%);
bottom:-200px;
right:-200px;
animation:float2 26s ease-in-out infinite;
filter:blur(20px);
}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(100px,80px) scale(1.12)}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-80px,-60px) scale(1.08)}}
.container{
max-width:1400px;
margin:0 auto;
padding:30px 20px;
min-height:100vh;
position:relative;
z-index:1;
}
.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:24px;
flex-wrap:wrap;
gap:12px;
position:sticky;
top:0;
z-index:100;
background:var(--bg-secondary);
backdrop-filter:blur(20px);
padding:14px 20px;
border-radius:var(--radius-md);
border:1px solid var(--border-subtle);
margin-left:-20px;
margin-right:-20px;
width:calc(100% + 40px);
}
.back-btn{
background:var(--field-bg);
border:1px solid var(--border-normal);
color:var(--text-primary);
padding:9px 14px;
border-radius:var(--radius-sm);
text-decoration:none;
font-weight:600;
font-size:11px;
display:flex;
align-items:center;
gap:7px;
transition:var(--transition);
font-family:'Space Grotesk',sans-serif;
letter-spacing:.5px;
text-transform:uppercase;
}
.back-btn:hover{
background:rgba(70,130,180,.1);
border-color:var(--neon-cyan);
color:var(--neon-cyan);
transform:translateX(-3px);
box-shadow:var(--shadow-glow);
}
.top-actions{display:flex;gap:8px;align-items:center}
.btn-icon{
width:40px;
height:40px;
padding:0;
display:grid;
place-items:center;
background:var(--field-bg);
border:1px solid var(--border-subtle);
border-radius:var(--radius-md);
color:var(--text-secondary);
cursor:pointer;
transition:var(--transition);
font-size:15px;
}
.btn-icon:hover{
color:var(--neon-cyan);
border-color:var(--neon-cyan);
background:rgba(70,130,180,.1);
transform:scale(1.06);
box-shadow:var(--shadow-glow);
}
.header{
text-align:center;
margin-bottom:32px;
animation:headerEntrance .8s cubic-bezier(.34,1.56,.64,1) backwards;
}
@keyframes headerEntrance{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:translateY(0)}}
.logo-icon{
width:72px;
height:72px;
border-radius:var(--radius-md);
background:linear-gradient(135deg,var(--bg-tertiary),var(--bg-card));
border:1px solid rgba(70,130,180,.3);
display:inline-flex;
align-items:center;
justify-content:center;
font-size:36px;
box-shadow:var(--shadow-md);
margin-bottom:18px;
animation:dance 5s ease-in-out infinite;
transition:var(--transition);
cursor:pointer;
}
.logo-icon:hover{
animation:spinFast 1s ease-in-out infinite;
transform:scale(1.15);
box-shadow:var(--shadow-glow);
border-color:var(--neon-cyan);
}
@keyframes dance{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-4px) rotate(-10deg)}75%{transform:translateY(-4px) rotate(10deg)}}
@keyframes spinFast{0%{transform:scale(1.15) rotate(0)}100%{transform:scale(1.15) rotate(360deg)}}
.title{
font-family:'Space Grotesk',sans-serif;
font-size:clamp(26px,6vw,44px);
font-weight:700;
letter-spacing:2px;
margin-bottom:10px;
background:linear-gradient(135deg,var(--neon-cyan),var(--neon-blue),var(--text-primary));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
background-clip:text;
text-transform:uppercase;
}
.subtitle{
font-size:11px;
color:var(--text-secondary);
letter-spacing:4px;
text-transform:uppercase;
margin-bottom:16px;
font-weight:500;
font-family:'Space Grotesk',sans-serif;
}
.status-badge{
display:inline-flex;
align-items:center;
gap:8px;
padding:6px 16px;
background:rgba(70,130,180,.1);
border:1px solid rgba(70,130,180,.3);
border-radius:100px;
font-size:10px;
font-weight:700;
color:var(--neon-cyan);
text-transform:uppercase;
letter-spacing:2px;
font-family:'Space Grotesk',sans-serif;
}
.status-dot{
width:7px;
height:7px;
background:var(--neon-green);
border-radius:50%;
box-shadow:0 0 8px var(--neon-green);
animation:pulse2 2.5s infinite;
}
@keyframes pulse2{0%,100%{opacity:1}50%{opacity:.4}}

/* Bento Stats */
.bento{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
margin-bottom:24px;
}
.bento-stat{
background:linear-gradient(135deg,var(--bg-tertiary),var(--bg-secondary));
border:1px solid var(--border-subtle);
border-radius:var(--radius-lg);
padding:16px 18px;
position:relative;
overflow:hidden;
transition:var(--transition);
}
.bento-stat::before{
content:'';
position:absolute;
top:-40px;
right:-40px;
width:110px;
height:110px;
border-radius:50%;
filter:blur(50px);
opacity:.16;
transition:opacity .4s;
}
.bento-stat:nth-child(1)::before{background:var(--neon-cyan)}
.bento-stat:nth-child(2)::before{background:var(--neon-blue)}
.bento-stat:nth-child(3)::before{background:var(--neon-purple)}
.bento-stat:nth-child(4)::before{background:var(--neon-cyan)}
.bento-stat:hover{
border-color:rgba(70,130,180,.3);
transform:translateY(-3px);
box-shadow:var(--shadow-glow);
}
.bento-stat:hover::before{opacity:.3}
.bento-label{
font-family:'Space Grotesk',sans-serif;
font-size:9px;
color:var(--text-tertiary);
text-transform:uppercase;
letter-spacing:1.5px;
font-weight:700;
display:flex;
align-items:center;
gap:7px;
}
.bento-label .icon{font-size:14px}
.bento-value{
font-family:'Space Grotesk',sans-serif;
font-size:28px;
font-weight:800;
margin-top:8px;
letter-spacing:-.03em;
background:linear-gradient(135deg,var(--neon-cyan),var(--neon-blue),var(--text-primary));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
line-height:1.1;
}
.bento-sub{font-size:10px;color:var(--text-muted);margin-top:4px;font-weight:500}

/* Search */
.search-container{
max-width:700px;
margin:0 auto 28px;
}
.search-box{
display:flex;
align-items:center;
gap:10px;
background:var(--field-bg);
border:1px solid var(--border-subtle);
border-radius:var(--radius-md);
padding:12px 16px;
transition:var(--transition);
position:relative;
}
.search-box:focus-within{
border-color:var(--neon-cyan);
background:rgba(70,130,180,.08);
box-shadow:0 0 0 3px rgba(70,130,180,.1);
}
.search-box i{color:var(--neon-cyan);font-size:14px;flex-shrink:0}
.search-box input{
background:none;
border:none;
outline:none;
color:var(--text-primary);
flex:1;
font-size:13px;
font-family:'Inter',sans-serif;
font-weight:500;
}
.search-box input::placeholder{color:var(--text-muted)}
.search-info{
font-size:10px;
color:var(--neon-cyan);
font-family:'Space Grotesk',sans-serif;
font-weight:600;
flex-shrink:0;
padding:2px 8px;
background:rgba(70,130,180,.1);
border-radius:5px;
}
.clear-btn{
background:none;
border:none;
color:var(--text-muted);
cursor:pointer;
font-size:14px;
padding:4px 8px;
border-radius:4px;
transition:var(--transition);
display:none;
}
.clear-btn.show{display:block}
.clear-btn:hover{color:var(--neon-red);background:rgba(198,40,40,.1)}

/* Section Header */
.section-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
flex-wrap:wrap;
gap:10px;
padding-bottom:12px;
border-bottom:1px solid var(--border-subtle);
position:relative;
}
.section-header::after{
content:'';
position:absolute;
bottom:-1px;
left:0;
width:60px;
height:2px;
background:linear-gradient(90deg,var(--neon-cyan),var(--neon-blue));
box-shadow:0 0 12px var(--neon-cyan);
}
.section-header h3{
font-family:'Space Grotesk',sans-serif;
font-size:14px;
font-weight:700;
letter-spacing:1.5px;
display:flex;
align-items:center;
gap:10px;
text-transform:uppercase;
}
.section-header h3 .bar{
width:3px;
height:18px;
background:linear-gradient(180deg,var(--neon-cyan),var(--neon-blue));
border-radius:2px;
box-shadow:0 0 8px var(--neon-cyan);
}
.section-header small{
font-family:'Space Grotesk',sans-serif;
font-size:10px;
color:var(--neon-cyan);
font-weight:600;
background:rgba(70,130,180,.1);
padding:4px 12px;
border-radius:16px;
border:1px solid rgba(70,130,180,.3);
letter-spacing:1px;
}

/* Gallery */
.gallery-section{margin-bottom:30px}
.gallery-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:16px;
}
.photo-card{
background:linear-gradient(135deg,var(--bg-tertiary),var(--bg-secondary));
border:1px solid var(--border-subtle);
border-radius:var(--radius-md);
overflow:hidden;
transition:var(--transition);
position:relative;
animation:cardEnter .5s ease forwards;
opacity:0;
transform:translateY(20px);
}
.photo-card:nth-child(1){animation-delay:.05s}
.photo-card:nth-child(2){animation-delay:.1s}
.photo-card:nth-child(3){animation-delay:.15s}
.photo-card:nth-child(4){animation-delay:.2s}
.photo-card:nth-child(5){animation-delay:.25s}
.photo-card:nth-child(6){animation-delay:.3s}
@keyframes cardEnter{to{opacity:1;transform:translateY(0)}}
.photo-card::before{
content:'';
position:absolute;
top:0;
left:-100%;
width:100%;
height:100%;
background:linear-gradient(120deg,transparent,rgba(70,130,180,.08),transparent);
transition:left .6s ease;
z-index:1;
pointer-events:none;
}
.photo-card:hover::before{left:100%}
.photo-card:hover{
border-color:rgba(70,130,180,.3);
transform:translateY(-4px);
box-shadow:var(--shadow-glow);
}
.photo-wrapper{
position:relative;
width:100%;
height:220px;
background:var(--field-bg);
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
border-bottom:1px solid var(--border-subtle);
}
.photo-wrapper img{
width:100%;
height:100%;
object-fit:cover;
display:block;
transition:transform .4s ease;
}
.photo-card:hover .photo-wrapper img{transform:scale(1.08)}
.photo-badge{
position:absolute;
top:10px;
right:10px;
background:rgba(0,0,0,.7);
color:#fff;
padding:3px 10px;
border-radius:6px;
font-size:9px;
font-weight:700;
backdrop-filter:blur(8px);
font-family:'Space Grotesk',sans-serif;
letter-spacing:.5px;
display:flex;
align-items:center;
gap:4px;
z-index:2;
border:1px solid rgba(255,255,255,.1);
}
.photo-badge.new{
background:rgba(198,40,40,.85);
animation:badgePulse 1.8s ease-in-out infinite;
}
@keyframes badgePulse{0%,100%{transform:scale(1);box-shadow:0 0 0 rgba(198,40,40,.4)}50%{transform:scale(1.05);box-shadow:0 0 10px rgba(198,40,40,.5)}}
.photo-info{padding:14px 16px}
.photo-title{
font-family:'Space Grotesk',sans-serif;
font-size:13.5px;
font-weight:700;
color:var(--text-primary);
margin-bottom:6px;
word-break:break-word;
letter-spacing:.5px;
}
.photo-meta{
font-size:10px;
color:var(--text-tertiary);
margin-bottom:12px;
font-family:'JetBrains Mono',monospace;
letter-spacing:.5px;
display:flex;
align-items:center;
gap:5px;
}
.photo-meta .icon{color:var(--neon-cyan)}
.action-buttons-row{
display:flex;
gap:8px;
padding-top:12px;
border-top:1px solid var(--border-subtle);
}
.btn{
padding:9px 14px;
border-radius:var(--radius-md);
font-family:'Inter',sans-serif;
font-size:11px;
font-weight:700;
cursor:pointer;
transition:var(--transition);
border:none;
display:inline-flex;
align-items:center;
justify-content:center;
gap:7px;
text-transform:uppercase;
letter-spacing:.8px;
flex:1;
}
.btn-success{
background:linear-gradient(135deg,var(--neon-cyan),var(--neon-blue));
color:#fff;
box-shadow:var(--shadow-glow);
}
.btn-success:hover{
transform:translateY(-2px);
box-shadow:0 0 20px rgba(70,130,180,.4);
}
.btn-warning{
background:linear-gradient(135deg,var(--neon-blue),var(--neon-purple));
color:#fff;
box-shadow:var(--shadow-sm);
}
.btn-warning:hover{
transform:translateY(-2px);
box-shadow:0 0 20px rgba(55,104,143,.4);
}
.btn-ghost{
background:var(--field-bg);
color:var(--text-primary);
border:1px solid var(--border-normal);
}
.btn-ghost:hover{
background:rgba(70,130,180,.1);
border-color:var(--neon-cyan);
color:var(--neon-cyan);
transform:translateY(-2px);
}

/* Loading */
.loading{
display:none;
text-align:center;
padding:40px;
grid-column:1/-1;
}
.loading.active{display:block}
.loader-wrap{
position:relative;
width:84px;
height:84px;
margin:0 auto 16px;
}
.loader-ring{
position:absolute;
inset:0;
border-radius:50%;
border:2px solid transparent;
border-top-color:var(--neon-cyan);
border-right-color:rgba(70,130,180,.25);
animation:spin 1.8s cubic-bezier(.5,0,.5,1) infinite;
box-shadow:0 0 20px rgba(70,130,180,.25);
}
.loader-ring:nth-child(2){
inset:9px;
border-top-color:var(--neon-blue);
animation-duration:1.2s;
animation-direction:reverse;
}
.loader-core{
position:absolute;
inset:18px;
border-radius:50%;
background:linear-gradient(135deg,var(--bg-tertiary),var(--bg-card));
border:1px solid rgba(70,130,180,.3);
display:grid;
place-items:center;
font-size:28px;
animation:pulse 2.5s ease-in-out infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.loading-text{
color:var(--neon-cyan);
font-family:'Space Grotesk',sans-serif;
font-size:11px;
letter-spacing:3px;
text-transform:uppercase;
font-weight:600;
}

.no-results{
grid-column:1/-1;
text-align:center;
padding:60px 24px;
background:var(--field-bg);
border:1px dashed var(--border-normal);
border-radius:var(--radius-lg);
color:var(--text-secondary);
}
.no-results .icon{
font-size:52px;
margin-bottom:14px;
opacity:.5;
color:var(--neon-cyan);
animation:float 3.5s ease-in-out infinite;
filter:drop-shadow(0 0 16px rgba(70,130,180,.3));
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.no-results h3{
font-family:'Space Grotesk',sans-serif;
font-size:17px;
margin-bottom:8px;
letter-spacing:1px;
color:var(--text-primary);
font-weight:700;
}
.no-results p{font-size:12.5px}

/* Modal */
.modal-backdrop{
position:fixed;
inset:0;
background:var(--overlay-bg);
backdrop-filter:blur(24px);
z-index:1000;
display:none;
align-items:center;
justify-content:center;
padding:24px;
overflow-y:auto;
}
.modal-backdrop.active{display:flex;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-content{
background:linear-gradient(135deg,var(--bg-tertiary),var(--bg-secondary));
border:1px solid rgba(70,130,180,.35);
border-radius:var(--radius-xl);
max-width:900px;
width:100%;
max-height:95vh;
overflow:auto;
display:flex;
flex-direction:column;
position:relative;
box-shadow:var(--shadow-lg),var(--shadow-glow);
animation:slideUp .4s cubic-bezier(.4,0,.2,1);
}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.modal-content::before{
content:'';
position:absolute;
top:0;
left:0;
right:0;
height:2px;
background:linear-gradient(90deg,transparent,var(--neon-cyan),var(--neon-blue),transparent);
background-size:200% 100%;
animation:borderFlow 2.5s linear infinite;
}
@keyframes borderFlow{0%{background-position:-200% 0}100%{background-position:200% 0}}
.modal-header{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 22px;
border-bottom:1px solid var(--border-subtle);
gap:12px;
}
.modal-title{
font-family:'Space Grotesk',sans-serif;
font-size:15px;
font-weight:700;
color:var(--neon-cyan);
letter-spacing:1px;
display:flex;
align-items:center;
gap:10px;
}
.modal-title .bar{
width:3px;
height:18px;
background:linear-gradient(180deg,var(--neon-cyan),var(--neon-blue));
border-radius:2px;
box-shadow:0 0 8px var(--neon-cyan);
}
.modal-close{
width:38px;
height:38px;
background:var(--field-bg);
border:1px solid var(--border-normal);
border-radius:var(--radius-sm);
color:var(--text-secondary);
font-size:14px;
cursor:pointer;
transition:var(--transition);
display:grid;
place-items:center;
flex-shrink:0;
}
.modal-close:hover{
background:rgba(198,40,40,.1);
border-color:var(--neon-red);
color:var(--neon-red);
transform:rotate(90deg);
}
.modal-body{
padding:22px;
text-align:center;
overflow-y:auto;
flex:1;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
background:var(--code-bg);
gap:18px;
}
.modal-image-wrap{
width:100%;
max-height:70vh;
display:flex;
align-items:center;
justify-content:center;
border-radius:var(--radius-md);
overflow:hidden;
background:var(--field-bg);
border:1px solid var(--border-subtle);
}
.modal-image-wrap img{
max-width:100%;
max-height:70vh;
width:auto;
object-fit:contain;
display:block;
}
.modal-url-display{
background:var(--field-bg);
border:1px solid var(--border-subtle);
border-radius:var(--radius-sm);
padding:10px 14px;
font-family:'JetBrains Mono',monospace;
font-size:10px;
color:var(--text-secondary);
word-break:break-all;
display:flex;
align-items:center;
gap:10px;
width:100%;
max-width:700px;
}
.modal-url-display .url{
flex:1;
user-select:all;
min-width:0;
}
.modal-url-display button{
flex-shrink:0;
padding:6px 10px;
font-size:9px;
}
.modal-meta{
display:flex;
gap:14px;
font-size:10px;
color:var(--text-tertiary);
flex-wrap:wrap;
justify-content:center;
}
.modal-meta span{display:flex;align-items:center;gap:5px}
.modal-meta .icon{font-size:11px;color:var(--neon-cyan)}
.modal-actions{
margin-top:4px;
display:flex;
gap:10px;
justify-content:center;
flex-wrap:wrap;
width:100%;
}

/* Toast */
.toasts{
position:fixed;
bottom:24px;
right:24px;
z-index:10000;
display:flex;
flex-direction:column;
gap:10px;
max-width:340px;
}
.toast{
background:linear-gradient(135deg,var(--bg-hover),var(--bg-tertiary));
backdrop-filter:blur(24px);
border:1px solid rgba(70,130,180,.3);
border-radius:var(--radius-md);
padding:13px 16px;
display:flex;
align-items:center;
gap:12px;
box-shadow:var(--shadow-glow);
animation:toastSlideIn .45s cubic-bezier(.34,1.56,.64,1);
font-size:12px;
font-weight:500;
position:relative;
overflow:hidden;
}
.toast.success{border-left:3px solid var(--neon-green)}
.toast.error{border-left:3px solid var(--neon-red)}
.toast.info{border-left:3px solid var(--neon-cyan)}
.toast.warning{border-left:3px solid var(--neon-blue)}
@keyframes toastSlideIn{from{transform:translateX(150%) scale(.9);opacity:0}to{transform:translateX(0) scale(1);opacity:1}}
.toast .icon{font-size:18px}
.toast-progress{
position:absolute;
bottom:0;
left:0;
height:2px;
background:linear-gradient(90deg,var(--neon-cyan),var(--neon-blue));
animation:progressShrink 3.5s linear forwards;
box-shadow:0 0 8px var(--neon-cyan);
}
@keyframes progressShrink{from{width:100%}to{width:0}}

.copy-flash{animation:copyFlash .6s ease;background:rgba(21,128,61,.2)!important;border-color:var(--neon-green)!important}
@keyframes copyFlash{0%{transform:scale(1)}50%{transform:scale(1.02)}100%{transform:scale(1)}}

@media(max-width:900px){
.bento{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:768px){
.container{padding:18px 12px}
.top-bar{margin-left:-12px;margin-right:-12px;width:calc(100% + 24px);padding:10px 14px}
.back-btn{padding:6px 10px;font-size:9px}
.gallery-grid{grid-template-columns:repeat(2,1fr);gap:10px}
.photo-wrapper{height:160px}
.btn{padding:7px 10px;font-size:9.5px}
.bento{grid-template-columns:repeat(2,1fr);gap:8px}
.bento-value{font-size:20px}
.bento-stat{padding:12px}
.title{font-size:clamp(22px,6vw,32px)}
.modal-content{padding:0}
.modal-actions{flex-direction:column}
.modal-actions .btn{width:100%}
}
@media(max-width:480px){
.gallery-grid{grid-template-columns:1fr}
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg-primary)}
::-webkit-scrollbar-thumb{
background:linear-gradient(180deg,var(--neon-cyan),var(--neon-blue));
border-radius:6px;
border:2px solid var(--bg-primary);
}
::selection{background:rgba(70,130,180,.35);color:var(--text-primary)}
</style>
</head>
<body>
<div class="bg-effects"></div>

<div class="container">
  <div class="top-bar">
    <a href="index.html" class="back-btn">
      <i class="fas fa-arrow-left"></i> Kembali ke Portal
    </a>
    <div class="top-actions">
      <button class="btn-icon" onclick="refreshPhotos()" title="Refresh Data">
        <i class="fas fa-sync"></i>
      </button>
      <button class="btn-icon" onclick="toggleTheme()" title="Ganti Tema" id="themeBtn">
        <i class="fas fa-moon"></i>
      </button>
    </div>
  </div>

  <header class="header">
    <div class="logo-icon">🐒</div>
    <h1 class="title">GALERI FOTO</h1>
    <p class="subtitle">LINE TOGEL · DOVE BLUE 2026</p>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>System Online</span>
    </div>
  </header>

  <div class="bento" id="statsBento">
    <div class="bento-stat">
      <div class="bento-label"><span class="icon"><i class="fas fa-images"></i></span>Total Foto</div>
      <div class="bento-value" id="statTotal">0</div>
      <div class="bento-sub">Semua foto tersimpan</div>
    </div>
    <div class="bento-stat">
      <div class="bento-label"><span class="icon"><i class="fas fa-clock"></i></span>Update Terakhir</div>
      <div class="bento-value" id="statLast" style="font-size:16px">-</div>
      <div class="bento-sub">Waktu lokal</div>
    </div>
    <div class="bento-stat">
      <div class="bento-label"><span class="icon"><i class="fas fa-filter"></i></span>Ditampilkan</div>
      <div class="bento-value" id="statShown">0</div>
      <div class="bento-sub">Setelah filter</div>
    </div>
    <div class="bento-stat">
      <div class="bento-label"><span class="icon"><i class="fas fa-wifi"></i></span>Status</div>
      <div class="bento-value" id="statStatus" style="font-size:14px;color:var(--neon-green)">ONLINE</div>
      <div class="bento-sub">Koneksi stabil</div>
    </div>
  </div>

  <section class="gallery-section">
    <div class="section-header">
      <h3><span class="bar"></span><i class="fas fa-camera"></i> KOLEKSI FOTO</h3>
      <small><span id="countBadge">0</span> FOTO</small>
    </div>

    <div class="search-container">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Cari foto berdasarkan judul..." onkeyup="searchPhotos()">
        <span class="search-info" id="searchInfo"></span>
        <button class="clear-btn" id="clearBtn" onclick="clearSearch()"><i class="fas fa-times-circle"></i></button>
      </div>
    </div>

    <div class="loading" id="loading">
      <div class="loader-wrap">
        <div class="loader-ring"></div>
        <div class="loader-ring"></div>
        <div class="loader-core">🐒</div>
      </div>
      <div class="loading-text">LOADING PHOTOS...</div>
    </div>

    <div class="gallery-grid" id="galleryGrid"></div>
  </section>
</div>

<!-- Modal -->
<div class="modal-backdrop" id="imageModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 class="modal-title"><span class="bar"></span><i class="fas fa-image"></i> <span id="modalTitle">Detail Foto</span></h3>
      <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body">
      <div class="modal-image-wrap">
        <img src="" alt="" id="modalImage">
      </div>
      <div class="modal-url-display">
        <span class="url" id="modalUrl"></span>
        <button class="btn btn-success" onclick="copyCurrentImageUrl()"><i class="fas fa-link"></i> COPY LINK</button>
      </div>
      <div class="modal-meta" id="modalMeta"></div>
      <div class="modal-actions">
        <button class="btn btn-success" onclick="copyImage()">
          <i class="fas fa-image"></i> COPY GAMBAR
        </button>
        <button class="btn btn-warning" onclick="downloadModalImage()">
          <i class="fas fa-download"></i> DOWNLOAD
        </button>
        <button class="btn btn-ghost" onclick="closeModal()">
          <i class="fas fa-times"></i> TUTUP
        </button>
      </div>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
let allPhotos = [];
let currentImageUrl = '';
let currentImageTitle = '';
let currentImageIndex = 0;

document.addEventListener('DOMContentLoaded', () => {
  applyTheme();
  fetchPhotosFromSheet();
});

function applyTheme(){
  const dark = localStorage.getItem('sv_foto_theme') !== 'light';
  document.documentElement.classList.toggle('light', !dark);
  const b = document.getElementById('themeBtn');
  if(b) b.innerHTML = dark ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
}

function toggleTheme(){
  const dark = document.documentElement.classList.contains('light');
  document.documentElement.classList.toggle('light', !dark);
  try{ localStorage.setItem('sv_foto_theme', dark ? 'light' : 'dark'); }catch(e){}
  const b = document.getElementById('themeBtn');
  if(b) b.innerHTML = dark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
}

function refreshPhotos(){
  showToast('🔄 Menyegarkan data...', 'info');
  fetchPhotosFromSheet();
}

async function fetchPhotosFromSheet() {
  const loading = document.getElementById('loading');
  const grid = document.getElementById('galleryGrid');
  loading.classList.add('active');
  grid.innerHTML = '';

  try {
    const sheetId = '1z5FYVvB0E9BeE3cRbl4id1YWi6lRB_2qzMhIvgz4Xx0';
    const gid = '1246502038';

    try {
      const gvizUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&gid=${gid}&range=C2:D150`;
      const response = await fetch(gvizUrl);
      const text = await response.text();
      const json = JSON.parse(text.substring(47).slice(0, -2));
      const rows = json.table.rows;

      allPhotos = [];
      rows.forEach((row, index) => {
        const c = row.c;
        if (!c) return;
        const judul = c[0] ? (c[0].v || '') : '';
        const foto = c[1] ? (c[1].v || '') : '';
        if (judul && foto) {
          allPhotos.push({ judul, foto, index: index + 2 });
        }
      });
    } catch (e) {
      console.log('GVIZ failed, trying CSV...', e);
      const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=${gid}&range=C2:D150`;
      const csvResponse = await fetch(csvUrl);
      const csvText = await csvResponse.text();
      const csvRows = csvText.split('\n').map(row => row.split(','));

      allPhotos = [];
      csvRows.forEach((row, index) => {
        if (row.length < 2) return;
        const judul = row[0] ? row[0].replace(/"/g, '').trim() : '';
        const foto = row[1] ? row[1].replace(/"/g, '').trim() : '';
        if (judul && foto) {
          allPhotos.push({ judul, foto, index: index + 2 });
        }
      });
    }

    renderGallery(allPhotos);
    updateStats();
    showToast(`✅ Berhasil memuat ${allPhotos.length} foto`, 'success');
    document.getElementById('statStatus').textContent = 'ONLINE';
    document.getElementById('statStatus').style.color = 'var(--neon-green)';
  } catch (error) {
    console.error('Error fetching photos:', error);
    showToast('❌ Gagal mengambil data dari Google Sheets', 'error');
    document.getElementById('statStatus').textContent = 'OFFLINE';
    document.getElementById('statStatus').style.color = 'var(--neon-red)';
    grid.innerHTML = `
      <div class="no-results">
        <div class="icon"><i class="fas fa-exclamation-triangle"></i></div>
        <h3>GAGAL MEMUAT FOTO</h3>
        <p>Pastikan Google Sheets sudah dipublikasikan<br>Klik tombol refresh untuk mencoba lagi</p>
      </div>
    `;
  }

  loading.classList.remove('active');
}

function updateStats(){
  document.getElementById('statTotal').textContent = allPhotos.length;
  document.getElementById('statLast').textContent = allPhotos.length > 0 ? 'Baru saja' : '-';
  document.getElementById('statShown').textContent = allPhotos.length;
  document.getElementById('countBadge').textContent = allPhotos.length;
}

function renderGallery(photos) {
  const grid = document.getElementById('galleryGrid');
  grid.innerHTML = '';

  document.getElementById('statShown').textContent = photos.length;
  document.getElementById('countBadge').textContent = photos.length;

  if (photos.length === 0) {
    const q = document.getElementById('searchInput').value.trim();
    grid.innerHTML = `
      <div class="no-results">
        <div class="icon"><i class="fas fa-${q ? 'search' : 'camera'}"></i></div>
        <h3>${q ? 'TIDAK DITEMUKAN' : 'BELUM ADA FOTO'}</h3>
        <p>${q ? 'Tidak ada foto yang cocok dengan "'+q+'"' : 'Tidak ada foto yang tersedia saat ini'}</p>
      </div>
    `;
    return;
  }

  photos.forEach((photo, idx) => {
    const card = createPhotoCard(photo.foto, photo.judul, idx, photo.index);
    grid.appendChild(card);
  });
}

function createPhotoCard(url, title, index, sheetIndex) {
  const card = document.createElement('div');
  card.className = 'photo-card';
  const safeTitle = title.replace(/'/g, "\\'").replace(/"/g, '&quot;');
  const safeUrl = url.replace(/'/g, "\\'").replace(/"/g, '&quot;');
  const isNew = index < 5;
  
  card.innerHTML = `
    ${isNew ? '<div class="photo-badge new"><i class="fas fa-bolt"></i> NEW</div>' : ''}
    <div class="photo-wrapper">
      <img src="${url}" alt="${title}" onerror="this.style.display='none';this.parentElement.innerHTML='<div style=\\'display:flex;align-items:center;justify-content:center;width:100%;height:100%;color:var(--text-muted);font-size:48px\\'><i class=\\'fas fa-image\\'></i></div>'" loading="lazy" onclick="viewFullImage('${safeUrl}', '${safeTitle}', ${index})" style="cursor: pointer;">
    </div>
    <div class="photo-info">
      <div class="photo-title">${title}</div>
      <div class="photo-meta">
        <span class="icon"><i class="fas fa-hashtag"></i></span>
        FOTO #${index + 1} · ROW ${sheetIndex}
      </div>
      <div class="action-buttons-row">
        <button class="btn btn-success" onclick="event.stopPropagation();copyPhoto('${safeUrl}', this)" title="Copy Gambar">
          <i class="fas fa-image"></i> COPY
        </button>
        <button class="btn btn-warning" onclick="event.stopPropagation();downloadPhoto('${safeUrl}', '${safeTitle}')" title="Download">
          <i class="fas fa-download"></i> DL
        </button>
      </div>
    </div>
  `;
  return card;
}

function searchPhotos() {
  const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
  const clearBtn = document.getElementById('clearBtn');
  const searchInfo = document.getElementById('searchInfo');
  
  clearBtn.classList.toggle('show', searchTerm.length > 0);
  
  if (!searchTerm) {
    renderGallery(allPhotos);
    searchInfo.textContent = '';
    return;
  }
  const filtered = allPhotos.filter(photo =>
    photo.judul.toLowerCase().includes(searchTerm)
  );
  searchInfo.textContent = filtered.length + ' dari ' + allPhotos.length;
  renderGallery(filtered);
}

function clearSearch(){
  document.getElementById('searchInput').value = '';
  document.getElementById('clearBtn').classList.remove('show');
  document.getElementById('searchInfo').textContent = '';
  renderGallery(allPhotos);
  document.getElementById('searchInput').focus();
}

function viewFullImage(url, title, index) {
  currentImageUrl = url;
  currentImageTitle = title;
  currentImageIndex = index;
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalImage').src = url;
  document.getElementById('modalUrl').textContent = url;
  document.getElementById('modalMeta').innerHTML = `
    <span><span class="icon"><i class="fas fa-hashtag"></i></span>FOTO #${index + 1}</span>
    <span><span class="icon"><i class="fas fa-clock"></i></span>${new Date().toLocaleString('id-ID')}</span>
    <span><span class="icon"><i class="fas fa-image"></i></span>Click kanan untuk simpan</span>
  `;
  document.getElementById('imageModal').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('imageModal').classList.remove('active');
  document.body.style.overflow = '';
  currentImageUrl = '';
  currentImageTitle = '';
}

async function copyPhoto(url, btnElement) {
  try {
    showToast('📋 Meng-copy gambar...', 'info');
    const response = await fetch(url, {mode: 'cors'});
    if(!response.ok) throw new Error('Fetch failed');
    const blob = await response.blob();
    
    if(navigator.clipboard && typeof ClipboardItem !== 'undefined'){
      const clipboardItem = new ClipboardItem({[blob.type]: blob});
      await navigator.clipboard.write([clipboardItem]);
      showToast('✅ Gambar berhasil di-copy! (Paste Ctrl+V)', 'success');
      if(btnElement){
        btnElement.classList.add('copy-flash');
        setTimeout(()=>btnElement.classList.remove('copy-flash'), 600);
      }
    } else {
      throw new Error('Clipboard API not supported');
    }
  } catch (error) {
    console.error('Copy error:', error);
    try{
      await navigator.clipboard.writeText(url);
      showToast('⚠️ Copy gambar gagal (CORS). Link URL di-copy', 'warning');
    }catch(e2){
      fallbackCopy(url);
      showToast('⚠️ Link URL di-copy sebagai fallback', 'warning');
    }
  }
}

function fallbackCopy(text){
  const t = document.createElement('textarea');
  t.value = text;
  t.style.position = 'fixed';
  t.style.opacity = '0';
  document.body.appendChild(t);
  t.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(t);
}

async function copyImage() {
  if (currentImageUrl) await copyPhoto(currentImageUrl);
}

async function copyCurrentImageUrl(){
  if(currentImageUrl){
    try{
      await navigator.clipboard.writeText(currentImageUrl);
      showToast('✅ Link foto berhasil di-copy!', 'success');
    }catch(e){
      fallbackCopy(currentImageUrl);
      showToast('✅ Link foto berhasil di-copy!', 'success');
    }
  }
}

function downloadPhoto(url, filename) {
  const link = document.createElement('a');
  link.href = url;
  link.download = `${filename.replace(/[^a-z0-9]/gi, '_').toLowerCase()}_${Date.now()}.jpg`;
  link.target = '_blank';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  showToast('⬇️ Download dimulai...', 'success');
}

function downloadModalImage() {
  if (currentImageUrl && currentImageTitle) {
    downloadPhoto(currentImageUrl, currentImageTitle);
  }
}

function showToast(message, type) {
  type = type || 'info';
  const container = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const icons = {
    success: '<i class="fas fa-check-circle" style="color:var(--neon-green)"></i>',
    error: '<i class="fas fa-times-circle" style="color:var(--neon-red)"></i>',
    info: '<i class="fas fa-info-circle" style="color:var(--neon-cyan)"></i>',
    warning: '<i class="fas fa-exclamation-triangle" style="color:var(--neon-blue)"></i>'
  };
  el.innerHTML = `<span class="icon">${icons[type] || icons.info}</span><span>${message}</span><div class="toast-progress"></div>`;
  container.appendChild(el);
  setTimeout(() => {
    el.style.animation = 'toastSlideIn 0.3s reverse';
    setTimeout(() => el.remove(), 300);
  }, 3500);
}

document.getElementById('imageModal').addEventListener('click', (e) => {
  if (e.target.id === 'imageModal') closeModal();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});
</script>
</body>
</html>
